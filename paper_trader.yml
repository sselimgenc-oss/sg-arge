name: Hourly Paper Trader

on:
  schedule:
    # Her saat başını 11 geçe otomatik çalışır (00:11, 01:11, 02:11 ... UTC)
    - cron: '11 * * * *'
  workflow_dispatch:
    # GitHub arayüzünden "Run workflow" butonuyla istediğiniz an elle de çalıştırabilirsiniz

permissions:
  contents: write

jobs:
  trade-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Depodan Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle (Varsa)
        run: |
          python -m pip install --upgrade pip

      - name: Kantitatif İşlem Motorunu Çalıştır
        run: |
          python bot_engine.py

      - name: Güncellenen data.json Dosyasını Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otonom bot güncellemesi: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
