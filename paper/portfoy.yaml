    - {id: U4-H1, piyasa: KRIPTO25, tf: 4H, semboller: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT], risk: 0.0025, sermaye: 5000, baslangic: 2026-09-01, canli_baslangic: 2026-10-24}
