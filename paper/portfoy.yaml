# Paper trade portfoyu (T27). Gercek para ve araci kurum baglantisi YOK: yalniz sanal defter.
# Satirlar results/SONUC.md ve results/portfoy.md onerisidir; 1/N sermaye, her satir kendi kitabinda
# EVRENSEL_KURALLAR A6 ile boyutlanir (islem basi %0,5 risk, toplam acik risk %2, kitap brutu %100, ATR14x3 stop kartta yoksa).
sanal_sermaye: 5000            # USD (kullanicinin paneliyle ayni)
# Paper baslangic tarihi: kullanici onayi 2026-10-22 (ilk sinyal 2026-10-23 kapanisi, ilk dolum ertesi islem gunu acilisi).
baslangic: 2026-10-23
satirlar:
  - {id: C07, piyasa: ABD25, tf: 1D, kaynak: codex, evren: guncel, agirlik: 0.333333}
  - {id: R01, piyasa: ABD25, tf: 1D, kaynak: kart, evren: guncel, agirlik: 0.333333}
  - {id: A6-010, piyasa: EMTIA, tf: 1D, kaynak: kart, evren: guncel, agirlik: 0.333334}
alarmlar:
  mdd_uyari: 0.10              # portfoy MDD >= %10: uyari
  mdd_durdur: 0.15             # portfoy MDD >= %15: DURDUR (yeni giris yok; kullanici karari olmadan devam yok)
  pf_inceleme_islem: 30        # bir satir bu kadar kapanmis islemden sonra PF < 1 ise inceleme
  veri_eski_gun: 5             # son bar bundan eski ise veri alarmi
