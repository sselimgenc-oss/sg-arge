# Paper trade portfoyu (T27). Gercek para ve araci kurum baglantisi YOK: yalniz sanal defter.
# Satirlar results/SONUC.md ve results/portfoy.md onerisidir; 1/N sermaye, her satir kendi kitabinda
# EVRENSEL_KURALLAR A6 ile boyutlanir (islem basi %0,5 risk, toplam acik risk %2, kitap brutu %100, ATR14x3 stop kartta yoksa).
sanal_sermaye: 5000            # USD (kullanicinin paneliyle ayni)
# Faz 2 paper basladi (kullanici karari 2026-10-23, secenek b: C07 + R01 + A6-010).
# Kullanici karari 2026-10-24: defter 2026-09-01'den geriye donuk calistirilir (ayni kurallar, gercek veri);
# canli paper 2026-10-24'ten itibaren. Panoda iki donem ayri etiketlenir.
baslangic: 2026-09-01
canli_baslangic: 2026-10-24
satirlar:
  - {id: C07, piyasa: ABD25, tf: 1D, kaynak: codex, evren: guncel, agirlik: 0.333333}
