belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan input: mav=''VAR'' (Variable Index Dynamic Average, CMO periyodu 9). MACD = VAR(close,12) - VAR(close,26); tetik = VAR(MACD, 9); hist = MACD - tetik; long: ta.crossover(hist, 0). Short girisi (ta.crossunder(hist, 0)) acik long''u ters cevirerek kapatir; cikis olarak yazildi.', 'Pine VAR ozyinelemesi 0''dan baslar (nz(VAR[1])) ve gercek TradingView gecmisinde (Bitstamp/Binance onlarca yil geriye) cok onceden yakinsamistir; motor `var` gostergesi kaynak fiyatiyla tohumlanir ve ayni formulu kullanir (alpha = 2/(n+1), alpha*|CMO|). Tohum farki yalniz veri baslangicindaki ilk yuz barda etkilidir; IS baslangici (2018) icin motor yakinsamis degere Pine''in sifirdan baslayan kosusundan daha yakindir.', FromYear/FromMonth tarih penceresi kodda tanimli ama emir kosullarinda kullanilmaz; kartta yok., 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
