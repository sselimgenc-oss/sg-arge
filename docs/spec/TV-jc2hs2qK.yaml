belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Giris: close, ONCEKI 60 barin en yuksek high''ini (ta.highest(60) kaynak=high, [1]) asar, hacim ONCEKI 60 barin en yuksek hacmini asar ve close > SMA(200). Pine''da opentrades == 0 kosulu motorun ''pozisyondayken yeni giris yok'' kuraliyla aynidir. input_order_direction=''Long'' (varsayilan).', 'Cikis: son 5 kapanisin (close ... close[4]) hepsi BUGUNKU SMA(200) degerinin altinda (Pine kodunda gecmis kapanislar guncel SMA ile karsilastirilir, SMA[k] ile degil); kartta ayni bicimde yazildi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
