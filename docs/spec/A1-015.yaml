belirsiz:
- Yazar (JohnScher) ana stratejiyi yalniz long olarak kurgulamistir (defparam cumulateorders = false).
- 'Takvim ve saat kurallari (ozel_kod: true): 1) Yaz aylari haric tutulur: openmonth != 6 and openmonth != 7 and openmonth != 8. 2) Cuma haric Pazartesi-Persembe gunleri (1 <= opendayofweek <= 4) saat 13:30 barinda (time == 133000, Europe/Berlin) close > EMA[6](close) ise 1 kontrat long acilir. 3) Pozisyon gece boyu tasinir ve ertesi sabah saat 08:00 barinda (time == 080000) piyasadan kapatilir veya %1.5 kar hedefiyle (set target %profit 1.5) cikar; stop-loss yoktur.'
- 'T10: ozel_kod_nedeni: seans_saat (13:30 giris / ertesi 08:00 cikis ve Haziran-Agustos haric ay filtresi)'
