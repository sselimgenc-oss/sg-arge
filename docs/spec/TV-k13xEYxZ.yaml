id: TV-k13xEYxZ
ad: 'Zero Line Momentum Strategy: Precision Trend Following'
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/k13xEYxZ/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar MyStrategyHub; yayin sembolu BINANCE:BTCUSDT; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BINANCE:BTCUSDT)
kol: KRIPTO-4H
yayin_sembolu: BINANCE:BTCUSDT
gostergeler:
  ema200: {f: ema, src: close, n: 200}
  esa: {f: ema, src: close, n: 9}
  dev: {f: seri, ifade: abs(close - esa)}
  d: {f: ema, src: dev, n: 9}
  ci: {f: seri, ifade: (close - esa) / (0.015 * d)}
  wt1: {f: ema, src: ci, n: 12}
ozel_kod: false
giris: close > ema200 and cross_over(wt1, 0)
cikis: close < ema200 and cross_under(wt1, 0)
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-4H}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Short kosulu (close < EMA(200) ve WaveTrend wt1 sifiri asagi keser) acik long''u strategy.entry(''Short'') ile ters cevirir; cikis olarak yazildi. Stop/hedef yok; ATR x 3 stop eklendi. WaveTrend: esa = EMA(close, 9), d = EMA(|close - esa|, 9), ci = (close - esa) / (0,015 d), wt1 = EMA(ci, 12).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
