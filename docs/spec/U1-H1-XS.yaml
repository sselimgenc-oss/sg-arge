belirsiz:
- "U1 on kaydi: donemler IS veri basi -> 2023-09-30, OOS 2023-10-01 -> 2025-09-30, kilitli 2025-10-01 -> bugun (yalniz lider acar)."
- "Once TS filtresi (L=126 sabit, TS kartinin ortasi), gecenler arasinda rocM sirasi; her grupta en guclu k x k_carpan tutulur (hisse 5, kripto 3, emtia 2). Hisse grubu = BIST30 + ABD25 birlikte; skorlar gunun her tarihinde SINIF ICINDE z-skora cevrilip havuzlanir (z: tum islem gorebilir sinif uyeleri uzerinden, ddof=0)."
- "Agirlik: grubun butcesi (grup siniflarinin sinif_butce toplami: hisse 0,50, kripto 0,25, emtia 0,25) secilenler arasinda ters volatiliteyle bolunur. Gruptan hic sembol gecmezse o grubun butcesi nakittir; gruptan k'den az gecerse butce yine gecenlere bolunur (TS kartindaki gibi pay nakitte birakmak burada uygulanmadi). Hisse butcesinin ABD ya da BIST'e dengesiz dagilmasi mumkundur. LIDER ONAYI BEKLENIR: alternatif 'her secime sabit 1/k payi, bos pay nakit'."
- "Sinif adlari data/evren.csv 'piyasa' sutunudur; kosucu 'siniflar' sozlugunu rotasyon.kos'a vermelidir."
