  dosya: docs/GOREV_U1.md
  url: null
  sayfa: null
  not: "Kendi stratejimiz. Dayanak: Jegadeesh-Titman 1993 (kesitsel momentum) + Moskowitz-Ooi-Pedersen 2012 filtresi; on kayit tartisma/012_ozet_karar.md K6"
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: BIST30 + ABD25 + KRIPTO25 + EMTIA
gostergeler:
  roc126:
    f: roc
    src: close
    n: 126
  sma200:
    f: sma
    src: close
    n: 200
  rocM:
    f: roc
    src: close
    n: 126
ozel_kod: false
giris: null
cikis: null
stop: null
hedef: null
stop_eklendi: false
rotasyon:
  kip: trend_sepet
  dengeleme:
    tip: ay
  filtre: roc126 > 0 and close > sma200
  skor: rocM
  grup:
    BIST30: hisse
    ABD25: hisse
    KRIPTO25: kripto
    EMTIA: emtia
  k:
    hisse: 5
    kripto: 3
    emtia: 2
  k_carpan: 1
  agirlik: ters_vol
  vol_n: 60
  sinif_butce:
    BIST30: 0.25
    ABD25: 0.25
    KRIPTO25: 0.25
    EMTIA: 0.25
parametreler:
  roc126.n: 126
  sma200.n: 200
  rocM.n: 126
  k_carpan: 1
izgara:
  # on kayit (docs/GOREV_U1.md bolum 1): 2 x 2 = 4 deneme; baska varyant denenmez
  - yol: gostergeler.rocM.n
    degerler: [63, 126]
  - yol: rotasyon.k_carpan
    degerler: [1, 2]
deneme_sayisi_kaynakta: 4
