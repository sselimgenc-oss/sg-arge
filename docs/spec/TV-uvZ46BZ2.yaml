id: TV-uvZ46BZ2
ad: Momentum Strategy_Public
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/uvZ46BZ2/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar chinmayp5394; yayin sembolu NSE:MCX; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: DIGER (NSE:MCX)
kol: ABD25-1D
yayin_sembolu: NSE:MCX
gostergeler:
  bbb: {f: sma, src: close, n: 20}
  sd: {f: stdev, src: close, n: 20}
  rsi14: {f: rsi, src: close, n: 14}
  avgvol: {f: sma, src: volume, n: 20}
  ema200: {f: ema, src: close, n: 200}
  dm: {f: dmi, n: 14}
  bbu: {f: seri, ifade: bbb + 2.0 * sd}
  bbl: {f: seri, ifade: bbb - 2.0 * sd}
ozel_kod: false
giris: close >= bbu and close[1] < bbu and rsi14 > 60 and volume > avgvol and close > ema200 and dm.adx > 20 and dm.adx > dm.adx[1] and dm.plus > dm.minus
cikis: close <= bbl and close[1] > bbl and rsi14 < 40 and volume > avgvol and close < ema200 and dm.adx > 20 and dm.adx > dm.adx[1] and dm.minus > dm.plus
stop: {tip: seviye, ifade: 'giris - min(giris - sinyal_low, giris * 0.015)'}
hedef: {tip: seviye, ifade: 'giris + 2 * min(giris - sinyal_low, giris * 0.015)'}
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [ABD]
parametreler: {kol: ABD25-1D}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: BB(20, 2), RSI(14) > 60, hacim > SMA(hacim, 20), EMA(200) uzerinde, ADX(14) > 20 ve yukselen, +DI > -DI. Not: prevInsideUpper = close[1] < bbUpper (ayni barin ust bandi, kaynaktaki gibi). Stop = giris - min(giris - sinyal_dip, %1,5 x giris), hedef = giris + 2 x risk; giris fiyati sonraki acilis dolumudur (position_avg_price). Satis sinyali (alt bant kirilimi) acik long''u ters yonde kapatir; long bacakta cikis olarak kalir. Gun ici cikis (15:15) gunluk barlarda hic tetiklenmez. Dolum bosluk yapip sinyal dibinin altinda acilirsa Pine''da risk negatif olabilir (kenar durum).', 'Not: ABD25 hisse evreni; hacim filtresi hisse hacmiyle hesaplanir.', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).', 'U7 Ek 1: kol DIGER-1D → ABD25-1D eslendi (kural ve parametreler degismedi; yayin sembolu NSE:MCX).']
