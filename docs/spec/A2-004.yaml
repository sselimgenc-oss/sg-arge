belirsiz:
- MQL5 CodeBase sayfasından ve yazarın (Gianluca Gangemi) paylaştığı kod/açıklamadan kurallar ve parametreler eksiksiz okundu
- 'Özel kod mantığı: CME piyasasında altının (XAUUSD) günlük bakım arasından (maintenance break) sonraki yeniden açılış saatinde (InpEntryHour) tek işlem açılır; InpHoldHours=2 saat sonra zaman stopu ile
