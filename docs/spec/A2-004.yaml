  atlanır (InpSkipMonday=true)'
- Yalnızca Long yönlü bir seans anomalisidir
- "ozel_kod_nedeni: seans_saat (CME bakim arasi sonrasi yeniden acilis saatinde tek islem, sunucu saati ve spread filtresi)"
