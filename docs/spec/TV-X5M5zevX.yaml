belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan girdiler (tum filtreler acik, Wave & EMA Combined kapali): sinyal = kesisim (WaveTrend ya da EMA) VE mum / hacim / seri filtreleri VE (A: w2 > 0, para akisi > 0, w2 < 70 ya da B: w2 < 0, K1 > K2, w2 < -70) VE HMA egimi yesil VE mandal acik; mandal, tek yonde art arda tekrar sinyal vermeyi engeller (var _gL/_gS). Short sinyal ticarete verilmez, long''u ters cevirir (cikis).', 'Pine ta.valuewhen(cond, seri, 1) ikinci en yakin olay degeri; ilk iki olaydan once na (kosul yanlis). math.round(x, 1) sifirdan uzaga yuvarlar (varsayim). ta.sar(0,01; 0,01; 0,1): baslangic = artis = 0,01, motor sar() implementasyonu TA-Lib baslangic yonunu kullanir; ilk barlarda Pine''dan farkli olabilir. Baslangic tarihi 2023-01-01 ve `Limit Testing Time` kapali (etkisiz). Stop/hedef yok; ATR x 3 stop eklendi.', Giris ve cikis kosulu ayni barda olusursa Pine strategy.close giris emrinden sonra calisir; motor yalniz acik pozisyona cikis uygular., 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_x5m5zevx.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
