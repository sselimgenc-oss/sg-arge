belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: MA 50/150/200, 20 bar yukselis, aralik uzunlugu 3, yuzdelik penceresi 150 (<= 40), kapanis araligi <= %4, hacim x 1,2 (acik), stop %8, hedefler %10/%20/%30. ta.percentrank: onceki 150 degerin simdikine esit/kucuk olanlarinin yuzdesi (gecerli bar haric; varsayim).', 'Pine''da uc strategy.exit emri (qty_percent 25 / 50 / 100, her biri ayni %8 stop ve +%10/+%20/+%30 limit) giris ortalamasina gore verilir: motorda stop = dolum x 0,92, %25 ve %50 dilimler bar ici limit (kademeli_cikis, bar_ici), kalan dilim hedef %30. Emirler pozisyon acildiktan sonra verildiginden dolum barinda etkin degildir (EXIT_GEC farki).', process_orders_on_close = true yalniz piyasa emirlerini etkiler; giris stop emridir (bar ici dolar). Tarih araligi girdisi test donemi girdisi sayildi., 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_hezsshjr.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
