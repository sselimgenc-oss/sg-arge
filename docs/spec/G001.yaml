id: G001
ad: KISS - Keep It Simple and Stupid (DAX 5m)
kart_yazari: claude
kaynak:
  dosya: day_trade_swing_trade_guncellenmis_strateji_listesi.pdf
  url: https://www.prorealcode.com/prorealtime-trading-strategies/keep-simple-stupid-strategy/
  sayfa: 2 (madde 4)
erisim_engeli: true
tarz: day
tf: 5m
mtf: null
tf_varsayim: false
yazar_piyasasi: Endeks (DAX)
gostergeler:
  ma20:
    f: sma
    src: close
    n: 20
  ma180:
    f: sma
    src: close
    n: 180
  ma200:
    f: sma
    src: close
    n: 200
  adx14:
    f: adx
    n: 14
ozel_kod: true
ozel_kod_nedeni: seans_saat
piyasa_kisiti:
- GER40
giris: ma20 > ma180 and ma180 > ma200 and ma20 > ma20[1] and ma180 > ma180[1] and ma200 > ma200[1] and cross_over(close, ma20) and close > open and adx14 > 12
cikis: close < ma180
stop: null
hedef: null
stop_eklendi: false
parametreler: {}
deneme_sayisi_kaynakta: null
rapor:
  pf: 1.25
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: evet (spread dahil)
spec_durumu: eksik
belirsiz:
- yalniz PDF ozeti (kaynak sayfasina erisilemedi; sandbox yalniz raw.githubusercontent.com'a erisir)
- 'PDF ozeti: MA20/180/200 siralamasi ve egimi ayni yonde; fiyat MA20''yi trend yonunde keser; mum ve ADX>12 teyidi; MA180 stop; 20.00 cikisi. Yalniz long kolu yazildi, short kolu belirsiz.'
- MA turu (basit varsayildi), ADX periyodu (14 varsayildi), 'mum teyidi' tanimi (close > open varsayildi) ve MA egim olcusu kaynakta yok
- 'MA180 stopu hareketli seviyedir: motorda sabit stop olarak yok, kapanis < MA180 cikisi olarak yaklasildi'
- 20.00 gun sonu cikisi saat/seans kurali (seans_saat); ifade dilinde saat ilkeli yok
