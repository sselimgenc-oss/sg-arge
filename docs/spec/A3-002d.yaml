id: A3-002d
ad: geraked BBRSI
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://github.com/geraked/tradingview
  sayfa: A3-002
tarz: day
tf: 5m
mtf: null
tf_varsayim: false
yazar_piyasasi: EURUSD
gostergeler:
  bb:
    f: bb
    n: 20
    carpan: 2.0
  rsi3:
    f: rsi
    src: close
    n: 3
    ma: rma
giris: rsi3[1] < 30 and close[1] < bb_lower[1] and rsi3 > 30 and close > bb_lower and rsi3 < 50 and close < bb_basis
cikis: cross_over(close, bb_basis) or close <= giris_stop or close >= giris_hedef
stop: null
hedef: null
stop_eklendi: false
parametreler: {}
deneme_sayisi_kaynakta: null
rapor:
  pf: 2.12
  sharpe: null
  getiri: null
  mdd: null
  islem: 88
  wr: '%75.0'
  maliyet_dahil: belirtilmemiş
spec_durumu: dakikalik
ozel_kod: false
belirsiz:
- '1H altı zaman dilimi: yalnız kripto (Binance) testine gider, BIST/ABD/emtia için Doğrulanamaz'
- 'Stop = bb_lower - 1.5*(bb_basis - bb_lower); hedef = giris + 1.5*(giris - stop): giriş fiyatına bağlı ifade, şema uzantısı (stop/hedef ifadesi) gerekir'
- 'Pine kaynağı: https://raw.githubusercontent.com/geraked/tradingview/master/strategies/BBRSI.pine'
- Yazarın test penceresi çok kısa (2023-06-18/07-14), maliyet/kayma belirtilmemiş
- Kaynak long/short; temel mod long-only
bias_varsayim: false
