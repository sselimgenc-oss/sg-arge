belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan varyant ''A_baseline_channel10'' (kismi cikis ve basabas yok); diger uc varyant (qty_percent kismi hedef + basabas) secili degildir, kartta yoktur. Giris 20 gun kirilimi + SMA(50) filtresi, cikis 10 gunluk kanal alti, stop dolum fiyati - 1,5 x ATR(20) (sinyal barinin ATR''si, pendingAtr).', Slippage = 5 ve yuzde 100 boyut kullanilmaz; motor baz maliyeti ve boyutu. Pine strategy.exit stop'u pozisyon acildiktan sonra dolum barinin kapanisinda kurar (sonraki bardan etkin); motorda dolum barindan etkindir., 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
