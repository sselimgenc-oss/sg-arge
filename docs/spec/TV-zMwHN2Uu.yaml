belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan input''lar: enableLongs/enableShorts = true, autoBefore = true, useAuto = false, useTrendFilter = false. Elle girilmis seviyeler (BTC 82600-87400 mutlak fiyatlari) 2026-09-21 tarihinden itibaren kullanilir; bu tarih kilitli donemin (2025-10-01+) otesindedir ve fiyat esikleri BTC''ye ozgudur, kartta cevrilmedi. 2026-09-21 oncesinin tamami Pine''in otomatik (pivot) seviyeleriyle calisir ve birebir cevrildi; tarihten sonra sinyal uretilmez.', 'Bekleme (cooldown): Pine lastTradeBar hem giriste hem pozisyonun kapandigi barda guncellenir; bar_index - lastTradeBar >= 6. Pozisyon kapisi (strategy.position_size == 0) ve short bacak (breakdown, long''dan sonra oncelik) Pine ile ayni sirada benzetilir; short bacak ticarete verilmez ama pozisyon kapisini ve beklemeyi etkiler (ters cevirme yok: pozisyon varken yeni giris olmaz).', 'Stop/hedef: Pine strategy.exit giris emriyle ayni barda verilir; seviyeler sinyal barinin kapanisindan (-%1,5 / +%3) sabitlenir, dolum barindan itibaren etkin (motorla ayni). Dolum fiyati sinyal kapanisindan farkli olabilir; Pine de ayni mutlak seviyeleri kullanir.', 'pivothigh/pivotlow: sert esitsizlik varsayildi (esitlik kurali dogrulanamadi); pivot, `sag` 5 bar sonra bilinir. priorHighClose = highest(close, 8)[6]. SMA(200) yalniz gorsel (useTrendFilter = false), kullanilmaz.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_zmwhn2uu.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
