belirsiz:
- Karar zaman dilimi 5m veya 15m (1 saatin altında)
- 'Özel kod mantığı (ProBuilder kaynak kodundan): (1) Saat 09:00-09:30 arasındaki açılış aralığının en yüksek (DailyHigh / orb_high) ve en düşük (DailyLow / orb_low) seviyeleri kaydedilir, (2) Sinyal çizgisi
  signal = TEMA[5](close) olarak hesaplanır, (3) Saat 09:30-11:30 veya 13:00-17:15 pencerelerinde (11:30-13:00 öğle arasında işlem açılmaz) günde en fazla 1 Long işlem (TradeCounterLong == 0) şartıyla cross_over(signal,
  DailyHigh) gerçekleştiğinde Long açılır, (4) Stop-loss sl = DailyHigh - DailyLow (açılış aralığı genişliği kadar), Take-profit tp = sl (1:1 R:R) ve akşam 17:30''da (DEFPARAM FlatAfter = 173000) açık pozisyon
  kapatılır'
- 'short kuralı var: Saat 09:30-15:00 arasında günde en fazla 1 short şartıyla cross_under(TEMA[5](close), DailyLow) ve close < DClose(1) olduğunda short açılır (SL ve TP = DailyHigh - DailyLow)'
- "ozel_kod_nedeni: seans_saat (09:00-09:30 acilis araligi, 09:30-11:30 / 13:00-17:15 islem pencereleri, gunde en fazla 1 islem)"
- "piyasa_kisiti: ['GER40'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
