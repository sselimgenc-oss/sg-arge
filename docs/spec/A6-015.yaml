- Quantpedia makalesindeki (Cyril Dujava & Filip Kalus) tam QuantConnect Python kodundan cikarilmistir; yalniz long calisir (trade_long = True, trade_short = False).
- 'Adim adim ikili dip (Double Bottom) algoritmasi (ozel_kod: true): 1) 24 ulke ETF''i (EWA, EWO, EWK, EWZ, EWC, FXI, EWQ, EWG, EWH, EWI, EWJ, EWM, EWW, EWN, EWS, EZA, EWY, EWP, EWD, EWL, EWT, THD, EWU,
  SPY) gunluk kapanislarla izlenir. 2) Ayda bir kez son 1000 gunluk veri uzerinde rolling_period = 30 (toplam 61 gunluk merkezli pencere, dolayisiyla bir yerel dip en az 30 gun sonra teyit edilir) ve aralarinda
  en az 30 takvim gunu mesafe olan yerel destek (Support) dipleri bulunur. 3) Aralarindaki mesafe 30 ile 1000 gun arasinda olan, dikey fiyat farki abs(Support_j / Support_i - 1) <= 0.02 (%2) olan ve aradaki
  tum destek noktalarinin daha yuksek dip seviyesinden (higher_bottom) asagi dusmedigi ciftler ''Double_Bottom'' olarak isaretlenir. 4) Son Double_Bottom olustuktan bugune kadar fiyat bu seviyenin altina
  hic inmemisse, o fiyata (limit_price = Double_Bottom) limit alim emri konur (en fazla 4 eszamanli acik pozisyon). 5) Emir gerceklestiginde %6 kar al (BUY_TP) ve %3 stop-loss (BUY_SL) konur; fiyat giris
  limit fiyatinin uzerine ciktikca stop-loss yeni zirvenin %3 altina (Price * 0.97) yukari tasinir.'
