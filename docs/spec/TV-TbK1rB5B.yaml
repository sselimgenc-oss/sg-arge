belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: useTrailing=false, flattenOnChop=false, maxBarsInTrade=0, tarih filtresi kapali; yani yazarin stop/hedefi yok (strategy.exit yalniz useTrailing ile). effectiveMult ADX rejimine gore degisir ve NEUTRAL (20-25) bolgede onceki deger korunur (Pine var). Supertrend seri carpanli: tv_ortak.supertrend, motor supertrend dongusunun bar-basina carpanli hali.', 'dmi(14, 14): ADX = Wilder yumusatmasi 14. Choppy rejimde yeni giris yok (long da short da); bu nedenle choppy iken gelen dusus donusu long''u kapatmaz (short girisi olusmaz).', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_tbk1rb5b.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
