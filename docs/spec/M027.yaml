belirsiz:
- '15 dakikalık bar kapanışları üzerinde sentetik Renko tuğlası hesaplama ve sinyal mantığı (ozel_kod: true): 1) İlk barda (barindex == BIfirst, varsayılan 1) upbrick = close ve downbrick = close - bricksize
  (bricksize=22 puan) olarak başlatılır. 2) Her 15m barda eğer close >= upbrick + bricksize ise: newbricksup = round(((close - upbrick) / bricksize) - 0.5); diffup = newbricksup * bricksize; downbrick =
  downbrick + diffup; upbrick = upbrick + diffup; totalbricksup = totalbricksup + newbricksup; totalbricksdown = 0. Eğer (totalbricksup[1] == 0 veya totalbricksup[1] == 1) ve totalbricksup >= 2 ise (en
  az 2 yükseliş tuğlası oluştuğunda) sonraki bar açılışında long (buy at market) girilir. 3) Eğer close <= downbrick - bricksize ise: newbricksdown = round(((downbrick - close) / bricksize) - 0.5); diffdown
  = newbricksdown * bricksize; upbrick = upbrick - diffdown; downbrick = downbrick - diffdown; totalbricksdown = totalbricksdown + newbricksdown; totalbricksup = 0. Eğer (totalbricksdown[1] == 0 veya totalbricksdown[1]
  == 1) ve totalbricksdown >= 2 ise long kapatılıp short (sellshort at market) açılır. 4) Ayrıca 120 puanlık sabit stop-loss (set stop ploss 120) uygulanır.'
