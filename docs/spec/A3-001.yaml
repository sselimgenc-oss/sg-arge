  ema_confirm_period: 1
  ema_fast_period: 14
  ema_medium_period: 18
  ema_slow_period: 24
  long_pullback_max_candles: 3
  short_pullback_max_candles: 3
  long_entry_window_periods: 2
  short_entry_window_periods: 2
  window_offset_multiplier: 1.0
  long_sl_atr_mult: 2.5
  long_tp_atr_mult: 12.0
  risk_percent: 0.01
deneme_sayisi_kaynakta: null
