belirsiz:
- Karar zaman dilimi 5m (1 saatin altında)
- 'Özel kod mantığı (4 fazlı durum makinesi - sunrise_ogle_xauusd.py): (1) SCANNING: EMA(1)''in EMA(14, 18, 24) sepetini yukarı kesmesi + mum yönü + EMA eğim açısı (slope in degrees) + ATR volatilite ve
  saat filtresi, (2) ARMED: 1 ile 3 adet (long_pullback_max_candles=3) düşüş (counter-trend) geri çekilme mumunun tamamlanmasını bekleme, (3) WINDOW_OPEN: 2 bar boyunca (long_entry_window_periods=2) window_offset_multiplier=1.0
  ile hesaplanan volatilite kanal kırılım seviyesini izleme (ters sinyalde sıfırlanır), (4) ENTRY: üst kırılım seviyesi aşıldığında Long giriş, 2.5 * ATR stop-loss ve 12.0 * ATR take-profit (OCA)'
- 'short kuralı var: Kodda short parametreleri (short_pullback_max_candles=3, short_entry_window_periods=2) tanımlanmış ancak varsayılan olarak devre dışı bırakılmıştır (SHORT strategy currently disabled)'
kart_yazari: argon
