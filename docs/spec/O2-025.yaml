belirsiz:
- Composer.trade sayfasından kurgu mantığı ('How it works') ve getiri raporu eksiksiz okundu
- 'Özel kod mantığı (Kaldıraçlı ETF Taktiksel Varlık Dağılımı): (1) TQQQ > SMA(TQQQ, 200) ise TQQQ tutulur; ancak RSI(TQQQ, 10) > 79 aşırı ısınma gösterirse UVXY (volatilite sıçraması) tutulur, (2) TQQQ
  < SMA(TQQQ, 200) ise aşırı satım sıçramaları aranır: RSI(TQQQ, 10) < 31 ise TECL (3x tech), değilse ve RSI(SOXL, 10) < 30 ise SOXL (3x semis) tutulur, (3) Diğer durumlarda TQQQ < SMA(TQQQ, 20) iken SQQQ
  (3x ters) veya BSV (kısa vadeli tahvil) arasında momentumu güçlü olan seçilir'
- "T22: kural agaci Composer acik uc noktasindan (https://stagehand-api.composer.trade/api/v1/public/symphonies/MmQbpf2U5TMQFmr9Nt2e/score) okundu ve rotasyon.agac olarak birebir cevrildi (esik, pencere ve varlik listesi kaynaktan; RSI Wilder, SMA/RSI gunluk kapanis uzerinden). Agac her bar degerlendirilir; hedef agirlik degisince emir verilir (EVRENSEL_KURALLAR D12). Kaldirac yok; kaldiracli ETF (TQQQ, UVXY vb.) enstruman sayilir. Composer sembolleri kapanista dolar (kendi backtest serisiyle gunluk getiri korelasyonu 1,0000 dogrulandi): D4 geregi dolum: kapanis; iki sekilde raporlanir (kapanis dolumu 2x maliyet | ertesi acilis)."
