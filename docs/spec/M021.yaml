belirsiz:
- 'Strateji makine öğrenmesi / olasılıksal gizli durum modeli (3 bileşenli Gaussian Hidden Markov Model - GaussianHMM) kullandığı için standart gösterge diliyle karta çevrilemez (spec_durumu: eksik, ozel_kod:
  true).'
- 'Algoritma adımları: 1) Piyasa değerine göre en büyük 10 ABD hissesi seçilir. 2) 1 dakikalık veriler 5 dakikalık barlara konsolide edilir ve 1-barlık değişim oranı (ROC(1)) için 150 barlık kayan pencere
  tutulur. 3) Her ay başında her hisse için son 150 adet 5 dakikalık getiri üzerinde hmmlearn GaussianHMM(n_components=3, n_iter=100, random_state=100) modeli eğitilir. 4) Her 5 dakikalık barda son getiri
  için durum olasılıkları (post_prob = model.predict_proba) hesaplanır; eğer post_prob[2] > post_prob[0] ise portföyün %10''u ile long pozisyon tutulur, aksi halde %-10 ağırlıkla short pozisyona geçilir.'
- "T10: ozel_kod_nedeni: ml (gizli Markov modeli)"
