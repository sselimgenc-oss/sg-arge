- 'Giriş/çıkış mantığı (ozel_kod: true): 1.00 puanlık Kase barı son Length=3 barın en düşük seviyesinin altına inip (low < lowest(low, 3)[1]) bir önceki Kase barının kapanışının üzerinde kapanırsa (close
