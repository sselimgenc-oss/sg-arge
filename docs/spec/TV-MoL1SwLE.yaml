parametreler: {kol: KRIPTO-4H}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: RSI 14, ADX 14, BB(20, 2), ATR 14, RR 2,5. Uc rejim girisi (yatay, trend, kirilim) VEYA ile birlestirildi; hepsi yalniz pozisyon yokken. Stop = giris - 1,5 x GUNCEL ATR, hedef = giris + (giris - stop) x 2,5 = giris + 3,75 x GUNCEL ATR (her barda yeniden). Short bacak yok.', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
