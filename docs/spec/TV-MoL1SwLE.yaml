id: TV-MoL1SwLE
ad: 3-Strategy Auto Switch - Range + Trend + Breakout
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/MoL1SwLE/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar vrhzytr; yayin sembolu BINANCE:BTCUSDT.P; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BINANCE:BTCUSDT.P)
kol: KRIPTO-4H
yayin_sembolu: BINANCE:BTCUSDT.P
gostergeler:
  rsi14: {f: rsi, src: close, n: 14}
  dm: {f: dmi, n: 14}
  bb: {f: bb, src: close, n: 20, carpan: 2.0}
  atr14: {f: atr, n: 14}
  volma: {f: sma, src: volume, n: 20}
  ema50: {f: ema, src: close, n: 50}
  ema200: {f: ema, src: close, n: 200}
ozel_kod: false
giris: (dm.adx < 25 and close > bb.lower and close < bb.upper and rsi14 < 35 and close <= bb.lower * 1.01 and volume > volma * 1.2) or (dm.adx > 25 and close > ema50 and ema50 > ema200 and cross_over(ema50, ema200) and rsi14 > 50 and close > bb.basis) or (volume > volma * 1.8 and cross_over(close, bb.upper) and dm.adx > 20 and rsi14 > 50 and close[1] < bb.upper[1])
cikis: null
stop: null
hedef: null
dinamik_cikis: {stop_giristen: 1.5 * atr14, hedef_giristen: 3.75 * atr14}
stop_eklendi: true
yalniz_long_bacak: true
