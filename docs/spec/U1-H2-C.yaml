belirsiz:
- "U1 on kaydi: donemler IS veri basi -> 2023-09-30, OOS 2023-10-01 -> 2025-09-30, kilitli 2025-10-01 -> bugun. Gecme: docs/GOREV_U1.md bolum 2 (kardes dogrulama K3)."
- "Kirilim: 'close > donchian(N).ust' kapanisin bir onceki barin N-bar zirvesini asmasi olarak yazildi (dc.upper[1]); donchian ust cizgisi guncel barin yuksegini icerdigi icin gecikmesiz kullanimda kosul asla dogru olmazdi."
- "Gun sonu: 1H barlarda UTC 23:45 yoktur. En yakin uygulanabilir: pozisyon UTC 23:00 acilisinda kapanir (22:00 acilisli bar kapaninca cikis sinyali, saat_utc() >= 22). Gece tasimamak icin giriste de saat_utc() <= 21 sarti var (mekanik, kaynakta degil)."
- "Iz suren stop: atr_kapanis_zirve, ATR14 x 2 (baslangic stopu da 2 ATR). Ema filtresi 'yok' varyanti izgara degeridir."
