id: U1-H2-C
ad: U1 Hat 2 - Kripto 1 saat gun ici trend devami (Donchian kirilimi)
kart_yazari: sonnet
kaynak:
  dosya: docs/GOREV_U1.md
  url: null
  sayfa: null
  not: "Kendi stratejimiz; mekanizma: gun ici trend devami / kirilim. On kayit tartisma/012_ozet_karar.md K6"
tarz: day
tf: 1H
mtf: null
tf_varsayim: false
yazar_piyasasi: Kripto
gostergeler:
  dc24:
    f: donchian
    n: 24
  ema50:
    f: ema
    src: close
    n: 50
ozel_kod: false
giris: close > dc24.upper[1] and close > ema50 and saat_utc() <= 21
cikis: saat_utc() >= 22
