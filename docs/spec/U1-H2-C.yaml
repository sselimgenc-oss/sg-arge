  n: 14
  carpan: 2
stop_eklendi: false
piyasa_kisiti: [KRIPTO]
parametreler:
  dc24.n: 24
  ema50.n: 50
izgara:
  # on kayit: 2 x 2 = 4 deneme
  - yol: gostergeler.dc24.n
    degerler: [12, 24]
  - yol: giris
    degerler:
      - "close > dc24.upper[1] and close > ema50 and saat_utc() <= 21"
      - "close > dc24.upper[1] and saat_utc() <= 21"
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT]
kardesler: [XRPUSDT, ADAUSDT, DOGEUSDT, TRXUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
