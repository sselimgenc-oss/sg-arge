id: U1-H2-A
ad: U1 Hat 2 - Kripto 15 dk volatilite sikismasindan kirilim
kart_yazari: sonnet
kaynak:
  dosya: docs/GOREV_U1.md
  url: null
  sayfa: null
  not: "Kendi stratejimiz; mekanizma: volatilite kumelenmesi ve sikisma sonrasi genisleme. On kayit tartisma/012_ozet_karar.md K6"
tarz: day
tf: 15m
mtf: null
tf_varsayim: false
yazar_piyasasi: Kripto
gostergeler:
  bbw_rank:
    f: bb_genislik_yuzdelik
    src: close
    n: 20
    carpan: 2
    pencere: 100
  bb20:
    f: bb
    src: close
    n: 20
    carpan: 2
ozel_kod: false
giris: bbw_rank <= 20 and close > bb20.upper and not (saat_utc() == 23 and dakika() >= 30)
cikis: saat_utc() == 23 and dakika() >= 30
stop:
  tip: atr
  n: 14
  carpan: 2
hedef:
  tip: atr
  n: 14
  carpan: 3
stop_eklendi: false
piyasa_kisiti: [KRIPTO]
parametreler:
  bbw_rank.esik: 20
  hedef_R: 1.5
izgara:
  # on kayit: 2 x 2 = 4 deneme. hedef.carpan = 2 (stop ATR carpani) x R
  - yol: giris
    degerler:
      - "bbw_rank <= 10 and close > bb20.upper and not (saat_utc() == 23 and dakika() >= 30)"
      - "bbw_rank <= 20 and close > bb20.upper and not (saat_utc() == 23 and dakika() >= 30)"
  - yol: hedef.carpan
    degerler: [3, 5]
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT]
kardesler: [XRPUSDT, ADAUSDT, DOGEUSDT, TRXUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
deneme_sayisi_kaynakta: 4
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- "U1 on kaydi: donemler IS veri basi -> 2023-09-30, OOS 2023-10-01 -> 2025-09-30, kilitli 2025-10-01 -> bugun. Gecme: docs/GOREV_U1.md bolum 2 (kardes dogrulama K3)."
- "bb_genislik_yuzdelik = (BB ust - BB alt) / BB orta bandinin son 100 bardaki (guncel dahil) yuzdelik sirasi (0-100). 'En dusuk %20' = <= 20 (izgara 10 ve 20). Esik karttaki 20'dir; 10 izgara degeridir."
- "Hedef: 'ATR x 2R' = stop mesafesi (2 ATR) x R; R=1,5 -> 3 ATR, R=2,5 -> 5 ATR. Stop de 2 ATR (Faz 1 boyutlama: islem basi risk %0,5)."
- "Gun sonu kurali: pozisyon en gec UTC 23:45 acilisinda kapanir. 23:30 acilisli bar kapaninca (23:45) cikis sinyali uretilir ve 23:45 acilisinda dolar. Mekanik gerek: 23:30 barinda yeni giris sinyali yok (gece tasinmasin); bu kaynakta degil, gun ici kuralinin kosuludur."
- "Kirilim 'close > bb.ust': bandin ust cizgisi guncel barin kapanisiyla hesaplanir (kapanmis bar), dolum sonraki aciliti (A1)."
