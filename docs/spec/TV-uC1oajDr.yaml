id: TV-uC1oajDr
ad: Woodies CCI Trend Strategy | Zero-Line Reject & Turbo Cross
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/uC1oajDr/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar blitz_locked; yayin sembolu COINBASE:ETHUSD; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (COINBASE:ETHUSD)
kol: KRIPTO-1D
yayin_sembolu: COINBASE:ETHUSD
gostergeler:
  cci14: {f: cci, n: 14}
  turbo: {f: cci, n: 6}
  ema34: {f: ema, src: close, n: 34}
  lsma: {f: linreg, src: close, n: 25, offset: 0}
  cmin5: {f: lowest, src: cci14, n: 5}
  cmax5: {f: highest, src: cci14, n: 5}
  trend: {f: seri, ifade: 'valuewhen(cmin5 >= 0 or cmax5 < 0, eger(cmin5 >= 0, 1, -1))'}
  lowrec: {f: lowest, src: cci14, n: 5, kaydir: 1}
  highrec: {f: highest, src: cci14, n: 5, kaydir: 1}
  zlr_long: {f: seri, ifade: 'trend == 1 and lowrec <= 50 and lowrec >= -100 and cci14 > cci14[1] and cci14[1] <= cci14[2] and cci14 > lowrec'}
  zlr_short: {f: seri, ifade: 'trend == -1 and highrec >= -50 and highrec <= 100 and cci14 < cci14[1] and cci14[1] >= cci14[2] and cci14 < highrec'}
  turbo_long: {f: seri, ifade: 'trend == 1 and cci14 > 0 and cross_over(turbo, cci14)'}
  turbo_short: {f: seri, ifade: 'trend == -1 and cci14 < 0 and cross_under(turbo, cci14)'}
  long_sig: {f: seri, ifade: '(zlr_long or turbo_long) and close > ema34 and lsma > lsma[1] and cci14 < 200'}
  short_sig: {f: seri, ifade: '(zlr_short or turbo_short) and close < ema34 and lsma < lsma[1] and cci14 > -200'}
ozel_kod: false
giris: long_sig
cikis: (trend == -1 and trend[1] != -1) or short_sig
stop: {tip: atr, n: 14, carpan: 2.0}
hedef: {tip: atr, n: 14, carpan: 3.0}
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-1D}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine sayaclari barsAbove/barsBelow (ardisik CCI>=0 / CCI<0 bar sayisi) ve kalici `trend` degiskeni: barsAbove >= 5 <=> son 5 barda CCI >= 0 (lowest(cci,5) >= 0), barsBelow >= 5 <=> highest(cci,5) < 0; trend son onaylanan yonu korur (valuewhen). CCI ilk gecerli bardan once NaN oldugundan sayac Pine''daki gibi gecerli veriyle baslar.', 'Varsayilan input''larla kapali dallar kartta yok: useHookFade=false (karsi trend fade), useSlopeFilt=false, exitOnZero=false, useDate=false. entryMode=Both: ZLR hook ve Turbo kesisimi birlikte.', Short sinyali (short_sig) acik long'u ters yonde strategy.entry ile kapatir; cikis ifadesinde yer alir. Trend asagi donusu (trendFlipDown) ayri cikistir., 'Stop = dolum fiyati - 2 x ATR(14) ve hedef = dolum + 3 x ATR(14); ATR sinyal barinin degeri (Pine: entryAtr = sinyal bari ATR''si, entry = strategy.position_avg_price).', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
