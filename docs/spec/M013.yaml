belirsiz:
- 'Sinyal barı Fibonacci stop/hedef ve kâr kilidi mantığı (ozel_kod: true): 1) EMA(30) üzerinde bir Bullish Engulfing / Outside bar (high > high[1] ve low < low[1], yazar #18. mesajda teyit edildiği üzere
  önceki barın high-low aralığını yutan barı engulfing olarak tanımlamaktadır) kapandığında sonraki 4H barın açılışında long girilir. 2) Sinyal barının low seviyesi Fibo 0, high seviyesi Fibo 100 olacak
  şekilde (R = high - low): Stop-Loss = low (Fibo 0), Take-Profit = high + R (Fibo 200) olarak konur. 3) Fiyat high + 0.5 * R (Fibo 150) seviyesine ulaştığında Stop-Loss high (Fibo 100 / başabaş) seviyesine
  çekilir.'
- 'Short kuralı: EMA(30) altında Bearish Engulfing bar oluştuğunda sonraki bar açılışında short girilir; Fibo 0 (high) SL, Fibo 200 (low - R) TP, Fibo 150''de SL Fibo 100''e çekilir.'
- "T10: ozel_kod_nedeni: sinyal_bari_referansi (stop/hedef/kar kilidi sinyal barinin Fibonacci seviyelerine bagli)"
