tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: true
belirsiz:
- 'OTT (Optimized Trend Tracker) listede yok: ozel_kod; TOTT==1 yön tanımı metinde formüle edilmemiş, Özbilgiç OTT standart mantığı varsayılır'
- Başlangıç stopu ayrıca yok; zirveden 2.5*ATR iz süren stop işlem açılışından itibaren varsayıldı
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 5,80); ölçüm/raporlama tavanı olabilir, PF'ye güvenilmez
parametreler:
  ott_fast.n: 14
  ott_fast.yuzde: 0.8
  ott_slow.n: 28
  ott_slow.yuzde: 1.6
id: P01
ad: Twin OTT (TOTT) çift bantlı trend sistemi
kaynak:
  dosya: Paper_Test_4_Lider_Day_ve_Swing_Strateji_Raporu.pdf
  url: null
  sayfa: bölüm 2.1
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: BIST/Kripto/FX (Kıvanç Özbilgiç, TradingView)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  ott_fast:
    f: ott
    src: close
    n: 14
    yuzde: 0.8
    ma: ema
  ott_slow:
    f: ott
    src: close
    n: 28
    yuzde: 1.6
    ma: ema
  ema50:
    f: ema
    src: close
    n: 50
  vol_sma20:
    f: sma
    src: volume
    n: 20
  atr14:
    f: atr
    n: 14
giris: (ema10w >= ema20w or close_1w >= ema20w * 0.985) and ott_fast.dir == 1 and ott_slow.dir == 1 and close > ema50 and volume > vol_sma20 *
  1.10
cikis: ott_fast.dir == -1 and ott_slow.dir == -1
iz_suren:
  tip: atr_zirve
  n: 14
  carpan: 2.5
kar_kilidi:
  tetik_atr: 1.5
  stop: giris * 1.002
rapor:
  pf: 5.37
  sharpe: 1.64
  getiri: +%846.9 (20 enstrüman ort.)
  mdd: '%17.5'
  islem: 27.6
  wr: '%61.1'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
bias_varsayim: false
