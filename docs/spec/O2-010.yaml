id: O2-010
ad: JPN225 QuietDrift (The Nikkei EA That Only Buys When Volume Is Quiet)
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.mql5.com/en/code/78027
  sayfa: null
tarz: day
tf: 15m
mtf: null
tf_varsayim: false
yazar_piyasasi: Endeks CFD (JPN225 / Nikkei 225)
gostergeler:
  sma34:
    f: sma
    src: close
    n: 34
  stdev34:
    f: stdev
    src: close
    n: 34
  macd_ind:
    f: macd
    src: close
    fast: 12
    slow: 26
    sig: 9
  atr14:
    f: atr
    n: 14
giris: close > sma34 + 0.5 * stdev34 and macd_ind.hist / atr14 < 0.2 and tick_vol < 0.6 * avg_vol_slot and server_time >= 111500 and server_time <= 150000
cikis: server_time >= 170000
stop:
  tip: atr
  n: 14
  carpan: 4.0
hedef:
  tip: atr
  n: 14
  carpan: 3.5
zaman_stop:
  bar: 23
stop_eklendi: false
ozel_kod: true
piyasa_kisiti: [JP225]
ozel_kod_nedeni: seans_saat
parametreler:
  ma_period: 34
  sd_mult: 0.5
  macd_atr_ratio_max: 0.2
  volume_threshold_pct: 0.6
  volume_avg_days: 20
  entry_start_server: '11:15'
  entry_end_server: '15:00'
  flat_server: '17:00'
  sl_atr_mult: 4.0
  tp_atr_mult: 3.5
deneme_sayisi_kaynakta: 1
rapor:
  pf: 1.68
  sharpe: 1.17
  getiri: 87.8
  mdd: 8.5
  islem: 309
  wr: 61.8
  maliyet_dahil: evet
spec_durumu: dakikalik
belirsiz:
- Karar zaman dilimi M15 (1 saatin altında)
- MQL5 CodeBase sayfasından yazarın (Tomasz Wojciech Forszpaniak) açık kaynak kodu eksiksiz okundu
- 'Özel kod mantığı: Kapanan son barda 3 koşul aranır: (1) Fiyat yukarı meyilli: close > SMA(34) + 0.5*StdDev(34), (2) Momentum aşırı gergin değil: MACD histogram / ATR(14) < 0.2, (3) Hacim sakin: son 20
  günün aynı 15 dakikalık dilimi ortalamasının %60''ından az hacim. Seans saati 11:15-15:00 arasında sonraki bar açılışında Long açılır; stop-loss 4 ATR, kâr hedefi 3.5 ATR ve saat 17:00 sunucu saatinde
  gün sonu tüm pozisyonlar kapatılır'
- Yalnızca Long yönlü bir stratejidir (short kuralı yoktur)
- "ozel_kod_nedeni: seans_saat (sunucu saati 11:15-15:00 penceresi, 17:00 zorunlu kapanis, ayni 15 dk dilimin 20 gunluk tick hacmi ortalamasi)"
- "piyasa_kisiti: ['JP225'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
