belirsiz:
- Karar zaman dilimi 30m (1 saatin altında)
- 'PyneSys aynasından (https://wild.pynesys.io/scripts/emperorbtc-s-vwap-strategy-wmJ1ovZQ, yazar: vaidab) EmperorBTC''nin popüler kripto VWAP stratejisi okundu: Fiyat seans VWAP''ını yukarı kırıp 20 EMA üzerinde kaldığında Long girilir; VWAP altına inişte çıkılır'
- 'short kuralı var: Fiyat VWAP ve 20 EMA altına indiğinde short açılır'
- 'T8: ozel_kod true -> false (yalniz kutuphane gostergeleri (vwap, ema); vwap UTC gunu basinda sifirlanir (oturum VWAP''i), 30m kart yalniz kripto testine gider); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi'
- 'U7 dakikalik: yazar piyasasi ''Kripto (BTCUSDT)''; kural ve parametreler degistirilmeden KRIPTO25 kolunda, kartin kendi tf''inde (30m) Binance verisiyle kosulur. Kartta seans saatine bagli kural yok. Kartta stop yok: ATR14 x 3 eklenir (stop_eklendi: true).'
