belirsiz:
- Karar ve aralık hesaplama verisi M1 (1 saatin altında); ABD seans açılışı (16:30 GMT+3) sonrası ilk dakikaların high/low aralığını (Opening Range) M1 verisinden çıkarır
- 'Özel kod mantığı: Açılış aralığının üstüne Buy Stop, altına Sell Stop (OCO) konur; günde en fazla 1 işlem açılır; ATR filtresiyle aşırı dar/geniş aralıklı günler atlanır; SL aralık genişliğinin bir kesri,
  TP ise R çarpanıdır; seans sonunda tüm pozisyonlar kapatılır'
- Aralık uzunluğu (dakika), SL aralık kesri, TP R çarpanı ve ATR filtre eşiklerinin sayısal varsayılanları açıklama metninde yazmayıp .mq5 dosyasındadır
- 'short kuralı var: Açılış aralığının altına konan Sell Stop tetiklendiğinde short açılır ve Buy Stop silinir'
- 'lider: varsayilan parametreler .mq5 icinde, okunmadi'
kart_yazari: argon
