belirsiz:
- Karar zaman dilimi M30 (1 saatin altında, bazen M10)
- 'Tamamen görsel/ihtiyari (discretionary) Quasimodo / Over-and-Under fiyat formasyonudur: Dip (L) -> Tepe (H) -> Daha Düşük Dip (LL) -> Daha Yüksek Tepe (HH) kırılımı sonrası fiyatın ilk Dip (L) yatay
  seviyesine geri çekilmesinde Long girilir; mekanik swing tanımı, stop-loss ve çıkış kuralları yoktur'
- 'short kuralı var: Tepe (H) -> Dip (L) -> Daha Yüksek Tepe (HH) -> Daha Düşük Dip (LL) sonrası ilk Tepe (H) seviyesine geri çekilmede short girilir'
- 'lider: gorsel formasyon, ihtiyari -> Dogrulanamaz'
