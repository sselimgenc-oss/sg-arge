id: A3-002a
ad: geraked CEZLSMA
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://github.com/geraked/tradingview
  sayfa: A3-002
tarz: day
tf: 1m
mtf: null
tf_varsayim: false
yazar_piyasasi: EURJPY
gostergeler:
  chand:
    f: chandelier
    n: 1
    carpan: 2
  lsma:
    f: linreg
    src: close
    n: 50
    offset: 0
  lsma2:
    f: linreg
    src: lsma
    n: 50
    offset: 0
  zlsma:
    f: seri
    ifade: lsma + (lsma - lsma2)
giris: chand.dir == 1 and chand.dir[1] == -1 and close > zlsma
cikis: cross_under(close, zlsma)
stop:
  tip: seviye
  ifade: sinyal_chand.long_stop
hedef: null
stop_eklendi: false
parametreler: {}
deneme_sayisi_kaynakta: null
rapor:
  pf: 5.392
  sharpe: null
  getiri: null
  mdd: null
  islem: 457
  wr: '%70.2'
  maliyet_dahil: belirtilmemiş
spec_durumu: tam
ozel_kod: false
belirsiz:
- '1H altı zaman dilimi: yalnız kripto (Binance) testine gider, BIST/ABD/emtia için Doğrulanamaz'
- 'PF > 3 ve 30 günden kısa pencere: aşırı uyum alarmı'
- 'Pine kaynağı: https://raw.githubusercontent.com/geraked/tradingview/master/strategies/CEZLSMA.pine'
- Yazarın test penceresi çok kısa (2023-07-02/07-12 (10 gün)), maliyet/kayma belirtilmemiş
- Kaynak long/short; temel mod long-only
- 'T21: Pine kaynagi (CEZLSMA.pine, raw.githubusercontent) birebir portlandi: chandelier(n=1, carpan=2) ilkeli (ratchet long_stop/short_stop ve dir bayragi), ZLSMA = lsma + (lsma - linreg(lsma, 50)) linreg ilkelinden. Giris: dir -1''den +1''e doner ve close > zlsma; cikis: close zlsma''yi asagi keser; stop sinyal barindaki long_stop''ta sabit (D10). Kaynak kodu ''close'' kullanir; yazar videoda Heikin Ashi grafikte calistiriyor olabilir (kod HA donusumu yapmaz), duz mumlar kullanildi'
- 'U7 dakikalik: yazar piyasasi ''EURJPY''; kural ve parametreler degistirilmeden KRIPTO25 kolunda, kartin kendi tf''inde (1m) Binance verisiyle kosulur. Kartta seans saatine bagli kural yok.'
