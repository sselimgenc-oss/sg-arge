id: O2-005
ad: Trading Made Simple
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.forexfactory.com/thread/291622-trading-made-simple
  sayfa: null
tarz: swing
tf: 1H
mtf: null
tf_varsayim: false
yazar_piyasasi: Forex
gostergeler:
  ema5:
    f: ema
    src: close
    n: 5
  tdi_rsi:
    f: rsi
    src: close
    n: 13
  tdi_green:
    f: "sma"
    src: "tdi_rsi"
    n: 2
  tdi_red:
    f: "sma"
    src: "tdi_rsi"
    n: 7
  ha:
    f: "heikinashi"
giris: cross_over(tdi_green, tdi_red) and tdi_green > 50 and close > ema5 and ha.close > ha.open
cikis: cross_under(tdi_green, tdi_red) or tdi_green < tdi_green[1]
stop:
  tip: pips
  deger: 30
hedef: null
stop_eklendi: false
ozel_kod: false
piyasa_kisiti: [FX]
parametreler:
  RSI_Period: 13
  Price_Line: 2
  Trade_Signal: 7
  Market_Base_Line: 34
  EMA_Period: 5
  StopLossPips: 30
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- 'ForexFactory konusu Post #1 ve BigE (Eric) resmi sistem kılavuzundan (https://www.forexfactory.com/thread/494420-trading-made-simple-the-right-way-and-other) okundu'
- 'Özel kod mantığı: Heiken Ashi mumları, 5 EMA ve Traders Dynamic Index (TDI: 13 periyot RSI, 2 periyot yeşil RSI Fiyat çizgisi, 7 periyot kırmızı Ticaret Sinyal çizgisi, 34 periyot sarı Piyasa Taban çizgisi).
  Long Giriş: Yeşil çizgi Kırmızı çizgiyi yukarı kestiğinde (saat 12-2 yönünde açı), tercihen sarı 50 çizgisinin üzerinde ise ve Heiken Ashi mumu mavi/yeşil olup 5 EMA üzerinde kapandığında yeni mum açılışında
  girilir; Çıkış: Yeşil çizgi yataylaştığında, aşağı büküldüğünde veya kırmızıyı aşağı kestiğinde kapatılır; varsayılan stop-loss 30 piptir'
- 'short kuralı var: Yeşil TDI kırmızıyı aşağı kestiğinde ve HA mumu kırmızı olup 5 EMA altında kapandığında short açılır'
- "T8: ozel_kod true -> false (TDI yesil cizgi = SMA(RSI13, 2), kirmizi = SMA(RSI13, 7) (kartin parametreler alani: Price_Line 2, Trade_Signal 7); 'ha_candle == green' -> 'ha.close > ha.open'. 30 pip stop kartta oldugu gibi); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi"
- "piyasa_kisiti: ['FX'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
