belirsiz:
- "U1 on kaydi: donemler IS veri basi -> 2023-09-30, OOS 2023-10-01 -> 2025-09-30, kilitli 2025-10-01 -> bugun. Gecme: docs/GOREV_U1.md bolum 2 (kardes dogrulama K3)."
- "'UTC 13:00 barinin kapanisinda' = UTC 13:00 ACILISLI saatlik bar (13:00-14:00); sinyal 14:00'te bar kapaninca verilir, dolum 14:00 acilisinda (A1). saat_utc() barin acilis saatini verir, bu yuzden giris saat_utc() == 13."
- "Cikis 'UTC 20:00' = 20:00 acilisinda dolum; 19:00 acilisli bar kapaninca sinyal (saat_utc() == 19). 17:00 varyanti saat_utc() == 16. Stop ATR14 x 2, hedef yok, gunde en fazla bir giris (tek saatlik kosul)."
- "'Gun acilisi' = UTC gununun ilk saatlik barinin acilisi (gosterge gun_acilis, UTC 00:00); vwap UTC gunune sabitlenir (anchor D, engine/gosterge.py vwap)."
