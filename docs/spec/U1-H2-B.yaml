id: U1-H2-B
ad: U1 Hat 2 - Kripto ABD seans acilisi akisi (1 saat kurulum, 15 dk / 5 dk giris)
kart_yazari: sonnet
kaynak:
  dosya: docs/GOREV_U1.md
  url: null
  sayfa: null
  not: "Kendi stratejimiz; mekanizma: ABD seans acilisinda (UTC 13:30) gun ici momentum ve akis. On kayit tartisma/012_ozet_karar.md"
tarz: day
tf: 15m
mtf: 1H
tf_varsayim: false
yazar_piyasasi: Kripto
gostergeler:
  close_1s:
    f: close
    tf: 1H
  gun_acilis_1s:
    f: gun_acilis
    tf: 1H
  vwap_1s:
    f: vwap
    anchor: D
    tf: 1H
  kurulum_ham:
    f: seri
    ifade: "eger(close_1s > gun_acilis_1s and close_1s > vwap_1s, 1, 0)"
  kurulum:
    f: seri
    ifade: "valuewhen(saat_utc() == 13 and dakika() == 0, kurulum_ham)"
  yuksek6:
    f: highest
    src: high
    n: 6
ozel_kod: false
giris: kurulum == 1 and ((saat_utc() == 13 and dakika() >= 30) or saat_utc() == 14) and close > yuksek6[1]
cikis: null
stop:
  tip: atr
  n: 14
  carpan: 2
hedef: null
cikis_saati: "20:00"
gun_sonu: "23:45"
gunde_en_fazla: 1
stop_eklendi: false
piyasa_kisiti: [KRIPTO]
parametreler:
  giris_tf: 15m
  cikis_saati_utc: "20:00"
izgara:
  # on kayit: giris_tf x cikis saati = 4 deneme
  - yol: tf
    degerler: [15m, 5m]
  - yol: cikis_saati
    degerler: ["17:00", "20:00"]
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
deneme_sayisi_kaynakta: 4
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- "U1 on kaydi: IS 2018-01-01 -> 2023-09-30, OOS 2023-10-01 -> 2025-09-30, kilitli 2025-10-01 -> bugun (yalniz lider acar). Gecme: GOREV_U1 bolum 4."
- "ONEMLI YORUM: Kaynak metinde 'UTC 13:00 1s barı kapandığında' kurulum, giris penceresi ise 'UTC 13:30-15:00'. 1 saatlik bar etiketi acilis saatiyse 13:00 bari 14:00'te kapanir ve 13:30-14:00 girisleri ileriye bakis olurdu. Bu yuzden kurulum, UTC 13:00'te KAPANAN saatlik bar (12:00 acilisli) olarak okundu: o bar 13:00'te bilinir, gun acilisindan getiri > 0 ve close > vwap o ana kadar dondurulur (valuewhen), giris 13:30-15:00 penceresinde. Diger okuma ('13:00 acilisli bar', giris ancak 14:00-15:00) lider karari ile degistirilebilir; bu yeni bir deneme sayilir."
- "Pencere: giris sinyal barinin ACILISI 13:30 <= t < 15:00. Tetik: giris TF kapanisi > bir onceki 6 giris TF barinin en yuksek 'high'i (yuksek6[1]; guncel bar dahil olsaydi kosul asla saglanmazdi). Gunde en fazla 1 islem (gunde_en_fazla: 1, UTC gunu, fill sayilir)."
- "Kurulum 'gun acilisindan getiri > 0': saatlik kapanis > UTC gununun ilk saatlik barinin acilisi (gosterge gun_acilis); vwap UTC gunune sabitlenir (anchor D) ve 1 saatlik barlardan hesaplanir."
- "Cikis: cikis_saati (UTC 17:00 ya da 20:00 acilisinda flat), stop ATR(14,giris TF) x 2, hedef yok; gun_sonu 23:45 emniyet."
