belirsiz:
- NinjaTrader sayfasının referans verdiği Temmuz 2017 Stocks & Commodities Traders' Tips sayfasından (https://technical.traders.com/content/TTlink.asp?mo=07&yr=2017, Markos Katsanos 'Trading The Nikkei')
  tam strateji kodu okundu
- 'Özel kod mantığı (Piyasalararası Regresyon Uyumsuzluğu): Ana enstrüman (DXJ / Nikkei) için RS1 = ROC(Close, 3), Data2 (FXY - Yen ETF) için RS2 = ROC(Close_FXY, 3) ve Data3 (SPY) için RS3 = ROC(Close_SPY,
  3) hesaplanır. CR2 = Correlation(RS1, RS2, 50), CR3 = Correlation(RS1, RS3, 50). 50 barlık doğrusal regresyon eğimi b2 = CR2 * StdDev(RS1, 50) / (StdDev(RS2, 50) + 0.001), kesim noktası a2 = SMA(RS1,
  50) - b2 * SMA(RS2, 50), tahmin PRED2 = b2 * RS2 + a2 ve uyumsuzluk DIV2 = PRED2 - RS1 bulunur. IM2 = SMA(DIV2 - Lowest(DIV2, 50), 2) * 100 / (SMA(Highest(DIV2, 50) - Lowest(DIV2, 50), 2) + 0.01) olarak
  normalize edilir. Long Giriş: IM2[3] > 75 ve IM2 < IM2[3] ve IM2 > 25 ve CR3 < 0.8 ve (LinRegSlope(Close, 25) >= LinRegSlope(Close, 25)[1] veya Close > SMA(Close, 25)). Çıkış: (1) İşlemde 3 bardan fazla
  kalındıysa ve Close < GirisFiyati * (1 - 0.015) ve Stoch(25, 3) > 10 ise başlangıç stopu, (2) İşlemde 7 bardan fazla kalındıysa ve Close < Highest(Close, BarsSinceEntry) * (1 - 0.015) ise iz süren stop,
  (3) BarsSinceEntry >= 11 barda zaman stopu'
- 'short kuralı var: IM2[3] < 25 ve IM2 > IM2[3] ve IM2 < 75 ve CR3 < 0.8 ve (LR <= LR[1] veya Close < SMA(Close, 25)) olduğunda short açılır (3 bar sonra %1.5 stop + Stoch < 90, 7 bar sonra %1.5 iz süren
  stop, 11 bar zaman stopu)'
- "ozel_kod_nedeni: cok_enstruman (FXY ve SPY serileri ile cross-instrument regresyon uyumsuzlugu)"
