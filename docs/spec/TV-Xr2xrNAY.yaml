belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'presentBollingBand: var degisken, her barda close > band ise max(band, alt), close < band ise min(band, ust), esitse 0.0; long sinyalinde alt banda, short sinyalinde ust banda atanir (short sinyali long bacakta islem acmaz ama bandi ayni sekilde sifirlar, kod bunu dahil eder). Alt/ust bant SMA/stdev(high ve low, 50) +- 2.7183 x stdev.', 'ta.crossover(priceSource, presentBollingBand) cagrisi sinyal aninda bandin bir onceki barin nihai degerini kullanir (var, bar basinda tasinir): a > B[t-1] ve a[t-1] <= B[t-1]. Cikis kosulu ise guncel (guncellenmis) bandla ta.crossunder(close, band) kullanir; modul ikisini de bu sirayla uygular.', 'Hlc3 kaynagi ve RSI(10) uzerinde SMA(5) filtresi varsayilan (useRSI=true). Giris/cikis pozisyondan bagimsiz hesaplanir, pozisyon kapisi motordadir.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_xr2xrnay.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
