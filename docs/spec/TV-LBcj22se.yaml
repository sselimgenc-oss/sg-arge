id: TV-LBcj22se
ad: Trend Pulse OBV
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/LBcj22se/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar ADXAE; yayin sembolu NASDAQ:AAPL; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD (NASDAQ:AAPL)
kol: ABD-1D
yayin_sembolu: NASDAQ:AAPL
gostergeler:
  hlc3: {f: seri, ifade: (high + low + close) / 3}
  srcin: {f: seri, ifade: 'hlc3 + (hlc3 - hlc3[17])'}
  trr: {f: tr}
  trin: {f: seri, ifade: 'trr + (trr - trr[17])'}
  f1: {f: ema, src: srcin, n: 20}
  f2: {f: ema, src: f1, n: 20}
  f3: {f: ema, src: f2, n: 20}
  f4: {f: ema, src: f3, n: 20}
  t1: {f: ema, src: trin, n: 20}
  t2: {f: ema, src: t1, n: 20}
  t3: {f: ema, src: t2, n: 20}
  t4: {f: ema, src: t3, n: 20}
  upper: {f: seri, ifade: f4 + t4 * 1.414}
  obv: {f: obv}
  obvema: {f: ema, src: obv, n: 60}
  reg: {f: ema, src: close, n: 50}
  atr14: {f: atr, n: 14}
  atrprev: {f: seri, ifade: 'atr14[1]'}
ozel_kod: false
giris: cross_over(close, upper) and close > reg and obv > obvema
cikis: close < f4 or close < reg
stop: {tip: seviye, ifade: sinyal_close - 1.7 * sinyal_atrprev}
hedef: null
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [ABD]
parametreler: {kol: ABD-1D}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Trend Pulse Channel: 4 kutuplu kaskad EMA. alpha = -beta + sqrt(beta^2 + 2 beta), beta = (1 - cos(2 pi / 144)) / (1,414^(2/4) - 1) = 0,00503 -> alpha = 0,09542, EMA uzunlugu int(2 / alpha) = 20 (Pine int() kesme). Lag Mode acik (varsayilan): kaynak ve ta.tr(true) icin x + (x - x[17]), 17 = int((144 - 1) / (2 x 4)). Kaynak hlc3. Bant = filtre + 1,414 x filtrelenmis TR. EMA zincirinin tohumlamasi yalniz isinma doneminde farkli olabilir.', 'Varsayilanlar: OBV > EMA(OBV, 60), kapanis > EMA(50) rejim filtresi, cikis kapanis < filtre orta cizgisi VEYA kapanis < EMA(50), baslangic 2018-01-01 (test donemi bu tarihte basladigindan kartta ayri bir tarih kosulu yok). pyramiding = 1 olsa da giris `position_size == 0` kapisindadir (ek alim yok).', 'Stop sinyal barinin kapanisindan ve ONCEKI barin ATR''sinden sabitlenir (stopOffset = atr[1] x 1,7, var stopPrice giriste kurulur); strategy.exit dolum barinda verilir (kartta tip: seviye, sinyal_atrprev). Aksi halde bar basina degismez.', 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).']
deneme_sayisi_kaynakta: 205
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
