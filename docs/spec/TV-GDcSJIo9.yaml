belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 9/21/50, EMA21 uzerinde en az 4 hafta (20 bar) kalis, EMA9 tepesine mesafe %0-3, 90 barda en az 2 ''bulut sicramasi'' (low <= EMA21 x 1,02 ve close > EMA9), 60 barin en az %60''i EMA9 uzerinde, ATR %3, 52 hafta dibinden en az %50 yukari; cikis modu ''EMA21 Close'' (close < EMA21). Ardisik kapanis sayaci barssince(close <= EMA21) ile ayni degeri verir (Pine''da var sayac); math.sum ayni uzunluktaki SMA x N ile hesaplandi.', Pine strategy.close sonraki acilista dolar (process_orders_on_close=false)., 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).', 'U7 Ek 1: kol DIGER-1D → ABD25-1D eslendi (kural ve parametreler degismedi; yayin sembolu NSE:NETWEB).']
