gostergeler:
  ema9: {f: ema, src: close, n: 9}
  ema21: {f: ema, src: close, n: 21}
  ema50: {f: ema, src: close, n: 50}
  atr14: {f: atr, n: 14}
  low52: {f: lowest, src: low, n: 252}
  bars21: {f: seri, ifade: barssince(close <= ema21)}
  up9: {f: seri, ifade: 'eger(close > ema9, 1, 0)'}
  up9_60: {f: sma, src: up9, n: 60}
  gb: {f: seri, ifade: 'eger(low <= ema21 * 1.02 and close > ema9, 1, 0)'}
  gb90: {f: sma, src: gb, n: 90}
