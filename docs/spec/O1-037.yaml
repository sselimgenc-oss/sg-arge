belirsiz:
- TradingView sayfası doğrudan açılmadı; stratejinin orijinal kaynağı olan ForexSignals TV resmi YouTube videosu (https://www.youtube.com/watch?v=zhEukjCzXwM) ve FrameworkFX 11 aylık backtest videosu (https://www.youtube.com/watch?v=m1RiTkwY9_g)
  transkriptlerinden tüm kurallar eksiksiz okundu
- Karar zaman dilimi 5m (1 saatin altında); üst zaman dilimi (anchor chart) 1h
- 'Özel kod mantığı: (1) 1H grafikte EMA(8) > EMA(21) olmalı ve fiyat her iki EMA''nın üzerinde seyretmeli, (2) 5M grafikte EMA(8) > EMA(13) > EMA(21) yukarı yelpaze açmalı, (3) Fiyat geri çekilip 5M EMA(8)''e
  değmeli (low <= ema8) ancak EMA(21) altında kapanış yapmamalı (tetik barı), (4) Tetik barından önceki 5 mumun en yüksek seviyesinin (highest(high, 5)[1]) 3 pip üzerine Buy Stop emri konulur (emir tetiklenmeden
  önce mum EMA(21) altında kapanırsa emir iptal edilir), (5) İlk stop-loss tetik barının en düşüğünün (low) 3 pip altına konulur; 1:1 R:R (1R) seviyesinde pozisyonun %50''si kapatılıp stop girişe (breakeven)
  çekilir, kalan %50 pozisyon ya 2R hedefte ya da son 3 mumun en düşüğünün 3 pip altında (lowest(low, 3)[1] - 3 pip) iz süren stopla kapatılır'
- 'short kuralı var: 1H EMA(8) < EMA(21) ve 5M EMA(8) < EMA(13) < EMA(21) iken fiyat EMA(8)''e değip EMA(21) üstünde kapanmadan önceki 5 barın en düşüğünün 3 pip altına Sell Stop konulur, SL tetik barı
  high + 3 pip'
