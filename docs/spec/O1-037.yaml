giris: mtf("1H", ema8_1h > ema21_1h and close_1h > ema8_1h) and ema8 > ema13 and ema13 > ema21 and low[1] <= ema8[1] and close[1] >= ema21[1] and high > hh5[1]
cikis: close < ll3[1]
stop: null
