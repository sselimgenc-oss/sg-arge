belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Sinyal secimi `signalBar`/`signalType` durum degiskenleriyle yapilir: son sinyalden sonra 4 bar gecmeden yeni sinyal secilmez; cikista durum sifirlanir. Giris sinyali ile pozisyon kapisi (strategy.opentrades > 0, entry_bar_index) Pine ile ayni sirada benzetilir (emir sonraki acilista dolar; giris bari = dolum bari, bars = bar_index - dolum bari >= 4).', 'Short sinyali long''u ters cevirir; short ticarete verilmez, cikis olarak kalir. ta.ema(src, 1) kaynaga esittir. Stop/hedef yok; ATR x 3 stop eklendi.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_qurvpamt.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
