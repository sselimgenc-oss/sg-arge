- Dion Kurczek (Traders 03/23) stratejisinin f1_maik tarafindan 5m NAS100 (Europe/Berlin saati) icin kodlanmis halidir; yalniz long calisir (defparam cumulateorders = false).
- 'Adim adim kurallar (ozel_kod: true): 1) Pazartesi saat 15:30 barinda (opendayofweek == 1 and time == 153000) referans kapanis alinir: Kauf = close * 0.99 (%1 alti), AnpassungTP = close * 0.985 (%1.5 alti). 2) Pazartesi 15:30''dan Sali 21:30''a kadar (timec1 and timec2) Kauf seviyesine limit alim emri (buy at Kauf limit) verilir ve hedef %1 (set target %profit 1) olarak ayarlanir. 3) Pozisyon acikken fiyat ek %0.5 daha duserse (kodda ''(close - tradePrice) =< AnpassungTP'' yazilmistir, metinde fiyat %0.5 daha duserse yani close <= AnpassungTP oldugunda hedef basabas noktasina Kauf''a cekilir). 4) Cuma saat 21:30''da (opendayofweek == 5 and time == 213000) acik pozisyon piyasadan kapatilir (zaman stopu). 5) Sigorta stop-loss %5''tir (set stop %loss 5).'
- 'T10: ozel_kod_nedeni: bekleyen_emir (Pazartesi 15:30 kapanisinin %1 altina limit alim, %1.5''ta basabas hedefi, Cuma 21:30 zaman cikisi)'
