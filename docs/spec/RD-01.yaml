belirsiz: ['Kural arastirma/reddit/ozet.md bolum A''daki yazar sozlerinden birebir cevrildi; parametre eklenmedi/degistirilmedi. Yazarin boyut/kaldirac bilgisi yoktur: boyut EVRENSEL_KURALLAR A6.', 'ozel_kod: true (durum makinesi: stoptan sonra yeniden giris kilidi pozisyon gecmisine baglidir): strategies/ozel/rd_01.py. Modul pozisyonu kendi icinde izler; motor giris sinyalini tek tek dolduruyorsa ayni yolu izler (sermaye/risk limitiyle atlanan giris olursa kilit durumu sapabilir).', 'Evren tek ETF evrenidir: SPY ve QQQ (ABD-1D kolu, her biri kendi sinyaliyle, havuz portfoyu).', 'Giris ''ertesi acilista al'': sinyal kapanista, dolum sonraki acilista. Cikis ''ilk kapanis > SMA(5)'': dolum barinin kapanisindan itibaren kontrol edilir; ''en cok 10 gun'': dolum gununu 1. gun sayarak 10. gunun kapanisinda cikis sinyali (ertesi acilista dolar) - gun sayimi yazarin sozlerinde net degil.', 'Stop: yazar ''kapanis girisin %8 altinda ise ertesi acilis'' der (kapanis tabanli). Motor stopu bar ici (dolum fiyatinin %8 alti) uygular; bar ici dokunup kapanista toparlanan barlarda ve cikis fiyatinda (stop seviyesi/acilis) Pine/yazar sonucundan farkli olabilir. Stop yazarindir (stop_eklendi: false).', '''Art arda 3 dusen kapanis'': close < close[1] < close[2] < close[3]. IBS = (kapanis - dusuk) / (yuksek - dusuk), aralik 0 ise tanimsiz (sinyal yok). RSI(2) Wilder (RMA).', 'Stoptan sonra yeniden giris: stop barindan sonraki ilk kapanis > SMA(5) olana dek giris yok (stop barinin kendisi sayilmaz).', 'Yazarin kendi rastgele giris karsilastirmasi 100 denemenin 78''ini gecmis (p ~ 0,22); bizim null kapisinda zorlanmasi beklenir (ozet.md). deneme_sayisi_kaynakta: yazar ~100+ strateji denemis (yaklasik, ''veri kazima'' payi).']
