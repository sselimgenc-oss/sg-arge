belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine pyramiding = N ayni yonde en fazla N giris demektir (N = 0 ve 1 tek giris); motor piramit.en_cok ek giris sayisidir (en_cok = N - 1). Her ek birim motorda kendi stop mesafesiyle ve normal islem basi risk kuraliyla boyutlanir, toplam acik risk sinirina dahildir; yazarin sabit miktar / sermaye yuzdesi kodu kullanilmaz. Cikis sinyali butun birimleri kapatir. pyramiding = 3: en fazla 3 birim (en_cok = 2); Pine `lastEntryBar`''i reddedilen (limit asimi) sinyalde de gunceller, kart ayni sirada sinyal uretir.', 'Pullback mandali `pullbackArmed` var degiskenidir (trend bitince / cikista / aday girisi sonrasi sifirlanir, EMA''ya degince kurulur). ta.dmi(14, 14) ADX; baslangic 2018-01-01. Stop/hedef yok; her birime ATR x 3 stop eklendi.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_cz5kaiof.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
