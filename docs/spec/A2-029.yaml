- Stop-loss seviyesi ve tam çıkış kuralı tanımlanmamıştır (yalnızca bir örnekte %38.2 Fib seviyesinde kısmi kâr alındığı ve stop-loss'un kullanıcıya bağlı olduğu belirtilmiştir)
- 'short kuralı var: Dip (L) ve Tepe (H) sonrası fiyat Dibi aşağı kırıp LL yaptığında, LL ile H arasına çekilen Fibonacci %78.2 düzeltme seviyesinde short girilir'
