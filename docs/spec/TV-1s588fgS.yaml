belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: Trade Mode = Both, Entry Style = Reclaim Band, TP %3, SL %1,5, EMA(200) trend filtresi acik. Short bacak (ust banttan geri donus, RSI < 70, kapanis < EMA(200)) ticarete verilmez ama Pine''da acik short `position_size == 0` kapisini tutar; pozisyon kapisi sinyal uretiminde benzetilir.', 'Pine strategy.exit stop/limit seviyelerini strategy.position_avg_price''tan (dolum fiyati) kurar ve pozisyon acikken her barda ayni degerle yeniler (sabit). strategy.exit dolum barinin kapanisinda verilir, sonraki bardan etkin; motor stop/hedefi dolum barindan etkin sayar.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_1s588fgs.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
