- 'Kurallar yoruma dayali (discretionary) oldugu icin spec_durumu: ihtiyari olarak isaretlendi: 1) RSI(14) 30 altina (asiri satim) indikten sonra fiyatta daha dusuk dip (lower low), RSI''da daha yuksek
  dip (higher low) olusmalidir. 2) Guclu trendlerden kacinilir, iki tepe/dip arasinda goz karari ''iyi ayrilma'' (good separation) aranir ve islem yonunde ''guclu bir mum'' ile RSI kivrildiginda (''hooks'')
  girilir. 3) Stop-loss son fiyat salinim dibinin diger tarafina konur, kar hedefi 1R''dir.'
