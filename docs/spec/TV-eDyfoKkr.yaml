belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: stokastik uzunluk 14, asiri satim 30, K ve D yumusatma 3, ATR 14, TP/SL carpani 1,5. Cikis yalniz stop/hedef; sinyalli cikis yok.', 'Pine stop ve hedefi dolum barinin ATR''si ve dolum fiyatindan kurar (tradeAtrAtEntry = dolum bari ATR''si, strategy.exit dolum barinin kapanisinda verilir, sonraki bardan etkin). Motor mesafeyi SINYAL barinin ATR''sinden, dolum fiyatindan olcer (bir bar farkli ATR, ATR(14) tek bar agirligi 1/14) ve stop/hedefi dolum barindan etkin sayar.', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
