belirsiz:
- Karar zaman dilimi M30 (1 saatin altında)
- 'İhtiyari (discretionary) kurallar içerir: Frankfurt/Londra/NY açılışlarında destek/direnç (S/R) bölgesinde, Daily Open Line (DOL) ve EMA(200) uzağında, uyumsuzluk (divergence/hidden divergence) veya
  trend çizgisi kırılımı/mum formasyonu eşliğinde TDI yeşil çizginin kırmızıyı yukarı kesmesi (TDI > 32), APB (Heikin Ashi) mum renginin aynı olması ve Stochastic > 50 (ve < 75) olmasıyla Long girilir;
  mekanik bir çıkış ve stop-loss kuralı tanımlanmamıştır'
- 'short kuralı var: S/R direncinde TDI aşağı kesişimi (TDI < 68), kırmızı APB mumu ve Stochastic < 50 (ve > 25) ile short girilir'
- 'lider: ihtiyari (discretionary) kurallar; mekanik test edilemez -> Dogrulanamaz'
