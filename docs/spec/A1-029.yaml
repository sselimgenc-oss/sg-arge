belirsiz:
- Karar zaman dilimi 10m Heikin Ashi mumlarıdır (1 saatin altında)
- 'Özel kod mantığı: 10m Heikin Ashi grafikte önce SMA(3) > SMA(9) kesişimi gerçekleşmeli, ardından MACDBB(8,16,36) çizgisi (noktaları) sıfır çizgisini arada boşluk bırakacak şekilde net yukarı kesmeli
  (kesişim sırasında kırmızı nokta yani macd < macd[1] oluşmamalı) ve aynı anda ErgodicOsc(2,10,36) > 0 (yeşil) olmalıdır'
- 'Çıkış ve stop belirsizliği: İlk mesajda ErgodicOsc kırmızıya (< 0) dönene kadar tutulabileceği yazarken, 11. mesajda yazarın opsiyon priminde +$0.75 ile +$1.00 artışa (SPX''te ~3 puan hareket) limit
  satış koyup 10 dakikadan kısa sürede çıktığı ve mekanik bir stop-loss kullanmadığı belirtilmiştir'
- 'Rapor çelişkisi: Yazar 90 günde 95 işlemin 75''inin pozitif olduğunu söyleyip başarı oranını %83 olarak yazmıştır (75/95 = %78.95)'
- 'short kuralı var: SMA(3) < SMA(9) sonrası MACDBB noktalarının kırmızı renkte sıfır çizgisini net aşağı kesmesi ve ErgodicOsc(2,10,36) < 0 (kırmızı) olması durumunda Put (short) alınır'
- 'lider: cikis kurali belirsiz (iki farkli cikis anlatimi)'
kart_yazari: argon
