id: TV-3Q75d98D
ad: Simple ZigZag Double
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/3Q75d98D/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar hamster-bot; yayin sembolu BYBIT:BTCUSDT.P; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BYBIT:BTCUSDT.P)
kol: KRIPTO-1D
yayin_sembolu: BYBIT:BTCUSDT.P
gostergeler:
  ema1: {f: ema, src: close, n: 5}
  ema2: {f: ema, src: ema1, n: 3}
  ema3: {f: ema, src: ema2, n: 2}
  lo3: {f: lowest, src: low, n: 3}
  hi3: {f: highest, src: high, n: 3}
  z: {f: seri, ifade: 'eger(ema3 >= ema3[1] and ema3[1] < ema3[2], lo3, eger(ema3 < ema3[1] and ema3[1] >= ema3[2], hi3, 0))'}
  point: {f: seri, ifade: 'valuewhen(z != 0, z)'}
  lvl_long: {f: seri, ifade: 'valuewhen(point > point[1], z)'}
  lvl_short: {f: seri, ifade: 'valuewhen(point < point[1], z)'}
ozel_kod: false
giris: lvl_long > 0
cikis: null
stop: null
hedef: null
giris_emri: {tip: stop, seviye: lvl_long, gecerlilik_bar: 1}
dinamik_cikis: {stop: lvl_short}
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-1D}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: uzunluk 5, algilama 3 (long ve short ayni), strict_position kapali, Use Long/Short acik. Uc kademeli EMA (5, 3, 2; round(5/3 x k)) dip/tepe donusleri z (son 3 barin dibi/tepesi); long seviyesi = nokta yukseldiginde z, short seviyesi = nokta dustugunde z (valuewhen). Long: LEVEL_LONG seviyesinde alis STOP emri her barda; long''un cikisi LEVEL_SHORT seviyesindeki karsit stop emridir (long''u ters cevirir) = dinamik stop.', 'Pine''da karsit yone verilen BEKLEYEN stop emri (strategy.entry stop=...) acik pozisyonu ters yone cevirir; long bacakta bu, her bar yeniden verilen dinamik bir stop cikisidir (dinamik_cikis.stop: seviye bar kapanisinda hesaplanir, ertesi bardan gecerli). Short bacak yoksayilir (kalan pozisyon yok).', 'Tarih araligi girdisi (2014-2050) test donemi girdisi sayildi, kurala alinmadi.', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
