tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: 3
ozel_kod: true
belirsiz:
- v1->v3 üç iterasyonla hedefe ulaşana dek geliştirilmiş (deneme_sayisi_kaynakta=3, DSR'de sayılmalı)
- 'Pozisyon boyutu ADX''e bağlı (1.15x/0.95x): EVRENSEL_KURALLAR A6 gereği yok sayılır'
- 'Confluence puanı: 35*(ott.dir==1) + 25*(close>=hh10*0.992) + 20*(adx14>15) + 15*(close>ema34) + 10*(volume>=vol_sma20*0.95): bool*sayı dil
  dışı -> ozel_kod'
- 'OTT (VAR ortalama) listede yok: ozel_kod'
- 'Gün içi 1H: BIST/ABD/emtia saatlik veri ~730 gün -> en fazla Koşullu'
- 1D/HTF_Bias formülü hiçbir raporda tanımlı değil; Voltran raporundaki HTF kuralı varsayıldı (Supertrend(10,2.5)=+1 veya kapanış>=EMA21*0.985)
  -> lider onayı
parametreler: {}
id: V2A
ad: VOLTRAN-2A saatlik adaptif kanal (TOTT) + seans kırılım (v3)
kaynak:
  dosya: Voltran_4_Super_Strateji_Mimari_ve_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2
tarz: day
tf: 1H
mtf: 4H
yazar_piyasasi: Voltran sentezi (iç üretim)
gostergeler:
  st_htf:
    f: supertrend
    n: 10
    carpan: 2.5
    tf: 1D
  ema21h:
    f: ema
    src: close
    n: 21
    tf: 1D
  close_1d:
    f: close
    tf: 1D
  ott:
    f: ott
    src: close
    n: 14
    yuzde: 1.35
    ma: var
  hh10:
    f: highest
    src: high
    n: 10
    kaydir: 1
  adx14:
    f: adx
    n: 14
  dmi14:
    f: dmi
    n: 14
  ema34:
    f: ema
    src: close
    n: 34
  vol_sma20:
    f: sma
    src: volume
    n: 20
  atr14:
    f: atr
    n: 14
giris: (st_htf.dir == 1 or close_1d >= ema21h * 0.985) and confluence_puan >= 70 and dmi14.plus >= dmi14.minus * 0.95
cikis: ott.dir == -1 and close < ema34
rapor:
  pf: 2.61
  sharpe: 1.83
  getiri: +%849.4
  mdd: '%22.7'
  islem: 96
  wr: '%60.2'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
iz_suren:
  tip: atr_kapanis_zirve
  n: 14
  carpan: 3.2
kar_kilidi:
  tetik_atr: 0.95
  stop: giris * 1.005
bias_varsayim: true
