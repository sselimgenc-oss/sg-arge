  macd_d1:
    f: macd
    src: close
    fast: 12
    slow: 26
    signal: 9
  ichimoku_d1:
    f: ichimoku
    tenkan: 9
    kijun: 26
    senkou: 52
  stoch_ltf:
    f: stoch
    k: 14
    d: 3
    smooth: 3
giris: mtf(1D, ema20_d1 > ema50_d1 and close > ema20_d1) and cross_over(stoch_ltf.k, 20)
