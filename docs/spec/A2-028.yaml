belirsiz:
- 'Çoklu mod içeren esnek bir EA çerçevesidir: Üst zaman diliminde (varsayılan D1=1440) 4 trend yönteminden (20/50 EMA, MACD > 0, Ichimoku Tenkan/Kijun kesişimi, Turtle/Donchian kanalı) seçilenlerin tamamı
  yükselişteyken, alt zaman diliminde (ör. H1) Williams %R (-80 altı/üstü) veya Stochastic (20 altı/üstü) sinyaliyle Long açar'
- Çıkış ve stop için sabit SL/TP, ATR SL/TP, Kijun-sen trailing SL, Breakeven, Jumping SL, ters sinyalde kapatma ve bakiye yüzdesi sepet hedefi seçenekleri vardır ancak hangi trend/giriş/çıkış kombinasyonunun
  ve SL/TP sayısal değerlerinin varsayılan olduğu forum metninde yazmayıp ekli TCO_Trader.mq4 dosyasındadır
- 'short kuralı var: D1 trend yöntemleri düşüşteyken alt zaman diliminde Williams %R -20''yi aşağı kestiğinde (veya > -20) ya da Stochastic 80''i aşağı kestiğinde (veya > 80) short açılır'
kart_yazari: argon
