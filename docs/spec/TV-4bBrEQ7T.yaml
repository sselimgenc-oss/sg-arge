belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: minimum skor 10 (maks. 10: kapanis > EMA200 3 + hacim > SMA(20) 3 + RSI < 65 2 + yesil mum 2 = hepsi gerekli), ATR(14) x 1,5. Alis: silahli long''da yuksek + 1,5 x ATR seviyesinde alis STOP emri (pozisyon yokken/short iken). Satis tarafi simetriktir (silahli short: dusuk - 1,5 x ATR satis stopu) ve long''u ters cevirir = dinamik stop; short skoru saglanmiyorsa stop yoktur (dyn_stop 0).', 'Pine''da karsit yone verilen BEKLEYEN stop emri (strategy.entry stop=...) acik pozisyonu ters yone cevirir; long bacakta bu, her bar yeniden verilen dinamik bir stop cikisidir (dinamik_cikis.stop: seviye bar kapanisinda hesaplanir, ertesi bardan gecerli). Short bacak yoksayilir (kalan pozisyon yok).', process_orders_on_close = true yalniz piyasa emirlerini etkiler; stop emirleri bar icinde dolar., 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
