tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: 3
ozel_kod: false
belirsiz:
- v1->v3 üç iterasyonla hedefe ulaşana dek geliştirilmiş (deneme_sayisi_kaynakta=3, DSR'de sayılmalı)
- 'Pozisyon boyutu ADX''e bağlı (1.15x/0.95x): EVRENSEL_KURALLAR A6 gereği yok sayılır'
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 6,50); PF'ye güvenilmez
- MDD %26.4 > %25 sınırı
- Giriş koşulu 'ema8 > ema21 ivmesi başlamalı' VEYA kolu çok gevşek (zaten çoğu zaman doğru)
parametreler: {}
id: V1A
ad: VOLTRAN-1A swing kırılım ve rejim motoru (v3)
kaynak:
  dosya: Voltran_4_Super_Strateji_Mimari_ve_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: Voltran sentezi (iç üretim)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  st_w:
    f: supertrend
    n: 10
    carpan: 2.5
    tf: 1W
  ema21w:
    f: ema
    src: close
    n: 21
    tf: 1W
  ema8w:
    f: ema
    src: close
    n: 8
    tf: 1W
  st:
    f: supertrend
    n: 10
    carpan: 2.4
  adx14:
    f: adx
    n: 14
  dmi14:
    f: dmi
    n: 14
  hh12:
    f: highest
    src: high
    n: 12
    kaydir: 1
  ema8:
    f: ema
    src: close
    n: 8
  ema21:
    f: ema
    src: close
    n: 21
  vol_sma20:
    f: sma
    src: volume
    n: 20
  atr14:
    f: atr
    n: 14
giris: (st_w.dir == 1 or (close_1w >= ema21w * 0.985 and ema8w > ema21w)) and st.dir == 1 and dmi14.plus > dmi14.minus and adx14 > 15 and (close
  > hh12 * 0.985 or ema8 > ema21) and volume >= vol_sma20 * 0.95
cikis: st.dir == -1 and close < ema21
rapor:
  pf: 3.89
  sharpe: 1.38
  getiri: +%400.9
  mdd: '%26.4'
  islem: 21
  wr: '%71.7'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
iz_suren:
  tip: atr_kapanis_zirve
  n: 14
  carpan: 3.0
kar_kilidi:
  tetik_atr: 1.05
  stop: giris * 1.005
bias_varsayim: false
