belirsiz:
- Concretum Group PDF linki (wp-content/uploads/2026/02/Beat-the-Market.pdf) doğrudan açılmadığı için makalenin St. Gallen Üniversitesi (UNISG Alexandria) resmi arşiv kopyasından (https://alexandria.unisg.ch/bitstreams/a99aba00-f967-49b3-aceb-f544dc386e0b/download) tam metin okundu.
- 'Saat-eşlemeli Noise Area ve giriş/çıkış mantığı (ozel_kod: true): 1) Her gün t ve her yarım saatlik dilim HH:MM (10:00, 10:30, ..., 15:30) için önceki 14 işlem günündeki aynı saat diliminin 09:30 açılışına göre mutlak getirilerinin ortalaması alınır: sigma_{t,HH:MM} = (1/14) * sum_{i=1..14} |Close_{t-i,HH:MM} / Open_{t-i,09:30} - 1|. 2) Gece boşluğu (gap) düzeltmeli bantlar: UpperBound_{t,HH:MM} = max(Open_{t,09:30}, Close_{t-1,16:00}) * (1 + sigma_{t,HH:MM}) ve LowerBound_{t,HH:MM} = min(Open_{t,09:30}, Close_{t-1,16:00}) * (1 - sigma_{t,HH:MM}). 3) Yalnız yarım saatlik kontrol noktalarında (HH:00 ve HH:30) Close > UpperBound ise long açılır (Close < LowerBound ise short açılır). 4) Long pozisyon, yarım saatlik kontrol noktasında Close < max(UpperBound, VWAP) olduğunda veya 16:00 seans kapanışında (EOD flat) kapatılır. 5) Pozisyon büyüklüğü: 14 günlük günlük getiri standart sapması ile günlük %2 volatilite hedeflenir, kaldıraç azami 4x ile sınırlandırılır: min(4, 0.02 / stdev_14(daily_ret)).'
- 'T10: ozel_kod_nedeni: seans_saat (gun ici gurultu alani (noise area) ust siniri ve seans VWAP''i; 13 bar zaman cikisi)'
dogrulanamaz:
  neden: veri
  ayrinti: 'U7 dakikalik sınıflaması: Yalnız ABD piyasasına bağlı (yazar piyasası: ABD Hisse (SPY)); kripto verisinde karşılığı yok. Seans açılış aralığına/saatine bağlı kural.'
