id: TV-6GReiiLS
ad: Up/Dn Volume Sentiment Strategy
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/6GReiiLS/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar cheerfulPepperbruuy; yayin sembolu BITSTAMP:BTCUSD; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BITSTAMP:BTCUSD)
kol: KRIPTO-1D
yayin_sembolu: BITSTAMP:BTCUSD
gostergeler:
  upv: {f: seri, ifade: 'eger(close > close[1], volume, 0)'}
  dnv: {f: seri, ifade: 'eger(close < close[1], volume, 0)'}
  sumup: {f: sma, src: upv, n: 50}
  sumdn: {f: sma, src: dnv, n: 50}
  ratio: {f: seri, ifade: sumup / sumdn}
  lo: {f: lowest, src: ratio, n: 756}
  hi: {f: highest, src: ratio, n: 756}
  osc: {f: seri, ifade: (ratio - lo) / (hi - lo) * 100}
ozel_kod: false
giris: osc <= 10
cikis: osc >= 90
stop: {tip: yuzde, deger: 5.0}
hedef: {tip: yuzde, deger: 10.0}
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-1D}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: SMA(50) yukari/asagi hacim orani, 756 barlik normalizasyon, long esigi <= 10, short esigi >= 90, stop %5, hedef 2R = %10 (position_avg_price). Short sinyali (osilator >= 90) acik long''u ters cevirir, cikis olarak yazildi. sumDn == 0 iken Pine oran na verir; kartta sifira bolme sonsuz olur (50 gunde hic dusus hacmi olmamasi gerekir, pratikte olusmaz).', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
deneme_sayisi_kaynakta: 205
