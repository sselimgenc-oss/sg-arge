id: O1-042
ad: Smoothed Bollinger% Strategy Daily
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.prorealcode.com/prorealtime-trading-strategies/smoothed-bollinger-strategy-daily/
  sayfa: null
erisim_engeli: true
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: Endeks / Hisse / Forex
gostergeler:
  st:
    f: supertrend
    n: 10
    carpan: 3.0
giris: cross_over(percb, lo) and st.yon == 1
cikis: cross_under(percb, hi) or st.yon == -1
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
parametreler:
  period: 18
  TeAv: 8
  afwh: 1.6
  afwl: 1.6
  afwper: 63
deneme_sayisi_kaynakta: null
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: eksik
belirsiz:
- Strateji sayfası erişim engeli nedeniyle doğrudan açılamadı; ancak stratejinin dayandığı ProRealCode göstergesi (https://www.prorealcode.com/prorealtime-indicators/smoothed-bollinger-b-indicator/, Sylvain
  Vervoort SVE_BBb.itf) ve strateji arama özetinden gösterge formülü okundu
- 'SVE Bollinger %b formülü: haOpen = ((Open[1]+High[1]+Low[1]+Close[1])/4 + haOpen[1])/2; haC = ((Open+High+Low+Close)/4 + haOpen + max(high,haOpen) + min(low,haOpen))/4; TMA1 = TEMA[8](haC); TMA2 = TEMA[8](TMA1);
  ZlHA = 2*TMA1 - TMA2; percb = (TEMA[8](ZlHA) + 2*STD[18](TEMA[8](ZlHA)) - WMA[18](TEMA[8](ZlHA))) / (4*STD[18](TEMA[8](ZlHA))) * 100; hi = 50 + 1.6*STD[63](percb); lo = 50 - 1.6*STD[63](percb)'
- 'Strateji sayfasındaki Supertrend trend filtresinin kesin parametreleri ve stop/çıkış satırları sayfa engeli nedeniyle doğrulanamadığından spec_durumu: eksik olarak işaretlendi'
