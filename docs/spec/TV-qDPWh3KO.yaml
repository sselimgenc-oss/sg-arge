belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Bayrak tespiti 25 ''var'' degiskenli bir durum makinesidir (baseHigh/baseLow/flagLength mandallari, direk taramasi, kirilim/dusus sifirlamalari); modul Pine satir sirasini ve `[1]` gecmis referanslarini (onceki barin nihai degerleri) birebir uygular (tv_qdpwh3ko.flag_events). Ayi bayragi hesabi long icin dogrudan sinyal vermez ama long''u kapatan bearishEntry''yi uretir; kod ayi `bearFlag` kosulunda poleMaxLen (boga girdisi) kullanir, aynen korundu.', 'Giris emriyle ayni barda strategy.exit(''Sell'',''Buy'', stop=supertrend) verilir: stop sinyal barinin Supertrend cizgisine sabitlenir (motorda dolum barindan etkin, Pine''da da giris emriyle birlikte). Supertrend ta.supertrend(4.0, 10); kartta dir +1 = yukselis. tradingDirection=''Both'' varsayilani: short sinyalleri long bacakta islem acmaz.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_qdpwh3ko.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
