belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'ta.percentrank(RSI araligi, 100): onceki 100 degerin (guncel bar haric) guncele esit ya da kucuk olanlarinin yuzdesi varsayildi; Pine kaynak koduna erisilemedi.', 'Yazar hatasi birebir korundu: targetPrice = close + stopPrice * rMultiple, stopPrice bir fiyat (close - 2 x ATR) oldugundan hedef ~3 x fiyatta kalir ve pratikte hic vurulmaz; kart hedef seviyesini aynen boyle yazar (duzeltilmedi). Stop = sinyal kapanisi - 2 x ATR(14); strategy.exit giris emriyle ayni barda verilir.', Short girisi yalniz pozisyon yokken (ters cevirme yok); long bacakta kullanilmaz., 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_dwgn7hre.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
