tf_varsayim: false
stop:
  tip: atr
  n: 14
  carpan: 2.6
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: false
belirsiz:
- 1W_Bias formülü bu raporda tanımlı değil; Paper_Test_4 S1'deki tanım varsayıldı (1W EMA10>=EMA20 veya 1W kapanış>=EMA20*0.985, 1 bar gecikmeli)
  -> lider onayı
- 'Metinde ''haftalık yön filtresi VEYA endeks trendi'' var: VEYA''nın endeks kolu tanımsız, yalnız haftalık kol kullanıldı'
- 'Raporun kendi Sharpe''ı 0.45: hedef (>=1) altında'
parametreler: {}
id: R02
ad: IBS < 0.30 + 25 günlük volatilite bandı ortalamaya dönüş
kaynak:
  dosya: Reddit_ve_Quant_Stratejileri_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2.2
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: ABD hisse/ETF (r/algotrading, SPY/QQQ/AAPL)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  sma100:
    f: sma
    src: close
    n: 100
  hh10:
    f: highest
    src: high
    n: 10
    kaydir: 1
  range25:
    f: sma
    src: high - low
    n: 25
  atr14:
    f: atr
    n: 14
giris: close > sma100 * 0.94 and (ema10w >= ema20w or close_1w >= ema20w * 0.985) and close < (hh10 - 2.15 * range25) * 1.012 and (close - low)
  / (high - low) < 0.30
cikis: close > high[1]
zaman_stop:
  bar: 18
rapor:
  pf: 2.43
  sharpe: 0.45
  getiri: +%26.5
  mdd: '%10.5'
  islem: 43.0
  wr: '%68.9'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
bias_varsayim: true
