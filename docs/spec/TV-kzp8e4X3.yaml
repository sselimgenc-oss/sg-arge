  ph_ev: {f: seri, ifade: 'high[1] > high[0] and high[1] > high[2] and high[1] > high[3]'}
  hprice: {f: seri, ifade: 'valuewhen(ph_ev, high[1])'}
  brk_h: {f: seri, ifade: high > hprice}
  le: {f: seri, ifade: barssince(ph_ev) >= 0 and not (barssince(brk_h) < barssince(ph_ev))}
  pl_ev: {f: seri, ifade: 'low[1] < low[0] and low[1] < low[2] and low[1] < low[3]'}
  lprice: {f: seri, ifade: 'valuewhen(pl_ev, low[1])'}
  brk_l: {f: seri, ifade: low < lprice}
  se: {f: seri, ifade: barssince(pl_ev) >= 0 and not (barssince(brk_l) < barssince(pl_ev))}
