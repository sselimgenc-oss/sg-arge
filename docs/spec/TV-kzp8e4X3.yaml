belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: pivot sol 2, sag 1 (ta.pivothigh/pivotlow(2, 1); sert buyuk/kucuk, esitlik pivot sayilmaz: varsayim); pivot 1 bar sonra bilinir. Giris: pivot tepesi sonrasi (ilk kirilima kadar) pivot tepesi + mintick seviyesinde alis STOP emri (giris_emri: stop, her bar yenilenir, gecerlilik 1 bar). Cikis: pivot dibi sonrasi (ilk asagi kirilima kadar) pivot dibi - mintick seviyesinde karsit stop emri (long''u ters cevirir) = dinamik_cikis.stop; emir yokken (se yanlis) stop yoktur (dyn_stop 0).', 'Pine''da karsit yone verilen BEKLEYEN stop emri (strategy.entry stop=...) acik pozisyonu ters yone cevirir; long bacakta bu, her bar yeniden verilen dinamik bir stop cikisidir (dinamik_cikis.stop: seviye bar kapanisinda hesaplanir, ertesi bardan gecerli). Short bacak yoksayilir (kalan pozisyon yok).', 'mintick (en kucuk fiyat adimi) farki yok sayildi: Pine''da seviyeler +/- syminfo.mintick kaydirilir (belirsiz: kabul edilen olcek farki).', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', calc_on_every_tick = true (bar ici yeniden hesap) yok sayildi; sinyal kapanmis barda., 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
