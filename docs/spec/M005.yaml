belirsiz:
- Substack sayfası doğrudan browse aracını engellediği için Google indeks snippet'leri, Scribd aynası ve Quantitativo/Quantopian özet kaydından (https://www.youtube.com/shorts/vEFhYylwBmc) kurallar doğrulandı.
- 'Zarattini et al. (M004) Noise Area stratejisinin ES ve NQ vadeli kontratlarına uyarlanmış halidir (ozel_kod: true): 1) Saat-eşlemeli ortalama mutlak hareket (sigma_{t,HH:MM}) 14 gün yerine N=90 günlük bakış penceresiyle hesaplanır: sigma_{t,HH:MM} = (1/90) * sum_{i=1..90} |Close_{t-i,HH:MM} / Open_{t-i,09:30} - 1|. 2) UpperBound = max(Open_{t,09:30}, Close_{t-1,16:00}) * (1 + sigma_{t,HH:MM}), LowerBound = min(Open_{t,09:30}, Close_{t-1,16:00}) * (1 - sigma_{t,HH:MM}). 3) Yarım saatlik barlarda (HH:00 ve HH:30) Close > UpperBound ise long (Close < LowerBound ise short) girilir. 4) Çıkış: yarım saatlik kontrol noktalarında Close < max(UpperBound, VWAP) veya seans kapanışında (16:00 EST) flat. 5) Günlük volatilite hedefi %2 yerine %3, azami kaldıraç 4x yerine 8x olarak uygulanır.'
- 'T10: ozel_kod_nedeni: seans_saat (gun ici gurultu alani (noise area) ust siniri ve seans VWAP''i; 13 bar zaman cikisi)'
dogrulanamaz:
  neden: veri
  ayrinti: 'U7 dakikalik sınıflaması: Yalnız ES, NQ piyasasına bağlı (yazar piyasası: Vadeli (ES ve NQ Futures)); kripto verisinde karşılığı yok. Seans açılış aralığına/saatine bağlı kural.'
