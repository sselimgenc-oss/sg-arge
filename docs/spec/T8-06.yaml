tf_varsayim: false
stop:
  tip: atr
  n: 14
  carpan: 2.6
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: true
belirsiz:
- 'Raporda 8 stratejinin 256''lık havuzdan seçildiği belirtiliyor: seçim yanlılığı (DSR''de N>=256)'
- Sonuçlar 1W->1D ve 4H/1D->1H iki kurguda raporlanmış; kartta ana kurgu 1W->1D, 1H varyantı 'varyantlar' altında
- 'P01 (Twin OTT) ile akraba ama farklı kural: bu kart tek OTT, 14/%1.4 + twin katsayı 0.001'
- 'OTT/VAR listede yok: ozel_kod'
- 'HTF ''pozitif'' formülü yok: Supertrend varsayımı'
- short_stop/long_stop yönlerinin isimlendirmesi metinde kafa karıştırıcı (OTT mantığına göre yorumlanacak)
parametreler: {}
id: T8-06
ad: TOTT/OTT tek bantlı (Twin Optimized Trend Tracker, saatlik kurgu)
kaynak:
  dosya: Paper_Test_8_Lider_Strateji_Ozet_ve_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 3.6
tarz: day
tf: 1H
mtf: 4H
varyantlar:
- tf: 1D
  mtf: 1W
yazar_piyasasi: BIST/Kripto/FX (Kıvanç Özbilgiç, açık kaynak)
gostergeler:
  var14:
    f: var
    src: close
    n: 14
  ott:
    f: ott
    src: close
    n: 14
    yuzde: 1.4
    ma: var
    twin_katsayi: 0.001
  atr14:
    f: atr
    n: 14
  htf:
    f: supertrend
    n: 10
    carpan: 2.5
    tf: 4H
giris: htf.dir == 1 and cross_over(var14, ott.short_stop)
cikis: cross_under(var14, ott.long_stop)
rapor:
  pf: 2.07
  sharpe: null
  getiri: +%376.2 (4H->1H)
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: evet, %0,1
spec_durumu: tam
bias_varsayim: true
