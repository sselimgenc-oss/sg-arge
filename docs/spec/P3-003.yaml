id: P3-003
ad: UT Bot Strategy
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.tradingview.com/script/VKMgZdYr-UT-Bot-Strategy/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: true
yazar_piyasasi: Kripto / Forex / Hisse
gostergeler:
  atr10:
    f: atr
    n: 10
  ema1:
    f: ema
    src: close
    n: 1
giris: cross_over(close, xATRTrailingStop) and ema1 > xATRTrailingStop
cikis: cross_under(close, xATRTrailingStop) and ema1 < xATRTrailingStop
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
parametreler:
  KeyValue: 1.0
  ATRPeriod: 10
  EMAPeriod: 1
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- QuantNomad resmi dokümantasyonundan (https://quantnomad.com/implementing-ut-bot-strategy-in-python-with-vectorbt/) tam kod ve mantık okundu
- 'Özel kod mantığı: nLoss = KeyValue * atr(ATRPeriod); xATRTrailingStop hesaplanır; cross_over(close, xATRTrailingStop) ve ema(close, 1) > xATRTrailingStop ile Long girilir; cross_under ile pozisyon kapatılır
  / short''a geçilir'
- 'short kuralı var: cross_under(close, xATRTrailingStop) olduğunda short pozisyona geçilir'
