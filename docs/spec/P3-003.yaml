id: P3-003
ad: UT Bot Strategy
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.tradingview.com/script/VKMgZdYr-UT-Bot-Strategy/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: true
yazar_piyasasi: Kripto / Forex / Hisse
gostergeler:
  atr10:
    f: atr
    n: 10
  ema1:
    f: ema
    src: close
    n: 1
  utbot:
    f: "ut_bot"
    carpan: 1.0
    n: 10
giris: cross_over(close, utbot) and ema1 > utbot
cikis: cross_under(close, utbot) and ema1 < utbot
stop: null
hedef: null
stop_eklendi: false
ozel_kod: false
parametreler:
  KeyValue: 1.0
  ATRPeriod: 10
  EMAPeriod: 1
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- QuantNomad resmi dokümantasyonundan (https://quantnomad.com/implementing-ut-bot-strategy-in-python-with-vectorbt/) tam kod ve mantık okundu
- 'Özel kod mantığı: nLoss = KeyValue * atr(ATRPeriod); utbot hesaplanır; cross_over(close, utbot) ve ema(close, 1) > utbot ile Long girilir; cross_under ile pozisyon kapatılır
  / short''a geçilir'
- 'short kuralı var: cross_under(close, utbot) olduğunda short pozisyona geçilir'
- "T8: ozel_kod true -> false (ut_bot kutuphaneye eklendi (KeyValue=1.0, ATR periyodu 10); 'xATRTrailingStop' -> 'utbot'); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi"
