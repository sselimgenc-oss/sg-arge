belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Kanal (onceki 50 barin en yuksek high / en dusuk low, [1]); giris bolgesi alt %25, trend filtresi close > SMA(200). Cikislar sirayla: close >= kanal ortasi, close < kanal alti - 1 x ATR(14) (''stop: channel failed''), close < SMA(200); hepsi kapanis tabanli ve process_orders_on_close=true ile kapanista dolar (dolum: kapanis). Yazarin emir stopu yok (cikislar kapanis kosulu): ATR(14) x 3 koruma stopu eklendi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
