tf_varsayim: false
stop:
  tip: max
  secenekler:
  - 1.05 * adr20 / 100 * close
  - 1.35 * atr14
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: false
belirsiz:
- Referans endeks (XU030/SPY/BTC) gerekli; emtia için endeks tanımsız -> lider kararı (filtre emtiada devre dışı mı?)
- 'Öncül ralli ''+%8 ila +%25'' aralığı: üst sınır anlamsız (>%25 neden dışlansın?); yalnız >=%8 varsayıldı, lider onayı'
- 'Çıkış ''SMA(10) veya EMA(20)*0.995'' yazılmış: VEYA mı (hangisi önce) -> ilk gelen olarak yorumlandı'
- 'Episodic Pivot bilanço/haber kaynaklı: veri yok, yalnız gap+hacim ile yaklaşıldı'
- Kısmi kâr/başabaş şema uzantısı
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 5,80); ölçüm/raporlama tavanı olabilir, PF'ye güvenilmez
- "T8: ozel_kod true -> false (RVOL kutuphanede, endeks serileri benchmark ile); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi"
parametreler: {}
id: R01
ad: Qullamaggie breakout continuation + episodic pivot
kaynak:
  dosya: Reddit_ve_Quant_Stratejileri_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2.1
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: ABD hisse (r/qullamaggie)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  adr20:
    f: sma
    src: (high - low) / close * 100
    n: 20
  hh15:
    f: highest
    src: high
    n: 15
    kaydir: 1
  ll15:
    f: lowest
    src: low
    n: 15
    kaydir: 1
  rvol20:
    f: rvol
    n: 20
  atr14:
    f: atr
    n: 14
  ema10:
    f: ema
    src: close
    n: 10
  ema20:
    f: ema
    src: close
    n: 20
  ema50:
    f: ema
    src: close
    n: 50
  sma10:
    f: sma
    src: close
    n: 10
  endeks_sma10:
    f: sma
    src: endeks_close
    n: 10
  endeks_sma20:
    f: sma
    src: endeks_close
    n: 20
giris: endeks_sma10 >= endeks_sma20 * 0.99 and (ema10w >= ema20w or close_1w >= ema20w * 0.985) and (close / close[40] >= 1.08 or (ema10 > ema20
  and ema20 > ema50)) and (((hh15 - ll15) / close) < 9.5 * adr20 / 100 and close > hh15 and rvol20 > 1.25 and (close - low) / (high - low) > 0.65
  or (low > high[1] * 1.015 and rvol20 > 1.65 and close > open))
cikis: close < sma10 or close < ema20 * 0.995
kismi_kar:
  gun: 4
  tetik: 0.6 * stop_mesafesi
  oran: 0.4
  kalan_stop: giris * 1.001
rapor:
  pf: 4.23
  sharpe: 1.19
  getiri: +%133.9
  mdd: '%11.0'
  islem: 24.9
  wr: '%68.7'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
bias_varsayim: false
