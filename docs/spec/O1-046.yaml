id: O1-046
ad: Fractal breakout intraday Strategy EUR/USD 1H
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.prorealcode.com/prorealtime-trading-strategies/fractal-breakout-intraday-strategy-eurusd-1h/
  sayfa: null
tarz: day
tf: 1H
mtf: null
tf_varsayim: false
yazar_piyasasi: Forex (EURUSD)
gostergeler:
  hh227:
    f: highest
    src: close
    n: 227
  ll227:
    f: lowest
    src: close
    n: 227
  dc_low20:
    f: lowest
    src: low
    n: 20
  dc_high20:
    f: highest
    src: high
    n: 20
giris: cross_over(close, hil)
cikis: close <= dc_low20[1]
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
piyasa_kisiti: [FX]
ozel_kod_nedeni: desen
parametreler:
  CP: 113
  fractal_window: 227
  DC: 20
  TGL_pips: 5
  TGS_pips: 5
  target_pips: 30
  start_time: 100000
  end_time: 230000
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- 'Özel kod mantığı (ProBuilder kaynak kodundan, yazar: Ale): (1) CP=113 parametresiyle 113 bar önceki kapanış son 227 barın (2*CP+1) en yüksek kapanışıysa (close[113] >= highest[227](close)) üst fraktal
  seviyesi HIL = close[113] olarak güncellenir (geçmişe dönük olduğundan repaint yapmaz), (2) Saat 10:00 ile 23:00 arasında (time >= 100000 and time < 230000) ve piyasada short pozisyon yokken close HIL
  seviyesini yukarı kestiğinde (close crosses over HIL) 1 kontrat Long açılır, (3) Çıkış: 30 pip sabit kar hedefi (set target pprofit 30), 20 barlık Donchian alt bandı stopu (laststop = lowest[20](low)[1])
  ve 5 piplik MFE iz süren stop (TGL = 5)'
- 'short kuralı var: close[113] <= lowest[227](close) ile tanımlanan LOL fraktal desteği aşağı kırıldığında (cross_under(close, LOL)) short açılır (hedef 30 pip, Donchian stop highest[20](high)[1], iz süren
  stop 5 pip)'
- "ozel_kod_nedeni: desen (113 bar geriden fraktal seviye HIL, saat penceresi 10:00-23:00, pip hedef/iz suren)"
- "piyasa_kisiti: ['FX'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
- "T20: motorda kalmadi. FX, pip cinsinden hedef/iz suren (stop tipi pips motorda yok) ve 10:00-23:00 seans penceresi (seans saati paketi); piyasa_kisiti FX"
