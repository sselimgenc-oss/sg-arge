belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Bilesik z-skor: ROC(14) z-skoru * 0.4 + RSI(14) z-skoru * 0.3 + (hacim/SMA(hacim,20)) z-skoru * 0.3 (100 barlik z-skor, sd > 0 degilse 0). Yumusatma ozyinelemeli: smoothComposite = onceki + alpha*(composite - onceki), alpha = 2/(round(15 - 13*ATRpercentrank/100)+1), ilk degerde composite. ta.percentrank(ATR(14), 100): onceki 100 degerin guncele esit/kucuk olanlarinin yuzdesi varsayildi (Pine kaynagi dogrulanamadi). Pine math.round(.5) yukari yuvarlar.', 'process_orders_on_close=true: emirler sinyal barinin kapanisinda dolar (kartta dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir). Stop = sinyal kapanisi - 2 x ATR(14) (use_stop_loss=true, strategy.exit giris emriyle ayni barda); motorda dolum kapanista oldugundan stop sonraki bardan etkindir.', 'Pozisyon boyutu hesabi (account_equity, risk_percent, max_pct_equity) kullanilmaz. Short girisi long''u kapatir (cikis ifadesi).', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_w67tjltc.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
