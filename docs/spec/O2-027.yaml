belirsiz:
- Reddit r/LETFs resmi başlığından (derecknielsen) ve Composer dokümantasyonundan okundu
- 'Özel kod mantığı: 200 günlük hareketli ortalama üzerinde TQQQ tutulur; 10 günlük RSI > 79 aşırı ısınmada UVXY''ye geçilir; 200 günlük ortalama altında iken aşırı satımda TECL/SOXL dip sıçraması denenir,
  aksi halde BIL / SQQQ ile korunulur'
- "T22: kural agaci Composer acik uc noktasindan (https://stagehand-api.composer.trade/api/v1/public/symphonies/HukRwDJLlYPLMbrQbua5/score) okundu ve rotasyon.agac olarak birebir cevrildi (esik, pencere ve varlik listesi kaynaktan; RSI Wilder, SMA/RSI gunluk kapanis uzerinden). Agac her bar degerlendirilir; hedef agirlik degisince emir verilir (EVRENSEL_KURALLAR D12). Kaldirac yok; kaldiracli ETF (TQQQ, UVXY vb.) enstruman sayilir. Composer sembolleri kapanista dolar (kendi backtest serisiyle gunluk getiri korelasyonu 1,0000 dogrulandi): D4 geregi dolum: kapanis; iki sekilde raporlanir (kapanis dolumu 2x maliyet | ertesi acilis)."
