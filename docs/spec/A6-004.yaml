id: A6-004
ad: Mean Reversion Entry Timing
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://alvarezquanttrading.com/blog/mean-reversion-entry-timing/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD Hisse (S&P 500)
gostergeler:
  rsi2:
    f: rsi
    src: close
    n: 2
  sma100:
    f: sma
    src: close
    n: 100
  hv100:
    f: getiri_std
    src: close
    n: 100
  endeks_sma200:
    f: sma
    src: close
    n: 200
    veri: endeks
  endeks_close:
    f: close
    veri: endeks
ozel_kod: false
giris: null
cikis: null
stop: null
hedef: null
stop_eklendi: false
parametreler:
  rsi2.n: 2
  rsi_giris_esik: 10
  rsi_cikis_esik: 60
  sma100.n: 100
  ma_egim_bar: 21
  max_positions: 7
deneme_sayisi_kaynakta: 112
rapor:
  pf: null
  sharpe: null
  getiri: 16.02
  mdd: 20.0
  islem: null
  wr: 65
  maliyet_dahil: true
varyantlar:
- ad: 'Varyant 2: Intraday Pullback (Onceki Gunun Dibinden Limit Giris) - RSI Cikis'
  giris: rsi2[1] < 10 and close[1] > sma100[1] and sma100[1] > sma100[22] and low <= low[1]
  cikis: rsi2 > 60
  not: Setup sonrasi ertesi gun onceki gunun en dusuk fiyatina (low[1]) limit alim emri girilir.
- ad: 'Varyant 3: Trend Resumption (Onceki Gunun Tepesini Kirinca Stop Giris) - RSI Cikis'
  giris: rsi2[1] < 10 and close[1] > sma100[1] and sma100[1] > sma100[22] and high > high[1]
  cikis: rsi2 > 80
  not: Setup sonrasi ertesi gun onceki gunun en yuksek fiyatina (high[1]) stop alim emri girilir (en yuksek tekil kosu CAR %16.02, MDD %20).
- ad: 'Varyant 4-6: N-Gunluk En Dusuk Altinda Kapanis Cikisli (N-Day Low Exit) Kurgular'
  not: Ayni 3 giris yonteminin (Acilista Giris, low[1] Limit Giris, high[1] Stop Giris) cikis kurali olarak close < lowest(low, N)[1] (N in {2, 5, 10, 15, 20}) kullanilan versiyonlaridir (win rate ~%29,
    ortalama tutma 21 bar).
rotasyon:
  kip: sirali_giris
  evren: piyasa
  dengeleme:
    tip: gun
    her: 1
  rejim: endeks_close > endeks_sma200
  giris: rsi2 < 10 and close > sma100 and sma100 > sma100[21]
  cikis: rsi2 > 60
  skor: hv100
  max_pozisyon: 7
  min_evren: 8
spec_durumu: tam
belirsiz:
- 'Ortak Setup Kurallari (ozel_kod: true): 1) S&P 500 hissesi ve SPX endeksi kendi 200-gunluk SMA''sinin uzerinde (SPX > SMA200), 2) Hisse Close > SMA(100), 3) SMA(100) > SMA(100)[21], 4) RSI(2) < X (X
  in {5, 10, 15, 20}; standart orta deger 10 secildi). Sinyaller 100-gunluk tarihsel volatiliteye (hv100) gore yuksekten dusuge siralanir, en fazla 7 pozisyon (%14.2 agirlik) acilir.'
- Ana kartta 1. kurgu (Entry on Open - RSI Exit, RSI(2) > Y, Y in {20, 40, 60, 80}) tanimlanmis, diger 5 giris/cikis kombinasyonu varyantlar altina eklenmistir.
- "T22: kart kurali sirali_giris olarak kodlandi: endeks > SMA200 iken RSI(2)<10, kapanis>SMA100, SMA100>SMA100[21] saglayan hisseler giris adayidir; adaylar 100 gunluk tarihsel oynaklik (gunluk getiri std, `getiri_std`) azalan siraya konur, en fazla 7 pozisyon (esit agirlik 1/7), cikis RSI(2)>60. Not: onceki kartta hv100 fiyat stdev idi; oynaklik getiri std olarak duzeltildi (sembolleri karsilastirilabilir kilmak icin). Kaynak sayfa (alvarezquanttrading.com) bu oturumda 406 verdi; kural kartin Argon okumasindan. Giris/cikis orijinalde sonraki gun acilis (ana kurgu), burada A1 kurali ayni."
