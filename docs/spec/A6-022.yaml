id: A6-022
ad: How to Design a Simple Multi-Timeframe Trend Strategy on Bitcoin
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://quantpedia.com/how-to-design-a-simple-multi-timeframe-trend-strategy-on-bitcoin/
  sayfa: null
tarz: swing
tf: 1H
mtf: 1D
tf_varsayim: false
yazar_piyasasi: Kripto (BTCUSD)
gostergeler:
  macd_1h:
    f: macd
    src: close
    fast: 12
    slow: 26
    signal: 9
  macd_1d:
    f: macd
    src: close
    fast: 12
    slow: 26
    signal: 9
    tf: 1D
ozel_kod: false
giris: mtf("1D", macd_1d.macd) > mtf("1D", macd_1d.signal) and cross_over(macd_1h.macd, macd_1h.signal)
cikis: close < open
stop: null
hedef: null
stop_eklendi: false
parametreler:
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
deneme_sayisi_kaynakta: 3
rapor:
  pf: null
  sharpe: 1.07
  getiri: 6.6
  mdd: 12.4
  islem: 1000
  wr: null
  maliyet_dahil: belirtilmemis
varyantlar:
- ad: 'Adim 1: Saf 1H MACD Kesisimi (MACD Pure)'
  giris: cross_over(macd_1h.macd, macd_1h.signal)
  cikis: cross_under(macd_1h.macd, macd_1h.signal)
  not: 2262 islem, yillik getiri %4.6, Sharpe 0.33, Calmar 0.19, MDD %23.9.
- ad: 'Adim 2: D1H1 Filtresi + 1 Bar Tutma'
  giris: mtf("1D", macd_1d.macd) > mtf("1D", macd_1d.signal) and cross_over(macd_1h.macd, macd_1h.signal)
  cikis: 'true'
  not: 1 saatlik tek bar tutma ile ~1000 islem, yillik getiri %6.6, Sharpe 0.80, MDD %12.4.
spec_durumu: tam
belirsiz:
- 'David Mesíček (Quantpedia, Kasim 2025) tarafindan gelistirilen nihai model (D1H1 STOP): Gunluk (1D) mum kapandiktan sonra (00:00 UTC sonrasi) 1D MACD cizgisi sinyal cizgisinin uzerindeyse yukari trend
  onaylanir; 1H grafikte MACD sinyal cizgisini yukari kestiginde long girilir. Saatlik mumlar pozitif kaldigi surece (close >= open) pozisyon korunur ve ilk negatif saatlik mumun (close < open) kapanisinda
  cikilir (Sharpe 1.07, Calmar 0.87).'
- "T10: macd parametresi sig -> signal, alan .sinyal -> .signal (kutuphane adlari); ozel_kod alani eklendi (false). 1H kart: gun ici taramada (T5b-2) kosulacak"
