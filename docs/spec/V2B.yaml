tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: 3
ozel_kod: false
belirsiz:
- v1->v3 üç iterasyonla hedefe ulaşana dek geliştirilmiş (deneme_sayisi_kaynakta=3, DSR'de sayılmalı)
- 'Pozisyon boyutu ADX''e bağlı (1.15x/0.95x): EVRENSEL_KURALLAR A6 gereği yok sayılır'
- 'Gün içi 1H: BIST/ABD/emtia saatlik veri ~730 gün -> en fazla Koşullu'
- 1D/HTF_Bias formülü hiçbir raporda tanımlı değil; Voltran raporundaki HTF kuralı varsayıldı (Supertrend(10,2.5)=+1 veya kapanış>=EMA21*0.985)
  -> lider onayı
- 'Sweep Low[1],8: ''test edip üzerinde kapanma'' low<=ll8 şeklinde yorumlandı'
parametreler: {}
id: V2B
ad: VOLTRAN-2B saatlik momentum şeridi + likidite dönüşü (v3)
kaynak:
  dosya: Voltran_4_Super_Strateji_Mimari_ve_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2
tarz: day
tf: 1H
mtf: 4H
yazar_piyasasi: Voltran sentezi (iç üretim)
gostergeler:
  st_htf:
    f: supertrend
    n: 10
    carpan: 2.5
    tf: 1D
  ema21h:
    f: ema
    src: close
    n: 21
    tf: 1D
  close_1d:
    f: close
    tf: 1D
  ema13:
    f: ema
    src: close
    n: 13
  ema34:
    f: ema
    src: close
    n: 34
  stoch:
    f: stoch
    k: 14
    d: 3
    smooth: 3
  rsi14:
    f: rsi
    src: close
    n: 14
  ll8:
    f: lowest
    src: low
    n: 8
    kaydir: 1
  atr14:
    f: atr
    n: 14
giris: (st_htf.dir == 1 or close_1d >= ema21h * 0.985) and ema13 > ema34 * 0.998 and close > ema34 and stoch.k >= stoch.d * 0.98 and stoch.k >
  35 and rsi14 > 48 and (close > open or (low <= ll8 and close > ll8))
cikis: (ema13 < ema34 * 0.995 and rsi14 < 45)
rapor:
  pf: 2.65
  sharpe: 1.56
  getiri: +%1149.3
  mdd: '%24.0'
  islem: 90
  wr: '%60.1'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
iz_suren:
  tip: atr_kapanis_zirve
  n: 14
  carpan: 3.2
kar_kilidi:
  tetik_atr: 0.95
  stop: giris * 1.005
bias_varsayim: true
