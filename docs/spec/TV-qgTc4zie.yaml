belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'KAMA ozyinelemelidir ve tohumu 0''dir (`var float kama = 0.0`, `nz(kama[1])`): ilk gecerli barda kama = smooth x kapanis ve cizgi gercek fiyata yavas yaklasir (smooth = (ER x (0,666 - 0,0645) + 0,0645)^2 >= 0,0042). Erken tarihli sinyaller bu yakinsamaya, yani verinin baslangic barina baglidir; motor verisi TradingView grafiginden farkli bir barda basliyorsa bu donem farkli cikar.', 'Ilk 21 barda math.sum(noise, 21) na oldugundan smooth/kama na varsayildi (na != 0 karsilastirmasinin Pine''daki sonucu dokumanda net degil); sonraki ilk gecerli barda nz(kama[1]) = 0.', Pozisyon kapisi (strategy.position_size == 0 / > 0) sinyal uretiminde Pine ile ayni sirada benzetilir (emir sonraki acilista dolar). Stop/hedef yok; ATR x 3 stop eklendi., 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_qgtc4zie.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
