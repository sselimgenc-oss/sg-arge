id: TV-AORNVoek
ad: Trend Pullback RSI+ATR | Daily Stocks
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/AORNVoek/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar Antonellago; yayin sembolu NASDAQ:NVDA; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD (NASDAQ:NVDA)
kol: ABD-1D
yayin_sembolu: NASDAQ:NVDA
gostergeler:
  ef: {f: ema, src: close, n: 50}
  es: {f: ema, src: close, n: 200}
  rsi14: {f: rsi, src: close, n: 14}
  atr14: {f: atr, n: 14}
ozel_kod: false
giris: ef > es and close > ef and barssince(rsi14 <= 50 and rsi14 >= 40) <= 5 and cross_over(rsi14, 50) and atr14 / close * 100 > 1.0
