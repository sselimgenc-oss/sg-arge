parametreler: {kol: ABD-1D}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 50/200 rejimi, RSI(14) 50 yukari kesisimi, son 5 barda RSI 40-50 bolgesi, ATR/kapanis > %1, stop 2 x ATR, hedef 4 x ATR, baslangic 2018-01-01 (test donemi ile ayni, kartta ayri tarih kosulu yok). process_orders_on_close = true: giris sinyal barinin KAPANISINDA dolar (dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir).', 'Seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (var stopPrice/tpPrice). Pine strategy.exit emrini pozisyon acildiktan sonraki barin script calismasinda verir (pooc ile dolum sinyal barinin kapanisinda oldugundan emir dolum barindan SONRAKI barin kapanisinda kurulur) ve en erken ondan sonraki bardan etkin olur; motor stop/hedefi dolum barindan sonraki bardan etkin sayar, yani Pine''dan bir bar once. `qty` (risk % boyutu) kullanilmaz.', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
