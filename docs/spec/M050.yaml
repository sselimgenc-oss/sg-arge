belirsiz:
- 'Kesitsel (cross-sectional) sıralama ve haftalık portföy dengeleme mantığı (ozel_kod: true): 1) Evren: Piyasa değerine göre en büyük 100 ABD hissesi (fiyat >= 1$). 2) Her 5 işlem gününde bir (haftalık)
  son 5 günlük getiriye (roc5 = close / close[5] - 1) göre 100 hisse küçükten büyüğe sıralanır; en düşük performanslı 10 hisseye eşit ağırlıkla long girilir. 3) Bir sonraki haftalık dengelemede ilk 10''dan
  çıkan hisseler kapatılır. 4) Short kuralı: Aynı 100 hisse içinden son 1 aylık (21 işlem günü, roc21 = close / close[21] - 1) getirisi en yüksek olan 10 hisseye eşit ağırlıkla short girilir ve haftalık
  dengelenir.'
- "T22: yalniz long bacak (EVRENSEL_KURALLAR A5): onceki haftanin en dusuk getirili hisseleri haftalik (haftanin son kapanisinda karar, ertesi acilista dolum) esit agirlikla tutulur; short bacak (21 gunluk en yuksek getiri) short fazina kaldi. Kaynak evren 100 buyuk hisse / 10 pozisyon: bizim evrenlerde (25-28 sembol) ayni yogunluk n_oran=0,10 (en az 3) ile korunur; 8 sembolden kucuk evren (emtia 6 ETF) Dogrulanamaz (evren_kucuk). Kaynak: https://quantpedia.com/strategies/short-term-reversal-in-stocks (long: son haftanin en dusuk 10 hissesi, haftalik dengeleme). M050 ile B3-014 ayni Quantpedia #13 kurali; sonuc B3-014 satirindan alinir."
