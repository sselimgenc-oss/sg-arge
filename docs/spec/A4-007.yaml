- 'Kurtarilan kurallar: Aylik evren seciminde fiyati > 5$ ve temel verisi olan en yuksek dolar hacimli 50 hisse secilir, Fine asamada EV/EBITDA > 0 olanlar filtrelenir. Gunluk kapanista yeniden dengeleme
