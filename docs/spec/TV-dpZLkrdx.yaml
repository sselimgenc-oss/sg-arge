belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: uzunluk 9, carpan 0,75; atrs = HMA(TR, 9) x 0,75 (HMA: n/2 tam sayiya kesilir = 4, round(sqrt(9)) = 3). Her barda alis stop emri (acilis + atrs) ve satis stop emri (acilis - atrs) verilir; long bacakta alis stopu girisi, satis stopu (long''u ters cevirir) dinamik stop cikisidir.', 'Pine''da karsit yone verilen BEKLEYEN stop emri (strategy.entry stop=...) acik pozisyonu ters yone cevirir; long bacakta bu, her bar yeniden verilen dinamik bir stop cikisidir (dinamik_cikis.stop: seviye bar kapanisinda hesaplanir, ertesi bardan gecerli). Short bacak yoksayilir (kalan pozisyon yok).', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
