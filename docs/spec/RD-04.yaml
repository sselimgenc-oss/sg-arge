belirsiz: ['Kural arastirma/reddit/ozet.md bolum A''daki yazar sozlerinden birebir cevrildi; parametre eklenmedi/degistirilmedi. Yazarin boyut/kaldirac bilgisi yoktur: boyut EVRENSEL_KURALLAR A6.', 'US500 (yazar) -> SPY (kullanici talimati). 4H: ABD icin yfinance 1H''den 4H (09:30 New York seans kovalari), Faz 1 1H donem kurali (son ~2 yil; ilk 2/3 IS, kalan OOS).', 'Williams %R(30) = -100 x (en yuksek(high, 30) - kapanis) / (en yuksek(high, 30) - en dusuk(low, 30)). ''Gir'' ve ''cik'' esik durumu olarak okundu (kesisim degil): pozisyon yokken %R < -90 ise her barda giris sinyali; %R > -50 olunca cikis.', '''%3 felaket stopu'': dolum fiyatinin %3 alti, bar ici (motor stopu). Stoptan sonra %R hala < -90 ise bir sonraki barda yeniden giris olur (yazar yeniden giris kilidi belirtmemis).', 'Yazarin ''%2 stop kenari yarilaya indirdi'' ve ''27 komsu ayarin hepsi pozitif'' ifadeleri kural degil kanittir; kullanilmadi, esikler yazarin degerleridir (komsu ayar taramasi yapilmadi).', 'Kural kaynagi bir yorumdur: tam gecikme/dolum bilgisi yok; sinyal kapanmis 4H barinda, dolum sonraki barin acilisinda.']
