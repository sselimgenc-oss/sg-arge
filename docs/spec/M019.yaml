belirsiz:
- WiseStockTrader sayfası doğrudan browse aracını engellediği için RBuck tarafından yazılan AFL kodu Google arama snippet'lerinden (36.2.1, 40.4.1, 43.1.1-43.3.1, 45.3.1-45.6.1, 47.3.1-47.6.1, 49.3.1-49.6.1,
  51.2.1-51.4.1) çıkarıldı.
- 'Tam AFL giriş/çıkış mantığı (ozel_kod: true): 1) FSK = 100 * (C - LLV(L, pds)) / (HHV(H, pds) - LLV(L, pds)) (pds=52); FLSK = EMA(FSK, slw) (slw=31); FLSD = EMA(FLSK, slwD) (slwD=16); OB=76, OS = OB
  - OSsub = 69. 2) WhenGoUp = FLSD < OS AND Cross(FSK, OS) AND FLSK >= Ref(FLSK, -1) AND FLSD >= Ref(FLSD, -1); ExRem ile WhenGoUp/WhenGoDown ardışık sinyalleri temizlenir ve Tgo = BarsSince(WhenGoUp) >
  Five (Five=2) ile UpFive = (NOT WhenGoDown) AND (TTurn > 0) AND (Tgo > Five) hesaplanır. 3) NormStoch = (C - LLV(L, 52)) / (HHV(H, 52) - LLV(L, 52)) üzerinden 3 barlık tahmin PlusForecast = ForeNmSth3
  > NormStoch * Enough (Enough=1.042, MaxForecast=0.33) hesaplanır. 4) Buy = Close > Open AND PlusForecast AND UpFive AND MFI(3) > 0 AND FLSK < Thirty (41) AND Day() > BuyDay (9). 5) Sell: Held = BarsSince(Buy)
  > 3 ve PositionScore < SellPoint (6400) düşüşü veya Held > MinHold (14) performans filtresi / FLSK > Fifty (48) koşuluyla çıkılır; Short = 0, Cover = 0 (yalnız long).'
