belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: Donchian 30 (onceki barlarin high/low), ADX(14) >= 22, EMA(200), asgari kirilim 0,5 ATR, en fazla 20 bar pozisyon, shorts kapali (allowShorts = false). process_orders_on_close = true: giris ve cikis sinyal barinin KAPANISINDA dolar (dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir).', 'Zaman cikisi: barsHeld = bar_index - entryBarIndex >= 20, entryBarIndex sinyal barindadir; motor zaman_stop semantigi ayni (dolum bari sonrasi, bars_held >= 20, kapanista cikis). Stop/hedef yok; ATR x 3 stop eklendi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
