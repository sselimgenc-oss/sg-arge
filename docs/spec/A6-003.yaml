varyantlar:
- ad: Nick Radge Orijinal Kurgu (20 Pozisyon, %200 Marjin)
  not: Maksimum 20 pozisyon (%10'ar agirlik, %200'e kadar kaldirac), 1995-2014 testinde CAR %26.6, MaxDD %14.6, 7359 islem, Win %64.9.
- ad: SMA100 Filtresiz Varyant (Howard Bandy / Nick Radge Yorumu)
  giris: close[1] < sma5[1] and low[1] < low[2] and low[2] < low[3] and low[3] < low[4] and low <= close[1] - 0.5 * atr10[1]
  not: close > sma100 sarti kaldirildiginda 1995-2014 CAR %41.9, MaxDD %32.8, 10755 islem.
spec_durumu: tam
belirsiz:
- 'Limit emirle giris (ozel_kod: true): Setup gununde (bar t-1) Close > SMA(100), Close < SMA(5) ve ust uste 3 daha dusuk dip (low[1] < low[2] < low[3] < low[4]) olusursa, ertesi gun (bar t) icin Close[1]
  - 0.5 * ATR(10)[1] fiyatina limit alim emri girilir. Cikis: Kapanis bir onceki gunun kapanisindan buyuk oldugunda (close > close[1]) ertesi acilista satilir.'
- 'Yorumlarda (Greg / Cesar Alvarez) ters (short) kurallari da verilmistir: Close < SMA(100), Close > SMA(5), 3 higher highs, limit giris Close[1] + 0.5 * ATR(10)[1], ilk dusuk kapanista (close < close[1])
  cikis.'
