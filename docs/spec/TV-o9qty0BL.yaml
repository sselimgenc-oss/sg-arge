belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine pyramiding = N ayni yonde en fazla N giris demektir (N = 0 ve 1 tek giris); motor piramit.en_cok ek giris sayisidir (en_cok = N - 1). Her ek birim motorda kendi stop mesafesiyle ve normal islem basi risk kuraliyla boyutlanir, toplam acik risk sinirina dahildir; yazarin sabit miktar / sermaye yuzdesi kodu kullanilmaz. Cikis sinyali butun birimleri kapatir. pyramiding = 2: ana giris + en fazla 1 ek (en_cok = 1); ek alim pozisyonun %30''u (sermayenin %30''u) olarak yazilmistir, motor ek birimi risk kuraliyla boyutlar.', 'Test penceresi: useDateFilter acik, baslangic 1632528000000 ms = 2021-09-25 (bitis 2026-09-25); bu tarihten onceki Supertrend donusleri islem uretmez, yani kart IS donemi (2018-2022) icin ancak 2021-09-25 sonrasi sinyal uretir. Pine pozisyon durumu (ek alim yalniz acik pozisyonda ve dongude bir kez) sinyal uretiminde benzetilir.', 'Supertrend T.supertrend (Pine ta.supertrend(4, 10) ile ayni dongu). Stop/hedef yok; her birime ATR x 3 stop eklendi.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_o9qty0bl.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
