belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine smma(src, len) = Wilder yumusatma (ilk deger SMA(len), sonra (onceki*(len-1)+src)/len). Motorda ayri smma yok; Wilder yumusatma alpha=1/len, EMA(2*len-1) ile ayni alphadir. Lips/teeth/jaw (3/5/8) bu nedenle EMA(5)/EMA(9)/EMA(15) olarak yazildi; tohumlama (ilk SMA penceresi) farki isinma doneminde (<=100 bar) kaybolur, EMA(200) trend filtresi zaten 200 bar isinma ister.', 'Kaynak hl2. Offset girdileri (jaw/teeth/lips offset) yalniz cizim icindir, islem kuralini etkilemez. Short girisi (opentrades == 0 gerektirir) long bacakta yok; long cikisi strategy.close(''Long'') ile yukaridaki kosulda.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
