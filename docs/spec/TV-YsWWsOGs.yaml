belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine CCI kaynagi close (cci(source=close, 28)); motor cci gostergesi hlc3 uzerinden calisir. CCI = (x - SMA(x,28)) / (0.015 * ortalama sapma) ve ortalama sapma > 0 oldugundan CCI isareti close - SMA(close,28) isaretine esittir; isStrategyLong = cci > 0 <=> close > SMA(28) ve isShort = cci < 0 <=> close < SMA(28) (ML=0). Esitlik (cci == 0) durumunda Pine onceki trendi korur; kartta giris ve cikis o barda tetiklenmez (olcu sifir olasilikli).', 'Supertrend cizgisi (f_supertrend) yalniz cizim icindir; giris/cikis yon degiskeni st_trend cci isaretinden gelir. Kod her barda strategy.entry(''Long'', when=isLong) cagirir; pozisyon varken tekrar eden giris motorda yok sayilir (pyramiding=0 ile ayni). Short girisi (cci < 0) long''u ters cevirerek kapatir, bu nedenle cikis = cci < 0.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
