id: TV-WWuTjyDx
ad: Capitulation Stretch Reversion [Jayadev Rana]
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/WWuTjyDx/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar JayadevRana; yayin sembolu AMEX:SPY; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD (AMEX:SPY)
kol: ABD-1D
yayin_sembolu: AMEX:SPY
gostergeler:
  ema5: {f: ema, src: close, n: 5}
  ema200: {f: ema, src: close, n: 200}
  atr14: {f: atr, n: 14}
ozel_kod: false
giris: close > ema200 and close < ema5 - 0.5 * atr14 and close < close[1] and close[1] < close[2] and close > open
