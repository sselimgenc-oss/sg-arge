spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'downRun >= 2 (iki ardisik dusen kapanis) = close < close[1] ve close[1] < close[2]. tradeLongs=true, tradeShorts=false (varsayilan): short bacak zaten kapali. Giris yalniz pozisyon yokken (flat).', 'Stop = sinyal kapanisi - 3 x ATR(14) (stopPx giriste sabitlenir; tip: seviye). Hedef ''mean'' dokunusu: close >= EMA(5) kapanis cikisi. Zaman stopu 10 bar: barsHeld dolum barindan sayilir (dolum bari 1), motor zaman_stop semantigi (bars_held >= 10 olunca sonraki acilista cikis) ayni.', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).']
