belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Short bacak yok sayilir ama Pine''da short acikken isFlat=false oldugu icin long girisi kapanir: sinyal uretiminde short girisi (edge 70 yukari kesisimi, z fiyat > 1.5, trend skoru < 50) ve short cikisi (edge 45 asagi kesisimi) pozisyon kapisi olarak benzetilir; short ticareti motora verilmez.', Stop yok (strategy.exit yok); cikis yalniz edge 45 asagi kesisimidir. Motorun ATR(14) x 3 koruma stopu long'u Pine'dan once kapatabilir; Pine'da long o sirada acik sayilacagindan yeni giris uretilmez (sinyal tarafinda tutarli)., 'ta.linreg(close,60,0) - ta.linreg(close,60,1) = regresyon egimi (en kucuk kareler, x=0..59) olarak hesaplandi; ta.highest(high,60)[60] = 60 bar onceki en yuksek. ta.stdev ddof=0 (populasyon), Pine ile ayni.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_xyfla6o7.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
