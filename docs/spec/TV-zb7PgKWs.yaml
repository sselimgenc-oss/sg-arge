id: TV-zb7PgKWs
ad: Hull Moving Average Crossover Strategy
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/zb7PgKWs/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar SeaSide420; yayin sembolu BITFINEX:ETHUSD; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BITFINEX:ETHUSD)
kol: KRIPTO-4H
yayin_sembolu: BITFINEX:ETHUSD
gostergeler:
  w7: {f: wma, src: ohlc4, n: 7}
  w14: {f: wma, src: ohlc4, n: 14}
  hdiff: {f: seri, ifade: 2 * w7 - w14}
  hull: {f: wma, src: hdiff, n: 4}
  n1: {f: seri, ifade: 'hull[1]'}
  n2: {f: seri, ifade: 'hull[2]'}
  lc1: {f: seri, ifade: '(n1 - n1[3]) + (n1 - n2[4]) * 100'}
  lc2: {f: seri, ifade: '(n2 - n2[3]) + (n2 - n1[4]) * 100'}
ozel_kod: false
giris: n1 > n2 and lc1 > lc2
cikis: n1 < n2 and lc1 < lc2
