spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Hull periyodu 14, kaynak ohlc4 (p[1] ve p[2] ile gecikmeli): n1 = Hull(p[1]) = HMA[1], n2 = Hull(p[2]) = HMA[2]; round(14/2) = 7, round(sqrt(14)) = 4. longcross1 = (n1 - n1[3]) + (n1 - n2[4]) * 100, longcross2 = (n2 - n2[3]) + (n2 - n1[4]) * 100 aynen.', 'Pine girisi `strategy.opentrades < 1` ile iki yonlu tek acik islem kapisi kullanir: acik short varken long girisi yoktur ve short kapanisindan sonraki barda gerceklesir. Kartta short bacak yok sayildigindan long giris kapisi yalniz long pozisyona bakar; short donemi sonrasi giris Pine''da bir bar gecikmeli olabilir (yalniz long bacak kuralinin dogal sonucu). Cikis: n1 < n2 ve longcross1 < longcross2 (strategy.close(''Long'')).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
