belirsiz:
- TuringTrader inceleme sayfası, TuringTrader Weekly Rotation portföy sayfası (https://www.turingtrader.com/portfolios/bensdorp-weekly-rotation/) ve GitHub C# kodu (fbertram/TuringTrader/blob/master/BooksAndPubs/Bensdorp_30MinStockTrader.cs)
  birlikte okundu.
- 'Haftalık rotasyon ve sıralama mantığı (ozel_kod: true): 1) S&P 500 hisseleri haftada bir kez (haftasonu hesaplanıp Pazartesi açılışta) yeniden dengelenir. 2) Rejim filtresi: S&P 500 endeksi 200 günlük
  SMA''sının %2 altındaki bandın (0.98 * SMA(200)) üzerinde olmalıdır. 3) Aşırı alım filtresi: 3 günlük RSI değeri 50''yi aşan (RSI(3) >= 50) hisseler elenir. 4) Kalan S&P 500 hisseleri 200 günlük momentumlarına
  (ROC(200)) göre yüksekten düşüğe sıralanır, ilk 10 hisseye %10''ar eşit ağırlık verilir.'
- "T10: ozel_kod_nedeni: portfoy_rotasyonu (haftalik S&P 500 siralamasi (ROC200), en iyi 10 hisse ve endeks rejim filtresi (SPY ikinci enstruman))"
