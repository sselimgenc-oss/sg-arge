belirsiz:
- TuringTrader inceleme sayfası, TuringTrader Weekly Rotation portföy sayfası (https://www.turingtrader.com/portfolios/bensdorp-weekly-rotation/) ve GitHub C# kodu (fbertram/TuringTrader/blob/master/BooksAndPubs/Bensdorp_30MinStockTrader.cs)
  birlikte okundu.
- 'Haftalık rotasyon ve sıralama mantığı (ozel_kod: true): 1) S&P 500 hisseleri haftada bir kez (haftasonu hesaplanıp Pazartesi açılışta) yeniden dengelenir. 2) Rejim filtresi: S&P 500 endeksi 200 günlük
  SMA''sının %2 altındaki bandın (0.98 * SMA(200)) üzerinde olmalıdır. 3) Aşırı alım filtresi: 3 günlük RSI değeri 50''yi aşan (RSI(3) >= 50) hisseler elenir. 4) Kalan S&P 500 hisseleri 200 günlük momentumlarına
  (ROC(200)) göre yüksekten düşüğe sıralanır, ilk 10 hisseye %10''ar eşit ağırlık verilir.'
- "T22: kaynak kod okundu (https://raw.githubusercontent.com/fbertram/TuringTrader/master/BooksAndPubs/Bensdorp_30MinStockTrader.cs, Bensdorp_30MinStockTrader_WR, aktif #if true dali): haftanin son isleminde karar; SPX kapanisi > 0,98 x SMA200 degilse hic hisse tutulmaz; evren ROC(200)e gore siralanir, ilk MAX_ENTRIES=10 secilir; bunlardan zaten tutulanlar RSI(3) farketmeksizin kalir, yeni girenler icin RSI(3) < 50 sarti aranir; her pozisyon 1/10 (elenen yuva nakitte). Kaynak evren S&P 500 / 10 pozisyon: bizim evrenlerde ayni yogunluk n_oran=0,02 (en az 3). Endeks: piyasanin benchmark serisi (ABD SPY, kripto BTC); BIST/emtia icin endeks yok -> Dogrulanamaz. Karar gunluk veride haftalik (kart tf: 1D). Onceki ozetteki 'RSI(3) >= 50 olanlar siralamadan once elenir' ifadesi kaynak kodla uyusmuyordu: RSI sarti yalniz yeni girislere uygulanir."
