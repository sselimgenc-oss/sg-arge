varyantlar:
- ad: '1 Dakikalik RSI(30/70) + RSI SMA + Kisa EMA Varyanti (Yorum #3)'
  not: 1m NQ grafikte RSI < 30 iken RSI'in SMA'si ve fiyat kisa EMA'si yukari donunce long girilir, RSI > 70 karsi bolgeye ulasinca cikilir (%61 win rate).
spec_durumu: eksik
belirsiz:
- 'QuantConnect tartisma sayfasindaki (David E, Mayis 2023) aciklamadan okundu: 5m NQ Mini barlarinda EMA egimi, RSI egimi, Momentum egimi ve Ultimate Oscillator egimi (MACD histogram egimi elenmis) ile
  500 EMA trend yonu kullanilir (500 EMA pozitifken long icin 1 bar sinyal, short icin ust uste 2 bar sinyal gerekir). Ancak gomulu backtest kodundaki kesin periyot sayilari metinde yazmadigi icin spec_durumu:
  eksik olarak isaretlendi.'
