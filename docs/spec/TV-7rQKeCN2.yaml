belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 21/50, kirilim = kapanis > onceki 20 barin en yuksegi (high[1] penceresi), hacim > SMA(hacim, 20) x 1,2, OBV EMA(5) > SMA(20). Stop = min(son 10 bar dibi, EMA50) - 0,5 x ATR; hedef = kapanis + 2 x risk (risk = kapanis - stop; risk <= 0 ise giris yok). strategy.exit her barda GUNCEL degerlerle yeniden verilir; ilk seviye sinyal barindan sabitlenir. Yalniz long (kaynakta short yok).', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir (sinyal barinda da); ilk seviye sinyal barinin degerleriyle kartta stop/hedef ''seviye'' olarak sabitlenir ve dolumdan itibaren gecerlidir, sonra motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplayip ertesi bardan gecerli sayar (Pine ile ayni sira).', 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'U7 Ek 1: kol ABD-4H → ABD25-4H eslendi (kural ve parametreler degismedi; yayin sembolu NASDAQ:AMD).']
