varyantlar:
- ad: Yalniz MAX10 (10 Gunluk Zirvede Trend Takibi) Bacagi
  giris: close >= hh10
  cikis: 'false'
  not: BTC son 10 gunun en yuksek kapanisina ulastiginda 1 gunlugune long acilir (20, 30, 40, 50 gunluk periyotlar da test edilmistir).
- ad: Yalniz MIN10 (10 Gunluk Dipte Ortalamaya Donus) Bacagi
  giris: close <= ll10
  cikis: 'false'
  not: BTC son 10 gunun en dusuk kapanisina ulastiginda 1 gunlugune long acilir.
- ad: Gun Ici 2 Saatlik Mevsimsellik (22:00 - 00:00 UTC) Bacagi
  not: 'A6-019 kartindaki strateji: Her gun 22:00 UTC''de long acilip 00:00 UTC''de kapatilir.'
