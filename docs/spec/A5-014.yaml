belirsiz:
- PapersWithBacktest URL'sine dogrudan erisim engellendi; ancak makalenin yazarlarina (Matúš Padyšák & Radovan Vojtko, Quantpedia) ait iki tam metin aynasindan (quantpedia.com/strategies/intraday-seasonality-in-bitcoin
  ve quantpedia.com/revisiting-trend-following-and-mean-reversion-strategies-in-bitcoin/) makaledeki birlesik MIN10 + MAX10 stratejisinin ve 2 saatlik mevsimsellik stratejisinin tum kurallari eksiksiz okundu.
