id: TV-OKxIjdsz
ad: BTC Trend-Momentum Strategy
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/OKxIjdsz/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar SystemsOverFeelings; yayin sembolu INDEX:BTCUSD; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (INDEX:BTCUSD)
kol: KRIPTO-1D
yayin_sembolu: INDEX:BTCUSD
gostergeler:
  ema200: {f: ema, src: close, n: 200}
  mfv: {f: seri, ifade: 'eger(high - low > 0, ((close - low) - (high - close)) / (high - low) * volume, 0)'}
  sma20_mfv: {f: sma, src: mfv, n: 20}
  sma20_vol: {f: sma, src: volume, n: 20}
  cmf: {f: seri, ifade: sma20_mfv / sma20_vol}
  rsi14: {f: rsi, src: close, n: 14}
  lo14: {f: lowest, src: rsi14, n: 14}
  hi14: {f: highest, src: rsi14, n: 14}
  stoch: {f: seri, ifade: 100 * (rsi14 - lo14) / (hi14 - lo14)}
  kline: {f: sma, src: stoch, n: 3}
  atr14: {f: atr, n: 14}
  atrma: {f: sma, src: atr14, n: 20}
ozel_kod: false
giris: cmf > 0 and cross_over(kline, 20) and atr14 > atrma and close > ema200
cikis: cmf < 0 and cross_under(kline, 80) and atr14 > atrma
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-1D}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'CMF(20) = SMA(mfv, 20) / SMA(hacim, 20) (Pine math.sum oranı; paydaki 20 sabiti sadelesir). Stokastik RSI: 100*(RSI - lowest(RSI,14))/(highest(RSI,14) - lowest(RSI,14)), %K = SMA(3); RSI sabit ise 0/0 NaN (Pine ile ayni). Hacim filtresi: ATR(14) > SMA(ATR, 20). Long: CMF > 0, %K 20''yi yukari keser, ATR filtresi, close > EMA(200).', 'Short kosulu (CMF < 0, %K 80''i asagi keser, ATR filtresi; EMA filtresi yok) acik long''u strategy.entry(''Short'') ile ters cevirir; cikis olarak yazildi. `time > start_period` (2018-01-01) kosulu kartta yok: test donemi 2018-01-01''de basladigindan etkisizdir (ilk bar zaman dilimi farki dahil).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
