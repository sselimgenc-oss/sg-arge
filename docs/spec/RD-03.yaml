      degilse: {tut: nakit}
    - eger: valuewhen(ay_islem_gunu_sondan(1), dbc_close > dbc_m9)
      ise: {tut: DBC}
      degilse: {tut: nakit}
    - eger: valuewhen(ay_islem_gunu_sondan(1), vnq_close > vnq_m9)
      ise: {tut: VNQ}
      degilse: {tut: nakit}
spec_durumu: tam
belirsiz: ['Yazarin kendi kurali yok; Faber (2007) yayinli kurali alindi: 5 ETF (SPY, EFA, IEF, DBC/GSG, VNQ) esit agirlik; her ay sonu kapanis 10 aylik SMA''nin ustundeyse varlik tutulur, degilse o pay nakitte. Aylik yeniden dengeleme.', 'DBC/GSG: ozette iki ad var; kullanici talimatiyla DBC alindi (GSG degil).', '10 aylik SMA, ay sonu kapanislari uzerinden hesaplanir ve cari ay sonu kapanisini icerir. Kartta ''close > SMA10(cari ay dahil)'', onceki 9 tamamlanmis ay sonu kapanisinin ortalamasina karsi ''close > SMA9(1M)'' ile ayni sonucu verir (close > (9 x m + close) / 10 <=> close > m); 1M gostergesi son TAMAMLANMIS ayi kullanir, ay sonu karar gununde cari ay dahil degildir.', 'Faber kurali ay sonu kapanisinda sinyal ve islem der: dolum kapanista (dolum: kapanis; gecis kartlari gibi, D4 MOC maliyeti 2x baz). Sonraki acilis varyanti ayrica raporlanir. Nakit payi getirisiz sayilir (faiz yok).', 'Rotasyon agaci her bari degerlendirir (gecis kipi); ay ici karar degisikligini onlemek icin karar degiskenleri ay sonu degerini tutar (valuewhen(ay son islem gunu, kosul)).', 'Maliyet motorun ABD baz maliyeti; ETF evreni (SPY, EFA, IEF, DBC, VNQ) sabit isimli enstrumanlardir (data/rotasyon_semboller.csv''ye eklenmesi gerekir: EFA, IEF, DBC, VNQ).']
