id: RD-03
ad: 'Faber GTAA (taktik varlik dagilimi): 5 ETF, 10 aylik SMA, aylik'
kart_yazari: sonnet
kaynak: {dosya: arastirma/reddit/ozet.md, url: null, sayfa: 'bolum A, RD-03', not: 'Reddit; r/algotrading, ReporterCalm6238 ("Faber''s GTAA, plain and simple"); kural Faber (2007) yayinli kuralidir. docs/GOREV_U7.md Ek 3.'}
tarz: swing
tf: 1D
mtf: null
