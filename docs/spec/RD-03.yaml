yazar_piyasasi: ABD ETF (SPY, EFA, IEF, DBC, VNQ)
kol: ABD-1D
gostergeler:
  spy_close: {f: close, varlik: SPY}
  spy_m9: {f: sma, src: close, n: 9, tf: 1M, varlik: SPY}
  efa_close: {f: close, varlik: EFA}
  efa_m9: {f: sma, src: close, n: 9, tf: 1M, varlik: EFA}
  ief_close: {f: close, varlik: IEF}
  ief_m9: {f: sma, src: close, n: 9, tf: 1M, varlik: IEF}
  dbc_close: {f: close, varlik: DBC}
  dbc_m9: {f: sma, src: close, n: 9, tf: 1M, varlik: DBC}
  vnq_close: {f: close, varlik: VNQ}
  vnq_m9: {f: sma, src: close, n: 9, tf: 1M, varlik: VNQ}
