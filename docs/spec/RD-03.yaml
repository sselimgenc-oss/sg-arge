  agac:
    esit:
    - eger: valuewhen(ay_islem_gunu_sondan(1), spy_close > spy_m9)
      ise: {tut: SPY}
      degilse: {tut: nakit}
    - eger: valuewhen(ay_islem_gunu_sondan(1), efa_close > efa_m9)
      ise: {tut: EFA}
