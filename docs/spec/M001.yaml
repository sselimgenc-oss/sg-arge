belirsiz:
- 'Strateji spot/vadeli kontrat yerine 0DTE opsiyon kredi spreadi (short put spread / short call spread) alıp sattığı için opsiyon zinciri verisi olmadan doğrudan spot OHLCV üzerinde gerçek PnL ile test
  edilemez (spec_durumu: eksik).'
- 'Long (bullish) sinyal mantığı (ozel_kod: true): Seansın ilk 60 dakikasında (09:30-10:30 EST) oluşan Opening Range (OR_High ve OR_Low) hesaplanır; aralık genişliği açılış fiyatının en az %0,2''si ((OR_High
  - OR_Low) / Open_0930 >= 0.002) olmalı ve saat 12:00 EST''den önce fiyat OR_High üstüne kırılmalıdır. Tetiklendiğinde kısa bacağı OR_Low seviyesinde veya altında olan 15$ genişlikli 0DTE short put spread
  açılır ve gün sonuna (16:00 EST vade sonu) kadar tutulur.'
- 'Short (bearish) kuralı: Fiyat 12:00 EST öncesinde OR_Low altına kırılırsa kısa bacağı OR_High seviyesinde veya üstünde olan 15$ genişlikli 0DTE short call spread açılır; günde en fazla 1 işlem alınır.'
