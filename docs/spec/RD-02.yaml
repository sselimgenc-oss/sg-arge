belirsiz: ['Kural arastirma/reddit/ozet.md bolum A''daki yazar sozlerinden birebir cevrildi; parametre eklenmedi/degistirilmedi. Yazarin boyut/kaldirac bilgisi yoktur: boyut EVRENSEL_KURALLAR A6.', 'ozel_kod: true (TLT getirisi baska enstruman verisi gerektirir, motor ifade dilinde yok): strategies/ozel/rd_02.py. TLT alinmaz; modul olcut serisini kosucunun verdigi veriden (data[''TLT'']) ya da arsivden (data/daily/TLT.parquet) okur; kosucu TLT''yi verilere eklemelidir (islem evreni yalniz SPY).', 'Takvim: O3-007''deki gibi islem gunu sayaci. ''Ay bitimine 4 islem gunu kala'' = ayin sondan 5. islem gunu (ay_islem_gunu_sondan(5); 4 islem gunu geriye kalir) - ''4. gun'' okumasi da mumkun, belirsiz. ''Ayin 3. islem gunu'' = ay_islem_gunu_bastan(3).', '''Ay basindan beri getiri'': onceki ayin son kapanisina gore kapanis getirisi (aylik YTD tanimi); yazar baz gunu yazmamis. Fark esigi %2 = 2 yuzde puan; esitlikte (tam %2) sinyal sayilir.', 'Dolum kapanista (dolum: kapanis; D4 MOC maliyeti 2x baz). Kaynak sozleri ''o kapanista al / ayin son kapanisinda sat'': sonraki acilis varyanti ayrica raporlanir.', 'Yazarin stopu yok: ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true); strateji gunler-haftalar tutuldugundan bu stop sonucu etkileyebilir.', Ayin son islem gununden onceki barlarda cikis ay sonuna yakin kapanis ile ayni gunde giris ve cikis cakisabilir (fark yoksa islem yok).]
