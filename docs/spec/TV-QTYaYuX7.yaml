belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Kaynak fiyat open (price=open). Hull MA: hma(open, 14) = wma(2*wma(open,7) - wma(open,14), round(sqrt(14))=4); highest/lowest(HMA, 9); Fisher donusumu ozyinelemeli: value := round_(0.66*((HMA-low_)/max(high_-low_,0.001) - 0.5) + 0.67*nz(value[1])), value1 := 0.5*ln((1+value)/max(1-value,0.001)) + 0.5*nz(value1[1]) (round_ +-0.999''a kirpar). CCI(open, 14) hlc3 degil open uzerinden.', 'useCCI=useHMA=true oldugundan yalniz LongCondition7/8 (CCI ve HMA onayli) etkindir; 1-6 numarali kosullar ''not useCCI/not useHMA'' ile devre disi. Kapanis kosullari (HMAclose, fishclose) vekil birlesimi: HMA < HMA[1] veya value1 < value1[1].', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_qtyayux7.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
