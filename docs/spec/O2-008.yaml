belirsiz:
- 'TooSlow tarafindan paylasilan HOLO (Highest Open / Lowest Open) gun ici donus stratejisidir (ozel_kod: true): 1) Mevcut islem gunu icindeki en yuksek 1H bar acilisi (Highest_H1_Open) ve en dusuk 1H bar
  acilisi (Lowest_H1_Open) cizilir. 2) Long giris: Fiyat once Lowest_H1_Open altina inmeli (ve 15m bar Lowest_H1_Open altinda acilmali), ardindan yukari donup Lowest_H1_Open seviyesini yukari gecince bar
  kapanisini beklemeden long acilir (fiyat dunku gunluk yuksek/dusugu kirmissa breakout uyarisi vardir). 3) Stop-loss mevcut gunun en dusuk seviyesidir (Daily Low). 4) Kar yonetimi: Islem +5 pip kara gecince
  stop BE+1 pipe, +10 pip kara gecince BE+5 pipe veya iz suren stopa cekilir (varsayilan EA seans araligi NY 08:00 - 12:00). 5) Short kurali: Fiyat Highest_H1_Open uzerine cikip tekrar Highest_H1_Open seviyesine
  indiginde short acilir, stop Daily High''dir.'
