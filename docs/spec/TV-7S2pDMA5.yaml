id: TV-7S2pDMA5
ad: MultiCross v4.20
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/7S2pDMA5/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar SeaSide420; yayin sembolu FX:NZDUSD; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: FX (FX:NZDUSD)
kol: FX8-4H
yayin_sembolu: FX:NZDUSD
gostergeler:
  w4: {f: wma, src: close, n: 4}
  w7: {f: wma, src: close, n: 7}
  w14: {f: wma, src: close, n: 14}
  d1: {f: seri, ifade: 2 * w4 - w7}
  n1: {f: wma, src: d1, n: 3}
  d1l: {f: seri, ifade: 'd1[2]'}
  n2: {f: wma, src: d1l, n: 3}
  d3: {f: seri, ifade: 2 * w7 - w14}
  n3: {f: wma, src: d3, n: 4}
  d3l: {f: seri, ifade: 'd3[2]'}
  n4: {f: wma, src: d3l, n: 4}
  e7: {f: ema, src: close, n: 7}
  e14: {f: ema, src: close, n: 14}
  macd: {f: seri, ifade: e7 - e14}
  amacd: {f: ema, src: macd, n: 3}
  pc: {f: seri, ifade: 'close - close[1]'}
  apc: {f: seri, ifade: 'abs(close - close[1])'}
  p1: {f: ema, src: pc, n: 5}
  p2: {f: ema, src: p1, n: 3}
  a1: {f: ema, src: apc, n: 5}
  a2: {f: ema, src: a1, n: 3}
  tsi: {f: seri, ifade: 100 * p2 / a2}
  tsis: {f: ema, src: tsi, n: 2}
ozel_kod: false
giris: n1 > n2 and macd > amacd and n1 < close and n3 > n4 and tsis > -4
cikis: n1 < n2 and n3 < n4 and n1 > close
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [FX]
parametreler: {kol: FX8-4H}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: cift HullMA 7 ve 14 (round(7/2) = 4, round(sqrt(7)) = 3; round(14/2) = 7, round(sqrt(14)) = 4), VWMA(close, 1) = close, MACD 7/14/3, TSI 5/3/2, cizgiler +4/-4. n2 ve n4 ayni Hull''un close[2] uzerinden hesaplanmis halidir. strategy.opentrades < 1 kosulu motorun tek pozisyon kuralidir. Kaynak v2 Pine; short girisi yoksayilir (short acikken long girisi Pine''da engellenir, long bacak tek basina kosulur).', 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).', 'U7 Ek 1: kol FX-4H → FX8-4H eslendi (kural ve parametreler degismedi; yayin sembolu FX:NZDUSD).']
deneme_sayisi_kaynakta: 205
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
