id: M003
ad: 5min /ES Futures Strategy For ThinkOrSwim (HalfTrend with Deviation Bands)
kart_yazari: argon
kaynak:
  dosya: markdown_listesi
  url: https://usethinkscript.com/threads/5min-es-futures-strategy-for-thinkorswim.9911/
  sayfa: null
tarz: day
tf: 5m
mtf: null
tf_varsayim: false
yazar_piyasasi: Vadeli (ES Futures)
gostergeler:
  lowpricei:
    f: lowest
    src: low
    n: 25
  highpricei:
    f: highest
    src: high
    n: 25
  lowma:
    f: sma
    src: low
    n: 25
  highma:
    f: sma
    src: high
    n: 25
  atr14:
    f: atr
    n: 14
giris: (cross_over(high, halftrend) and up > 0) or cross_over(high, halftrend + 17)
cikis: cross_under(high, halftrend - 17) or (cross_under(high, halftrend) and down > 0)
stop:
  tip: atr
  n: 14
  carpan: 2.5
hedef: null
stop_eklendi: false
ozel_kod: true
ozel_kod_nedeni: ozel_gosterge
piyasa_kisiti: [ES]
parametreler:
  Price: high
  Amplitude: 25
  Num_Dev_Dn: -17
  Num_Dev_up: 17
  stop_mult: 2.5
varyantlar:
- aciklama: Yazarın 5m ES mesajında kullandığı ayarlar
  Price: low
  Amplitude: 20
  Num_Dev_Dn: -4
  Num_Dev_up: 4
  stop_mult: 0.5
deneme_sayisi_kaynakta: 2
rapor:
  pf: 2.3
  sharpe: null
  getiri: null
  mdd: null
  islem: 1270
  wr: null
  maliyet_dahil: hayir
spec_durumu: dakikalik
belirsiz:
- 'HalfTrend + Deviation Bands hesaplama adımları (ozel_kod: true): 1) lowpricei = lowest(low, Amplitude), highpricei = highest(high, Amplitude), lowma = sma(low, Amplitude), highma = sma(high, Amplitude).
  2) nexttrend[1] == 1 iken: maxlowprice = max(lowpricei, maxlowprice[1]); eğer highma < maxlowprice[1] ve close < low[1] ise trend = 1, nexttrend = 0, minhighprice = highpricei olur. 3) nexttrend[1] ==
  0 iken: minhighprice = min(highpricei, minhighprice[1]); eğer lowma > minhighprice[1] ve close > high[1] ise trend = 0, nexttrend = 1, maxlowprice = lowpricei olur. 4) trend == 0 iken up = (trend[1] !=
  0 ise down[1] değilse max(maxlowprice[1], up[1])), down = 0; trend == 1 iken down = (trend[1] != 1 ise up[1] değilse min(minhighprice, down[1])), up = 0. 5) halftrend (MidLine) = (up > 0 ise up değilse
  down); LowerBand = halftrend + Num_Dev_Dn; UpperBand = halftrend + Num_Dev_up.'
- 'Long giriş (BUY_auto): Price (varsayılan high, 5m ayarında low) MidLine''ı yukarı keser ve up > 0 ise VEYA Price UpperBand''ı yukarı keserse. Çıkış / Short dönüş (SELL_auto): Price LowerBand''ı aşağı
  keserse VEYA (Price MidLine''ı aşağı keser ve down > 0 ise). Ayrıca ATR(14) * stop_mult seviyesinde stop-loss vardır.'
- "T10: ozel_kod_nedeni: ozel_gosterge (HalfTrend gostergesi kutuphanede yok)"
- "T21: kaynak erisilemedi (https://usethinkscript.com/threads/5min-es-futures-strategy-for-thinkorswim.9911/) -> Argon T19. Price girdisi celisiyor: kart high kullanir, kaynak metni 5m ayarinda low der; ayrica yalniz ES vadeli (piyasa_kisiti ES). HalfTrend adimlari kartta var ama bu girdi netlesmeden yazilmadi"
