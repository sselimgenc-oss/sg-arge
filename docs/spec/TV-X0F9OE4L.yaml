id: TV-X0F9OE4L
ad: Gradient Ribbon | EMA Ribbon Slope-Acceleration System
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/X0F9OE4L/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar blitz_locked; yayin sembolu COINBASE:ETHUSD; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (COINBASE:ETHUSD)
kol: KRIPTO-1D
yayin_sembolu: COINBASE:ETHUSD
gostergeler:
  ema8: {f: ema, src: close, n: 8}
  ema13: {f: ema, src: close, n: 13}
  ema21: {f: ema, src: close, n: 21}
  ema34: {f: ema, src: close, n: 34}
  ema55: {f: ema, src: close, n: 55}
  s8: {f: seri, ifade: '(ema8 - ema8[5]) / ema8[5] * 100'}
  s13: {f: seri, ifade: '(ema13 - ema13[5]) / ema13[5] * 100'}
  s21: {f: seri, ifade: '(ema21 - ema21[5]) / ema21[5] * 100'}
  s34: {f: seri, ifade: '(ema34 - ema34[5]) / ema34[5] * 100'}
  s55: {f: seri, ifade: '(ema55 - ema55[5]) / ema55[5] * 100'}
  fan_artan: {f: seri, ifade: s8 > s13 and s13 > s21 and s21 > s34 and s34 > s55}
  fan_skor: {f: seri, ifade: s8 - s55}
  rsi14: {f: rsi, src: close, n: 14}
  volma: {f: sma, src: volume, n: 20}
  atr14: {f: atr, n: 14}
ozel_kod: false
giris: s8 > 0 and s13 > 0 and s21 > 0 and s34 > 0 and s55 > 0 and fan_artan and fan_skor > 0.8 and rsi14 > 50 and rsi14 < 70 and volume > volma * 1.0
cikis: (not fan_artan) or fan_skor < 0.2
stop: {tip: seviye, ifade: sinyal_close - 2.0 * sinyal_atr14}
hedef: {tip: seviye, ifade: sinyal_close + 4.0 * sinyal_atr14}
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-1D}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'EMA kurdelesi 8/13/21/34/55; egim = (EMA - EMA[5]) / EMA[5] * 100 (slopeLookback=5). Giris: bes egim de pozitif, egimler s8>s13>s21>s34>s55, yelpaze skoru (s8 - s55) > 0.8, RSI(14) 50-70 arasi, hacim > SMA(hacim,20). Cikis (strategy.close): sira bozulur ya da skor < 0.2.', 'Stop = sinyal kapanisi - 2 x ATR(14), hedef = sinyal kapanisi + 2 x (2 x ATR) (R carpani 2): seviyeler sinyal barindan sabit (kartta tip: seviye). Short girisi (strategy.position_size == 0 gerektirir, ters cevirme yok) long bacakta kullanilmaz.', 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).']
