belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine ta.supertrend(factor=1.8, atrPeriod=10): direction < 0 yukselis; kartta st.dir +1 = yukselis. bullFlip = ta.change(direction) < 0 <=> st.dir == 1 ve st.dir[1] == -1; bearFlip tersi. Ilk bar yonu motor/Pine arasinda isinma doneminde farkli olabilir.', 'Varsayilan input''lar: enableSL=false, enableTP=false, enableADX=false; yani yazarin stopu/hedefi/ADX filtresi kapali ve kartta yok. Giris: yukselis donusu + kapanis > EMA(200). Cikis: dusus donusu (strategy.close(''Long'') bearFlip''te).', Dusus donusunde short giris (bearFlip ve close < EMA200) long bacakta yok; long kapanisi zaten bearFlip ile yapildigindan cikis degismez., 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
