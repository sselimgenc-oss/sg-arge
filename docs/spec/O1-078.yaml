belirsiz:
- NinjaTrader sayfasının referans verdiği Haziran 2016 Stocks & Commodities Traders' Tips (https://traders.com/Documentation/FEEDbk_docs/2016/06/TradersTips.html, Ken Calhoun 'ATR Breakout Entries') ve
  thinkorswim dokümantasyonundan tam kod okundu
- 'Özel kod mantığı: ATR(14) değeri son 14 günün en yüksek ATR değerini aştığında (volatilite patlaması), hisse 100 günlük basit hareketli ortalamanın (SMA 100) üzerindeyse ve fiyat son 15 günün en yüksek
  seviyesinin $0.50 üzerine çıktığında Buy Stop ile Long girilir; $2.00 iz süren stop veya son 2 günün en düşüğü (lowest(low, 2)[1]) kırıldığında çıkılır'
