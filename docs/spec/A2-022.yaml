belirsiz:
- Karar grafiği M1 verisinden üretilen 10 pip Renko (M2 çevrimdışı grafik, 1 saatin altında / bar-dışı)
- 'Özel kod mantığı: 10 pip Renko grafikte fiyat EMA(21) ve EMA(50) üzerindeyken tuğla rengi kırmızıdan yeşile dönüp 2 ardışık yeşil tuğla kapandığında (3. yeşil tuğla açılışında) Long açılır; SL dönüşteki son kırmızı tuğlanın düşüğü veya son anlamlı diptir; çıkış ters renkli (kırmızı) tuğla kapanışında veya 20-30 pip izsüren stop ile yapılır'
- 'short kuralı var: Fiyat EMA(21) ve EMA(50) altındayken yeşilden kırmızıya dönüp 2 ardışık kırmızı tuğla kapandığında short açılır'
- 'ozel_kod_nedeni: renko (10 pip Renko tuglalari (zaman bazli bar degil))'
- 'T20: motorda kalmadi. 10 pip Renko (EURUSD, FX) ve 20-30 pip izsuren; pips stop tipi motorda yok, ''kirmizidan yesile donus + 2 yesil tugla'' kurali kaynakta tam degil'
kart_yazari: argon
dogrulanamaz:
  neden: ceviri
  ayrinti: 'U7 dakikalik sınıflaması: 10 pip Renko tuğlaları zaman bazlı bar değil; ''kırmızıdan yeşile dönüş + 2 yeşil tuğla'' kuralı kaynakta tam değil, pips stop motorda yok.'
