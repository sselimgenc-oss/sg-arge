belirsiz:
- Karar grafiği M1 verisinden üretilen 10 pip Renko (M2 çevrimdışı grafik, 1 saatin altında / bar-dışı)
- 'Özel kod mantığı: 10 pip Renko grafikte fiyat EMA(21) ve EMA(50) üzerindeyken tuğla rengi kırmızıdan yeşile dönüp 2 ardışık yeşil tuğla kapandığında (3. yeşil tuğla açılışında) Long açılır; SL dönüşteki
  son kırmızı tuğlanın düşüğü veya son anlamlı diptir; çıkış ters renkli (kırmızı) tuğla kapanışında veya 20-30 pip izsüren stop ile yapılır'
- 'short kuralı var: Fiyat EMA(21) ve EMA(50) altındayken yeşilden kırmızıya dönüp 2 ardışık kırmızı tuğla kapandığında short açılır'
- "ozel_kod_nedeni: renko (10 pip Renko tuglalari (zaman bazli bar degil))"
