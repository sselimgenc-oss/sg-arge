    n: 14
giris: (st_htf.dir == 1 or close_1d >= ema21h * 0.985) and rrs > 1.10 and ema8 > ema20 and close > ema8 and (close - low) / (high - low) > 0.60
cikis: rrs < -0.35 and close < ema10
iz_suren:
  tip: atr_zirve
  n: 14
  carpan: 2.2
kar_kilidi:
  tetik_atr: 1.4
  stop: giris * 1.002
rapor:
  pf: 1.87
  sharpe: 0.88
  getiri: +%166.9
  mdd: '%18.3'
  islem: 229.5
  wr: '%48.4'
