belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: OTT periyodu 2, yuzde 1.4, hareketli ortalama VAR (CMO 9). buySignalk = crossover(MAvg, OTT[2]); motor ott gostergesi OTT serisini zaten 2 bar kaydirilmis verir (ott.ott = OTT[2]). Short girisi (crossunder(MAvg, OTT[2])) acik long''u ters cevirir; cikis olarak yazildi.', Pine VAR ozyinelemesi sifirdan baslar; motor `var` ayni formulu kaynak fiyatiyla tohumlanarak kullanir (yakinsama sonrasi ayni; ilk yuz bar farkli olabilir). Script'in 20 sembollu tarayici/etiket kismi islem kuralina girmez., 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
