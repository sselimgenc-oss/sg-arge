id: TV-4NV68grw
ad: Micro-Trendline Momentum Breakout [ATR Optimized] (Anant)
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/4NV68grw/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar oil-carried-hurt; yayin sembolu OANDA:EURUSD; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: FX (OANDA:EURUSD)
kol: FX8-4H
yayin_sembolu: OANDA:EURUSD
gostergeler:
  hma_a: {f: wma, src: close, n: 10}
  hma_b: {f: wma, src: close, n: 20}
  hma_d: {f: seri, ifade: 2 * hma_a - hma_b}
  hma20: {f: wma, src: hma_d, n: 4}
  rsi14: {f: rsi, src: close, n: 14}
  atr14: {f: atr, n: 14}
  ph_ev: {f: seri, ifade: 'high[1] > high[0] and high[1] > high[2] and high[1] > high[3] and high[1] > high[4]'}
  ph1: {f: seri, ifade: 'valuewhen(ph_ev, high[1])'}
  ph2: {f: seri, ifade: 'valuewhen(ph_ev, ph1[1])'}
  gap: {f: seri, ifade: 'valuewhen(ph_ev, barssince(ph_ev)[1] + 1)'}
  res: {f: seri, ifade: ph1 + (ph1 - ph2) / gap * (barssince(ph_ev) + 1)}
ozel_kod: false
giris: cross_over(close, res) and close > hma20 and rsi14 < 70
cikis: null
stop: {tip: seviye, ifade: sinyal_close - 1.5 * sinyal_atr14}
hedef: {tip: seviye, ifade: sinyal_close + 3.0 * sinyal_atr14}
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [FX]
parametreler: {kol: FX8-4H}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: pivot gucu 3, R:R 2, ATR carpani 1,5, HMA(20) (= WMA(2 x WMA(close,10) - WMA(close,20), 4)), RSI(14) < 70. Direnc cizgisi son iki pivot tepesinden gecen dogrunun uzantisidir: ta.pivothigh(3, 1) = high[1], sol 3 ve sag 1 bardan SERT buyuk (esitlik pivot sayilmaz: varsayim); pivot ph[1] degeriyle bir bar sonra bilinir (ileriye bakma yok). Cizgi egimi (ph1 - ph2) / (iki pivot arasi bar sayisi). Stop = sinyal kapanisi - 1,5 x ATR, hedef = kapanis + 2 x risk (= 3 x ATR); seviyeler sinyal barinda sabitlenir. Short kosulu yoksayilir.', 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).', 'U7 Ek 1: kol FX-4H → FX8-4H eslendi (kural ve parametreler degismedi; yayin sembolu OANDA:EURUSD).']
deneme_sayisi_kaynakta: 205
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
