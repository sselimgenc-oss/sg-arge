id: TV-ANmKXWWJ
ad: ATR Breakout Trend Strategy
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/ANmKXWWJ/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar Harshal_choudhari; yayin sembolu DELTAIN:SOLUSD.P; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (DELTAIN:SOLUSD.P)
kol: KRIPTO-4H
yayin_sembolu: DELTAIN:SOLUSD.P
gostergeler:
  tr: {f: seri, ifade: 'max(high - low, max(abs(high - close[1]), abs(low - close[1])))'}
  atr20: {f: sma, src: tr, n: 20}
  hh20: {f: highest, src: high, n: 20, kaydir: 1}
  ll20: {f: lowest, src: low, n: 20, kaydir: 1}
  sma200: {f: sma, src: close, n: 200}
ozel_kod: false
giris: cross_over(close, hh20) and close > sma200
cikis: close < ll20
stop: {tip: seviye, ifade: sinyal_close - 2.0 * sinyal_atr20}
hedef: null
dolum: kapanis
stop_eklendi: false
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-4H}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: giris kanali 20, cikis kanali 20, trend SMA 200, ATR = SMA(TR, 20), ilk stop = 2 x ATR, izleyen stop kapali (trailingStopEnabled = false), short acik. process_orders_on_close = true: giris sinyal barinin KAPANISINDA dolar (dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir).', Short kirilimi (close < onceki 20 barin en dusuk low degerini asagi keser ve close < SMA(200)) acik long'u ters yonde strategy.entry ile kapatir; bu zaten 'close < ll20' kanal cikisinin icindedir (ikisi birlikte tek cikis ifadesi). Pine'da long cikisi yalniz long acik ve stop tanimliyken denetlenir; ayni., 'ta.tr(true): ilk barda high-low (handle_na); ATR = ta.sma(tr, 20), motorun Wilder ATR''si degil; kartta tr serisi elle kuruldu. Stop sinyal barinin kapanisindan ve ATR''sinden sabitlenir; strategy.exit giris emriyle ayni barda verildiginden stop dolum (sinyal kapanisi) sonrasi ilk bardan etkindir.', 'Yazarin boyut kodu (riskPercent, maxExposure, orderQty), slippage = 2 ve komisyon kullanilmaz.', 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).']
