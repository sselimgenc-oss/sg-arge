id: TV-70PkIvTL
ad: Vix FIX / StochRSI Strategy
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/70PkIvTL/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar timj; yayin sembolu NASDAQ:PEP; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD (NASDAQ:PEP)
kol: ABD-1D
yayin_sembolu: NASDAQ:PEP
gostergeler:
  hc: {f: highest, src: close, n: 22}
  wvf: {f: seri, ifade: (hc - low) / hc * 100}
  sd: {f: stdev, src: wvf, n: 20}
  mid: {f: sma, src: wvf, n: 20}
  upper: {f: seri, ifade: mid + 2.0 * sd}
  rh: {f: highest, src: wvf, n: 50}
  rangehigh: {f: seri, ifade: rh * 0.85}
  st: {f: stoch, k: 14, d: 3, smooth: 3}
ozel_kod: false
giris: ((low > low[1] and close > high[1]) and close > close[3] and (close < close[40] or close < close[14]) and (wvf[1] >= upper[1] or wvf[1] >= rangehigh[1]) and wvf < upper and wvf < rangehigh) or ((close > close[1] and close > open[1]) and close > close[3] and (close < close[40] or close < close[14]) and (wvf[1] >= upper[1] or wvf[1] >= rangehigh[1]) and (wvf >= upper or wvf >= rangehigh))
cikis: cross_over(st.k, st.d) and st.k > 80
stop: null
hedef: null
piramit: {en_cok: 8}
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [ABD]
parametreler: {kol: ABD-1D}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: Williams VIX Fix (22 bar), Bollinger (20, 2), aralik yuksegi = son 50 barin en yuksek wvf''i x 0,85, filtreli ve agresif giris acik, uzun donem 40 / orta donem 14 / guc 3 bar, stokastik (14, 3, 3) 80 ustunde K/D yukari kesisimi cikis. Iki giris sinyali ayni `Long` kimligiyle verilir; pyramiding = 9.', 'Pine pyramiding = N ayni yonde en fazla N giris demektir (N = 0 ve 1 tek giris); motor piramit.en_cok ek giris sayisidir (en_cok = N - 1). Her ek birim motorda kendi stop mesafesiyle ve normal islem basi risk kuraliyla boyutlanir, toplam acik risk sinirina dahildir; yazarin sabit miktar / sermaye yuzdesi kodu kullanilmaz. Cikis sinyali butun birimleri kapatir. Pine miktari sabit 1 sozlesmedir; motor risk kuralina gore boyutlar. Filtreli sinyalin `not (wvf < ust and wvf < aralik)` tamlayicisi (agresif) De Morgan ile `wvf >= ust or wvf >= aralik` yazildi. Stop/hedef yok; her birime ATR x 3 stop eklendi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
