belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: pd = 11, bbl = 10, mult = 5, lb = 25, ph = 0.99, pl = 1.01, length = 10, multFib = 0.618, tarih araligi 2020-01-01 .. 2025-01-01 (input.time varsayilanlari; aralik disinda sinyal yok). strategy() cagrisinda pyramiding verilmedigi icin 0: %10 dususte ek alim kosulu (pyramidCondition) Pine''da ek giris acmaz, kartta yok.', 'ta.percentile_linear_interpolation(wvf, int(ph * 100), lb) cagrisinda Pine imzasi (kaynak, uzunluk, yuzde) oldugundan yazar uzunluk = 99, yuzde = 25 vermis olur (niyet buyuk olasilikla yuzde 99 / uzunluk 25 idi). Kart yazarin KODUNUN yaptigini cevirir: rangeHigh = son 99 barin 25. yuzdeligi, yani wvf >= rangeHigh yaklasik %75 zaman dogrudur ve VIX Fix kosulu zayif bir filtredir. rangeLow (uzunluk 101) giriste kullanilmaz. Yuzdelik hesabi dogrusal ara deger (numpy tip 7) varsayildi; Pine''in sira tanimi dokumanda net degil.', 'Hedef: limit = strategy.position_avg_price x 1.05 (dolum fiyatinin %5''i); Pine strategy.exit bunu dolum barinin kapanisinda verir ve sonraki bardan etkindir. Motor hedefi dolum barindan etkin sayar (hedef yuzdesi dolum fiyatindan olculur).', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_imks0opw.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
