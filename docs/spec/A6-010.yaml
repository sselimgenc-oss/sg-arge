id: A6-010
ad: The Gap Momentum System
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://financial-hacker.com/the-gap-momentum-system/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD ETF (QQQ)
gostergeler:
  gap_up:
    f: "sma"
    src: "max(open - close[1], 0)"
    n: 40
  gap_dn:
    f: "sma"
    src: "max(close[1] - open, 0)"
    n: 40
  gap_oran:
    f: "seri"
    ifade: "100 * gap_up / (gap_dn + 0.000000000001)"
  signals:
    f: "sma"
    src: "gap_oran"
    n: 20
ozel_kod: false
giris: signals > signals[1]
cikis: signals < signals[1]
stop: null
hedef: null
stop_eklendi: false
parametreler:
  Period: 40
  SignalPeriod: 20
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: 12.0
  mdd: null
  islem: null
  wr: 56
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- Perry Kaufman'in (TASC 1/24) Gap Momentum Indicator (GAPM) sisteminin Petra Volkova tarafindan Zorro C koduyla QQQ (2011-2023) uzerinde uygulanmis halidir; yalniz long calisir, emirler sonraki acilista
  (Fill = 3) icra edilir.
- 'Adim adim GAPM(Period=40, SignalPeriod=20) hesaplamasi (ozel_kod: true): 1) Son Period = 40 bar boyunca (ix = 0..39) her barin acilis boslugu Gap(ix) = open[ix] - close[ix+1] hesaplanir. 2) Gap(ix) >
  0 olanlar UpGaps toplamina eklenir; Gap(ix) < 0 olanlarin mutlak degeri DnGaps toplamina eklenir (DnGaps -= Gap). 3) GapRatio = (DnGaps == 0 and 1) or (not (DnGaps == 0) and 100 * UpGaps / DnGaps). 4)
  Signals = SMA(GapRatio, SignalPeriod=20). 5) Long giris: rising(Signals) yani Signals[0] > Signals[1]. 6) Long cikis: falling(Signals) yani Signals[0] < Signals[1].'
- "T10: ozel_kod true -> false; GAPM = 100*UpGaps/DnGaps (toplam yerine SMA, oran ayni), Signals = SMA(GapRatio,20); rising/falling = Signals[0] vs Signals[1]. Zorro'daki DnGaps==0 -> 1 ozel durumu uygulanmadi (40 barda hic asagi bosluk olmasi gerceklesmez)."
