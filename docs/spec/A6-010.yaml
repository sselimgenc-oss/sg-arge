belirsiz:
- Perry Kaufman'in (TASC 1/24) Gap Momentum Indicator (GAPM) sisteminin Petra Volkova tarafindan Zorro C koduyla QQQ (2011-2023) uzerinde uygulanmis halidir; yalniz long calisir, emirler sonraki acilista
  (Fill = 3) icra edilir.
- 'Adim adim GAPM(Period=40, SignalPeriod=20) hesaplamasi (ozel_kod: true): 1) Son Period = 40 bar boyunca (ix = 0..39) her barin acilis boslugu Gap(ix) = open[ix] - close[ix+1] hesaplanir. 2) Gap(ix) >
  0 olanlar UpGaps toplamina eklenir; Gap(ix) < 0 olanlarin mutlak degeri DnGaps toplamina eklenir (DnGaps -= Gap). 3) GapRatio = (DnGaps == 0 and 1) or (not (DnGaps == 0) and 100 * UpGaps / DnGaps). 4)
  Signals = SMA(GapRatio, SignalPeriod=20). 5) Long giris: rising(Signals) yani Signals[0] > Signals[1]. 6) Long cikis: falling(Signals) yani Signals[0] < Signals[1].'
