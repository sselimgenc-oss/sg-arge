belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan input: buy=''Full Moon'' (long), sell=''New Moon'' (short). Referans yeni ay tarihi timestamp(''2021-01-13:05:00'') 2021-01-13 05:00 UTC varsayildi (1610514000000 ms); Pine''in tek argumanli timestamp(string) icin saat dilimi dokumanda UTC''dir ama bu girdinin '':'' bicimli yazimi dogrulanamadi. Sinodik ay 2551442876.8992 ms, `time` bar ACILIS zamani (ms).', 'process_orders_on_close=true: emirler sinyal barinin KAPANISINDA dolar (kartta dolum: kapanis; motor D4: maliyet 2x baz, ertesi acilis (b) varyanti de raporlanir). Short bacak yok; short sinyali (yeni ay) long''u kapatir.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_yvdyq0pv.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
