id: TV-HfxNiEab
ad: Hull Moving Average Cloud v2
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/HfxNiEab/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar SeaSide420; yayin sembolu BITFINEX:BTCUSD; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BITFINEX:BTCUSD)
kol: KRIPTO-4H
yayin_sembolu: BITFINEX:BTCUSD
gostergeler:
  price: {f: seri, ifade: (open + high + low + close) / 4}
  w105: {f: wma, src: ohlc4, n: 105}
  w210: {f: wma, src: ohlc4, n: 210}
  hdiff: {f: seri, ifade: 2 * w105 - w210}
  n1: {f: wma, src: hdiff, n: 14}
  n2: {f: seri, ifade: 'n1[1]'}
  hline: {f: seri, ifade: 'n1 - n1[1] / n2[1]'}
  hret: {f: seri, ifade: 'eger(n1 > n2, hline - 200, hline + 200)'}
  c1: {f: seri, ifade: 'hret * n1 / price[1]'}
  c2: {f: seri, ifade: 'hret * n2 / price[1]'}
ozel_kod: false
giris: price[1] > c2 and price[1] > c1
cikis: price < c2 or (price[1] < c1 and price[1] < c2)
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [KRIPTO]
parametreler: {kol: KRIPTO-4H}
cekirdek: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, TRXUSDT]
kardesler: [ADAUSDT, DOGEUSDT, LTCUSDT, LINKUSDT, DOTUSDT, AVAXUSDT, BCHUSDT, NEARUSDT]
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Hull periyodu 210, bulut genisligi 200, fiyat ohlc4; Hull_Line = n1 - n1[1]/n2[1] ve Hull_retracted = Hull_Line -/+ 200 (n1 > n2 ise eksi) yazarin formulu aynen (birimler karisik oldugu halde korunur). n2 = wma(diff(price[1])) = n1[1] (wma gecikme degismezdir), kartta n2 = n1[1].', 'Pine kodu: close BUY when price < c2; entry BUY when price[1] > c2 and price[1] > c1; short girisi (price[1] < c1 ve price[1] < c2) long''u ters cevirir (cikis ifadesinde). window() 2017-01-01''den itibaren acik (veri 2017-08''den basladigindan her zaman dogru).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
