tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: true
belirsiz:
- 'Çıkış kuralı giriş motoruna bağlı (durum bilgisi): ozel_kod, yorumlayıcıda ''giris_modu'' desteği gerekir'
- 1W_Bias formülü bu raporda tanımlı değil; Paper_Test_4 S1'deki tanım varsayıldı (1W EMA10>=EMA20 veya 1W kapanış>=EMA20*0.985, 1 bar gecikmeli)
  -> lider onayı
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 5,80); ölçüm/raporlama tavanı olabilir, PF'ye güvenilmez
- 'Üç stratejinin birleşimi: seçim yanlılığı/aşırı uyum riski yüksek'
- "T7 sozdizimi: cikis 'MOD_A: ...; MOD_B: ...' giris_modu calisma zamani degiskeniyle yazildi (A = dip avcisi, B = trend/kirilim); anlam ayni"
parametreler: {}
id: R07
ad: VOLTRAN-R1 swing hibrit (Qullamaggie + Z-skor + IBS dip avcısı)
kaynak:
  dosya: Reddit_ve_Quant_Stratejileri_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2.7
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: Voltran sentezi (R1+R2+R5)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  sma100:
    f: sma
    src: close
    n: 100
  hh10:
    f: highest
    src: high
    n: 10
    kaydir: 1
  hh15:
    f: highest
    src: high
    n: 15
    kaydir: 1
  range25:
    f: sma
    src: high - low
    n: 25
  ema65:
    f: ema
    src: close
    n: 65
  sd65:
    f: stdev
    src: close
    n: 65
  rvol20:
    f: rvol
    n: 20
  ema10:
    f: ema
    src: close
    n: 10
  ema20:
    f: ema
    src: close
    n: 20
  atr14:
    f: atr
    n: 14
giris: (ema10w >= ema20w or close_1w >= ema20w * 0.985) and ((close > sma100 * 0.95 and close < hh10 - 2.15 * range25 and (close - low) / (high
  - low) < 0.28) or ((close - ema65) / sd65 > 0.48 and ((close >= hh15 * 0.997 and rvol20 > 1.20) or ((close - low) / (high - low) > 0.65 and
  ema10 > ema20))))
cikis: "(giris_modu == \"A\" and close > high[1]) or (giris_modu == \"B\" and (close - ema65) / sd65 < -0.15)"
iz_suren:
  tip: atr_zirve
  n: 14
  carpan: 2.5
  sadece: MOD_B
kismi_kar:
  gun: 4
  tetik_atr: 1.2
  oran: 0.3
  kalan_stop: giris
  sadece: MOD_B
rapor:
  pf: 4.29
  sharpe: 1.54
  getiri: +%490.8
  mdd: '%16.6'
  islem: 45.2
  wr: '%61.7'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
bias_varsayim: true
