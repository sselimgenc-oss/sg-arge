belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilan input''lar: confirmOnClose=true (tarihsel barlarda her bar kapanisi), useTrendFilter=false, useSqueezeFilter=false, exitMode=''Middle Band'', useStop=false. Giris: close < alt Bollinger(20, 2) ve RSI(14) < 30. Cikis (long): close orta bandi yukari keser (ta.crossover(close, middleBand)).', 'Short girisi (close > ust bant ve RSI > 70) acik long''u ters cevirerek kapatir; cikis ifadesinde bu kosul da yer alir. Ta.bb standart sapmasi populasyon (ddof=0), motor bb varsayilani ayni.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
