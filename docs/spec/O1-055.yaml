belirsiz:
- 'Karar zaman dilimi kodda sabitlenmemiştir (gün içi 5m/15m grafik, varsayılan 5m alındı, tf_varsayim: true)'
- 'Kod ile açıklama çelişkisi: Açıklama metninde ''Modified version of MACD'' yazmasına karşın AmiBroker AFL kodunda hiçbir MACD hesaplaması yoktur; al/sat sinyalleri doğrudan ''Pivot Finder for Amibroker''
  bloğundaki 12 barlık tepe/dip pivotlarından (Buy = aLPivs == 1; Sell = aHPivs == 1;) üretilir'
- 'REPAINT: AFL kodundaki pivot döngüsü son bardan (curBar = BarCount - 1) geriye doğru çalışır ve HHVBars(H, 12) / LLVBars(L, 12) kullanarak pivot onaylandığında sinyali geçmişteki tepe/dip barına (curPivBarIdx
  = curBar - aLLVBars[curBar]) geriye dönük yazar; ayrıca Fibonacci seviyeleri için gelecek barları kullanan PeakBars(H, 0.325, 1) ve TroughBars(L, 0.325, 1) (ZigZag) fonksiyonları kullanılmıştır'
- 'Özel kod mantığı: nBars=12 periyotluk yerel dip pivotunda (aLPivs == 1) Buy, yerel tepe pivotunda (aHPivs == 1) Sell üretilir; yorum panosundaki genişletilmiş sürümde hedefler tar1 = +0.50%, tar2 = +0.92%,
  tar3 = +1.79% ve stop-loss slPrice = HighestSince(Buy, LLV(L, 40)) olarak tanımlanmıştır'
- 'short kuralı var: aHPivs == 1 (12 barlık tepe pivotu) oluştuğunda Sell / Short sinyali üretilir'
- "ozel_kod_nedeni: tanim_belirsiz ('aLPivs == 1' yerel pivot tanimi (cok barli onay mi, low == LLV(12) mi) kartta belirsiz; kodun genisletilmis surumu farkli hedefler kullaniyor)"
