belirsiz:
- 'Raporda 8 stratejinin 256''lık havuzdan seçildiği belirtiliyor: seçim yanlılığı (DSR''de N>=256)'
- Sonuçlar 1W->1D ve 4H/1D->1H iki kurguda raporlanmış; kartta ana kurgu 1W->1D, 1H varyantı 'varyantlar' altında
- 'Gerçek k-NN: komşu sayısı k, eğitim penceresi, etiketleme ufku (kaç bar sonraki getiri), özellik normalizasyonu raporda yok -> kritik kural
  eksik'
- 'Çıkış ''negatife döndüğünde veya nötrleştiğinde'': nötr eşiği tanımsız'
- V1B'deki 4 terimli formül bunun basitleştirilmesi; aynı strateji değil
- Yalnız günlük (1H aşırı işlem üretiyor)
