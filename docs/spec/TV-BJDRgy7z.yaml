kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/BJDRgy7z/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar ignaciodarias; yayin sembolu BINANCE:XRPUSDT; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: KRIPTO (BINANCE:XRPUSDT)
