yayin_sembolu: BINANCE:XRPUSDT
gostergeler:
  efast: {f: ema, src: close, n: 9}
  eslow: {f: ema, src: close, n: 21}
  rsi14: {f: rsi, src: close, n: 14}
  atr14: {f: atr, n: 14}
  m: {f: macd, fast: 12, slow: 26, signal: 9}
  raw: {f: seri, ifade: 'cross_over(efast, eslow) and rsi14 > 30 and rsi14 < 70 and m.macd > m.signal'}
  sig: {f: seri, ifade: 'eger(raw[1], 1, 0) > 0'}
  sraw: {f: seri, ifade: 'cross_under(efast, eslow) and rsi14 < 70 and rsi14 > 30 and m.macd < m.signal'}
  ssig: {f: seri, ifade: 'eger(sraw[1], 1, 0) > 0'}
ozel_kod: false
giris: sig
cikis: ssig
stop: {tip: seviye, ifade: sinyal_close - sinyal_atr14 * 1.0}
hedef: {tip: seviye, ifade: sinyal_close + sinyal_atr14 * 4.0}
dinamik_cikis: {stop: 'valuewhen(sig, close - atr14 * 1.0)', hedef: 'valuewhen(sig, close + atr14 * 4.0)'}
stop_eklendi: false
yalniz_long_bacak: true
