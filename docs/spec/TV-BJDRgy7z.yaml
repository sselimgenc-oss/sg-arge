belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 9/21 yukari kesisimi, RSI(14) 30-70 arasi, MACD(12, 26, 9) macd > sinyal, hacim ve EMA(200) filtreleri kapali (varsayilan), mum kapanis teyidi acik (sinyal bir bar gecikmeli: longRaw[1]), stop 1 x ATR, hedef 4 x ATR.', 'strategy.exit giris sinyalinde (sinyal gunu kapanis ve ATR''siyle) verilir; pozisyon acikken tekrarlanan long sinyali girisi yoksayilir ama acik pozisyonun stop/hedef emrini yeni sinyalin seviyeleriyle DEGISTIRIR: dinamik_cikis''te valuewhen(sig, seviye) ile ifade edilir (seviye yalnizca yeni sinyalde degisir). Short bacak yoksayilir; short sinyali long''u ters yonde kapatir (cikis olarak kalir): cikis kuralina eklendi.', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir (sinyal barinda da); ilk seviye sinyal barinin degerleriyle kartta stop/hedef ''seviye'' olarak sabitlenir ve dolumdan itibaren gecerlidir, sonra motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplayip ertesi bardan gecerli sayar (Pine ile ayni sira).']
