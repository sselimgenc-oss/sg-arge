belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 9/21, RSI(14) > 50, ATR(14), carpan 1,5 (hedef 2 x carpan = 3 x ATR). Short girisi yalniz pozisyon yokken acilir: yoksayilir. strategy.exit(stop = close - 1,5 x ATR, limit = close + 3 x ATR) her barda GUNCEL kapanis ve ATR ile yeniden verilir; ilk seviye sinyal barindan sabitlenir.', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir (sinyal barinda da); ilk seviye sinyal barinin degerleriyle kartta stop/hedef ''seviye'' olarak sabitlenir ve dolumdan itibaren gecerlidir, sonra motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplayip ertesi bardan gecerli sayar (Pine ile ayni sira).']
