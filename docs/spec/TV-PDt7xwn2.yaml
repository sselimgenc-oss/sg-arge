belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Kaynak fiyat open (price=open), Hull periyodu 50: n1 = wma(2*wma(open, round(50/2)=25) - wma(open, 50), round(sqrt(50))=7); candle_cross = 10. Giris: open > n1 ve open > open[10]. Short kosulu (open < n1 ve open < open[10]) acik long''u ters cevirir; cikis olarak yazildi.', 'Script calc_on_order_fills=true kullanir (emir dolumundan sonra ek hesaplama); emir doluslari yine sonraki acilista olur, kart bunu yok sayar.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
