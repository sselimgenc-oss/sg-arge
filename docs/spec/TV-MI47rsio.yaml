belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 20/50, en az 10 bar trend suresi, ATR(14), stop 1,5 x ATR, hedef 1,5 x ATR x RR 2 = 3 x ATR. Trend sayaci (bullBars) barssince(fast <= slow) ile ayni degeri verir. Short girisi (ayni kosulun tersi, 10 bar dusus) acik long''u ters yonde kapatir; long bacakta cikis olarak kalir. Dinamik stop/hedef GUNCEL ATR ile her barda yeniden kurulur.', 'U7 Ek 4: Pine strategy.exit her barda yeniden verilir; motor dinamik_cikis seviyesini her bar KAPANISINDA hesaplar ve ertesi bardan gecerli sayar (ayni sira). Dolum barinda Pine''da (pozisyon sonrasi verilen) seviye yoktur; motorda ilk dinamik seviyeye kadar baslangic koruma stopu (ATR14 x 3, stop_eklendi: true; boyutlandirma da buna dayanir) gecerlidir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
