belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Trend Pulse Channel: 4 kutuplu kaskad EMA, alpha = 0,09542 (beta = (1 - cos(2 pi / 144)) / (1,414^(2/4) - 1)), EMA uzunlugu max(1, int(round(2 / alpha))) = 21 (bu kodda math.round). Varsayilan Reduced Lag ve Fast Response kapali; kaynak hlc3, bant = filtre + 1,414 x filtrelenmis TR. Baslangic 2018-01-01 (test donemi ile ayni, kartta ayri tarih kosulu yok).', 'Giris kapanisin ust bandi yukari kesmesi, cikis ayni bandi asagi kesmesidir (strategy.close). Stop/hedef yok; ATR x 3 stop eklendi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
