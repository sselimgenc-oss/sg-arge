id: A3-011e
ad: 'pandianmn fork: Strategy005 (resmi depo kodu)'
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://github.com/pandianmn/freqtrade-strategies
  sayfa: A3-011
tarz: day
tf: 5m
mtf: null
tf_varsayim: false
yazar_piyasasi: Kripto
gostergeler:
  vol_sma70:
    f: sma
    src: volume
    n: 70
  rsi14:
    f: rsi
    src: close
    n: 14
  sma40:
    f: sma
    src: close
    n: 40
  macd:
    f: macd
    fast: 12
    slow: 26
    signal: 9
  dmi14:
    f: dmi
    n: 14
  fisher:
    f: fisher_rsi
    n: 14
  fisher_norma:
    f: seri
    ifade: 50 * (fisher + 1)
  fast:
    f: stoch
    k: 5
    d: 3
    smooth: 1
giris: volume > vol_sma70 * 4 and close < sma40 and fast.d > fast.k and rsi14 > 30 and fast.d > 30 and fisher_norma < 30
cikis: cross_over(rsi14, 70) and macd.macd < 0 and dmi14.minus > 50
stop:
  tip: yuzde
  deger: 10
hedef: null
stop_eklendi: false
parametreler: {}
deneme_sayisi_kaynakta: null
rapor:
  pf: null
  sharpe: null
  getiri: ort. kâr %1.16
  mdd: '-'
  islem: 180
  wr: null
  maliyet_dahil: belirtilmemiş
spec_durumu: tam
ozel_kod: false
belirsiz:
- Fisher RSI normalize (50*(fisher+1)) ve STOCHF listede yok
- Parametreler optimize edilebilir (IntParameter); varsayılanlar alındı
- Çıkış tetikleyicisi varsayılan 'rsi-macd-minusdi'
- 'Kaynak: https://raw.githubusercontent.com/freqtrade/freqtrade-strategies/main/user_data/strategies/Strategy005.py'
- '1H altı zaman dilimi: yalnız kripto (Binance) testine gider, BIST/ABD/emtia için Doğrulanamaz'
- 'T8: ozel_kod true -> false (fisher_rsi eklendi (A3-010c ile ortak); fisher_rsi_norma = 50*(fisher+1) seri olarak yazildi; dmi14.minus TA-Lib MINUS_DI ile 1e-13 uyumlu; 5m kart yalniz kripto testine gider); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi'
- 'U7 dakikalik: yazar piyasasi ''Kripto''; kural ve parametreler degistirilmeden KRIPTO25 kolunda, kartin kendi tf''inde (5m) Binance verisiyle kosulur. Kartta seans saatine bagli kural yok.'
