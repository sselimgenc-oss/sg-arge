- 'Composer Atlas ve Composer.trade dokümantasyonundan kurgu mantığı okundu (yazar: Simon97)'
- 'Özel kod mantığı: 3 katmanlı RSI(10) tahsisat algoritması; dış katmanda 11 piyasa enstrümanının RSI(10) uç değerleri taranır, aşırı uç yoksa Teknoloji (TQQQ/TECL) ile KMLM (Managed Futures Trend ETF)
  göreceli gücüne göre risk-on büyüme veya defansif (KMLM / SQQQ / TLT) moduna geçilir'
- "T22: kural agaci Composer acik uc noktasindan (https://stagehand-api.composer.trade/api/v1/public/symphonies/syMn9OgFREE0wo8LtYsG/score) okundu ve rotasyon.agac olarak birebir cevrildi (esik, pencere ve varlik listesi kaynaktan; RSI Wilder, SMA/RSI gunluk kapanis uzerinden). Agac her bar degerlendirilir; hedef agirlik degisince emir verilir (EVRENSEL_KURALLAR D12). Kaldirac yok; kaldiracli ETF (TQQQ, UVXY vb.) enstruman sayilir. Composer sembolleri kapanista dolar (kendi backtest serisiyle gunluk getiri korelasyonu 1,0000 dogrulandi): D4 geregi dolum: kapanis; iki sekilde raporlanir (kapanis dolumu 2x maliyet | ertesi acilis)."
