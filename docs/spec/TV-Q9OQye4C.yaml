belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: Hull Variation = Hma, uzunluk 55, kaynak close, Strategy Direction = long (strategy.risk.allow_entry_in long: short girisleri engellenir), test donemi 2016-01-01 .. 2030-12-30 (veri bu pencerede basladigindan etkisiz). HMA(55) = wma(2 x wma(close, 27) - wma(close, 55), round(sqrt(55)) = 7); n / 2 tam sayiya kesilir.', 'pyramiding = 1: ayni yonde en fazla 1 giris, kod her barda `buy` girisi verse de ek birim acilmaz; kart piramit icermez. Okuma Pine dokumanina dayanir (pyramiding = N en fazla N giris; N = 0 ve 1 tek giris); aksi halde ikinci bir birim eklenirdi ve yalniz miktari etkilerdi, yon ve cikis sinyali ayni kalir. Short sinyali (HULL[0] < HULL[2]) long''u kapatan cikis olarak yazildi. Stop/hedef yok; ATR x 3 stop eklendi.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
