belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'ZigZag: ta.pivothigh(high, 5, 1) / ta.pivotlow(low, 5, 1) ile (esit-deger kurali dogrulanamadi, sert esitsizlik varsayildi) zx/zy dizilerine (en yeni basta, en fazla 8) eklenir; ayni yonde daha uc bir pivot sonuncuyu gunceller. Pivot dizisi pozisyondan bagimsizdir; pozisyon kapisi (position_size == 0) motordadir. Yalniz long sinyalleri (sigDir == 1) verilir; short sinyalleri islem acmaz (ters cevirme yok).', 'Stop/hedef seviyeleri sinyal barinda sabitlenir (strategy.exit giris emriyle ayni barda verilir, dolum barindan etkin; motorla ayni). Zaman stopu: Pine entryBar = dolum bari, bar_index - entryBar >= 100 kosulu dolum + 100. barin kapanisinda saglanir ve cikis bir sonraki acilistadir; motor zaman_stop semantigiyle (bars_held >= N, dolum bari 1) bu N = 101''dir.', 'Pine odul/risk ve miktar hesaplari (calcQty, riskPct, maxNotional) yazarin boyut kodudur ve kullanilmaz; minRR = 1 kosulu (sinyal kapanisina gore) kuralin parcasi olarak korunur.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_rvbgd3ap.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
