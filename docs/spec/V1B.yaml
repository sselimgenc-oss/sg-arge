tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: 3
ozel_kod: true
belirsiz:
- v1->v3 üç iterasyonla hedefe ulaşana dek geliştirilmiş (deneme_sayisi_kaynakta=3, DSR'de sayılmalı)
- 'Pozisyon boyutu ADX''e bağlı (1.15x/0.95x): EVRENSEL_KURALLAR A6 gereği yok sayılır'
- '''Lorentzian ML skoru'' gerçek k-NN değil, 4 terimli sabit formül: ml_skor = (rsi14-45)/20 + (close>ema34?0.9:-0.9) + (+DI>-DI?0.6:-0.6) +
  (ema13>ema34?0.5:-0.5): koşullu terimler dil dışı -> ozel_kod'
- 1W trend 'ana trend yönü Boğa' formülü tanımsız (weekly_trend)
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 5,80); ölçüm/raporlama tavanı olabilir, PF'ye güvenilmez
parametreler: {}
id: V1B
ad: VOLTRAN-1B SMC + ML geri çekilme motoru (v3)
kaynak:
  dosya: Voltran_4_Super_Strateji_Mimari_ve_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: Voltran sentezi (iç üretim)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  ema34:
    f: ema
    src: close
    n: 34
  ema21:
    f: ema
    src: close
    n: 21
  ema13:
    f: ema
    src: close
    n: 13
  rsi14:
    f: rsi
    src: close
    n: 14
  dmi14:
    f: dmi
    n: 14
  atr14:
    f: atr
    n: 14
giris: weekly_trend == 1 and close > ema34 and ((low > high[2] * 0.990) or (low <= ema21 * 1.02 and close > ema21 and close > open)) and ml_skor
  >= 1.10 and rsi14 >= 46
cikis: (ml_skor <= -0.7 and close < ema34 * 0.985)
rapor:
  pf: 3.6
  sharpe: 1.55
  getiri: +%468.9
  mdd: '%23.7'
  islem: 37
  wr: '%52.3'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
iz_suren:
  tip: atr_kapanis_zirve
  n: 14
  carpan: 3.0
kar_kilidi:
  tetik_atr: 1.05
  stop: giris * 1.005
bias_varsayim: true
