id: A2-011
ad: APEX VELOCITY
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.mql5.com/en/code/78275
  sayfa: null
tarz: day
tf: 5m
mtf: 1h
tf_varsayim: false
yazar_piyasasi: Emtia (XAUUSD)
gostergeler:
  atr_m5:
    f: atr
    n: 14
  ma10:
    f: sma
    src: close
    n: 10
  ma50:
    f: sma
    src: close
    n: 50
  rsi14:
    f: rsi
    src: close
    n: 14
  vol_sma:
    f: sma
    src: volume
    n: 20
  htf_ma50:
    f: sma
    src: close
    n: 50
giris: close > high[1] and close > open and close > ma50 and rsi14 < 70 and mtf(1h, close > htf_ma50)
cikis: null
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
parametreler:
  ma_fast.n: 10
  ma_slow.n: 50
  htf_ma.n: 50
  rsi_buy_max: 70.0
  rsi_sell_min: 30.0
deneme_sayisi_kaynakta: null
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: eksik
belirsiz:
- Karar zaman dilimi M5 (1 saatin altında), üst zaman dilimi onayı H1 MA(50)
- 'Özel kod mantığı (GetVolumeAccelerationSignal): (1) tick_volume >= önceki InpVolumePeriod barın ortalama hacmi * InpAggrVolumeThreshold, (2) abs(close - open) / (high - low) >= InpMinBodyPercent, (3)
  (high - low) >= atr * InpMinVolatilityATR, (4) close > ma50 ve rsi < 70, (5) close > high[1] + atr * InpBreakoutBufferATR ve close > open, (6) H1 close > H1 ma50 ve Londra/NY seans filtresi'
- InpVolumePeriod, InpAggrVolumeThreshold, InpMinBodyPercent, InpMinVolatilityATR, InpBreakoutBufferATR ve ATR SL/TP çarpanlarının varsayılan sayısal değerleri açıklama metnindeki kod kesitinde yer almayıp
  .mq5 dosyasının başlık kısmındadır
- 'short kuralı var: close < low[1] - atr * InpBreakoutBufferATR and close < open and close < ma50 and rsi > 30 and mtf(1h, close < htf_ma50) olduğunda short açılır'
- 'lider: varsayilan parametreler .mq5 icinde, okunmadi'
kart_yazari: argon
