id: A2-011
ad: APEX VELOCITY
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.mql5.com/en/code/78275
  sayfa: null
tarz: day
tf: 5m
mtf: 1H
tf_varsayim: false
yazar_piyasasi: Emtia (XAUUSD)
gostergeler:
  atr14:
    f: atr
    n: 14
  ma10:
    f: sma
    src: close
    n: 10
  ma50:
    f: sma
    src: close
    n: 50
  rsi14:
    f: rsi
    src: close
    n: 14
  ma50_1h:
    f: sma
    src: close
    n: 50
    tf: 1H
giris: volume >= avg_vol * 1.5 and (body / range) >= 0.5 and range >= atr14 * 1.0 and close > ma50 and rsi14 < 70.0 and close > high[1] + atr14 * 0.2 and close > open and mtf("1H", close > ma50_1h)
cikis: null
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
ozel_kod_nedeni: tanim_belirsiz
parametreler:
  InpVolumePeriod: 20
  InpAggrVolumeThreshold: 1.5
  InpMinBodyPercent: 0.5
  InpMinVolatilityATR: 1.0
  InpBreakoutBufferATR: 0.2
  FastMA: 10
  SlowMA: 50
  HTF_MA: 50
  RSI_Period: 14
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: dakikalik
belirsiz:
- Karar zaman dilimi M5 (1 saatin altında); üst zaman dilimi H1
- 'MQL5 CodeBase sayfasında paylaşılan tam C++ kaynak kodundan (GetVolumeAccelerationSignal ve ConfirmHigherTF fonksiyonları) kurallar birebir çıkarıldı: (1) Anlık hacim 20 barlık ortalama hacmin 1.5 katı
  veya üstünde olmalı, (2) Mum gövdesi toplam aralığın en az %50''si olmalı (body/range >= 0.5), (3) Mum aralığı ATR(14)''ün 1.0 katından büyük olmalı, (4) Kapanış MA(50)''nin üzerinde ve RSI(14) < 70 olmalı,
  (5) Kapanış önceki mumun en yükseğini ATR(14)*0.2 tampon ile yukarı kırmalı (bullish breakout), (6) H1 üst zaman diliminde kapanış MA(50) üzerinde olmalı'
- Çıkışlar ATR çarpanlı dinamik başabaş (break-even), ATR iz süren stop ve maksimum hesap düşüş koruma kesicisi ile yönetilir
- 'short kuralı var: Hacim, gövde ve volatilite şartları sağlandığında close < ma50, rsi > 30, close < low[1] - atr*0.2 ve H1 close < ma50 şartlarıyla short açılır'
- "ozel_kod_nedeni: tanim_belirsiz (cikis: ATR carpanli dinamik basabas, ATR iz suren ve maks. hesap dususu kesicisi kartta sayisal degerlerle yok; avg_vol penceresinin cari bari icerip icermedigi belirsiz)"
- "T21: kaynak erisilemedi (https://www.mql5.com/en/code/78275) -> Argon T19. cikis kurallari (ATR carpanli basabas, iz suren, maks. hesap dususu) sayisal degerleriyle kartta yok"
