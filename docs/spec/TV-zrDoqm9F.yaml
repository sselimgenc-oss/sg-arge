belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: maType=''EMA'' (20/50), useAtrStop=true, ATR(14) x 1.5 stop, R:R = 2 (hedef = 3 x ATR), process_orders_on_close=true. Giris, sinyal barinin KAPANISINDA dolar (kartta dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir). Stop = sinyal kapanisi - 1.5 x ATR, hedef = sinyal kapanisi + 3 x ATR (strategy.exit giris emriyle ayni barda).', Short kesisimi (crossunder) acik long'u ters cevirir (cikis ifadesi). Webhook mesaj kodlari ve pip hesaplari islem kuralina girmez., 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).']
