belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: orderType=''Longs+Shorts'' (long bacak alinir), SMA 7/20, Supertrend faktoru 3, ATR periyodu 3, ''daily'' zaman dilimi (grafik de 1D). Pine''daki f_supertrend (Kivanc Ozbilgic) ta.supertrend ile ayni bant mantigidir; motor supertrend(n=3, carpan=3) kullanildi (esitlik anlari disinda ayni).', 'st_tsl_TF = security(ticker, ''D'', st_tsl[1], lookahead=true) 1D grafikte st_tsl[1] (bir onceki barin cizgisi) demektir; kartta st.line[1]. Bu [1] + lookahead_on kalibi geleceği kullanmaz.', 'cross_buy = (curr < 0), curr = barssince(long_exit) cikarilarak barssince(short_exit): son SMA kesisiminin yukari (crossover) olmasidir; kartta barssince(cross_over) < barssince(cross_under). Iki kesisim de olusmadan NaN (kosul yanlis), Pine ile ayni. Cikis: long_exit = crossunder(sma_fast, sma_slow); ters (bear) giris zaten bu kesisimden sonra olusabilecegi icin long''u ayrica kapatmaz.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
