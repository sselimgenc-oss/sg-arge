belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'PresentTrend ozyinelemeli: ATR = SMA(ta.tr, 14) (ilk barin tr''si na), esikler low - ATR*1.618 ve high + ATR*1.618; MFI(hlc3, 14) >= 50 ise max-benzeri takip (upperThreshold < PT[1] ise PT[1]), degilse lowerThreshold > PT[1] ise PT[1]; nz(PT[1]) ilk degerde 0. indicatorChoice=false (MFI).', 'trendDirection (var, ilk 0): longSignal ve previousBuy > barsSinceSell ise 1, shortSignal ve previousSell > barsSinceBuy ise -1, aksi halde onceki deger. barssince NaN iken karsilastirma yanlis (Pine na semantigi): ilk alim/satim sinyalleri yonu belirlemez.', 'tradeDirection=''Both'' varsayilani: long girisi trendDirection == 1 iken her barda tekrarlanir (motor pozisyondayken yok sayar), short girisi (== -1) long''u ters cevirir; cikis = trendDirection == -1.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_tipnjpu8.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
