id: P3-007
ad: Heikin Ashi Supertrend
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.tradingview.com/script/9z16eauD-Heikin-Ashi-Supertrend/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: true
yazar_piyasasi: Kripto / Forex / Endeks
gostergeler:
  st_ha:
    f: supertrend
    n: 10
    carpan: 3.0
    ha: true
  ha:
    f: "heikinashi"
giris: cross_over(ha.close, st_ha.line)
cikis: cross_under(ha.close, st_ha.line)
stop: null
hedef: null
stop_eklendi: false
ozel_kod: false
parametreler:
  Periods: 10
  Multiplier: 3.0
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: tam
belirsiz:
- Scribd aynasından (https://www.scribd.com/document/948242736/ABO-LANA) ve TradingView topluluk kodlarından okundu
- 'Özel kod mantığı: Supertrend hesaplaması Heikin Ashi mumlarının (ha_close, ha_high, ha_low) sentetik serileri üzerinden yapılır; ha_close Supertrend çizgisini yukarı kestiğinde Long girilir, aşağı kestiğinde
  çıkılır / ters yöne dönülür'
- 'short kuralı var: cross_under(ha_close, st_ha) olduğunda short açılır'
- "T8: ozel_kod true -> false (heikinashi kutuphaneye eklendi; Supertrend `ha: true` ile Heikin Ashi mumlari uzerinde hesaplanir; 'ha_close' -> 'ha.close'. Not: onceki gostergeler'deki st_ha normal OHLC uzerindeydi, kartin metnine uygun olarak HA uzerine alindi); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi"
