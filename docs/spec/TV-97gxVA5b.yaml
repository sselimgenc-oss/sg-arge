belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: bbLen 20, bbMult 2, rankLen 126, sqzPct 25, sqzAge 5, brkLen 20, smaLen 200, atrLen 22, ilk stop 2 x ATR, Chandelier 3 x ATR, tarih 2005-01-01 .. 2099-01-01. process_orders_on_close = true: giris ve cikis sinyal barinin KAPANISINDA dolar (dolum: kapanis; maliyet 2x baz, ertesi acilis (b) varyanti da raporlanir).', 'Cikis pozisyon durumuna baglidir (giris kapanisindan sabit ilk stop ve giris sonrasi en yuksek kapanis); motorda `exit_builder` ile giris barindan sonraki barlarda Pine ile ayni sirada izlenir. Giris barinda inPos henuz yoktur (emir kapanista dolar), izleme sonraki bardan baslar. Pine cikisi kapanis < stopLvl kosuludur, bir stop emri degildir (ara bar fitili cikarmaz).', 'Yazarin cikisi kapanis sinyali oldugundan ara-bar stopu yoktur: motorun ara-bar stopu olarak ATR(14) x 3 koruma stopu eklendi (A7, stop_eklendi: true). Bu stop Pine''da yoktur; ara bar fitilinde giris kapanisinin 3 ATR altina inen long''u motor kapatir, Pine kapatmaz.', 'ta.percentrank(bbW, 126): onceki 126 degerin (guncel bar haric) guncele esit ya da kucuk olanlarinin yuzdesi varsayildi. ta.atr = RMA(TR, 22). Yazarin boyut kodu (riskPct, qty) ve slippage = 1 kullanilmaz.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_97gxva5b.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
