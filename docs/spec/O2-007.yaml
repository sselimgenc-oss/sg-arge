id: O2-007
ad: Another simple system - Time-Frame 15
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.forexfactory.com/thread/345586-another-simple-system-time-frame-15
  sayfa: null
tarz: day
tf: 15m
mtf: 4h
tf_varsayim: false
yazar_piyasasi: Forex
gostergeler:
  ema10:
    f: ema
    src: close
    n: 10
  ema200:
    f: ema
    src: close
    n: 200
  ema800:
    f: ema
    src: close
    n: 800
  tdi_rsi:
    f: rsi
    src: close
    n: 13
giris: close > ema200 and close > ema800 and cross_over(ema10, ema200) and tdi_green > tdi_red
cikis: cross_under(ema10, ema200)
stop:
  tip: pips
  deger: 50
hedef:
  tip: pips
  deger: 50
stop_eklendi: false
ozel_kod: true
piyasa_kisiti: [FX]
ozel_kod_nedeni: seans_saat
parametreler:
  fast_ema: 10
  trend_ema: 200
  htf_ema: 800
  StopLossPips: 50
  TakeProfitPips: 50
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: dakikalik
belirsiz:
- Karar zaman dilimi M15 (1 saatin altında)
- 'ForexFactory konusu Post #1 (loveevery1) ve topluluk kılavuzundan okundu: 15 dakikalık grafikte 10 EMA, 200 EMA (günlük 50 EMA dengi) ve 800 EMA (4 saatlik 50 EMA dengi) kullanılır; fiyat 200 ve 800
  EMA üzerindeyken 10 EMA''nın 200 EMA''dan sıçraması / yukarı kesmesi ve TDI yeşil çizgisinin kırmızıyı yukarı kesmesiyle Long girilir; sabit 50 pip kar hedefi ve 50 pip stop-loss uygulanır'
- 'short kuralı var: Fiyat 200 ve 800 EMA altında iken 10 EMA aşağı kesişimi ve TDI teyidi ile 50 pip TP / 50 pip SL ile short açılır'
- "ozel_kod_nedeni: seans_saat (Londra acilisi sonrasi pencere, TDI cizgi parametreleri kartta yok, 50 pip stop/hedef)"
- "piyasa_kisiti: ['FX'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
