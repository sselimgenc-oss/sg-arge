belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Faz: k = (yilin gunu / 364,25 + yil - 1900) x 12,3685; k''nin kesri < 0,5 ise k = floor(k), faz +1 (yeni ay), degilse floor(k) + 0,5, faz -1 (dolunay). Donum zamani getUNIXTimeFromJD ile hesaplanir; time_close >= donum zamani ise bir onceki barin degeri kullanilir. Faz, donum zamani degistiginde guncellenir; faz degistigi barda moonType olusur. Girdi yok: kural takvimle ve bar kapanis zamaniyla belirlenir.', 'getUNIXTimeFromJD saat ve dakikayi float bolmeyle hesaplar (hour = saniye / 3600 float, minute = (saniye - hour x 3600) / 60 = 0); timestamp() bunlari tam sayiya keser: saat tam saate yuvarlanir, dakika 0, saniye = saniye % 60. Kart Pine''in bu davranisini aynen izler (donum zamani en cok bir saat sapar; 4H bar sinirini kaydirabilir). Float -> int kesmesi Pine dokumaninda net degildir.', 'Pine short sinyali (-1) long''u kapatip short acar; short ticarete verilmez, yalniz cikis olarak kalir. Stop/hedef yok; ATR x 3 stop eklendi.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_qa8ac0vs.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
