belirsiz:
- Algo Kütüphanesi sayfasından Matriks formülü eksiksiz okundu
- 'Kaynak formüldeki opt1, opt2, opt3, opt4, opt5, opt6 parametreleri yazar tarafından optimizasyon değişkeni olarak bırakılmış, sabit varsayılan sayısal değerler verilmemiştir; lider kuralına göre (''parametre
  eksikse ... eksik'') spec_durumu: eksik olarak sınıflandırıldı'
- 'Matriks AL Kodu: if(MOV(C,opt1,VAR)>OTT(C,opt1,7), MOV(C,opt1,VAR)>OTT(C,opt1,opt2)*(1+opt3) AND STOSK(opt4,opt5,33,VAR)+1000>OTT(STOSK(opt4,opt5,33,VAR)+1000,2,opt6) AND H>OTT(HHV(H,20/2),2,0.5) AND
  H>REF(HHV(H,20),-1), MOV(C,opt1,VAR)>(OTT(C,opt1,3)+REF(OTT(C,opt1,3)-(OTT(C,opt1,7)-OTT(C,opt1,3)),-100))/2 AND MOV(C,opt1,VAR)>OTT(C,opt1,opt2)*(1+opt3) AND STOSK(opt4,opt5,33,VAR)+1000>OTT(STOSK(opt4,opt5,33,VAR)+1000,2,opt6)
  AND H>OTT(HHV(H,20/2),2,0.5) AND H>REF(HHV(H,20),-1)) AND ((HOUR()=10 AND MINUTE()>=03) OR HOUR()>=11) AND ((HOUR()=17 AND MINUTE()<=58) OR HOUR()<=16)'
- 'Matriks SAT Kodu: if(MOV(C,opt1,VAR)>OTT(C,opt1,7), MOV(C,opt1,VAR)<OTT(C,opt1,opt2)*(1-opt3) AND STOSK(opt4,opt5,33,VAR)+1000<OTT(STOSK(opt4,opt5,33,VAR)+1000,2,opt6) AND L<OTT(LLV(L,20/2),2,0.5) AND
  L<REF(LLV(L,20),-1), MOV(C,opt1,VAR)<OTT(C,opt1,opt2)*(1-opt3) AND STOSK(opt4,opt5,33,VAR)+1000<OTT(STOSK(opt4,opt5,33,VAR)+1000,2,opt6) AND L<OTT(LLV(L,20/2),2,0.5) AND L<REF(LLV(L,20),-1)) AND ((HOUR()=10
  AND MINUTE()>=03) OR HOUR()>=11) AND ((HOUR()=17 AND MINUTE()<=58) OR HOUR()<=16)'
- 'short kuralı var: Sayfada açığa satış için MOV(C,opt1,VAR)<OTT(C,opt1,7) koşulu ile başlayan simetrik açığa satış ve açık pozisyon kapatma formülleri verilmiştir'
