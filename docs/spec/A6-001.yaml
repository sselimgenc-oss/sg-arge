id: A6-001
ad: Double 7's Strategy
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://alvarezquanttrading.com/blog/double-7s-strategy/
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD ETF ve Hisse (SPY, QQQ, SPX, NDX)
gostergeler:
  sma200:
    f: sma
    src: close
    n: 200
  llv7:
    f: lowest
    src: close
    n: 7
  hhv7:
    f: highest
    src: close
    n: 7
ozel_kod: false
giris: close > sma200 and close <= llv7
cikis: close >= hhv7
stop: null
hedef: null
stop_eklendi: false
parametreler:
  sma200.n: 200
  llv7.n: 7
  hhv7.n: 7
deneme_sayisi_kaynakta: 2
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
varyantlar:
- ad: Metot 2 (Onceki 6 Gunun En Dusugunun Altinda Kapanis)
  giris: close > sma200 and close < llv6[1]
  cikis: close > hhv6[1]
  not: 'AmiBroker kodu: Close < Ref(LLV(Close, 6), -1).'
- ad: SPX / NDX Hisse Portfoy Kurallari
  not: Hisse SPX veya NDX uyesi olmali, Endeks Kapanis > Endeks SMA(200), Hisse Kapanis > SMA(200), Close <= LLV(Close, 7), maksimum 10 pozisyon (%10 esit agirlik).
spec_durumu: tam
belirsiz:
- Larry Connors ve Cesar Alvarez'in 'Short Term Trading Strategies that Work' (2008) kitabindaki kurallardir; Alvarez bu yazida emirleri kapanis yerine sonraki gun acilisinda (A1 ile uyumlu) calistirmistir;
  stop-loss yoktur.
- "T10: ozel_kod alani eklendi (false); kural oldugu gibi ifade dilinde"
