kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/gf21APTn/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar SeaSide420; yayin sembolu FX:USDJPY; yayin araligi 4H. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 4H
mtf: null
tf_varsayim: false
yazar_piyasasi: FX (FX:USDJPY)
kol: FX8-4H
yayin_sembolu: FX:USDJPY
gostergeler:
  pc: {f: seri, ifade: 'open - open[1]'}
  apc: {f: seri, ifade: 'abs(open - open[1])'}
  a1h: {f: wma, src: pc, n: 25}
  a1f: {f: wma, src: pc, n: 50}
  a1d: {f: seri, ifade: 2 * a1h - a1f}
  a1o: {f: wma, src: a1d, n: 7}
  a2h: {f: wma, src: a1o, n: 25}
  a2f: {f: wma, src: a1o, n: 50}
  a2d: {f: seri, ifade: 2 * a2h - a2f}
  num: {f: wma, src: a2d, n: 7}
  b1h: {f: wma, src: apc, n: 25}
  b1f: {f: wma, src: apc, n: 50}
  b1d: {f: seri, ifade: 2 * b1h - b1f}
  b1o: {f: wma, src: b1d, n: 7}
  b2h: {f: wma, src: b1o, n: 25}
  b2f: {f: wma, src: b1o, n: 50}
  b2d: {f: seri, ifade: 2 * b2h - b2f}
  den: {f: wma, src: b2d, n: 7}
  tsi: {f: seri, ifade: 100 * num / den * 5}
  c1h: {f: wma, src: tsi, n: 3}
  c1f: {f: wma, src: tsi, n: 7}
  c1d: {f: seri, ifade: 2 * c1h - c1f}
  tl0: {f: wma, src: c1d, n: 3}
  tl: {f: seri, ifade: tl0 * 5}
ozel_kod: false
giris: tl > tl[1] and open > open[1]
cikis: tl < tl[1] and open < open[1]
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
