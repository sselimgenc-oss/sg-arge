parametreler: {kol: FX8-4H}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: TSI uzun 50, kisa 50, sinyal 7, kaynak open. Pine v4 hma(x, n) = wma(2 x wma(x, n/2) - wma(x, n), round(sqrt(n))); n/2 tam sayiya kesilir (7/2 -> 3; tv_ortak.hma ile ayni varsayim). tsi_value = 100 x HMA(HMA(degisim)) / HMA(HMA(|degisim|)) x 5, cizgi = HMA(tsi, 7) x 5. Short girisi (cizgi dususu ve open dususu) acik long''u ters yonde kapatir; long bacakta cikis olarak kalir.', 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).', 'U7 Ek 1: kol FX-4H → FX8-4H eslendi (kural ve parametreler degismedi; yayin sembolu FX:USDJPY).']
deneme_sayisi_kaynakta: 205
