- Algo Kütüphanesi MatriksIq C# kodundan tüm bölge parametreleri ve kuralları eksiksiz okundu; sadece LONG işlem yapmaktadır
- 'Özel kod mantığı: MajorTrend = MOV(C, 15, VAR) > OTT(C, 15, 7.0). Major trend boğa iken 1. Bölge (TOTT 25/0.6, SOTT 300/150, HHV(8) OTT ve H > HHV(16)[1]) ile Long açılır. Fırsatçı Trend aktifken 2.
  Bölge koşullarıyla Long açılır. Long kapama 3. ve 4. bölge LLV(46) koşullarıyla yapılır'
- "T7 sozdizimi: ternary (c ? a : b) '(c and a) or (not c and b)' bicimine cevrildi; anlam ayni"
- "ozel_kod_nedeni: tanim_belirsiz (TOTT/SOTT/HHV-OTT bolge kosullari kartta tanimli degil)"
- "piyasa_kisiti: ['BIST'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
