- "T7 sozdizimi: 'down_fractal(n=2)' -> ad 'down_fractal2' (Williams fraktal, n=2; ozel gosterge)"
- "ozel_kod_nedeni: desen (Williams fraktal (n=2) ve sinyal barina bagli sayisal ternary stop)"
