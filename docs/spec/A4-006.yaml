varyantlar:
- ad: Yuzdesel ATR Filtresi Varyanti
  not: Mutlak ATR > 0.50$ yerine ATR > 0.01 * close (%1) kullanildiginda Sharpe 2.237 elde edilmistir.
spec_durumu: dakikalik
belirsiz:
- 'Zarattini, Barbon & Aziz (2024) ''A Profitable Day Trading Strategy For The U.S. Equity Market'' makalesinin QuantConnect C# uygulamasidir (Yazar: Derek Melchin).'
- 'Adim adim kurallar (ozel_kod: true): 1) Evren: fiyati > 5$ olan en yuksek dolar hacimli 1000 ABD hissesi (SPY haric), 14 gunluk ATR > 0.50$. 2) Saat 09:35''te (ilk 5 dakikalik 09:30-09:35 acilis barinin
  kapanisinda) ilk 5 dakika hacminin son 14 gunun ilk 5 dakika ortalama hacmine orani (RelativeVolume) > 1.0 olan hisselerden RelativeVolume''u en yuksek 20 hisse (Stocks in Play) secilir. 3) Long giris:
  Acilis 5m barinda Close > Open ise, OpeningBar.High seviyesine StopMarket alim emri konur; stop-loss OpeningBar.High - 0.1 * ATR(14, 1D) seviyesidir. Pozisyon buyuklugu stop vuruldugunda portfoyun %1''i
  kaybedilecek sekilde (ve hisse basina en fazla 1/20 = %5 agirlikla) hesaplanir. 4) Cikis: Stop vurulmazsa gun sonunda (16:00 kapanista) pozisyon kapatilir.'
- 'Short kurallari da vardir: Acilis 5m barinda Close < Open ise OpeningBar.Low seviyesine StopMarket short emri ve OpeningBar.Low + 0.1 * ATR(14, 1D) stop-loss konur.'
