belirsiz:
- Karar zaman dilimi C# kodunda [Parameter(SymbolPeriod.Min)] olarak tanımlı olup gün içi seans saatlidir (10:03 - 17:58, 1 saatin altında, dakikalık)
- Algo Kütüphanesi MatriksIq C# kodundan tüm bölge parametreleri ve kuralları eksiksiz okundu; sadece LONG işlem yapmaktadır
- 'Özel kod mantığı: Major Trend = MOV(C, 30, VAR) > OTT(C, 30, 8.0). Eğer Major Trend yukarı ise 1. Bölge şartları (OTT(40, 0.6) altta, StochSlow(500,200,111) yukarı kesişimli ve H > HHV(H, 20)[1]) ile
  Long açılır. Major Trend aşağı ise 2. Bölge şartları (OTT(30, 0.9) altta, StochSlow(500,300,111) yukarı kesişimli ve H > HHV(H, 22)[1]) ile Long açılır. Pozisyon kapama 3. Bölge (LLV 23) veya 4. Bölge
  (LLV 24) koşullarıyla gerçekleşir'
- "T7 sozdizimi: ternary (c ? a : b) '(c and a) or (not c and b)' bicimine cevrildi; anlam ayni"
