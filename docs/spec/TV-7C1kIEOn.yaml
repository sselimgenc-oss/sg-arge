belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'tradeDirection=''Long'' (varsayilan), TPSLCondition=''None'' (yazarin TP/SL''si yok). BBTrend = (|kisa alt - uzun alt| - |kisa ust - uzun ust|) / kisa orta * 100 (BB 20 ve 50, 2 stdev). Supertrend fiyata degil BBTrend''e uygulanir: yapay bar (o = nz(src[1]), h = max(o, src), l = min(o, src), c = src), ATR = rma(tr, 10), faktor 7; sinyal st.d < 0 iken long.', 'Yazarin ozel `st` metodu nz(up[1]) / nz(dn[1]) kullanir ve ilk barda band 0''a baslar; kod bu sirayla birebir uygulandi (motor supertrend''inden farkli baslangic). Giris/cikis durumsal (yon < 0 iken her bar), pozisyon kapisi motordadir.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_7c1kieon.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
