varyantlar:
- ad: WFO Long/Short Varyanti
  not: N (20..150 adim 10) ve Factor (0.05..0.50 adim 0.05) 5 WFO dongusuyle optimize edilip exitLong yerine enterShort kullanildiginda PF 7.0 ve Win Rate %76 raporlanmistir.
- ad: Pozitif Genislikli Ic Kanal Varyanti (Yorumdaki Duzeltme)
  not: Zone = Factor * (HighDev - LowDev) kullanilarak tetikleyicilerin her zaman kanal icinde kalmasi saglanir.
spec_durumu: tam
belirsiz:
- Perry Kaufman'in (TASC Mayis 2025) Inside Channel regresyon kanali stratejisinin Petra Volkova tarafindan Zorro C koduyla uygulanmis halidir.
- 'Adim adim hesaplama (ozel_kod: true): 1) Son N = 40 barin kapanis fiyatlari uzerinden dogrusal regresyon egimi Slope = LinearRegSlope(close, N) ve kesim noktasi Intercept = LinearRegIntercept(close,
  N) hesaplanir. 2) i = N''den 1''e kadar dongude LinVal(i) = Intercept + Slope * (N - i) bulunur; HighDev = max(0, max_i(close[i] - LinVal(i))) ve LowDev = min(0, min_i(close[i] - LinVal(i))) maksimum
  pozitif ve negatif sapmalari hesaplanir (mevcut bar i=0 icin LinVal = Intercept + Slope * N). 3) Zone = Factor * (HighDev + LowDev) (Factor = 0.2). 4) Long giris: acik long yokken close < LinVal + LowDev
  + Zone. 5) Long cikis: close > LinVal + HighDev - Zone.'
