id: M012a
ad: '5 Swing Trading Strategies for Beginners - Strategy 1: The Mean Reversion Band and IBS'
kart_yazari: argon
kaynak:
  dosya: markdown_listesi
  url: https://quantifiedstrategies.substack.com/p/5-swing-trading-strategies-for-beginners
  sayfa: null
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD Hisse / ETF (SPY)
gostergeler:
  high10:
    f: highest
    src: high
    n: 10
  atr25:
    f: atr
    n: 25
giris: close < high10 - 2.5 * range_sma25 and (close - low) / (high - low) < 0.3
cikis: close > high[1]
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
