  pf: null
  sharpe: null
  getiri: 8.0
  mdd: 23.0
  islem: null
  wr: null
  maliyet_dahil: evet
spec_durumu: tam
belirsiz:
- 'range_sma25 hesaplaması (ozel_kod: true): Son 25 günün (high - low) farkının basit hareketli ortalamasıdır (sma(high - low, 25)). Alt bant = highest(high, 10) - 2.5 * sma(high - low, 25). IBS = (close
  - low) / (high - low). Kapanış alt bandın altında ve IBS < 0.3 ise long girilir; close > high[1] olduğunda çıkılır.'
