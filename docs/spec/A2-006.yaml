belirsiz:
- Yazarın backtesti EURUSD M15 (1 saatin altında) üzerindedir (ayrıca H1 ve H4 için de önerilmiştir)
- 'Özel kod mantığı: EMA(20) > EMA(50) trend filtresi ve geçmiş SRLookback barlık destek/direnç (S/R) doğrulaması ile birlikte 3 fiyat aksiyonu formasyonundan biri oluştuğunda girilir: (1) Pin Bar (fitil/gövde
  oranı >= PinBarRatio), (2) Bullish Engulfing (yutan mum), (3) Inside Bar (ana bar kırılımı); çıkış sabit StopLossPips, TakeProfitRatio (R:R çarpanı), otomatik Break-Even, Trailing Stop ve gün sonu seans
  kapanışı ile yapılır'
- StopLossPips, TakeProfitRatio, PinBarRatio, SRLookback ve Start/End Hour parametrelerinin varsayılan sayısal değerleri açıklama metninde yazmayıp .mq5 kaynak dosyasındadır
- 'short kuralı var: EMA(20) < EMA(50) iken direnç bölgesinde bearish Pin Bar, Bearish Engulfing veya aşağı Inside Bar kırılımında short açılır'
- 'lider: varsayilan parametreler .mq5 icinde, okunmadi'
