  Son 1 ayda (21 islem gunu, roc21) en yuksek getiriye sahip 10 hisse esit agirlikli olarak short satilir.'
- "T22: yalniz long bacak (EVRENSEL_KURALLAR A5): onceki haftanin en dusuk getirili hisseleri haftalik (haftanin son kapanisinda karar, ertesi acilista dolum) esit agirlikla tutulur; short bacak (21 gunluk en yuksek getiri) short fazina kaldi. Kaynak evren 100 buyuk hisse / 10 pozisyon: bizim evrenlerde (25-28 sembol) ayni yogunluk n_oran=0,10 (en az 3) ile korunur; 8 sembolden kucuk evren (emtia 6 ETF) Dogrulanamaz (evren_kucuk). Kaynak: https://quantpedia.com/strategies/short-term-reversal-in-stocks (long: son haftanin en dusuk 10 hissesi, haftalik dengeleme)."
