- 'TradingView sayfası doğrudan açılmadı; aynı script ID''li (4mz6xvnK, yazar: ceyhun) PyneSys aynası (https://wild.pynesys.io/scripts/kpl-swing-strategy-4mz6xvnK) ve Kamalesh Langote''nin orijinal AmiBroker
  AFL kodu (https://www.scribd.com/document/341758649/KPL-Swing-Trading-System) üzerinden okundu'
