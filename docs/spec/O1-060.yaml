  dosya: strateji_listesi (2).xlsx
  url: https://usethinkscript.com/threads/strategy-based-on-emas-tsi-macd-and-premarket-highs-lows-for-thinkorswim.10866/
  sayfa: null
tarz: day
tf: 5m
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD Hisse / Opsiyon
gostergeler:
  ema5:
    f: ema
    src: close
    n: 5
  ema12:
    f: ema
    src: close
    n: 12
  ema34:
    f: ema
    src: close
    n: 34
  ema50:
    f: ema
    src: close
    n: 50
  macd_ind:
    f: macd
    src: close
    fast: 10
    slow: 22
    sig: 8
giris: ema5 > ema12 and close > premarket_high and tsi_val > macd_ind.signal and tsi_val > tsi_val[2] and low <= ema5 * 1.0025
cikis: close < open and close < ema5 and low < low[4] and close < ema12 and (cross_under(ema5, ema12) or tsi_val < tsi_val[1] * 0.91 or cross_under(tsi_val, macd_ind.signal))
stop: null
hedef: null
stop_eklendi: false
ozel_kod: true
