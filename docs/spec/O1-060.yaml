ozel_kod_nedeni: seans_saat
parametreler:
  EMA1: 5
  EMA2: 12
  EMA3: 34
  EMA4: 50
  EMA200: 200
  EMASepThrHld_5m: 0.2
  EntryPullBackFactor: 0.0025
  TkPftFactor: 0.01
  TSI_LongLength: 25
  TSI_ShortLength: 13
  TSI_SignalLength: 8
  MACD_FastLength: 10
  MACD_SlowLength: 22
  MACD_Length: 8
  PreMarketStartTime: 700
  PreMarketEndTime: 929
  StartTime: 930
  EndTime: 1600
  LastCandleStop_min: 5
deneme_sayisi_kaynakta: 1
