belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA 5/13/26, hacim > SMA(hacim, 20), azami risk %1. Stop = giris - min(giris - sinyal_dip, %1 x giris); hedef = giris + RR x risk, RR = 1 (sinyal mumu araligi > %1) ya da 2. Seviyeler sinyal barinda (strategy.exit stop/limit sabit degiskenlerden) belirlenir; process_orders_on_close = true: giris sinyal kapanisinda dolar (dolum: kapanis). Ters sinyal (EMA 5 asagi kesisim) acik long''u kapatir (cikis olarak kalir). Gun ici cikis (saat 23:10) gunluk barlarda hic tetiklenmez.', 'Not: ABD25 hisse evreni; hacim filtresi hisse hacmiyle hesaplanir.', 'Pine''da strategy.exit koruma emirleri pozisyon acildiktan sonra, dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan itibaren etkindir (D8): dolum barinda stop/hedef vurulursa motor cikar, Pine cikmaz. Stop/hedef mesafesi sinyal barinin ATR''sine sabitlenir, dolum fiyatindan olculur (Pine: strategy.position_avg_price).', 'U7 Ek 1: kol DIGER-1D → ABD25-1D eslendi (kural ve parametreler degismedi; yayin sembolu NSE:TARIL).']
