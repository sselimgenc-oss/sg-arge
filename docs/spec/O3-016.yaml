id: O3-016
ad: Gap down + 25 MA filtresi (S&P 500 gun ici)
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.quantifiedstrategies.com/gap-trading-strategies/
  sayfa: null
tarz: day
tf: 5m
mtf: 1D
tf_varsayim: false
yazar_piyasasi: Vadeli / ETF (S&P 500 E-mini ES, SPY)
gostergeler:
  sma25_1d:
    f: sma
    src: close
    n: 25
    tf: 1D
  close_1d:
    f: close
    tf: 1D
    kaydir: 1
ozel_kod: true
giris: open <= close_1d * 0.9985 and open >= close_1d * 0.993 and open > mtf("1D", sma25_1d)
cikis: high >= close_1d
stop: null
hedef: null
stop_eklendi: false
parametreler:
  min_gap_down_pct: 0.15
  max_gap_down_pct: 0.7
  sma_days: 25
deneme_sayisi_kaynakta: 4
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: 777
  wr: null
  maliyet_dahil: belirtilmemis
varyantlar:
- ad: Swing Gap Down + IBS <= 0.25 + RSI(5) <= 45 Stratejisi
  not: Gunluk grafikte S&P 500 en az %0.15 asagi gap yapmali, dunku IBS <= 0.25 ve dunku 5-gunluk RSI <= 45 olmali; bugunku acilista long girilir, kapanis dunku kapanistan yuksek oldugunda (close > close[1])
    kapanista cikilir (PF 1.8, islem basina ort. %0.48 kazanc).
spec_durumu: dakikalik
belirsiz:
- 'Gun ici bosluk doldurma (gap fill) kurallari (ozel_kod: true): 2011-2021 5 dakikalik surekli E-mini S&P 500 vadeli verisinde seans acilisinda dunku kapanisa gore -%0.15 ile -%0.70 arasinda asagi bosluk
  (gap down) olusmali ve bugunku acilis fiyati son 25 gunluk kapanis ortalamasinin (SMA25) uzerinde olmalidir. Acilista long girilir, bosluk doldugunda (fiyat dunku kapanisa ulastiginda) veya seans sonunda
  kapatilir (islem basina ort. %0.06 getiri).'
