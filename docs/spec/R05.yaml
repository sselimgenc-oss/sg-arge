tf_varsayim: false
stop: null
hedef: null
stop_eklendi: false
deneme_sayisi_kaynakta: null
ozel_kod: false
belirsiz:
- 'stdev listede yok; Z-skor EMA tabanlı (listedeki zscore SMA tabanlı olabilir): ozel_kod'
- 1W_Bias formülü bu raporda tanımlı değil; Paper_Test_4 S1'deki tanım varsayıldı (1W EMA10>=EMA20 veya 1W kapanış>=EMA20*0.985, 1 bar gecikmeli)
  -> lider onayı
- Rapordaki PF değeri tavanlanmış görünüyor (birçok satırda birebir 5,80); ölçüm/raporlama tavanı olabilir, PF'ye güvenilmez
- En yüksek getiri/PF -> aşırı uyum alarmı
- "T8: ozel_kod true -> false (stdev kutuphanede); kural ifade diline ve engine/gosterge.py kutuphanesine cevrildi, anlam degismedi"
parametreler: {}
id: R05
ad: 'Dual Signal Trend Sentinel: 65 günlük Z-skor rejimi'
kaynak:
  dosya: Reddit_ve_Quant_Stratejileri_Backtest_Raporu.pdf
  url: null
  sayfa: bölüm 2.5
tarz: swing
tf: 1D
mtf: 1W
yazar_piyasasi: Çoklu (r/algotrading)
gostergeler:
  ema10w:
    f: ema
    src: close
    n: 10
    tf: 1W
  ema20w:
    f: ema
    src: close
    n: 20
    tf: 1W
  close_1w:
    f: close
    tf: 1W
  ema65:
    f: ema
    src: close
    n: 65
  sd65:
    f: stdev
    src: close
    n: 65
  ema20:
    f: ema
    src: close
    n: 20
  atr14:
    f: atr
    n: 14
giris: (ema10w >= ema20w or close_1w >= ema20w * 0.985) and (close - ema65) / sd65 > 0.55 and close > ema20 and (close - low) / (high - low) >
  0.55
cikis: (close - ema65) / sd65 < -0.10
iz_suren:
  tip: atr_zirve
  n: 14
  carpan: 2.8
kar_kilidi:
  tetik_atr: 1.8
  stop: giris
rapor:
  pf: 4.93
  sharpe: 1.64
  getiri: +%954.0
  mdd: '%19.3'
  islem: 35.8
  wr: '%48.8'
  maliyet_dahil: evet, %0,1 komisyon (slippage belirtilmemiş)
spec_durumu: tam
bias_varsayim: true
