  doğrudan erişim engeline takıldı; arama motoru önbelleğinden strateji girdileri (inputs: ChanLength(20), StopDollars(1), MALength(50)) ve geri çekilme dip fiyatının $0.50 üzerine Buy Stop emri (''buy
