belirsiz:
- Karar zaman dilimi 1m (1 saatin altında)
- 'Özel kod mantığı (AlgoTrader77): 1 dakikalık NQ grafiğinde EMA(20) kullanılır (paylaşılan kodda setHiding(if close > open(period=''DAY'') then 0 else 1) ile günlük açılış üzerinde görünür kılınmıştır);
  bir mum EMA(20) üzerinde kapandığında (close[1] > ema20[1]), bir sonraki mum o sinyal mumunun en yükseğini 1 tick (0.25 puan) yukarı kırdığında (high >= high[1] + 0.25) Long girilir; stop-loss sinyal
  mumunun diğer ucuna (low[1]) konulur, kar hedefi 100 NQ puanıdır (400 tick)'
- 'short kuralı var: Mum EMA(20) altında kapandığında (close[1] < ema20[1]), o mumun en düşüğünün 1 tick (0.25 puan) altına kırılımda short girilir; stop-loss sinyal mumunun en yükseği (high[1]), hedef
  100 puan'
- "ozel_kod_nedeni: bekleyen_emir (sinyal mumunun yuksegine +1 tick (0.25 puan) Buy Stop; tick/puan birimi NQ'ya ozgu)"
- "piyasa_kisiti: ['NQ'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
