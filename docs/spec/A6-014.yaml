belirsiz:
- 'Zorro''ya ozgu 2. dereceden LowPass filtre ve Market Meanness Index (MMI) gostergeleri kullanildigi icin ozel_kod: true olarak tanimlandi; yalniz long calisir (MaxLong = 1).'
- 'Adim adim kurallar: 1) Signals = LowPass(close, lowpass_n) hesaplanir (varsayilan 10, WFO''da 2..20 adim 2 optimize edilir). 2) MMIFast = MMI(close, mmi_fast_n) hesaplanir (varsayilan 50, WFO''da 40..60
  adim 5 optimize edilir; MMI son N barda fiyatin medyana gore ortalamaya donus sikligini olcer). 3) MMISlow = LowPass(MMIFast, 100). 4) Rejim filtresi: MMISlow dusuyor olmali (falling(MMISlow) yani MMISlow[0]
  < MMISlow[1], piyasa trend rejimine giriyor). 5) Long giris: falling(MMISlow) ve valley(Signals) (Signals dip yaptiysa: Signals[0] > Signals[1] ve Signals[1] < Signals[2]). 6) Long cikis: falling(MMISlow)
  ve peak(Signals) (Signals tepe yaptiysa: Signals[0] < Signals[1] ve Signals[1] > Signals[2]).'
