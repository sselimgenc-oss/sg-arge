belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol U7 Ek 1 ile yayin sembolunun sinifina eslendi. Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: EMA(200), swing 5, RSI(14), stop 1,5 x ATR, hedef 3 x ATR. Likidite supurmesi: low < onceki 5 barin dibi (kaydirilmis pencere, [1]) ve close bu dibin ustunde. Short sinyali (supurme ustte) acik long''u ters yonde kapatir; long bacakta cikis olarak kalir. strategy.exit yalniz giris barinda verilir: seviyeler sinyal kapanisi ve ATR''sinden sabitlenir.', 'Not: ABD/FX/EMTIA 4H kolunda veri yfinance 1H''den 4H''ye yeniden orneklenir (U7 Ek 1).', 'Pine''da strategy.exit emri giris emriyle ayni barda (sinyal barinin kapanisinda) verilir; seviyeler sinyal barinin kapanisi ve ATR''sinden sabitlenir (kartta tip: seviye, sinyal_close/sinyal_atr). Giris sonraki acilista dolunca emir dolum barindan itibaren etkindir (motorla ayni).', 'U7 Ek 1: kol ABD-4H → ABD25-4H eslendi (kural ve parametreler degismedi; yayin sembolu NASDAQ:QQQ).']
