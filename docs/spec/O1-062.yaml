- 'Kazanan işlemler için kar hedefi veya mekanik çıkış kuralı tanımlanmamıştır (yazar #4 mesajında çıkış için EMA ve pivot gibi başka göstergelere baktığını belirtmiştir); çıkış kuralı eksik olduğundan
  öncelik sırasına göre (eksik > dakikalik) spec_durumu: eksik verildi'
- 'short kuralı var: Günün en yüksek seviyesini (HOD) yapan mumun en düşüğü (HOD_l) aşağı kırıldığında (close crosses below HOD_l) short sinyali üretilir'
