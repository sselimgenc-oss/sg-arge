belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Pine pyramiding = N ayni yonde en fazla N giris demektir (N = 0 ve 1 tek giris); motor piramit.en_cok ek giris sayisidir (en_cok = N - 1). Her ek birim motorda kendi stop mesafesiyle ve normal islem basi risk kuraliyla boyutlanir, toplam acik risk sinirina dahildir; yazarin sabit miktar / sermaye yuzdesi kodu kullanilmaz. Cikis sinyali butun birimleri kapatir. pyramiding = 3: uc ayri giris (ilk, 50 MA, golden cross). Pine nakit miktarlari (1000 / 6000 / 3000) kullanilmaz.', 'ZigZag: isSwingHigh = high[3] == highest(high, 7), isSwingLow = low[3] == lowest(low, 7); dalga durumu 0 -> A -> B -> C -> 0 ayni barda zincirleme ilerleyebilir (Pine sirasi). Bayraklar (allowBuys, first/second/finalBuyTriggered, sellTriggered) var degiskenidir ve bir kez kullanilir: cikistan sonra yeni dongu acilmaz. Sinyal uretimi veri baslangicindan itibaren kesintisiz hesaplanir; motor donem kesitinde alt kumeyi calistirir.', 'Stop/hedef yok; her birime ATR x 3 stop eklendi: motor stopu Pine''da olmayan erken cikis uretir, sonraki kademeler bu durumda yeni pozisyon acabilir.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_vmueblzr.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
