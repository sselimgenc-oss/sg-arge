id: TV-qo43NaGV
ad: BB + MACD v6.1.5 (Qing Smart Distribution)
kart_yazari: sonnet
kaynak: {dosya: arastirma/U5_tv.csv, url: 'https://www.tradingview.com/script/qo43NaGV/', sayfa: null, not: 'TradingView acik kaynak Pine; yazar Z8830; yayin sembolu NASDAQ:GOOGL; yayin araligi 1D. docs/GOREV_U6.md bolum 2.'}
tarz: swing
tf: 1D
mtf: null
tf_varsayim: false
yazar_piyasasi: ABD (NASDAQ:GOOGL)
kol: ABD-1D
yayin_sembolu: NASDAQ:GOOGL
gostergeler:
  m: {f: macd, fast: 6, slow: 12, signal: 8}
  basis: {f: sma, src: close, n: 20}
  sd: {f: stdev, src: close, n: 20}
  upper: {f: seri, ifade: basis + 2.0 * sd}
  atr14: {f: atr, n: 14}
  avgvol: {f: sma, src: volume, n: 20}
  hh3: {f: highest, src: high, n: 3}
ozel_kod: false
giris: (((cross_over(close, basis) and m.macd > m.signal and m.hist > 0 and m.hist > m.hist[1]) or (cross_over(m.macd, m.signal) and close > basis and m.hist > 0)) and volume >= avgvol and close > open)
cikis: (hh3 >= upper[1] and m.hist < m.hist[1] and m.hist[1] < m.hist[2] and close < open and close <= close[1]) or (close < basis - atr14 * 0.5 and close < open) or (close > upper and m.macd > 0 and m.macd > m.signal * 2.5)
stop: null
hedef: null
stop_eklendi: true
yalniz_long_bacak: true
piyasa_kisiti: [ABD]
parametreler: {kol: ABD-1D}
spec_durumu: tam
belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: BB(20, 2), MACD(6, 12, 8), cikis ATR tamponu 0,5, hacim onayi acik (hacim >= SMA(hacim, 20)). Uc cikis (dagitim, trend sonu, tukenme) VEYA ile birlestirildi; Pine''da hepsi ayni strategy.close''a gider.', 'Giris pozisyon kontrolu olmadan strategy.entry ile verilir (pyramiding 0: acik long varken yeni giris reddedilir; motor da pozisyondayken giris yapmaz).', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
deneme_sayisi_kaynakta: 205
