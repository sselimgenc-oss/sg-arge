ozel_kod_nedeni: ozel_gosterge
parametreler:
  mm_tema.n: 56
  surachat_tma.n: 10
  contracts_long: 4
  contracts_short: 3
  tp1_pips: 18
  tp2_pips: 20
  tp3_pips: 40
  trailingstop_pips: 33
  sl_pips: 200
  start_time: 0
  end_time: 200000
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
