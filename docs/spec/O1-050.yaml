  dosya: strateji_listesi (2).xlsx
  url: https://www.prorealcode.com/prorealtime-trading-strategies/eurusd-15-minutes-timeframe-dhigh-dlow-strategy/
  sayfa: null
tarz: day
tf: 15m
mtf: 1D
tf_varsayim: false
yazar_piyasasi: Forex (EURUSD)
gostergeler:
  dhigh0:
    f: high
    tf: 1D
  dlow0:
    f: low
    tf: 1D
giris: mm > surachat and cross_over(close, milieu)
cikis: null
