id: A2-013
ad: Opening Range Breakout with NR4 / NR7 Contraction Filters
kart_yazari: argon
kaynak:
  dosya: strateji_listesi (2).xlsx
  url: https://www.mql5.com/en/code/78259
  sayfa: null
tarz: day
tf: 1m
mtf: 1D
tf_varsayim: false
yazar_piyasasi: Emtia (XAUUSD)
gostergeler:
  atr_daily:
    f: atr
    n: 14
    tf: 1D
giris: is_nr_day and high >= session_open + offset
cikis: null
stop: null
hedef: null
zaman_stop:
  bar: 780
stop_eklendi: false
ozel_kod: true
piyasa_kisiti: [XAUUSD]
ozel_kod_nedeni: seans_saat
parametreler:
  session_start_london: 08:00
  filter_type: NR4
  offset_mode: stretch
  exit_minutes_after_start: 780
  risk_percent: 1.0
deneme_sayisi_kaynakta: 1
rapor:
  pf: null
  sharpe: null
  getiri: null
  mdd: null
  islem: null
  wr: null
  maliyet_dahil: belirtilmemis
spec_durumu: dakikalik
belirsiz:
- Karar zaman dilimi 1m (1 saatin altında, günlük sıkışma filtreli gün içi kırılım)
- 'MQL5 CodeBase sayfasından kurallar okundu (Panduleni Nambala / Toby Crabel ORB): (1) Önceki gün NR4 (son 4 günün en dar aralığı), NR7 (son 7 günün en dar aralığı) veya Inside Day+NR4 olmalıdır, (2) Londra
  seans açılışında (08:00) açılış fiyatı kaydedilir ve açılış + offset seviyesine Buy Stop, açılış - offset seviyesine Sell Stop konulur, (3) Biri dolduğunda diğeri iptal edilir (OCO); stop-loss ters emir
  seviyesidir, (4) Seans başlangıcından 13 saat sonra (780 dakika) tüm pozisyonlar kapatılarak gün sonu taşınmaz'
- 'short kuralı var: Fiyat session_open - offset seviyesine düştüğünde Sell Stop tetiklenerek short açılır'
- "ozel_kod_nedeni: seans_saat (gunluk NR4/NR7 filtresi + seans acilisi (session_open) ofseti ile stop emirleri)"
- "piyasa_kisiti: ['XAUUSD'] (mutlak fiyat/pip/tick birimi ya da seans saati yazarin piyasasina ozgu; diger piyasalarda Dogrulanamaz (piyasa ozgu); BIST/ABD/KRIPTO/EMTIA disindaki ad yazarin evrenimizde olmayan piyasasidir)"
