belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'ta.pivothigh/pivotlow(5, 5): esit-deger kurali dogrulanamadi, sol ve sag icin sert esitsizlik varsayildi (strategies/ozel/tv_ortak.py). Pivot degerleri 5 bar sonra bilinir ve swing fiyati/bar numarasi mandalli tutulur.', 'Giris sonrasi stop ve hedef seviyeleri (Fib 0.786 stop, 1.618 uzanti hedef) sinyal barinda sabitlenir. `strategy.exit` dolum barinin kapanisinda verilir ve sonraki bardan etkindir; motorda stop/hedef dolum barindan etkindir (fark yalniz dolum barinda). Karttaki `stop`/`hedef` alani yalniz tipi gostermek icindir; seviyeler modulde (_stop_level/_target_level).', cooldownBars=5 son GIRIS barindan sayilir (long ve short girisleri); modul iki yonlu pozisyon/bekleme durumunu Pine kurallariyla ayrica benzetir (tv_ortak.simulate_two_sided) ve yalniz long girislerini sinyal olarak verir; long'u kapatan short girisleri cikis sinyalidir. Short bacak islem acmaz ama bekleme suresini ve ters cevirmeyi belirler., 'Yazarin boyut kodundaki `qty > 0` kosulu (equity, mintick, pointvalue ile hesaplanan miktar) kuralin parcasi sayilmadi; kodda 1 sozlesmelik sabit miktar ve BTC fiyatinda qty cogunlukla 0 cikar (pratikte islem acmaz), bu motorda uygulanmaz.', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_busjaz8o.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.']
