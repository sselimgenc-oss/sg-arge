belirsiz:
- 'Abade (King of Forex / cpfleger tabanli) tarafindan acikca ihtiyari (discretional) olarak tanimlanan 1m ters-trend ortalama maliyet (grid/averaging) stratejisidir (spec_durumu: ihtiyari).'
- 'Kurallar: 1) Kapanis 9, 20 ve 50 EMA''larin tamaminin altinda ve ''yeterince uzak'' mesafedeyken ilk long acilir (''yeterince uzak'' mesafe yatay destek/direnc, hacim ve volatiliteye gore goz karari
  belirlenir). 2) Fiyat pozisyonun tersine gitmeye devam ederse stop-loss kullanilmaz; 9 EMA son emir seviyesini kestiginde yeni long pozisyonlar eklenir. 3) Toplam pozisyonu karla kapatmaya yetecek en
  yakin EMA''ya (9, 20, 50 veya 200 EMA) fiyat degdiginde cikilir.'
