belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Osilator: trend = normalize(20 x (ALMA(24, 0,85, 6) - VWMA(120)) / VWMA), momentum = normalize(ROC(14) / stdev(ROC, 50)), normalize(x) = x / (1 + |x|), puan = 0,6 trend + 0,4 momentum, osilator = clamp(100 puan), sonra ALMA ile yumusatilir. ta.alma agirliklari en eskiden en yeniye exp(-(i - floor(0,85 (n - 1)))^2 / (2 (n / 6)^2)). Baslangic tarihi 2017-01-01 (veri bu tarihten once baslamadigindan etkisiz).', Pozisyon kapisi (strategy.entry tekrar eden kesisimde yoksayilir) sinyal uretiminde Pine ile ayni sirada benzetilir. Short kosullari tanimli ama emir verilmez. Stop/hedef yok; ATR x 3 stop eklendi., 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_fennqpan.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
