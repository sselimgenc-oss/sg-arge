belirsiz: ['Yayin sembolu ve sinifi script sayfasindaki symbol alanindan okundu; kol sinifa gore sabit (sinif degistirilmez). Parametreler Pine input varsayilanlaridir, optimizasyon yok.', 'Yalniz long bacak: short girisleri yok sayilir; short sinyali acik long pozisyonu kapatiyorsa (ters yonde strategy.entry) cikis olarak kalir. Yazarin boyut kodu (qty, equity yuzdesi, kaldirac) kullanilmaz; boyut EVRENSEL_KURALLAR A6.', 'Sinyal kapanmis barda uretilir, emir sonraki acilista dolar (Pine varsayilani process_orders_on_close=false ile ayni). Maliyet motorun baz maliyeti; yazarin commission/slippage degerleri kullanilmaz.', 'Varsayilanlar: Trade direction = Both, Active sample = Full history, ornek 2018-01-01 .. 2099-01-01 (tarih disinda emir yok). Short bacak (EMA(50) < EMA(200), dusen egim, kapanis onceki 20 barin en dusuk low degerinin altinda) ticarete verilmez ama Pine''da acik short `flat` kapisini tutar; Pine durum makinesi short bacagi da izleyerek long girislerini uretir.', 'Cikis pozisyon durumuna baglidir (en yuksek kapanis, dolum fiyatindan baslayan risk cizgisi); motorda `exit_builder` ile dolum barindan itibaren Pine ile ayni sirada izlenir: dolum barinin kapanisinda zirve = kapanis, risk = dolum fiyati - 3 x ATR(14); sonraki barlarda zirve = max(zirve, kapanis), risk = max(risk, zirve - 3 x guncel ATR). Yazarin cikisi KAPANIS TABANLI sinyal oldugundan sinyal kapanista uretilir, sonraki acilista dolar; yazar bir stop emri vermez.', 'Yazarin fiyat seviyesi stopu yok (risk cizgisi kapanis sinyalidir, ara bar stopu degildir): motorun ara-bar stopu olarak ATR(14) x 3 koruma stopu eklendi (A7, stop_eklendi: true). Bu stop Pine''da yoktur; ara bar fitilinde sinyal kapanisinin 3 ATR altina inen long''u motor kapatir, Pine kapatmaz.', 'Pine EMA ilk degeri kaynaga esitler (seed); motor EMA''si tohumlama farki yalniz isinma doneminde (2018 oncesi bar ve ilk ~200 bar) fark yaratir. ta.atr = RMA(TR, 14).', 'ozel_kod: true. Kural motor ifade diline sigmadigi icin Pine''dan birebir Python''a cevrildi: strategies/ozel/tv_z9o5w3sg.py (girdiler bu kartin parametreler blogundan okunur). Modulun ileriye bakma testi tests/test_tv_parti*.py''dedir.', 'Yazarin stopu yok (ya da stop mantigi cevrilemiyor): ATR(14) x 3 koruma stopu eklendi (EVRENSEL_KURALLAR A7, stop_eklendi: true).']
