belirsiz:
- 'Limit emir ve evren/sıralama mantığı (ozel_kod: true): 1) Evren: Geçmişte Russell 3000 endeksinde yer almış ancak işlem gününde endeksten çıkmış (ex-index) hisseler. 2) Likidite: İşlem fiyatı > 1$ ve
  21 günlük ortalama (Close * Volume) > 500.000$. 3) Kurulum: Close > SMA(100) ve RSI(2) < 10 gerçekleştiğinde ertesi gün için son kapanışın %5 altına (Close * 0.95) 1 gün geçerli alış limit emri verilir.
  4) En fazla 10 açık pozisyon taşınır; birden fazla aday varsa 100 günlük tarihsel volatiliteye (yüksekten düşüğe) göre sıralanır. 5) Çıkış: RSI(2) > 50 olduğunda veya 10 işlem günü sonunda ertesi sabah
  açılışta çıkılır.'
- "T10: ozel_kod_nedeni: bekleyen_emir (ertesi gun kapanisin %5 altina 1 gun gecerli limit alim; ex-Russell 3000 evreni ve hacim siralamasi)"
