belirsiz:
- 'Raporda 8 stratejinin 256''lık havuzdan seçildiği belirtiliyor: seçim yanlılığı (DSR''de N>=256)'
- Sonuçlar 1W->1D ve 4H/1D->1H iki kurguda raporlanmış; kartta ana kurgu 1W->1D, 1H varyantı 'varyantlar' altında
- 'Stop 2.0-2.8*ATR aralık olarak verilmiş, yazar varsayılanı yok: orta değer 2.4 geçici varsayım -> lider kararı'
- 'Hacim eşiği 1.15-1.50 aralığı: alt sınır 1.15 alındı'
- '''%99.2 eşiği'' (close >= hh20*0.992) VEYA kolu giriş kolu olarak alındı'
- 'Yazar kodunda short tarafı hatalı: yalnız long'
parametreler: {}
