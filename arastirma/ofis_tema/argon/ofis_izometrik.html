<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Ofis İzometrik Canlı Haritası</title>
  <style>
    :root {
      --arkaplan: #0f172a;
      --panel-arkaplan: #1e293b;
      --panel-ust: #334155;
      --metin: #f8fafc;
      --metin-ikincil: #cbd5e1;
      --metin-soluk: #94a3b8;
      --vurgu: #38bdf8;
      --yesil: #22c55e;
      --sari: #eab308;
      --kirmizi: #ef4444;
      --serit-yukseklik: 28px;
      --ust-bar-yukseklik: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--arkaplan);
      color: var(--metin);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 5. Üstte sabit ince şerit */
    .ust-uyari-seridi {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--serit-yukseklik);
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 50%, #1e293b 100%);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      color: #fde047;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 0 10px;
      text-align: center;
    }

    /* Üst kontrol çubuğu */
    .ust-cubuk {
      position: fixed;
      top: var(--serit-yukseklik);
      left: 0;
      right: 0;
      min-height: var(--ust-bar-yukseklik);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      gap: 6px;
      z-index: 100;
    }

    .baslik-grup {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .baslik-grup h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--metin);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .durum-alt-metin {
      font-size: 11px;
      color: var(--metin-soluk);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ust-dugmeler {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Tüm dokunma alanları >= 44px */
    .dugme {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.9);
      color: var(--metin);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .dugme:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(56, 189, 248, 0.5);
    }

    .dugme:active {
      transform: scale(0.97);
    }

    .dugme.vurgu-dugme {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .dugme.aktif-bolge {
      background: rgba(234, 179, 8, 0.22);
      border-color: #eab308;
      color: #fef08a;
    }

    .dugme[hidden] {
      display: none !important;
    }

    /* Ağ hatası çubuğu */
    .hata-cubugu {
      position: fixed;
      top: calc(var(--serit-yukseklik) + var(--ust-bar-yukseklik) + 8px);
      left: 10px;
      right: 10px;
      background: rgba(127, 29, 29, 0.96);
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 105;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }

    .hata-cubugu[hidden] {
      display: none !important;
    }

    .hata-metni {
      font-size: 13px;
      font-weight: 600;
      color: #fecaca;
    }

    /* Ana harita görünüm alanı */
    .harita-dis-alan {
      position: fixed;
      top: calc(var(--serit-yukseklik) + var(--ust-bar-yukseklik));
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 75%);
      cursor: grab;
    }

    .harita-dis-alan.surukleniyor {
      cursor: grabbing;
    }

    /* Harita sahnesi: tam genişlikte izometrik görsel + SVG bölgeler + rozetler */
    .harita-sahne {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 1536 / 1024;
      transform-origin: 0 0;
      will-change: transform;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      background: #f8fafc;
    }

    .harita-sahne.yumusak-gecis {
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ofis-gorsel {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Oranlı çokgen bölgeler katmanı (SVG) */
    .bolge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: visible;
    }

    .oda-poligon {
      fill: rgba(56, 189, 248, 0.001);
      stroke: transparent;
      stroke-width: 2;
      cursor: pointer;
      transition: fill 0.2s ease, stroke 0.2s ease;
      vector-effect: non-scaling-stroke;
      outline: none;
    }

    .oda-poligon:hover,
    .oda-poligon:focus-visible {
      fill: rgba(56, 189, 248, 0.18);
      stroke: rgba(56, 189, 248, 0.85);
    }

    .oda-poligon.secili {
      fill: rgba(56, 189, 248, 0.24);
      stroke: #38bdf8;
      stroke-width: 2.5;
    }

    /* ?bolge=1 hata ayıklama görünümü */
    .hata-ayiklama-aktif .oda-poligon {
      fill: var(--bolge-dolgu, rgba(56, 189, 248, 0.38));
      stroke: var(--bolge-cizgi, #ffffff);
      stroke-width: 2;
      stroke-dasharray: 4 2;
    }

    .bolge-kose-nokta {
      display: none;
      fill: #ffffff;
      stroke: #0f172a;
      stroke-width: 1.5;
      pointer-events: none;
    }

    .hata-ayiklama-aktif .bolge-kose-nokta {
      display: block;
    }

    .bolge-debug-etiket {
      display: none;
      font-size: 16px;
      font-weight: 700;
      fill: #ffffff;
      paint-order: stroke;
      stroke: #0f172a;
      stroke-width: 4px;
      pointer-events: none;
      text-anchor: middle;
    }

    .hata-ayiklama-aktif .bolge-debug-etiket {
      display: block;
    }

    /* 2. Oda üstü canlı rozetler katmanı */
    .rozet-katmani {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* Her rozet/dokunma alanı en az 44x44px */
    .oda-rozet-kapsayici {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 2px;
      cursor: pointer;
      pointer-events: auto;
      z-index: 22;
      outline: none;
    }

    .oda-rozet-kapsayici:focus-visible .rozet-kutu {
      outline: 2px solid var(--vurgu);
      outline-offset: 2px;
    }

    /* Çay Ocağı: rozet yok ama >= 44px dokunma alanı korunur */
    .oda-rozet-kapsayici.rozet-gorunmez .rozet-kutu {
      display: none;
    }

    .hata-ayiklama-aktif .oda-rozet-kapsayici.rozet-gorunmez .rozet-kutu {
      display: inline-flex;
      opacity: 0.75;
      border-style: dashed;
    }

    .rozet-kutu {
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(148, 163, 184, 0.42);
      border-radius: 7px;
      padding: 2px 5px;
      color: var(--metin);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.40);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.15;
      max-width: 112px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .oda-rozet-kapsayici:hover .rozet-kutu,
    .oda-rozet-kapsayici.secili .rozet-kutu {
      border-color: var(--vurgu);
      background: rgba(15, 23, 42, 0.98);
      transform: scale(1.05);
    }

    /* Lab rozeti 90 dk'dan eskiyse sarı */
    .rozet-kutu.uyari-sari {
      background: rgba(113, 63, 18, 0.95);
      border-color: #facc15;
      color: #fef08a;
    }

    .rozet-kutu.uyari-kirmizi {
      border-color: rgba(239, 68, 68, 0.8);
    }

    .rozet-baslik {
      font-size: 9px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .rozet-kutu.uyari-sari .rozet-baslik {
      color: #fde047;
    }

    .rozet-deger {
      font-size: 9.5px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
    }

    .rozet-sade .rozet-baslik {
      color: #e2e8f0;
      font-size: 9.5px;
    }

    /* 390px ve altı telefon ekranlarında rozetlerin taşmaması için kompakt ölçü */
    @media (max-width: 480px) {
      .rozet-kutu {
        padding: 1.5px 4px;
        border-radius: 5px;
        max-width: 92px;
      }
      .rozet-baslik {
        font-size: 7.5px;
      }
      .rozet-deger {
        font-size: 8px;
      }
      .rozet-sade .rozet-baslik {
        font-size: 8px;
      }
    }

    /* Sağ alt yakınlaştırma düğmeleri (>= 44px) */
    .harita-kontroller {
      position: fixed;
      right: 10px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 85;
      transition: bottom 0.3s ease;
    }

    .harita-kontroller.panel-acik {
      bottom: calc(52vh + 12px);
    }

    .kontrol-dugme {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.9);
      color: var(--metin);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .kontrol-dugme:active {
      transform: scale(0.95);
    }

    /* 3. Alttan açılan detay paneli */
    .alt-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 52vh;
      background: var(--panel-arkaplan);
      border-top: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.55);
      z-index: 110;
      display: flex;
      flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .alt-panel.acik {
      transform: translateY(0);
    }

    .panel-tutacak {
      width: 38px;
      height: 4px;
      background: rgba(148, 163, 184, 0.4);
      border-radius: 2px;
      margin: 8px auto 2px;
      flex-shrink: 0;
    }

    .panel-ust {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      gap: 10px;
      flex-shrink: 0;
    }

    .panel-baslik-alan {
      min-width: 0;
    }

    .panel-oda-adi {
      font-size: 17px;
      font-weight: 700;
      color: var(--metin);
    }

    .panel-oda-ozet {
      font-size: 12px;
      color: var(--metin-ikincil);
      margin-top: 2px;
    }

    .panel-icerik {
      padding: 12px 14px 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Panel içi bileşenler */
    .metrik-izgara {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .metrik-kart {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .metrik-etiket {
      font-size: 11px;
      color: var(--metin-soluk);
    }

    .metrik-deger {
      font-size: 15px;
      font-weight: 700;
      color: var(--metin);
      margin-top: 2px;
    }

    .trader-tablo {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 6px;
    }

    .trader-tablo th,
    .trader-tablo td {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      text-align: left;
    }

    .trader-tablo th {
      color: var(--metin-soluk);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .trader-tablo td.sayi-hucre,
    .trader-tablo th.sayi-hucre {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .pozitif {
      color: #4ade80;
      font-weight: 600;
    }

    .negatif {
      color: #f87171;
      font-weight: 600;
    }

    .notr {
      color: var(--metin-ikincil);
    }

    .uyari-kutu {
      background: rgba(234, 179, 8, 0.14);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: #fef08a;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 12.5px;
    }

    .bilgi-kutu {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--metin-ikincil);
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 12.5px;
    }

    .anahtar-liste {
      list-style: none;
      margin-top: 6px;
    }

    .anahtar-liste li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <!-- 5. Üstte sabit ince şerit -->
  <div class="ust-uyari-seridi" role="region" aria-label="Araştırma bildirimi">
    Sanal araştırma — gerçek para yok
  </div>

  <!-- Üst bilgi ve kontrol çubuğu -->
  <header class="ust-cubuk">
    <div class="baslik-grup">
      <h1>Ofis Canlı Haritası</h1>
      <p id="son-guncelleme-metni" class="durum-alt-metin" aria-live="polite">Veri bekleniyor...</p>
    </div>
    <div class="ust-dugmeler">
      <button type="button" id="ust-binaya-don-dugme" class="dugme vurgu-dugme" hidden aria-label="Binaya dön">
        Binaya dön
      </button>
      <button type="button" id="bolge-modu-dugme" class="dugme" aria-pressed="false" aria-label="Hata ayıklama bölgelerini göster veya gizle">
        Bölgeler
      </button>
      <button type="button" id="ust-yenile-dugme" class="dugme" aria-label="Canlı veriyi şimdi yenile">
        ↻ Yenile
      </button>
    </div>
  </header>

  <!-- 4. Ağ hatasında "Veri okunamadı" + Yenile düğmesi -->
  <div id="hata-cubugu" class="hata-cubugu" role="alert" hidden>
    <span id="hata-metni" class="hata-metni">Veri okunamadı</span>
    <button type="button" id="hata-yenile-dugme" class="dugme vurgu-dugme" aria-label="Veriyi yeniden okumayı dene">
      Yenile
    </button>
  </div>

  <!-- 1 & 3. İzometrik harita ve dokunmatik yakınlaştırma/kaydırma alanı -->
  <main id="harita-dis-alan" class="harita-dis-alan" aria-label="İzometrik şirket ofisi haritası">
    <div id="harita-sahne" class="harita-sahne yumusak-gecis">

    function htmlKacis(deger) {

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // =========================================================================
    // Veri Çözümleme Yardımcıları (Sahte veri üretmez, eksikse "veri yok" döner)
    // =========================================================================
    function isikDegeriAl(trader) {
      if (!trader || typeof trader !== "object") return null;
      let ham = null;
      if (typeof trader.saglik === "string") {
        ham = trader.saglik;
      } else if (trader.saglik && typeof trader.saglik === "object" && typeof trader.saglik.isik === "string") {
        ham = trader.saglik.isik;
      }
      if (!ham) return null;
      const temiz = ham.trim().toLowerCase()
        .replace(/ş/g, "s")
        .replace(/ı/g, "i")
        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c");
      if (temiz === "yesil" || temiz === "sari" || temiz === "kirmizi") {
        return temiz;
      }
      return null;
    }

    function isikSimgeAl(isik) {
      if (isik === "yesil") return "🟢";
      if (isik === "sari") return "🟡";
      if (isik === "kirmizi") return "🔴";
      return "⚪";
    }

    function isikAdAl(isik) {
      if (isik === "yesil") return "Yeşil";
      if (isik === "sari") return "Sarı";
      if (isik === "kirmizi") return "Kırmızı";
      return "Veri yok";
    }

    function odaTraderlariniAl(veri) {
      if (!veri || !Array.isArray(veri.traderlar)) return null;
      return veri.traderlar.filter(function (t) {
        return t && t.kol === "oda";
      });
    }

    // Kalabalık uyarısı kontrolü (uydurma alan kullanmadan mevcut alanı inceler)
    function kalabalikDurumuCozumle(kalabalik) {
      if (kalabalik === undefined || kalabalik === null) {
        return { veriVar: false, uyariVar: false, aciklama: "veri yok" };
      }
      if (typeof kalabalik === "boolean") {
        return { veriVar: true, uyariVar: kalabalik, aciklama: kalabalik ? "Kalabalık uyarısı aktif" : "Normal" };
      }
      if (Array.isArray(kalabalik)) {
        return {
          veriVar: true,
          uyariVar: kalabalik.length > 0,
          aciklama: kalabalik.length > 0 ? (kalabalik.length + " kalabalık kaydı") : "Uyarı yok"
        };
      }
      if (typeof kalabalik === "object") {
        const anahtarlar = Object.keys(kalabalik);
        if (anahtarlar.length === 0) {
          return { veriVar: true, uyariVar: false, aciklama: "Uyarı yok" };
        }
        let uyari = false;
        for (let i = 0; i < anahtarlar.length; i++) {
          const anahtar = anahtarlar[i];
          const deger = kalabalik[anahtar];
          const kucukAnahtar = anahtar.toLowerCase();
          if (typeof deger === "boolean") {
            if (deger === true && (kucukAnahtar.includes("uyari") || kucukAnahtar.includes("var") || kucukAnahtar.includes("aktif") || kucukAnahtar.includes("alarm") || kucukAnahtar.includes("kalabalik") || kucukAnahtar.includes("risk"))) {
              uyari = true;
            }
          } else if (typeof deger === "number" && !Number.isNaN(deger)) {
            if ((kucukAnahtar.includes("uyari") || kucukAnahtar.includes("sayi") || kucukAnahtar.includes("adet") || kucukAnahtar.includes("kalabalik")) && deger > 0) {
              uyari = true;
            }
          } else if (typeof deger === "string") {
            const d = deger.trim().toLowerCase();
            if (d === "uyari" || d === "sari" || d === "kirmizi" || d === "yuksek" || d === "kritik" || d === "var" || d === "aktif" || d === "evet") {
              uyari = true;
            }
          } else if (Array.isArray(deger) && deger.length > 0) {
            if (kucukAnahtar.includes("uyari") || kucukAnahtar.includes("kalabalik") || kucukAnahtar.includes("alarm") || kucukAnahtar.includes("liste") || kucukAnahtar.includes("ortak") || kucukAnahtar.includes("pozisyon") || kucukAnahtar.includes("sembol")) {
              uyari = true;
            }
          }
        }
        return {
          veriVar: true,
          uyariVar: uyari,
          aciklama: uyari ? "Kalabalık uyarısı mevcut (⚠)" : "Kalabalık uyarısı yok"
        };
      }
      return { veriVar: false, uyariVar: false, aciklama: "veri yok" };
    }

    // Makam: t0 = 2026-10-29'dan bu yana tam hafta + 1
    function makamHaftaHesapla(referansZaman) {
      const simdi = referansZaman instanceof Date && !Number.isNaN(referansZaman.getTime())
        ? referansZaman
        : new Date();
      const farkMs = simdi.getTime() - T0_TARIHI.getTime();
      const haftaMs = 7 * 24 * 60 * 60 * 1000;
      const tamHafta = Math.max(0, Math.floor(farkMs / haftaMs));
      return tamHafta + 1;
    }

    // Finans hesaplama: oda kolu sanal_kopya.bakiye_usd toplamı; başlangıç = trader sayısı * 1000
    function finansMetrikHesapla(veri) {
      const odaTraderlar = odaTraderlariniAl(veri);
      if (!odaTraderlar || odaTraderlar.length === 0) {
        return { gecerli: false };
      }
      const bakiyeListesi = odaTraderlar.filter(function (t) {
        return t.sanal_kopya && typeof t.sanal_kopya.bakiye_usd === "number" && !Number.isNaN(t.sanal_kopya.bakiye_usd);
      });
      if (bakiyeListesi.length === 0) {
        return { gecerli: false };
      }
      const toplamBakiye = bakiyeListesi.reduce(function (toplam, t) {
        return toplam + Number(t.sanal_kopya.bakiye_usd);
      }, 0);
      const baslangic = odaTraderlar.length * 1000;
      const degisimYuzde = baslangic > 0 ? ((toplamBakiye - baslangic) / baslangic) * 100 : 0;
      return {
        gecerli: true,
        toplamBakiye: toplamBakiye,
        baslangic: baslangic,
        degisimYuzde: degisimYuzde,
        odaTraderSayisi: odaTraderlar.length,
        bakiyeTraderSayisi: bakiyeListesi.length
      };
    }

    // Oda ve Risk ışık sayıları hesaplama
    function isikSayilariHesapla(traderListesi) {
      if (!Array.isArray(traderListesi) || traderListesi.length === 0) {
        return { gecerli: false, yesil: 0, sari: 0, kirmizi: 0, bilinmeyen: 0, enKotu: null };
      }
      let yesil = 0;
      let sari = 0;
      let kirmizi = 0;
      let bilinmeyen = 0;

      for (let i = 0; i < traderListesi.length; i++) {
        const isik = isikDegeriAl(traderListesi[i]);
        if (isik === "yesil") yesil++;
        else if (isik === "sari") sari++;
        else if (isik === "kirmizi") kirmizi++;
        else bilinmeyen++;
      }

      if (yesil === 0 && sari === 0 && kirmizi === 0) {
        return { gecerli: false, yesil: 0, sari: 0, kirmizi: 0, bilinmeyen: bilinmeyen, enKotu: null };
      }

      let enKotu = "yesil";
      if (kirmizi > 0) enKotu = "kirmizi";
      else if (sari > 0) enKotu = "sari";

      return {
        gecerli: true,
        yesil: yesil,
        sari: sari,
        kirmizi: kirmizi,
        bilinmeyen: bilinmeyen,
        enKotu: enKotu
      };
    }

    // Lab veri yaşı hesaplama ("12 dk önce"; 90 dk'dan eskiyse sarı)
    function veriYasiHesapla(veri) {
      if (!veri || typeof veri.uretildi !== "string" || !veri.uretildi.trim()) {
        return { gecerli: false };
      }
      const uretildiMs = Date.parse(veri.uretildi);
      if (Number.isNaN(uretildiMs)) {
        return { gecerli: false };
      }
      const farkDk = Math.max(0, Math.floor((Date.now() - uretildiMs) / 60000));
      return {
        gecerli: true,
        dakika: farkDk,
        metin: farkDk + " dk önce",
        eskiMi: farkDk > 90,
        isoMetin: veri.uretildi
      };
    }

    function dolarBicimle(tutar) {
      const yuvarlanmis = Math.round(tutar);
      return "$" + yuvarlanmis.toLocaleString("tr-TR");
    }

    function yuzdeBicimle(deger) {
      const isaret = deger > 0 ? "+" : "";
      return isaret + deger.toFixed(1).replace(".", ",") + "%";
    }

    // =========================================================================
    // Rozet Bilgisi Üretimi
    // =========================================================================
    function odaRozetBilgisiUret(anahtar) {
      const oda = ODALAR[anahtar];
      const veri = durum.veri;

      if (!oda.rozetGoster) {
        return {
          gorunur: false,
          baslik: oda.ad,
          deger: "",
          sinif: "",
          ariaLabel: oda.ad + " bölgesi (rozet yok). Detaylar için dokunun."
        };
      }

      if (oda.sadeEtiket) {
        return {
          gorunur: true,
          baslik: oda.ad,
          deger: "",
          sinif: "rozet-sade",
          ariaLabel: oda.ad + " bölgesi. Detaylar için dokunun."
        };
      }

      if (anahtar === "makam") {
        const hafta = makamHaftaHesapla(new Date());
        return {
          gorunur: true,
          baslik: "Makam",
          deger: "Hafta " + hafta,
          sinif: "",
          ariaLabel: "Makam bölgesi: Hafta " + hafta
        };
      }

      if (anahtar === "finans") {
        const m = finansMetrikHesapla(veri);
        if (!m.gecerli) {
          return {
            gorunur: true,
            baslik: "Finans",
            deger: "veri yok",
            sinif: "",
            ariaLabel: "Finans bölgesi: veri yok"
          };
        }
        const degerMetni = dolarBicimle(m.toplamBakiye) + " (" + yuzdeBicimle(m.degisimYuzde) + ")";
        return {
          gorunur: true,
          baslik: "Finans",
          deger: degerMetni,
          sinif: "",
          ariaLabel: "Finans bölgesi: Kasa " + dolarBicimle(m.toplamBakiye) + ", başlangıçtan değişim " + yuzdeBicimle(m.degisimYuzde)
        };
      }

      if (anahtar === "risk") {
        const odaTraderlar = odaTraderlariniAl(veri);
        const kaynakListe = (odaTraderlar && odaTraderlar.length > 0)
          ? odaTraderlar
          : (veri && Array.isArray(veri.traderlar) ? veri.traderlar : null);
        const isiklar = isikSayilariHesapla(kaynakListe);
        const kalabalik = kalabalikDurumuCozumle(veri ? veri.kalabalik : undefined);

        if (!isiklar.gecerli && !kalabalik.veriVar) {
          return {
            gorunur: true,
            baslik: "Risk",
            deger: "veri yok",
            sinif: "",
            ariaLabel: "Risk bölgesi: veri yok"
          };
        }

        const enKotuSimge = isiklar.gecerli ? isikSimgeAl(isiklar.enKotu) : "";
        const sayilarMetni = isiklar.gecerli
          ? ("🟢" + isiklar.yesil + " 🟡" + isiklar.sari + " 🔴" + isiklar.kirmizi)
          : "veri yok";
        const uyariEk = kalabalik.uyariVar ? " ⚠" : "";
        return {
          gorunur: true,
          baslik: "Risk " + enKotuSimge + uyariEk,
          deger: sayilarMetni,
          sinif: isiklar.enKotu === "kirmizi" || kalabalik.uyariVar ? "uyari-kirmizi" : "",
          ariaLabel: "Risk bölgesi: En kötü ışık " + isikAdAl(isiklar.enKotu) +
            ", " + isiklar.yesil + " yeşil, " + isiklar.sari + " sarı, " + isiklar.kirmizi + " kırmızı" +
            (kalabalik.uyariVar ? ", kalabalık uyarısı var" : "")
        };
      }

      if (anahtar === "oda") {
        const odaTraderlar = odaTraderlariniAl(veri);
        if (!odaTraderlar) {
          return {
            gorunur: true,
            baslik: "Oda",
            deger: "veri yok",
            sinif: "",
            ariaLabel: "Oda bölgesi: veri yok"
          };
        }
        const isiklar = isikSayilariHesapla(odaTraderlar);
        const ustMetin = "Oda · " + odaTraderlar.length + " trader";
        const altMetin = isiklar.gecerli
          ? ("🟢" + isiklar.yesil + " 🟡" + isiklar.sari + " 🔴" + isiklar.kirmizi)
          : "veri yok";
        return {
          gorunur: true,
          baslik: ustMetin,
          deger: altMetin,
          sinif: "",
          ariaLabel: "Oda bölgesi: " + odaTraderlar.length + " trader, " +
            (isiklar.gecerli ? (isiklar.yesil + " yeşil, " + isiklar.sari + " sarı, " + isiklar.kirmizi + " kırmızı") : "ışık verisi yok")
        };
      }

      if (anahtar === "lab") {
        const yas = veriYasiHesapla(veri);
        if (!yas.gecerli) {
          return {
            gorunur: true,
            baslik: "Lab",
            deger: "veri yok",
            sinif: "",
            ariaLabel: "Lab bölgesi: veri yok"
          };
        }
        return {
          gorunur: true,
          baslik: "Lab",
          deger: yas.metin,
          sinif: yas.eskiMi ? "uyari-sari" : "",
          ariaLabel: "Lab bölgesi: Veri yaşı " + yas.metin + (yas.eskiMi ? " (90 dakikadan eski)" : "")
        };
      }

      return {
        gorunur: true,
        baslik: oda.ad,
        deger: "veri yok",
        sinif: "",
        ariaLabel: oda.ad + " bölgesi: veri yok"
      };
    }

    // =========================================================================
    // Harita Bölgeleri ve Rozetlerin Çizimi
    // =========================================================================
    function haritaBolgeleriniOlustur() {
      bolgeSvgEl.innerHTML = "";
      rozetKatmaniEl.innerHTML = "";

      const anahtarlar = Object.keys(ODALAR);
      for (let i = 0; i < anahtarlar.length; i++) {
        const anahtar = anahtarlar[i];
        const oda = ODALAR[anahtar];

        // 1. SVG Çokgen
        const grup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        const noktalar = oda.poligon.map(function (n) {
          return (n.x * 1000).toFixed(1) + "," + (n.y * 1000).toFixed(1);
        }).join(" ");

        poly.setAttribute("points", noktalar);
        poly.setAttribute("class", "oda-poligon");
        poly.setAttribute("data-oda", anahtar);
        poly.setAttribute("role", "button");
        poly.setAttribute("tabindex", "0");
        poly.setAttribute("aria-label", oda.ad + " bölgesi");
        poly.style.setProperty("--bolge-dolgu", oda.renk);
        poly.style.setProperty("--bolge-cizgi", oda.cizgi);

        poly.addEventListener("click", function (olay) {
          if (suruklemeOlduMu) return;
          olay.stopPropagation();
          odayaOdaklan(anahtar);
        });

        poly.addEventListener("keydown", function (olay) {
          if (olay.key === "Enter" || olay.key === " ") {
            olay.preventDefault();
            odayaOdaklan(anahtar);
          }
        });

        grup.appendChild(poly);

        // Hata ayıklama (?bolge=1) köşe noktaları ve merkez etiketi
        let topX = 0;
        let topY = 0;
        for (let k = 0; k < oda.poligon.length; k++) {
          const kose = oda.poligon[k];
          topX += kose.x;
          topY += kose.y;
          const daire = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          daire.setAttribute("cx", (kose.x * 1000).toFixed(1));
          daire.setAttribute("cy", (kose.y * 1000).toFixed(1));
          daire.setAttribute("r", "5");
          daire.setAttribute("class", "bolge-kose-nokta");
          grup.appendChild(daire);
        }

        const merkezX = (topX / oda.poligon.length) * 1000;
        const merkezY = (topY / oda.poligon.length) * 1000;
        const debugYazi = document.createElementNS("http://www.w3.org/2000/svg", "text");
        debugYazi.setAttribute("x", merkezX.toFixed(1));
        debugYazi.setAttribute("y", merkezY.toFixed(1));
        debugYazi.setAttribute("class", "bolge-debug-etiket");
        debugYazi.textContent = oda.ad + " (" + anahtar + ")";
        grup.appendChild(debugYazi);

        bolgeSvgEl.appendChild(grup);

        // 2. Oda Üstü Rozet Düğmesi (Dokunma alanı >= 44x44px)
        const rozetDugme = document.createElement("button");
        rozetDugme.type = "button";
        rozetDugme.className = "oda-rozet-kapsayici" + (oda.rozetGoster ? "" : " rozet-gorunmez");
        rozetDugme.id = "rozet-" + anahtar;
        rozetDugme.setAttribute("data-oda", anahtar);
        rozetDugme.style.left = (oda.rozetKonum.x * 100).toFixed(2) + "%";
        rozetDugme.style.top = (oda.rozetKonum.y * 100).toFixed(2) + "%";

        const kutu = document.createElement("span");
        kutu.className = "rozet-kutu";
        kutu.id = "rozet-kutu-" + anahtar;

        const baslikSpan = document.createElement("span");
        baslikSpan.className = "rozet-baslik";
        baslikSpan.id = "rozet-baslik-" + anahtar;
        baslikSpan.textContent = oda.ad;

        const degerSpan = document.createElement("span");
        degerSpan.className = "rozet-deger";
        degerSpan.id = "rozet-deger-" + anahtar;

        kutu.appendChild(baslikSpan);
        kutu.appendChild(degerSpan);
        rozetDugme.appendChild(kutu);

        rozetDugme.addEventListener("click", function (olay) {
          if (suruklemeOlduMu) return;
          olay.stopPropagation();
          odayaOdaklan(anahtar);
        });

        rozetKatmaniEl.appendChild(rozetDugme);
      }

      rozetleriGuncelle();
    }

    function rozetleriGuncelle() {
      const anahtarlar = Object.keys(ODALAR);
      for (let i = 0; i < anahtarlar.length; i++) {
        const anahtar = anahtarlar[i];
        const bilgi = odaRozetBilgisiUret(anahtar);
        const dugmeEl = document.getElementById("rozet-" + anahtar);
        const kutuEl = document.getElementById("rozet-kutu-" + anahtar);
        const baslikEl = document.getElementById("rozet-baslik-" + anahtar);
        const degerEl = document.getElementById("rozet-deger-" + anahtar);
        const polyEl = bolgeSvgEl.querySelector('.oda-poligon[data-oda="' + anahtar + '"]');

        if (dugmeEl && kutuEl && baslikEl && degerEl) {
          baslikEl.textContent = bilgi.baslik;
          degerEl.textContent = bilgi.deger;
          degerEl.style.display = bilgi.deger ? "block" : "none";
          kutuEl.className = "rozet-kutu" + (bilgi.sinif ? " " + bilgi.sinif : "");
          dugmeEl.setAttribute("aria-label", bilgi.ariaLabel);
        }
        if (polyEl) {
          polyEl.setAttribute("aria-label", bilgi.ariaLabel);
        }
      }

      if (durum.seciliOda) {
        altPanelIceriginiOlustur(durum.seciliOda);
      }
    }

    // =========================================================================
    // 3. Odaya Yakınlaşma, Alt Panel ve "Binaya dön"
    // =========================================================================
    function sahneDonusumUygula(yumusak) {
      if (yumusak) {
        sahneEl.classList.add("yumusak-gecis");
      } else {
        sahneEl.classList.remove("yumusak-gecis");
      }
      sahneEl.style.transform =
        "translate3d(" + durum.kaydirX.toFixed(1) + "px, " + durum.kaydirY.toFixed(1) + "px, 0) scale(" + durum.olcek.toFixed(3) + ")";
    }

    function odayaOdaklan(anahtar) {
      const oda = ODALAR[anahtar];
      if (!oda) return;

      durum.seciliOda = anahtar;

      // Seçili stilini güncelle
      const tumPoligonlar = bolgeSvgEl.querySelectorAll(".oda-poligon");
      for (let i = 0; i < tumPoligonlar.length; i++) {
        tumPoligonlar[i].classList.toggle("secili", tumPoligonlar[i].getAttribute("data-oda") === anahtar);
      }
      const tumRozetler = rozetKatmaniEl.querySelectorAll(".oda-rozet-kapsayici");
      for (let i = 0; i < tumRozetler.length; i++) {
        tumRozetler[i].classList.toggle("secili", tumRozetler[i].getAttribute("data-oda") === anahtar);
      }

      // Hedef odak koordinatına yumuşak yakınlaşma hesapla
      const sahneGenislik = sahneEl.offsetWidth;
      const sahneYukseklik = sahneEl.offsetHeight;
      const disRect = disAlanEl.getBoundingClientRect();
      const sahneSolBaslangic = (disRect.width - sahneGenislik) / 2;
      const sahneUstBaslangic = (disRect.height - sahneYukseklik) / 2;

      const hedefOlcek = oda.odak && oda.odak.olcek ? oda.odak.olcek : 2.3;
      const odakX = (oda.odak ? oda.odak.x : oda.rozetKonum.x) * sahneGenislik;
      const odakY = (oda.odak ? oda.odak.y : oda.rozetKonum.y) * sahneYukseklik;

      // Alt panel ekranın alt yarısını kapladığı için odayı üst %36 noktasına hizala
      const gorunurMerkezX = disRect.width * 0.5;
      const gorunurMerkezY = disRect.height * 0.34;

      durum.olcek = hedefOlcek;
      durum.kaydirX = gorunurMerkezX - sahneSolBaslangic - (odakX * hedefOlcek);
      durum.kaydirY = gorunurMerkezY - sahneUstBaslangic - (odakY * hedefOlcek);

      sahneDonusumUygula(true);

      altPanelIceriginiOlustur(anahtar);
      altPanelEl.classList.add("acik");
      altPanelEl.setAttribute("aria-hidden", "false");
      haritaKontrollerEl.classList.add("panel-acik");
      ustBinayaDonDugme.hidden = false;
    }

    function binayaDon() {
      durum.seciliOda = null;
      durum.olcek = 1;
      durum.kaydirX = 0;
      durum.kaydirY = 0;
      sahneDonusumUygula(true);

      const tumPoligonlar = bolgeSvgEl.querySelectorAll(".oda-poligon");
      for (let i = 0; i < tumPoligonlar.length; i++) {
        tumPoligonlar[i].classList.remove("secili");
      }
      const tumRozetler = rozetKatmaniEl.querySelectorAll(".oda-rozet-kapsayici");
      for (let i = 0; i < tumRozetler.length; i++) {
        tumRozetler[i].classList.remove("secili");
      }

      altPanelEl.classList.remove("acik");
      altPanelEl.setAttribute("aria-hidden", "true");
      haritaKontrollerEl.classList.remove("panel-acik");
      ustBinayaDonDugme.hidden = true;
    }

    // =========================================================================
    // Alt Panel Ayrıntı Görünümü
    // =========================================================================
    function altPanelIceriginiOlustur(anahtar) {
      const oda = ODALAR[anahtar];
      const rozetBilgi = odaRozetBilgisiUret(anahtar);
      const veri = durum.veri;

      panelOdaAdiEl.textContent = oda.ad;
      panelOdaOzetEl.textContent = rozetBilgi.deger
        ? (rozetBilgi.baslik + " — " + rozetBilgi.deger)
        : (oda.rozetGoster ? "Sade etiketli oda bölgesi" : "Rozetsiz ortak alan");

      if (anahtar === "oda") {
        const odaTraderlar = odaTraderlariniAl(veri);
        if (!odaTraderlar) {
          panelIcerikEl.innerHTML = '<div class="bilgi-kutu">Bu oda için trader verisi yok.</div>';
          return;
        }
        const isiklar = isikSayilariHesapla(odaTraderlar);
        let html = '<div class="metrik-izgara">' +
          '<div class="metrik-kart"><div class="metrik-etiket">Oda Trader Sayısı</div><div class="metrik-deger">' + odaTraderlar.length + ' trader</div></div>' +
          '<div class="metrik-kart"><div class="metrik-etiket">Sağlık Dağılımı</div><div class="metrik-deger">' +
          (isiklar.gecerli ? ('🟢 ' + isiklar.yesil + ' · 🟡 ' + isiklar.sari + ' · 🔴 ' + isiklar.kirmizi) : 'veri yok') +
          '</div></div></div>';

        if (odaTraderlar.length === 0) {
          html += '<div class="bilgi-kutu">Oda kolunda kayıtlı trader bulunamadı.</div>';
        } else {
          html += '<table class="trader-tablo" aria-label="Oda kolu trader listesi">' +
            '<thead><tr><th>Takma Ad</th><th>Işık</th><th class="sayi-hucre">Sanal Getiri %</th><th class="sayi-hucre">Bakiye ($)</th></tr></thead><tbody>';

          for (let i = 0; i < odaTraderlar.length; i++) {
            const t = odaTraderlar[i];
            const ad = t.takma_ad || t.id || "veri yok";
            const isik = isikDegeriAl(t);
            const isikHucresi = isik ? (isikSimgeAl(isik) + " " + isikAdAl(isik)) : "veri yok";

            let getiriMetni = "veri yok";
            let getiriSinif = "notr";
            if (t.sanal_kopya && typeof t.sanal_kopya.getiri === "number" && !Number.isNaN(t.sanal_kopya.getiri)) {
              const g = Number(t.sanal_kopya.getiri);
              getiriMetni = yuzdeBicimle(g * 100);   // durum.json getiri oran (0,012 = %1,2)
              getiriSinif = g > 0 ? "pozitif" : (g < 0 ? "negatif" : "notr");
            }

            let bakiyeMetni = "veri yok";
            if (t.sanal_kopya && typeof t.sanal_kopya.bakiye_usd === "number" && !Number.isNaN(t.sanal_kopya.bakiye_usd)) {
              bakiyeMetni = dolarBicimle(Number(t.sanal_kopya.bakiye_usd));
            }

            html += '<tr>' +
              '<td>' + htmlKacis(ad) + '</td>' +
              '<td>' + htmlKacis(isikHucresi) + '</td>' +
              '<td class="sayi-hucre ' + getiriSinif + '">' + htmlKacis(getiriMetni) + '</td>' +
              '<td class="sayi-hucre">' + htmlKacis(bakiyeMetni) + '</td>' +
              '</tr>';
          }
          html += '</tbody></table>';
        }
        panelIcerikEl.innerHTML = html;
        return;
      }

      if (anahtar === "finans") {
        const m = finansMetrikHesapla(veri);
        if (!m.gecerli) {
          panelIcerikEl.innerHTML = '<div class="bilgi-kutu">Finans hesaplaması için sanal kopya bakiye verisi yok.</div>';
          return;
        }
        const farkUsd = m.toplamBakiye - m.baslangic;
        const sinif = m.degisimYuzde > 0 ? "pozitif" : (m.degisimYuzde < 0 ? "negatif" : "notr");
        panelIcerikEl.innerHTML =
          '<div class="metrik-izgara">' +
            '<div class="metrik-kart"><div class="metrik-etiket">Toplam Sanal Kasa</div><div class="metrik-deger">' + htmlKacis(dolarBicimle(m.toplamBakiye)) + '</div></div>' +
            '<div class="metrik-kart"><div class="metrik-etiket">Başlangıç Kasası (' + m.odaTraderSayisi + ' × $1.000)</div><div class="metrik-deger">' + htmlKacis(dolarBicimle(m.baslangic)) + '</div></div>' +
            '<div class="metrik-kart"><div class="metrik-etiket">Başlangıçtan Değişim</div><div class="metrik-deger ' + sinif + '">' + htmlKacis(yuzdeBicimle(m.degisimYuzde)) + ' (' + htmlKacis(dolarBicimle(farkUsd)) + ')</div></div>' +
          '</div>' +
          '<div class="bilgi-kutu">Hesaplama: Oda kolundaki ' + m.bakiyeTraderSayisi + ' traderın <code>sanal_kopya.bakiye_usd</code> toplamı esas alınmıştır.</div>';
        return;
      }

      if (anahtar === "risk") {
        const odaTraderlar = odaTraderlariniAl(veri);
        const tumTraderlar = veri && Array.isArray(veri.traderlar) ? veri.traderlar : null;
        const odaIsiklar = isikSayilariHesapla(odaTraderlar);
        const tumIsiklar = isikSayilariHesapla(tumTraderlar);
        const kalabalik = kalabalikDurumuCozumle(veri ? veri.kalabalik : undefined);

        let html = '<div class="metrik-izgara">' +
          '<div class="metrik-kart"><div class="metrik-etiket">En Kötü Sağlık Işığı</div><div class="metrik-deger">' +
          (odaIsiklar.gecerli ? (isikSimgeAl(odaIsiklar.enKotu) + " " + isikAdAl(odaIsiklar.enKotu)) : "veri yok") +
          '</div></div>' +
          '<div class="metrik-kart"><div class="metrik-etiket">Oda Işık Dağılımı</div><div class="metrik-deger">' +
          (odaIsiklar.gecerli ? ("🟢 " + odaIsiklar.yesil + " · 🟡 " + odaIsiklar.sari + " · 🔴 " + odaIsiklar.kirmizi) : "veri yok") +
          '</div></div>' +
          '<div class="metrik-kart"><div class="metrik-etiket">Tüm Kollar Işık Dağılımı</div><div class="metrik-deger">' +
          (tumIsiklar.gecerli ? ("🟢 " + tumIsiklar.yesil + " · 🟡 " + tumIsiklar.sari + " · 🔴 " + tumIsiklar.kirmizi) : "veri yok") +
          '</div></div>' +
          '</div>';

        if (kalabalik.uyariVar) {
          html += '<div class="uyari-kutu">⚠ <strong>Kalabalık Uyarısı:</strong> ' + htmlKacis(kalabalik.aciklama) + '</div>';
        } else {
          html += '<div class="bilgi-kutu"><strong>Kalabalık Durumu:</strong> ' + htmlKacis(kalabalik.aciklama) + '</div>';
        }

        if (veri && veri.kalabalik && typeof veri.kalabalik === "object") {
          const anahtarlar = Object.keys(veri.kalabalik);
          if (anahtarlar.length > 0) {
            html += '<ul class="anahtar-liste">';
            for (let i = 0; i < anahtarlar.length; i++) {
              const k = anahtarlar[i];
              const v = veri.kalabalik[k];
              const gosterim = typeof v === "object" ? JSON.stringify(v) : String(v);
              html += '<li><span>' + htmlKacis(k) + '</span><strong>' + htmlKacis(gosterim) + '</strong></li>';
            }
            html += '</ul>';
          }
        }
        panelIcerikEl.innerHTML = html;
        return;
      }

      if (anahtar === "lab") {
        const yas = veriYasiHesapla(veri);
        if (!yas.gecerli) {
          panelIcerikEl.innerHTML = '<div class="bilgi-kutu">Üretim zamanı (<code>uretildi</code>) verisi yok.</div>';
          return;
        }
        panelIcerikEl.innerHTML =
          '<div class="metrik-izgara">' +
            '<div class="metrik-kart"><div class="metrik-etiket">Veri Yaşı</div><div class="metrik-deger">' + htmlKacis(yas.metin) + '</div></div>' +
            '<div class="metrik-kart"><div class="metrik-etiket">Eşik Durumu (90 dk)</div><div class="metrik-deger">' + (yas.eskiMi ? '🟡 90 dk üzeri (Eski)' : '🟢 Güncel') + '</div></div>' +
          '</div>' +
          '<div class="bilgi-kutu">Son veri üretim zamanı (ISO): <code>' + htmlKacis(yas.isoMetin) + '</code></div>';
        return;
      }

      if (anahtar === "makam") {
        const hafta = makamHaftaHesapla(new Date());
        panelIcerikEl.innerHTML =
          '<div class="metrik-izgara">' +
            '<div class="metrik-kart"><div class="metrik-etiket">Takip Haftası</div><div class="metrik-deger">Hafta ' + hafta + '</div></div>' +
            '<div class="metrik-kart"><div class="metrik-etiket">Başlangıç (t0)</div><div class="metrik-deger">2026-10-29</div></div>' +
          '</div>' +
          '<div class="bilgi-kutu">t0 = 2026-10-29 tarihinden itibaren geçen tam hafta sayısı + 1 olarak hesaplanır.</div>';
        return;
      }

      if (anahtar === "arsiv" || anahtar === "kapi" || anahtar === "sekreterlik") {
        let ekBilgi = '<div class="bilgi-kutu"><strong>' + htmlKacis(oda.ad) + ':</strong> Sade etiketli oda bölgesi.</div>';
        if (veri && Array.isArray(veri.traderlar)) {
          const kolSayilari = {};
          for (let i = 0; i < veri.traderlar.length; i++) {
            const kol = (veri.traderlar[i] && veri.traderlar[i].kol) ? veri.traderlar[i].kol : "belirsiz";
            kolSayilari[kol] = (kolSayilari[kol] || 0) + 1;
          }
          const kolAnahtarlari = Object.keys(kolSayilari);
          if (kolAnahtarlari.length > 0) {
            ekBilgi += '<ul class="anahtar-liste">';
            for (let i = 0; i < kolAnahtarlari.length; i++) {
              const k = kolAnahtarlari[i];
              ekBilgi += '<li><span>Kol: ' + htmlKacis(k) + '</span><strong>' + kolSayilari[k] + ' trader</strong></li>';
            }
            ekBilgi += '</ul>';
          }
        }
        panelIcerikEl.innerHTML = ekBilgi;
        return;
      }

      // Çay Ocağı
      panelIcerikEl.innerHTML =
        '<div class="bilgi-kutu"><strong>Çay Ocağı:</strong> Dinlenme ve sohbet alanı. Bu oda için harita üzerinde canlı rozet gösterilmez.</div>';
    }

    // =========================================================================
    // 4. Canlı Veri Okuma ve 5 Dakikada Bir Yenileme (Sekme Gizliyse Durdurma)
    // =========================================================================
    async function canliVeriOku() {
      if (durum.yukleniyor) return;
      durum.yukleniyor = true;
      ustYenileDugme.textContent = "Yükleniyor...";

      try {
        const yanit = await fetch(VERI_ADRESI, {
          method: "GET",
          cache: "no-store"
        });
        if (!yanit.ok) {
          throw new Error("HTTP " + yanit.status);
        }
        const json = await yanit.json();
        if (!json || typeof json !== "object") {
          throw new Error("Geçersiz JSON");
        }

        durum.veri = json;
        durum.sonOkumaHatasi = false;
        hataCubuguEl.hidden = true;

        const yas = veriYasiHesapla(json);
        sonGuncellemeEl.textContent = yas.gecerli
          ? ("Veri yaşı: " + yas.metin + " · Otomatik yenileme: 5 dk")
          : "Canlı veri yüklendi (üretim zamanı belirtilmemiş)";
      } catch (hata) {
        durum.sonOkumaHatasi = true;
        hataMetniEl.textContent = "Veri okunamadı";
        hataCubuguEl.hidden = false;
        sonGuncellemeEl.textContent = "Veri okunamadı — Yenile düğmesini kullanın";
      } finally {
        durum.yukleniyor = false;
        ustYenileDugme.textContent = "↻ Yenile";
        rozetleriGuncelle();
      }
    }

    function zamanlayiciyiBaslat() {
      zamanlayiciyiDurdur();
      if (!document.hidden) {
        durum.yenilemeZamanlayici = setInterval(function () {
          if (!document.hidden) {
            canliVeriOku();
          }
        }, YENILEME_ARALIGI_MS);
      }
    }

    function zamanlayiciyiDurdur() {
      if (durum.yenilemeZamanlayici !== null) {
        clearInterval(durum.yenilemeZamanlayici);
        durum.yenilemeZamanlayici = null;
      }
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        // 4. Sekme gizliyse 5 dakikalık yenilemeyi durdur
        zamanlayiciyiDurdur();
      } else {
        canliVeriOku();
        zamanlayiciyiBaslat();
      }
    });

    // Veri yaşını ekranda dakikada bir tazele
    durum.yasGuncellemeZamanlayici = setInterval(function () {
      if (!document.hidden && durum.veri) {
        rozetleriGuncelle();
      }
    }, 30000);

    // =========================================================================
    // Parmakla Yakınlaştırma (Pinch-to-Zoom) ve Kaydırma (Pan) Desteği
    // =========================================================================
    let suruklemeAktif = false;
    let suruklemeOlduMu = false;
    let baslangicX = 0;
    let baslangicY = 0;
    let baslangicKaydirX = 0;
    let baslangicKaydirY = 0;
    let ilkPinchMesafe = 0;
    let ilkPinchOlcek = 1;
    let pinchMerkezX = 0;
    let pinchMerkezY = 0;

    function ikiParmakMesafe(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }

    disAlanEl.addEventListener("touchstart", function (olay) {
      if (olay.touches.length === 1) {
        suruklemeAktif = true;
        suruklemeOlduMu = false;
        baslangicX = olay.touches[0].clientX;
        baslangicY = olay.touches[0].clientY;
        baslangicKaydirX = durum.kaydirX;
        baslangicKaydirY = durum.kaydirY;
      } else if (olay.touches.length === 2) {
        suruklemeAktif = false;
        suruklemeOlduMu = true;
        ilkPinchMesafe = ikiParmakMesafe(olay.touches[0], olay.touches[1]);
        ilkPinchOlcek = durum.olcek;
        const sahneRect = sahneEl.getBoundingClientRect();
        const ortaX = (olay.touches[0].clientX + olay.touches[1].clientX) / 2;
        const ortaY = (olay.touches[0].clientY + olay.touches[1].clientY) / 2;
        pinchMerkezX = (ortaX - sahneRect.left) / durum.olcek;
        pinchMerkezY = (ortaY - sahneRect.top) / durum.olcek;
      }
    }, { passive: true });

    disAlanEl.addEventListener("touchmove", function (olay) {
      if (olay.touches.length === 1 && suruklemeAktif) {
        const dx = olay.touches[0].clientX - baslangicX;
        const dy = olay.touches[0].clientY - baslangicY;
        if (Math.hypot(dx, dy) > 6) {
          suruklemeOlduMu = true;
        }
        if (suruklemeOlduMu) {
          durum.kaydirX = baslangicKaydirX + dx;
          durum.kaydirY = baslangicKaydirY + dy;
          sahneDonusumUygula(false);
        }
      } else if (olay.touches.length === 2 && ilkPinchMesafe > 0) {
        const yeniMesafe = ikiParmakMesafe(olay.touches[0], olay.touches[1]);
        const yeniOlcek = Math.min(4.0, Math.max(0.85, ilkPinchOlcek * (yeniMesafe / ilkPinchMesafe)));
        const ortaX = (olay.touches[0].clientX + olay.touches[1].clientX) / 2;
        const ortaY = (olay.touches[0].clientY + olay.touches[1].clientY) / 2;
        const disRect = disAlanEl.getBoundingClientRect();
        const sahneSolBaslangic = (disRect.width - sahneEl.offsetWidth) / 2;
        const sahneUstBaslangic = (disRect.height - sahneEl.offsetHeight) / 2;

        durum.olcek = yeniOlcek;
        durum.kaydirX = ortaX - disRect.left - sahneSolBaslangic - (pinchMerkezX * yeniOlcek);
        durum.kaydirY = ortaY - disRect.top - sahneUstBaslangic - (pinchMerkezY * yeniOlcek);
        sahneDonusumUygula(false);
      }
    }, { passive: true });

    disAlanEl.addEventListener("touchend", function () {
      suruklemeAktif = false;
      ilkPinchMesafe = 0;
      setTimeout(function () {
        suruklemeOlduMu = false;
      }, 60);
    }, { passive: true });

    // Fare ile sürükleme ve tekerlek ile yakınlaştırma
    disAlanEl.addEventListener("mousedown", function (olay) {
      if (olay.button !== 0) return;
      suruklemeAktif = true;
      suruklemeOlduMu = false;
      disAlanEl.classList.add("surukleniyor");
      baslangicX = olay.clientX;
      baslangicY = olay.clientY;
      baslangicKaydirX = durum.kaydirX;
      baslangicKaydirY = durum.kaydirY;
    });

    window.addEventListener("mousemove", function (olay) {
      if (!suruklemeAktif) return;
      const dx = olay.clientX - baslangicX;
      const dy = olay.clientY - baslangicY;
      if (Math.hypot(dx, dy) > 5) {
        suruklemeOlduMu = true;
      }
      if (suruklemeOlduMu) {
        durum.kaydirX = baslangicKaydirX + dx;
        durum.kaydirY = baslangicKaydirY + dy;
        sahneDonusumUygula(false);
      }
    });

    window.addEventListener("mouseup", function () {
      if (!suruklemeAktif) return;
      suruklemeAktif = false;
      disAlanEl.classList.remove("surukleniyor");
      setTimeout(function () {
        suruklemeOlduMu = false;
      }, 40);
    });

    disAlanEl.addEventListener("wheel", function (olay) {
      olay.preventDefault();
      const carpan = olay.deltaY < 0 ? 1.15 : 0.87;
      const yeniOlcek = Math.min(4.0, Math.max(0.85, durum.olcek * carpan));
      durum.olcek = yeniOlcek;
      if (Math.abs(yeniOlcek - 1) < 0.05 && !durum.seciliOda) {
        durum.olcek = 1;
        durum.kaydirX = 0;
        durum.kaydirY = 0;
      }
      sahneDonusumUygula(true);
    }, { passive: false });

    // Yakınlaştırma kontrol düğmeleri
    yakinlastirDugme.addEventListener("click", function () {
      durum.olcek = Math.min(4.0, durum.olcek * 1.25);
      sahneDonusumUygula(true);
    });

    uzaklastirDugme.addEventListener("click", function () {
      durum.olcek = Math.max(0.85, durum.olcek * 0.8);
      if (durum.olcek <= 1.02 && !durum.seciliOda) {
        durum.olcek = 1;
        durum.kaydirX = 0;
        durum.kaydirY = 0;
      }
      sahneDonusumUygula(true);
    });

    sifirlaDugme.addEventListener("click", function () {
      binayaDon();
    });

    // =========================================================================
    // ?bolge=1 Hata Ayıklama Modu ve Genel Düğmeler
    // =========================================================================
    function bolgeModunuAyarla(aktif) {
      durum.bolgeModu = Boolean(aktif);
      sahneEl.classList.toggle("hata-ayiklama-aktif", durum.bolgeModu);
      bolgeModuDugme.classList.toggle("aktif-bolge", durum.bolgeModu);
      bolgeModuDugme.setAttribute("aria-pressed", durum.bolgeModu ? "true" : "false");
      try {
        const url = new URL(window.location.href);
        if (durum.bolgeModu) {
          url.searchParams.set("bolge", "1");
        } else {
          url.searchParams.delete("bolge");
        }
        window.history.replaceState(null, "", url.toString());
      } catch (e) {
        // Sandbox ortamında history kısıtlıysa sessizce devam et
      }
    }

    bolgeModuDugme.addEventListener("click", function () {
      bolgeModunuAyarla(!durum.bolgeModu);
    });

    ustBinayaDonDugme.addEventListener("click", binayaDon);
    panelBinayaDonDugme.addEventListener("click", binayaDon);
    ustYenileDugme.addEventListener("click", canliVeriOku);
    hataYenileDugme.addEventListener("click", canliVeriOku);

    // Başlangıç kurulumu
    function baslat() {
      yerelGorseliDene();
      haritaBolgeleriniOlustur();

      const parametreler = new URLSearchParams(window.location.search);
      if (parametreler.get("bolge") === "1") {
        bolgeModunuAyarla(true);
      }

      canliVeriOku();
      zamanlayiciyiBaslat();
    }

    baslat();
  </script>
