<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Pano</title>
  <meta name="description" content="sg-arge paper trade panosu: sanal defter, gerçek para yok.">
  <link rel="stylesheet" href="vendor/tailwind.3.4.17.css">
  <script src="vendor/chart.umd.4.4.1.js"></script>
  <script src="vendor/lucide.0.460.0.min.js"></script>
  <style>
    :root {
      --bg: #0d1527; --header: #101a30; --card: #16223b; --hover: #1d2c4b; --border: #243555;
      --accent: #f5cb5c; --text: #e2e8f0; --muted: #94a3b8; --up: #10b981; --down: #ef4444;
    }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; }
    .nav-btn.active { background-color: #1c2a47; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
    .nav-btn.active i { color: var(--accent); }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
    .empty { padding: 1.25rem; text-align: center; color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 0.25rem; font-size: 10px; font-weight: 600; }
    /* copy trade sekmeleri (telefon öncelikli: tek sütun, tablo yok, yatay kaydırma yok) */
    .ct-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .ct-card { display: block; min-width: 0; padding: 0.875rem; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .ct-card:hover, .ct-card:focus-visible { background: var(--hover); outline: none; }
    .ct-card.kirmizi { opacity: 0.6; }
    .ct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .ct-name { font-weight: 700; color: #fff; font-size: 15px; }
    .ct-sub { font-size: 11px; color: var(--muted); }
    .ct-pos { border-top: 1px solid var(--border); padding: 0.5rem 0; font-size: 12px; }
    .ct-pos .l1 { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
    .ct-pos .l1 > span:first-child { display: inline-flex; align-items: center; gap: 0.375rem; white-space: nowrap; }
    .ct-pos .l2 { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .ct-sec { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); font-size: 12px; }
    .ct-b-ok { background: rgba(16,185,129,.18); color: #34d399; } .ct-b-warn { background: rgba(245,203,92,.18); color: #f5cb5c; }
    .ct-b-bad { background: rgba(239,68,68,.18); color: #f87171; } .ct-b-mut { background: rgba(148,163,184,.18); color: #cbd5e1; }
    /* sabit üst şerit: sticky'nin çalışması için CT sekmesi açıkken main/kap taşma kırpmasını bırakır (belge kayar) */
    body.ct-aktif #layoutWrap, body.ct-aktif #main { overflow: visible; }
    .ct-sticky { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 0.375rem 0; margin-top: -0.375rem; }
    .ct-strip { padding: 0.375rem 0.625rem; font-size: 11px; color: var(--muted); }
    .ct-strip.stale { border-color: #b45309; background: #2a2012; color: #fcd34d; }
    .ct-stat { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 0.5rem; }
    .ct-stat .k { font-size: 9px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .ct-stat .v { font-size: 13px; font-weight: 700; color: #fff; overflow-wrap: anywhere; }
    .ct-age { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 0.5rem; font-size: 10px; }
    .ct-card.tik { cursor: pointer; }
    .ct-pos summary { list-style: none; cursor: pointer; }
    .ct-pos summary::-webkit-details-marker { display: none; }
    .ct-pos summary .ok { display: inline-block; color: var(--muted); transition: transform .15s; margin-left: 2px; }
    .ct-pos[open] summary .ok { transform: rotate(90deg); }
    .ct-bn { display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
    .ct-pos .ek span { white-space: nowrap; }
    .ct-pos .ek { color: var(--muted); font-size: 11px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 0.75rem; align-items: center; }
    .ct-row { padding: 0.625rem 0; border-top: 1px solid var(--border); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    .ct-row:first-child { border-top: 0; }
    @media (max-width: 359px) { .yenile-yazi { display: none; } }
    .ct-detay { max-width: 760px; }
    .ct-btn { background: #1c2a47; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem 0.875rem; font-size: 12px; color: var(--text); min-height: 40px; }
    .ct-btn[disabled] { opacity: 0.4; }
    .ct-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem; }
    .ct-kv > div { background: #101a30; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.375rem 0.5rem; min-width: 0; }
    .ct-kv .k { font-size: 10px; color: var(--muted); } .ct-kv .v { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ÜST BAŞLIK -->
  <header class="bg-[#101a30] border-b border-[#243555] px-4 py-2.5 flex items-center justify-between gap-3">
    <h1 class="text-base font-bold text-white min-w-0 truncate">SG Pano · Copy trade</h1>
    <div class="flex items-center gap-2 flex-shrink-0">
      <span class="text-[11px] text-slate-400 whitespace-nowrap" id="dataAge">—</span>
      <button onclick="ctYukle(true)" class="ct-btn flex items-center justify-center gap-1.5" style="padding:0.375rem 0.75rem;min-height:36px" aria-label="Yenile">
        <i id="refreshIcon" data-lucide="refresh-cw" class="w-3.5 h-3.5 text-[#f5cb5c]"></i><span class="yenile-yazi">Yenile</span>
      </button>
    </div>
  </header>

  <div id="layoutWrap" class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <!-- MENÜ: geniş ekranda sol sütun, dar ekranda yatay şerit -->
    <aside class="lg:w-60 bg-[#101a30] border-b lg:border-b-0 lg:border-r border-[#243555] flex lg:flex-col justify-between flex-shrink-0">
      <nav id="nav" class="flex lg:flex-col overflow-x-auto lg:overflow-visible py-1 lg:py-2 text-xs w-full"></nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-6" id="main">
      <!-- COPY TRADE: ana ekran (kartlar) + ayrıntı -->
      <section data-tab="ct" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctMain"></div>
      </section>

      <!-- COPY TRADE: akış -->
      <section data-tab="ctakis" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctAkis"></div>
      </section>

      <!-- COPY TRADE: istatistik -->
      <section data-tab="ctistat" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctIstat"></div>
      </section>

    </main>
  </div>

<script>
  const TABS = [
    ['ct', 'Copy trade', 'users'], ['ctakis', 'CT akış', 'activity'], ['ctistat', 'CT istatistik', 'bar-chart-3'],
  ];
  const charts = {};

  // ---------- yardımcılar
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
  const cls = (v) => !isNum(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  function buildNav() {
    $('nav').innerHTML = TABS.map(([id, label, icon]) =>
      `<button data-nav="${id}" onclick="showTab('${id}')" class="nav-btn flex items-center gap-2.5 px-4 py-2.5 text-slate-300 hover:bg-[#1a2438] whitespace-nowrap lg:w-full">
         <i data-lucide="${icon}" class="w-4 h-4 text-slate-400"></i><span>${label}</span><span class="ml-auto text-[10px] text-slate-400" id="navc-${id}"></span></button>`).join('');
  }
  function showTab(id) {
    document.querySelectorAll('.tab').forEach((s) => s.classList.toggle('hidden', s.dataset.tab !== id));
    document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.nav === id));
    document.body.classList.toggle('ct-aktif', id.startsWith('ct'));
    if (id === 'ct') ctCizim();
  }

  function chart(id, cfg) {
    if (charts[id]) charts[id].destroy();
    const el = $(id); if (!el || !window.Chart) return;
    charts[id] = new Chart(el, cfg);
  }
  const axes = { x: { ticks: { color: '#94a3b8', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: '#1f2b42' } }, y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1f2b42' } } };
  const base = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: axes };

  // ---------- copy trade izleme (tanım: sg-arge docs/PANO_COPYTRADE.md, veri: docs/VERI_SOZLESMESI.md, surum 1)
  // Kaynak adresleri yalnız burada değişir (canlı: sg-arge copytrade-izleme dalı; örnek sabit veri: ./izleme/ornek_durum.json).
  const CT_KAYNAK = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/durum.json';
  const CT_KARAR = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/kararlar.jsonl'; // dosya yoksa (404) karar kaydı yok sayılır
  const CT_ESKI_DK = 90, CT_SAYFA = 8, CT_AKIS_ADIM = 50, CT_YETERSIZ = 10; // eşik: sözleşme v1.1 (<10 kapanmış ve kararı verilmiş olay)
  let CT = null, CTK = { durum: 'yok', kayit: {}, bozuk: 0 }, ctHata = null;
  let ctSel = null, ctSayfa = 0, ctFiltre = '', ctAkisN = CT_AKIS_ADIM;

  const ISIK = { yesil: ['🟢', 'Yeşil'], sari: ['🟡', 'Sarı'], kirmizi: ['🔴', 'Kırmızı'] };
  const TUR = { acilis: 'Açılış', kapanis: 'Kapanış', buyutme: 'Büyütme', azaltma: 'Azaltma', isik: 'Işık' };
  const NEDEN = { gec_gordum: 'geç gördüm', begenmedim: 'beğenmedim', bakiye_yok: 'bakiye yok', diger: 'diğer' };
  const ctIsik = (t) => (ISIK[t.saglik && t.saglik.isik] || ['⚪', 'Bilinmiyor']);
  const ctKirmizi = (t) => !!t.saglik && t.saglik.isik === 'kirmizi';
  const ctYonCls = (y) => y === 'long' ? 'up' : y === 'short' ? 'down' : 'flat';
  const ctYonRozet = (y) => ctRozet(ctYon(y) || '?', y === 'long' ? 'ct-b-ok' : y === 'short' ? 'ct-b-bad' : 'ct-b-mut');
  const ctKaldirac = (v) => isNum(v) ? ctRozet(fmt(v, 1).replace(',0', '') + 'x', 'ct-b-mut') : '';
  const ctRozet = (txt, c) => `<span class="badge ${c}">${esc(txt)}</span>`;
  const ctKapiRozet = (k) => { const s = k && k.sinif; return ctRozet(s || 'kapı yok', s === 'Geçti' ? 'ct-b-ok' : s === 'Yetersiz' ? 'ct-b-warn' : s === 'Kaldı' ? 'ct-b-bad' : 'ct-b-mut'); };
  // oranlar (0,08) → %8 ; sayılar Türkçe biçim, para "1.043,20 $"
  const ctP = (v, d = 0) => isNum(v) ? '%' + fmt(v * 100, d) : '—';
  const ctPs = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '-' : '') + '%' + fmt(Math.abs(v * 100), d) : '—';
  const ctUsd = (v, d = 2) => isNum(v) ? (v < 0 ? '-' : '') + fmt(Math.abs(v), d) + ' $' : '—';
  const ctUsdA = (v) => ctUsd(v, isNum(v) && Math.abs(v) < 100 ? 2 : 0); // küçük tutarlar kuruşlu
  const ctUsds = (v, d) => isNum(v) ? (v > 0 ? '+' : '') + (d === undefined ? ctUsdA(v) : ctUsd(v, d)) : '—';
  const ctFiyat = (v) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: v >= 1000 ? 2 : v >= 1 ? 4 : 6 }) : '—';
  const ctYon = (y) => y ? String(y).toUpperCase() : '';
  const ctDate = (iso) => new Date(String(iso || '').replace(/(\.\d{3})\d+/, '$1')); // Safari/WebKit için kesir 3 haneye
  const ctTarih = (iso, tamZaman) => {
    const t = iso ? ctDate(iso) : null; if (!t || isNaN(t)) return '—';
    return t.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit', ...(tamZaman === false ? {} : { hour: '2-digit', minute: '2-digit' }) });
  };
  const ctAdr = (a) => { a = String(a || ''); return a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a; };
  function ctYas(dk) { return dk < 60 ? `${dk} dk önce` : dk < 2880 ? `${Math.round(dk / 60)} sa önce` : `${Math.round(dk / 1440)} gün önce`; }
  function ctBinance(b) {
    const m = b === 'var' ? ['badge-check', 'up', "Binance'te var"] : b === 'yok' ? ['ban', 'down', "Binance'te yok"] : ['circle-help', 'flat', 'Binance durumu bilinmiyor'];
    return `<span class="ct-bn ${m[1]}" title="${esc(m[2])}" aria-label="${esc(m[2])}"><i data-lucide="${m[0]}" class="w-3.5 h-3.5"></i></span>`;
  }

  // Kapanmış sanal sonucu olan olaylar (acilis/buyutme); sonuç = kopyalanan tutara göre maliyet sonrası net %, ortalaması alınır.
  const ctKapali = (o) => o.sanal_sonuc && o.sanal_sonuc.durum === 'kapandi' && isNum(o.sanal_sonuc.net_yuzde);
  const ctOrt = (l) => l.length ? l.reduce((t, o) => t + o.sanal_sonuc.net_yuzde, 0) / l.length : null;
  function ctKarsilastir(olay) {
    const kapali = olay.filter(ctKapali), karar = (o) => CTK.kayit[o.id] && CTK.kayit[o.id].karar;
    const acti = kapali.filter((o) => karar(o) === 'acti'), atladi = kapali.filter((o) => karar(o) === 'atladi');
    const n = acti.length + atladi.length, oa = ctOrt(acti), ot = ctOrt(kapali);
    return { n, yeterli: n >= CT_YETERSIZ, tum: { n: kapali.length, ort: ot }, acti: { n: acti.length, ort: oa }, atladi: { n: atladi.length, ort: ctOrt(atladi) },
      fark: isNum(oa) && isNum(ot) ? oa - ot : null };
  }
  function ctKarsilastirHtml(k) {
    const kv = (a, v) => `<div><div class="k">${esc(a)}</div><div class="v">${v}</div></div>`;
    if (!k.yeterli) return `<div class="ct-kv">${kv('Durum', '<span class="text-amber-300">yetersiz veri</span>')}${kv('Kapanmış + karar verilmiş', `${k.n} / ${CT_YETERSIZ}`)}${kv('Tüm olaylar', `${ctPs(k.tum.ort)} <span class="ct-sub">(${k.tum.n})</span>`)}</div>`;
    return `<div class="ct-kv">${kv('Tüm olaylar (ort.)', `<span class="${cls(k.tum.ort)}">${ctPs(k.tum.ort)}</span> <span class="ct-sub">(${k.tum.n})</span>`)}${kv('Açtıklarım (ort.)', `<span class="${cls(k.acti.ort)}">${ctPs(k.acti.ort)}</span> <span class="ct-sub">(${k.acti.n})</span>`)}${kv('Fark', `<b class="${cls(k.fark)}">${ctPs(k.fark)}</b>`)}</div>`;
  }
  const ctSanalRozet = (o) => !o.sanal_sonuc ? '' : o.sanal_sonuc.durum === 'kapandi' && isNum(o.sanal_sonuc.net_yuzde)
    ? ctRozet('sanal ' + ctPs(o.sanal_sonuc.net_yuzde), o.sanal_sonuc.net_yuzde >= 0 ? 'ct-b-ok' : 'ct-b-bad') : o.sanal_sonuc.durum === 'acik' ? ctRozet('sanal: açık', 'ct-b-mut') : '';

  // Sıralama yalnız görünüm içindir: kırmızı en alta, kalanlar form skoruna göre (skoru olmayan sona).
  function ctSirala(list) {
    const sk = (t) => isNum(t.form && t.form.skor) ? t.form.skor : -Infinity;
    return list.slice().sort((a, b) => (ctKirmizi(a) - ctKirmizi(b)) || (sk(b) - sk(a)));
  }

  function ctSparkline(egri) {
    const y = (egri || []).map((p) => p && p[1]).filter(isNum);
    if (y.length < 2) return '<div class="ct-sub">kâr eğrisi yok</div>';
    const mn = Math.min(...y), mx = Math.max(...y), r = mx - mn || 1;
    const pts = y.map((v, i) => `${(i / (y.length - 1) * 100).toFixed(2)},${(28 - (v - mn) / r * 26 - 1).toFixed(2)}`).join(' ');
    const c = y[y.length - 1] >= y[0] ? '#10b981' : '#ef4444';
    return `<svg viewBox="0 0 100 28" preserveAspectRatio="none" class="w-full" style="height:36px" role="img" aria-label="Son 90 gün kâr eğrisi"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function ctSanalKopya(sk) {
    if (!sk) return '<div class="ct-sub">sanal kopya: henüz veri yok</div>';
    return `<div>sanal kopya: <b>${ctUsd(sk.baslangic_usd, 0)} → <span class="${cls(sk.getiri)}">${ctUsd(sk.bakiye_usd)}</span></b>
      <span class="ct-sub">(t0'dan beri, ${isNum(sk.gecikme_dk) ? fmt(sk.gecikme_dk, 0) : '?'} dk gecikmeli)</span></div>`;
  }

  // Kart özeti: coin, yön, kaldıraç, hesap payı, anlık K/Z. Giriş, büyüklük, açılış saati, Binance dokununca açılır (ayrıntı sayfasında açık gelir).
  function ctPozisyon(p, acik) {
    return `<details class="ct-pos"${acik ? ' open' : ''}><summary><div class="l1"><span><b class="text-white">${esc(p.coin)}</b> ${ctYonRozet(p.yon)} ${ctKaldirac(p.kaldirac)}</span>
      <span><b class="${cls(p.anlik_kz_usd)}">${ctUsds(p.anlik_kz_usd)}</b> <span class="ok">›</span></span></div>
      <div class="l2">hesabın ${ctP(p.hesap_payi)}</div></summary>
      <div class="ek"><span>giriş ${ctFiyat(p.giris)}</span><span>${ctUsdA(p.buyukluk_usd)}</span><span>açılış ${esc(ctTarih(p.acilis))}</span><span class="ct-bn">${ctBinance(p.binance)} Binance</span></div></details>`;
  }

  function ctKart(t) {
    const [em, ad] = ctIsik(t), kir = ctKirmizi(t), poz = t.pozisyonlar || [], si = t.son_islem;
    return `<div class="card ct-card tik${kir ? ' kirmizi' : ''}" onclick="if(!event.target.closest('details,a'))location.hash='ct/${encodeURIComponent(t.id)}'">
      <div class="ct-head"><a href="#ct/${encodeURIComponent(t.id)}" class="ct-name" style="color:#fff;text-decoration:none" aria-label="${esc(t.takma_ad)} ayrıntısı">${esc(t.takma_ad)}</a><span title="Sağlık: ${esc(ad)}" aria-label="Sağlık: ${esc(ad)}">${em}</span>${ctKapiRozet(t.kapi)}
        ${kir ? ctRozet('izlemede — kopyalama', 'ct-b-bad') : t.durum && t.durum !== 'kopyala' ? ctRozet(t.durum, 'ct-b-mut') : ''}</div>
      <div class="ct-sub mt-1">form ${isNum(t.form && t.form.skor) ? fmt(t.form.skor, 1) : '—'} · 30 g ${ctPs(t.form && t.form.getiri_30g)}</div>
      <div class="mt-2">${poz.length ? poz.map((p) => ctPozisyon(p)).join('') : '<div class="ct-pos ct-sub">pozisyon yok</div>'}</div>
      <div class="ct-sec">${si ? `son işlem: <b class="text-white">${esc(si.coin)}</b> ${ctYonRozet(si.yon)} · <b class="${cls(si.net_yuzde)}">${ctPs(si.net_yuzde)}</b>` : '<span class="ct-sub">son işlem yok</span>'}</div>
      <div class="ct-sec">${ctSparkline(t.egri)}<div class="ct-sub">son 90 gün kâr eğrisi</div></div>
      <div class="ct-sec">${ctSanalKopya(t.sanal_kopya)}</div></div>`;
  }

  // ---------- üst şerit (güncelleme zamanı + veri yaşı) ve hata mesajı
  function ctSerit() {
    const msg = document.querySelectorAll('.ct-msg'), bar = document.querySelectorAll('.ct-strip');
    msg.forEach((el) => { el.classList.toggle('hidden', !ctHata); el.textContent = ctHata ? ctHata + (CT ? ' Son başarılı veri gösteriliyor.' : ' Gösterilecek veri yok; sahte veri kullanılmaz.') : ''; });
    let html = '', eski = false;
    if (CT) {
      const tr = CT.traderlar || [], acik = tr.reduce((n, t) => n + (t.pozisyonlar || []).length, 0);
      const sk = tr.map((t) => t.sanal_kopya).filter((k) => k && isNum(k.baslangic_usd) && isNum(k.bakiye_usd));
      const b0 = sk.reduce((n, k) => n + k.baslangic_usd, 0), fark = sk.reduce((n, k) => n + k.bakiye_usd - k.baslangic_usd, 0);
      const t = ctDate(CT.uretildi), gecerli = !isNaN(t), dk = gecerli ? Math.max(0, Math.round((Date.now() - t.getTime()) / 60000)) : null;
      eski = !gecerli || dk > CT_ESKI_DK;
      html = `<div class="ct-stat"><div><div class="k">Trader</div><div class="v">${tr.length}</div></div><div><div class="k">Açık poz.</div><div class="v">${acik}</div></div>
          <div><div class="k">Sanal kopya (hepsi)</div><div class="v ${sk.length ? cls(fark) : ''}">${sk.length ? `${ctUsds(fark)} (${ctPs(b0 ? fark / b0 : null)})` : 'veri yok'}</div></div></div>
        <div class="ct-age"><span>${eski ? '⚠ ' : ''}veri: ${gecerli ? esc(ctTarih(CT.uretildi)) + ' (' + esc(ctYas(dk)) + ')' : 'saati bilinmiyor'}</span>`
        + (eski ? `<span>${CT_ESKI_DK} dk'dan eski!</span>` : '')
        + (/^ornek/i.test(String(CT.kaynak || '')) ? '<span class="text-amber-300">ÖRNEK VERİ</span>' : '') + '</div>';
    } else html = '<span>Veri yok.</span>';
    bar.forEach((el) => { el.classList.toggle('stale', eski); el.innerHTML = html; });
    const yas = $('dataAge'), t0 = CT && ctDate(CT.uretildi);
    yas.textContent = t0 && !isNaN(t0) ? ctYas(Math.max(0, Math.round((Date.now() - t0.getTime()) / 60000))) : '—';
    yas.style.color = eski ? '#fcd34d' : '';
  }

  // ---------- ana ekran / ayrıntı
  function ctRenderAna() {
    const el = $('ctMain');
    if (!CT) { el.innerHTML = '<div class="card empty">Henüz veri yok.</div>'; return; }
    const tr = CT.traderlar || [];
    if (ctSel) {
      const t = tr.find((x) => x.id === ctSel);
      el.innerHTML = t ? ctAyrinti(t) : `<a href="#" class="ct-btn inline-block mb-3">← Kartlar</a><div class="card empty">Bu trader veride yok (${esc(ctSel)}).</div>`;
      return;
    }
    el.innerHTML = tr.length ? `<div class="ct-grid">${ctSirala(tr).map(ctKart).join('')}</div>` : '<div class="card empty">Henüz izlenen trader yok.</div>';
  }

  function ctKararRozet(o) {
    const k = CTK.kayit[o.id];
    if (k) return k.karar === 'acti' ? ctRozet('Açtım', 'ct-b-ok') : ctRozet('Atladım' + (k.neden ? ' · ' + (NEDEN[k.neden] || k.neden) : ''), 'ct-b-mut');
    if (o.tur !== 'acilis') return '';
    return CTK.durum === 'hata' ? ctRozet('karar kaydı okunamadı', 'ct-b-warn') : ctRozet('cevapsız', 'ct-b-warn');
  }
  function ctOlayMetin(o) {
    if (o.tur === 'isik') { const i = ISIK[o.not]; return i ? `ışık → ${i[0]} ${esc(i[1].toLowerCase())}` : 'ışık değişti'; }
    return `<b class="text-white">${esc(o.coin)}</b> ${ctYonRozet(o.yon)} ${ctKaldirac(o.kaldirac)}`
      + (isNum(o.fiyat) ? ` · fiyat ${ctFiyat(o.fiyat)}` : '') + (isNum(o.hesap_payi) ? ` · hesabın ${ctP(o.hesap_payi)}` : '');
  }
  function ctOlayYuvarlak(o, adGoster) {
    const t = (CT.traderlar || []).find((x) => x.id === o.trader);
    return `<div class="ct-row"><div class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="ct-sub">${esc(ctTarih(o.zaman))}</span>
      ${adGoster ? `<b class="text-white">${esc(t ? t.takma_ad : o.trader)}</b>` : ''}${ctRozet(TUR[o.tur] || o.tur, 'ct-b-mut')}${ctKararRozet(o)}${ctSanalRozet(o)}</div>
      <div class="mt-1">${ctOlayMetin(o)}${o.not && o.tur !== 'isik' ? ` <span class="ct-sub">· ${esc(o.not)}</span>` : ''}</div></div>`;
  }
  const ctOlaylar = () => ((CT && CT.olaylar) || []).slice().sort((a, b) => String(b.zaman).localeCompare(String(a.zaman)));

  function ctAyrinti(t) {
    const [em, ad] = ctIsik(t), olay = ctOlaylar().filter((o) => o.trader === t.id), sk = t.sanal_kopya, poz = t.pozisyonlar || [];
    const sayfaSay = Math.max(1, Math.ceil(olay.length / CT_SAYFA)); ctSayfa = Math.min(ctSayfa, sayfaSay - 1);
    const dilim = olay.slice(ctSayfa * CT_SAYFA, (ctSayfa + 1) * CT_SAYFA);
    const kr = olay.filter((o) => CTK.kayit[o.id]), acti = kr.filter((o) => CTK.kayit[o.id].karar === 'acti').length, atladi = kr.length - acti;
    const cevapsiz = olay.filter((o) => o.tur === 'acilis' && !CTK.kayit[o.id]).length;
    const kv = (k, v) => `<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
    return `<a href="#" class="ct-btn inline-flex items-center gap-1 mb-3">← Kartlar</a>
      <div class="space-y-4 ct-detay">
      <div class="card ct-card"><div class="ct-head"><span class="ct-name text-lg">${esc(t.takma_ad)}</span><span aria-label="Sağlık: ${esc(ad)}">${em} ${esc(ad)}</span>${ctKapiRozet(t.kapi)}
          ${ctKirmizi(t) ? ctRozet('izlemede — kopyalama', 'ct-b-bad') : t.durum && t.durum !== 'kopyala' ? ctRozet(t.durum, 'ct-b-mut') : ''}</div>
        <div class="ct-sub mt-1">${esc(ctAdr(t.adres))} · t0: ${esc(t.t0 || '—')} · hesap değeri ${ctUsdA(t.hesap_degeri)}</div>
        <div class="ct-kv mt-3">${kv('Form skoru', isNum(t.form && t.form.skor) ? fmt(t.form.skor, 1) : '—')}${kv('30 gün', ctPs(t.form && t.form.getiri_30g))}${kv('90 gün', ctPs(t.form && t.form.getiri_90g))}</div></div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Sağlık ışığının nedenleri</h3>
        ${(t.saglik && t.saglik.nedenler || []).length ? `<ul class="text-xs list-disc pl-5 space-y-0.5">${t.saglik.nedenler.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : '<div class="ct-sub">neden belirtilmemiş</div>'}
        <h3 class="text-xs font-semibold text-slate-300 mt-3 mb-1">Kapı sonucu</h3>
        <div class="text-xs">${ctKapiRozet(t.kapi)} <span class="ct-sub">${esc((t.kapi && t.kapi.tarih) || '')}${t.kapi && t.kapi.not ? ' · ' + esc(t.kapi.not) : ''}</span></div></div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Açık pozisyonlar</h3>
        ${poz.length ? poz.map((p) => ctPozisyon(p, true)).join('') : '<div class="ct-sub">pozisyon yok</div>'}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Kâr eğrisi (son 90 gün)</h3>
        ${(t.egri || []).some((p) => p && isNum(p[1])) ? '<div class="relative h-56"><canvas id="ctChEgri"></canvas></div>' : '<div class="ct-sub">kâr eğrisi yok</div>'}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Sanal kopya</h3>
        ${sk ? `<div class="ct-kv">${kv('Başlangıç', ctUsd(sk.baslangic_usd, 0))}${kv('Bakiye', `<span class="${cls(sk.getiri)}">${ctUsd(sk.bakiye_usd)}</span>`)}${kv('Getiri', `<span class="${cls(sk.getiri)}">${ctPs(sk.getiri)}</span>`)}${kv('Düşüş', ctP(sk.dusus, 1))}${kv('Gecikme', isNum(sk.gecikme_dk) ? fmt(sk.gecikme_dk, 0) + ' dk' : '—')}${kv('t0', esc(sk.t0 || '—'))}</div>` : '<div class="ct-sub">henüz veri yok</div>'}
        ${ctSkEgri(sk) ? '<div class="relative h-48 mt-3"><canvas id="ctChSanal"></canvas></div><div class="ct-sub">günlük sanal bakiye (t0\'dan beri)</div>' : '<div class="ct-sub mt-2">sanal kopya eğrisi: henüz veri yok</div>'}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Açtıklarım ↔ tümü</h3>
        <div class="ct-kv">${kv('Açtım', acti)}${kv('Atladım', atladi)}${kv('Cevapsız', cevapsiz)}</div>
        <div class="mt-2">${ctKarsilastirHtml(ctKarsilastir(olay))}</div>
        <div class="ct-sub mt-2">${CTK.durum === 'hata' ? 'Karar kaydı okunamadı. ' : CTK.durum === 'yok' ? 'Henüz karar kaydı yok. ' : ''}Sonuç: kapanmış olayların kopyalanan tutara göre maliyet sonrası net getirisinin ortalaması.</div></div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">İşlem geçmişi <span class="ct-sub font-normal">(${olay.length} olay; veride son 200 olay var)</span></h3>
        ${dilim.length ? dilim.map((o) => ctOlayYuvarlak(o, false)).join('') : '<div class="ct-sub">bu trader için olay yok</div>'}
        <div class="flex items-center justify-between mt-2"><button class="ct-btn" onclick="ctSayfaGit(-1)" ${ctSayfa === 0 ? 'disabled' : ''}>← Önceki</button>
          <span class="ct-sub">${ctSayfa + 1} / ${sayfaSay}</span><button class="ct-btn" onclick="ctSayfaGit(1)" ${ctSayfa + 1 >= sayfaSay ? 'disabled' : ''}>Sonraki →</button></div></div>
      </div>`;
  }
  const ctSkEgri = (sk) => { const e = ((sk && sk.egri) || []).filter((p) => p && isNum(p[1])); return e.length >= 2 ? e : null; };
  function ctSayfaGit(d) { ctSayfa = Math.max(0, ctSayfa + d); ctRender(); }

  function ctCizim() {
    if (!CT || !ctSel) { ['ctChEgri', 'ctChSanal'].forEach((k) => { if (charts[k]) { charts[k].destroy(); delete charts[k]; } }); return; }
    const t = (CT.traderlar || []).find((x) => x.id === ctSel); if (!t || !$('ctChEgri')) return;
    const sg = ctSkEgri(t.sanal_kopya);
    if (sg && $('ctChSanal')) chart('ctChSanal', { type: 'line', data: { labels: sg.map((p) => p[0]), datasets: [{ data: sg.map((p) => p[1]), borderColor: '#10b981', borderWidth: 2, pointRadius: 0, tension: 0.15 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ctUsd(c.parsed.y) } } } } });
    if (!$('ctChEgri')) return;
    const pts = (t.egri || []).filter((p) => p && isNum(p[1]));
    const opt = { ...base, scales: { ...axes, y: { ...axes.y, ticks: { ...axes.y.ticks, callback: (v) => '%' + fmt(v * 100, 0) } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ctPs(c.parsed.y, 2) } } } };
    chart('ctChEgri', { type: 'line', data: { labels: pts.map((p) => p[0]), datasets: [{ data: pts.map((p) => p[1]), borderColor: '#f5cb5c', borderWidth: 2, pointRadius: 0, tension: 0.15 }] }, options: opt });
  }

  // ---------- akış sekmesi
  function ctRenderAkis() {
    const el = $('ctAkis');
    if (!CT) { el.innerHTML = '<div class="card empty">Henüz veri yok.</div>'; return; }
    const tr = CT.traderlar || [], tum = ctOlaylar().filter((o) => !ctFiltre || o.trader === ctFiltre), goster = tum.slice(0, ctAkisN);
    el.innerHTML = `<div class="card p-3 space-y-2"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="text-sm font-bold text-white">Akış <span class="ct-sub font-normal">(son olaylar, yeniden eskiye)</span></h2>
      <select id="ctFiltreSel" class="bg-[#1c2a47] border border-[#243555] px-2.5 py-2 rounded text-slate-200 text-xs" onchange="ctFiltre=this.value;ctAkisN=${CT_AKIS_ADIM};ctRender()">
        <option value="">Tüm traderlar</option>${tr.map((t) => `<option value="${esc(t.id)}"${t.id === ctFiltre ? ' selected' : ''}>${esc(t.takma_ad)}</option>`).join('')}</select></div>
      ${CTK.durum === 'hata' ? '<div class="ct-sub text-amber-300">Karar kaydı okunamadı; karar durumları eksik olabilir.</div>' : CTK.durum === 'yok' ? '<div class="ct-sub">Henüz karar kaydı yok.</div>' : ''}
      ${goster.length ? goster.map((o) => ctOlayYuvarlak(o, true)).join('') : '<div class="empty">Henüz olay yok.</div>'}
      ${tum.length > goster.length ? `<button class="ct-btn w-full" onclick="ctAkisN+=${CT_AKIS_ADIM};ctRender()">Daha fazla (${tum.length - goster.length})</button>` : ''}</div>`;
  }

  // ---------- istatistik sekmesi
  function ctRenderIstat() {
    const el = $('ctIstat');
    if (!CT) { el.innerHTML = '<div class="card empty">Henüz veri yok.</div>'; return; }
    const olay = ctOlaylar(), id2olay = Object.fromEntries(olay.map((o) => [o.id, o]));
    const kayitlar = Object.values(CTK.kayit), toplamActi = kayitlar.filter((k) => k.karar === 'acti').length, toplamAtladi = kayitlar.filter((k) => k.karar === 'atladi').length;
    const disarida = kayitlar.filter((k) => !id2olay[k.olay_id]).length;
    const nedenSay = (liste) => { const m = {}; liste.filter((k) => k.karar === 'atladi').forEach((k) => { const n = NEDEN[k.neden] || k.neden || 'belirtilmemiş'; m[n] = (m[n] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const nedenHtml = (liste) => { const n = nedenSay(liste); return n.length ? n.map(([k, v]) => ctRozet(`${k}: ${v}`, 'ct-b-mut')).join(' ') : '<span class="ct-sub">atlama yok</span>'; };
    const kv = (k, v) => `<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
    const kartlar = ctSirala(CT.traderlar || []).map((t) => {
      const o = olay.filter((x) => x.trader === t.id), kr = o.filter((x) => CTK.kayit[x.id]).map((x) => CTK.kayit[x.id]);
      const acti = kr.filter((k) => k.karar === 'acti').length, cevapsiz = o.filter((x) => x.tur === 'acilis' && !CTK.kayit[x.id]).length;
      const ks = ctKarsilastir(o);
      return `<div class="card ct-card"><div class="ct-head"><span class="ct-name">${esc(t.takma_ad)}</span>${ctIsik(t)[0]}</div>
        <div class="ct-kv mt-2">${kv('Sanal kopya getirisi', `<span class="${cls(t.sanal_kopya && t.sanal_kopya.getiri)}">${ctPs(t.sanal_kopya && t.sanal_kopya.getiri)}</span>`)}${kv('Olay', o.length)}${kv('Açtım', acti)}${kv('Atladım', kr.length - acti)}${kv('Cevapsız', cevapsiz)}</div>
        <div class="ct-sec"><span class="ct-sub">Açtıklarım ↔ tümü:</span><div class="mt-1">${ctKarsilastirHtml(ks)}</div></div>
        <div class="ct-sec"><span class="ct-sub">Atlama nedenleri:</span> ${nedenHtml(kr)}</div></div>`;
    }).join('');
    el.innerHTML = `<div class="card ct-card"><h2 class="text-sm font-bold text-white mb-2">Kararlarım değer kattı mı?</h2>
        <div class="ct-kv">${kv('Toplam karar', kayitlar.length)}${kv('Açtım', toplamActi)}${kv('Atladım', toplamAtladi)}</div>
        <div class="ct-sec">${ctKarsilastirHtml(ctKarsilastir(olay))}<div class="ct-sub mt-1">Fark = açtıklarımın ortalama sanal sonucu − tüm olayların. ${kayitlar.length ? '' : 'Henüz karar kaydı yok. '}${CTK.durum === 'hata' ? 'Karar kaydı okunamadı. ' : ''}Eşik: ${CT_YETERSIZ} kapanmış ve karar verilmiş olay.</div></div>
        <div class="ct-sec"><span class="ct-sub">Atlama nedenleri (toplam):</span> ${nedenHtml(kayitlar)}</div>
        ${disarida ? `<div class="ct-sub mt-1">${disarida} karar, veride artık bulunmayan eski olaylara ait (trader dağılımına girmez).</div>` : ''}</div>
      <div class="ct-grid mt-3">${kartlar || '<div class="card empty">Henüz izlenen trader yok.</div>'}</div>`;
  }

  function ctRender() { ctSerit(); ctRenderAna(); ctRenderAkis(); ctRenderIstat(); if (window.lucide) lucide.createIcons(); ctCizim(); }

  // ---------- yükleme
  async function ctYukle(elle) {
    const ikon = $('refreshIcon'); if (elle && ikon) ikon.classList.add('animate-spin');
    try {
      const r = await fetch(CT_KAYNAK + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j || !Array.isArray(j.traderlar) || !Array.isArray(j.olaylar)) throw new Error('beklenen alanlar yok');
      if (j.surum !== 1) throw new Error('desteklenmeyen sürüm: ' + j.surum);
      CT = j; ctHata = null;
    } catch (e) { ctHata = 'Copy trade verisi okunamadı (' + e.message + ').'; }
    try {
      const r = await fetch(CT_KARAR + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.status === 404) CTK = { durum: 'yok', kayit: {}, bozuk: 0 };
      else if (!r.ok) throw new Error('HTTP ' + r.status);
      else {
        const kayit = {}; let bozuk = 0;
        (await r.text()).split('\n').filter((l) => l.trim()).forEach((l) => {
          try { const k = JSON.parse(l); if (k && k.olay_id && (k.karar === 'acti' || k.karar === 'atladi')) kayit[k.olay_id] = k; else bozuk++; } catch (e) { bozuk++; }
        });
        CTK = { durum: Object.keys(kayit).length ? 'ok' : 'yok', kayit, bozuk };
      }
    } catch (e) { CTK = { durum: 'hata', kayit: {}, bozuk: 0 }; }
    ctRender();
    if (ikon) setTimeout(() => ikon.classList.remove('animate-spin'), 400);
  }
  function ctHash() {
    const m = /^#ct\/(.+)$/.exec(location.hash);
    ctSel = m ? decodeURIComponent(m[1]) : null; ctSayfa = 0;
    if (m) showTab('ct');
    if (CT !== null || ctHata) ctRender();
  }
  window.addEventListener('hashchange', ctHash);

  buildNav();
  showTab('ct');
  if (window.lucide) lucide.createIcons();
  ctHash(); ctYukle();
  setInterval(ctYukle, 5 * 60 * 1000);
  setInterval(ctSerit, 60 * 1000);
</script>
</body>
</html>
