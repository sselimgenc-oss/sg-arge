<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Pano</title>
  <meta name="description" content="sg-arge copy trade panosu: sanal gölge ölçüm, gerçek para ve emir yok. Araştırma; yatırım tavsiyesi değildir.">
  <link rel="stylesheet" href="vendor/tailwind.3.4.17.css">
  <script src="vendor/lucide.0.460.0.min.js"></script>
  <style>
    :root {
      --bg: #0d1527; --header: #101a30; --card: #16223b; --hover: #1d2c4b; --border: #243555;
      --accent: #f5cb5c; --text: #e2e8f0; --muted: #94a3b8; --up: #10b981; --down: #ef4444;
    }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; }
    .nav-btn.active { background-color: #1c2a47; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
    .nav-btn.active i { color: var(--accent); }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
    .empty { padding: 1.25rem; text-align: center; color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 0.25rem; font-size: 10px; font-weight: 600; }

    .ct-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .ct-card { display: block; min-width: 0; padding: 0.875rem; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .ct-card:hover, .ct-card:focus-visible { background: var(--hover); outline: none; }
    .ct-card.kirmizi { opacity: 0.6; }
    .ct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .ct-name { font-weight: 700; color: #fff; font-size: 15px; }
    .ct-sub { font-size: 11px; color: var(--muted); }
    .ct-pos { border-top: 1px solid var(--border); padding: 0.5rem 0; font-size: 12px; }
    .ct-pos .l1 { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
    .ct-pos .l1 > span:first-child { display: inline-flex; align-items: center; gap: 0.375rem; white-space: nowrap; }
    .ct-pos .l2 { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .ct-sec { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); font-size: 12px; }
    .ct-b-ok { background: rgba(16,185,129,.18); color: #34d399; } .ct-b-warn { background: rgba(245,203,92,.18); color: #f5cb5c; }
    .ct-b-bad { background: rgba(239,68,68,.18); color: #f87171; } .ct-b-mut { background: rgba(148,163,184,.18); color: #cbd5e1; }
    .ct-row { padding: 0.625rem 0; border-top: 1px solid var(--border); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    .ct-row:first-child { border-top: 0; }
    .ct-detay { max-width: 760px; }
    .ct-btn { background: #1c2a47; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem 0.875rem; font-size: 12px; color: var(--text); min-height: 40px; }
    .ct-btn[disabled] { opacity: 0.4; }
    .ct-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem; }
    .ct-kv > div { background: #101a30; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.375rem 0.5rem; min-width: 0; }
    .ct-kv .k { font-size: 10px; color: var(--muted); } .ct-kv .v { font-size: 13px; font-weight: 600; }
    /* Keşif: kartlar tek sütunda da okunur; filtreler asla yatay kaydırma oluşturmaz. */
    .ks-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: .5rem; }
    .ks-select { width: 100%; min-width: 0; background: #1c2a47; border: 1px solid var(--border); border-radius: .375rem; color: var(--text); padding: .6rem .5rem; font-size: 12px; }
    .ks-card { cursor: pointer; }
    .ks-card:hover, .ks-card:focus-visible { background: var(--hover); outline: none; }
    .ks-card-head { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; }
    .ks-address { font-weight: 700; color: #fff; font-size: 14px; }
    .ks-share { display: flex; height: 7px; overflow: hidden; border-radius: 99px; background: #0f172a; margin-top: .3rem; }
    .ks-share > span { min-width: 0; }
    .ks-adim { display: grid; grid-template-columns: auto 1fr; gap: .25rem .6rem; align-items: start; border-top: 1px solid var(--border); padding: .55rem 0; font-size: 12px; }
    .ks-adim:first-child { border-top: 0; }
    .ks-copy-note { min-height: 1.1rem; font-size: 11px; color: var(--muted); }
    .ks-bilgi { font-size: 11px; color: var(--muted); }
    .ct-live { font-size: 12px; color: var(--muted); }
    .ct-link { color: #93c5fd; text-decoration: underline; font-size: 12px; min-height: 44px; display: inline-flex; align-items: center; }
    .ct-open-row { display: block; width: 100%; text-align: left; border-top: 1px solid var(--border); padding: .55rem 0; font-size: 12px; color: var(--text); }
    .ct-open-row:first-child { border-top: 0; }
    .ct-trade { border-top: 1px solid var(--border); padding: .65rem 0; font-size: 12px; }
    .ct-trade:first-child { border-top: 0; }
    .ct-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 12px; }
    .ct-table th, .ct-table td { padding: .55rem .4rem; text-align: left; border-top: 1px solid var(--border); vertical-align: top; }
    .ct-table th { color: var(--muted); font-weight: 600; }
    /* telefonda açık işlemler: süre, kaldıraç ve likidasyon sütunları gizlenir (coin, trader, yön, teminat, K/Z kalır) */
    @media (max-width: 600px) { .ct-table.kasa-acik { min-width: 0; font-size: 13px; } .ct-table.kasa-acik th:nth-child(n+4):nth-child(-n+6), .ct-table.kasa-acik td:nth-child(n+4):nth-child(-n+6) { display: none; } }
    .ct-trade.vurgu { background: rgba(250, 204, 21, .12); box-shadow: 0 0 0 1px rgba(250, 204, 21, .5); padding-inline: .4rem; border-radius: .35rem; }
    /* pano-sade: sabit üst (başlık + sekmeler + yasal ibare), telefon öncelikli */
    html { scroll-padding-top: 7rem; }
    .ust { position: sticky; top: 0; z-index: 40; background: var(--header); border-bottom: 1px solid var(--border); }
    .ust-1 { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .5rem 1rem; }
    .yasal { padding: .25rem 1rem; font-size: 11px; color: #cbd5e1; background: #0b1222; border-top: 1px solid var(--border); text-align: center; }
    .sekmeler { display: grid; grid-template-columns: repeat(5, 1fr); }
    a.nav-btn { text-decoration: none; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 48px; padding: 0 .25rem; font-size: 13px; color: #cbd5e1; border-bottom: 3px solid transparent; }
    .nav-btn.active { color: #fff; border-bottom-color: var(--accent); background: #1c2a47; }
    .nav-btn.active i { color: var(--accent); }
    @media (max-width: 420px) { .nav-btn i { display: none; } }
    .sayfa { max-width: 960px; margin: 0 auto; padding: 1rem; width: 100%; }
    .bas { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: .4rem; }
    .alt { font-size: 12px; font-weight: 600; color: #cbd5e1; margin: .9rem 0 .35rem; }
    .ip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 99px; border: 1px solid #475569; color: #cbd5e1; font-size: 11px; font-weight: 700; line-height: 1; position: relative; vertical-align: middle; }
    .ip::after { content: ""; position: absolute; inset: -11px; }   /* dokunma alanı ≥ 44 px */
    #ipKutu { position: fixed; left: .75rem; right: .75rem; bottom: .75rem; z-index: 60; max-width: 520px; margin: 0 auto; background: #1c2a47; border: 1px solid var(--accent); border-radius: .5rem; padding: .75rem; font-size: 13px; display: flex; flex-direction: column; gap: .4rem; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    #ipKutu[hidden] { display: none; }
    #ipKutu b { color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .8rem; border-radius: 99px; border: 1px solid var(--border); background: #1c2a47; color: var(--text); font-size: 12px; }
    .chip b { color: #fff; }
    .chip.on { border-color: var(--accent); background: #26365a; }
    .kilit { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; padding: .5rem .6rem; border: 1px dashed #64748b; border-radius: .375rem; font-size: 12px; color: #cbd5e1; }
    .kilit b { color: #fff; }
    .taze { display: grid; grid-template-columns: 1fr auto; gap: 0 .75rem; padding: .4rem 0; border-top: 1px solid var(--border); font-size: 12px; }
    .taze:first-child { border-top: 0; }
    .taze > .ct-sub { grid-column: 1 / -1; }
    .taze.eski b { color: #fcd34d; }
    .huni { display: flex; align-items: stretch; gap: .5rem; flex-wrap: wrap; }
    .huni .ok { align-self: center; color: var(--muted); }
    .hk { flex: 1 1 90px; min-width: 0; background: #101a30; border: 1px solid var(--border); border-radius: .375rem; padding: .5rem; }
    .hk .k { font-size: 11px; color: var(--muted); } .hk .v { font-size: 20px; font-weight: 700; color: #fff; }
    details.det > summary { cursor: pointer; list-style: none; min-height: 28px; display: flex; align-items: center; gap: .4rem; }
    details.det > summary::-webkit-details-marker { display: none; }
    details.det > summary::before { content: "›"; color: var(--muted); transition: transform .15s; }
    details.det[open] > summary::before { transform: rotate(90deg); }
    .ct-btn, .ct-link { min-height: 44px; }
    .ct-name { text-decoration: none; }
    .ct-row > .flex { gap: .25rem .5rem; }
    .geri { display: inline-flex; align-items: center; margin-bottom: .75rem; padding: 0 .9rem; }
    code { background: #101a30; padding: 0 .25rem; border-radius: .2rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="ust">
    <div class="ust-1">
      <h1 class="text-base font-bold text-white min-w-0 truncate">SG Pano</h1>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="text-[11px] text-slate-400 whitespace-nowrap" id="dataAge">—</span>
        <button onclick="ctYukle(true)" class="ct-btn flex items-center justify-center gap-1.5" style="padding:0.375rem 0.75rem" aria-label="Yenile">
          <i id="refreshIcon" data-lucide="refresh-cw" class="w-3.5 h-3.5 text-[#f5cb5c]"></i><span class="yenile-yazi">Yenile</span>
        </button>
      </div>
    </div>
    <nav id="nav" class="sekmeler" aria-label="Bölümler"></nav>
    <div class="yasal" id="yasal">Araştırma / sanal, yatırım tavsiyesi değil · gerçek emir yok</div>
  </header>

  <main class="sayfa flex-1" id="main">
    <div id="ctMsg" class="hidden p-3 mb-4 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
    <div id="ksMsg" role="alert" class="hidden w-full p-3 mb-4 rounded border border-amber-600 bg-amber-950/50 text-sm text-amber-100"></div>
    <section data-tab="ozet" class="tab hidden space-y-4"><div id="ozMain" class="space-y-4"></div></section>
    <section data-tab="traderlar" class="tab hidden space-y-4"><div id="trMain"></div></section>
    <section data-tab="huni" class="tab hidden space-y-4"><div id="huMain" class="space-y-4"></div></section>
    <section data-tab="kasa" class="tab hidden space-y-4"><div id="kasaMain" class="space-y-4"></div></section>
    <section data-tab="ayarlar" class="tab hidden space-y-4"><div id="ayarMain" class="space-y-4"></div></section>
  </main>
  <div id="ipKutu" role="dialog" aria-live="polite" hidden></div>

<script>
  const TABS = [['ozet', 'Özet', 'layout-dashboard'], ['kasa', 'Kasa', 'wallet'], ['traderlar', "Trader'lar", 'users'], ['huni', 'Huni', 'filter'], ['ayarlar', 'Ayarlar', 'settings']];
  const charts = {};

  // ---------- yardımcılar
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
  const cls = () => '';   // kâr/zarar rengi yok (ön kayıt: performans körlüğü); yön ve uyarı renkleri ayrı sınıflardır

  // ---------- veri (tanım: sg-arge docs/PANO_COPYTRADE.md, docs/VERI_SOZLESMESI.md, surum 1)
  // ---------- copy trade izleme (tanım: sg-arge docs/PANO_COPYTRADE.md, veri: docs/VERI_SOZLESMESI.md, surum 1)
  // Kaynak adresleri yalnız burada değişir (canlı: sg-arge copytrade-izleme dalı; örnek sabit veri: ./izleme/ornek_durum.json).
  const CT_KAYNAK = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/durum.json';
  const CT_KARAR = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/kararlar.jsonl'; // dosya yoksa (404) karar kaydı yok sayılır
  const CT_DEGISIM = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/degisim.json';
  // Keşif verisinin tek uzak kaynağı: GitHub API tarih klasörünü, ardından API'nin verdiği ham adresi bulur.
  const KESIF_KAYNAK = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-kapi/kesif/kesif.json';   // yayıncı (kapi_yayimla.sh) sabit yola yazar
  const KESIF_ORNEK = './kesif/ornek_kesif.json';
  const CT_ESKI_DK = 90, CT_SAYFA = 8, CT_AKIS_ADIM = 50, CT_YETERSIZ = 10;
  const KAYMA_ESIK = { intraday: 0.005, swing: 0.015 }; // kullanıcı kararı: %0,5 / %1,5
  const HL_INFO = 'https://api.hyperliquid.xyz/info', TUTAR_AYAR = 'sg-pano-tutar-v1';
  let CT = null, CTK = { durum: 'yok', kayit: {}, bozuk: 0 }, CTD = { durum: 'yok', degisimler: [] }, ctHata = null;
  let ctSel = null, traderAdres = null, traderCoin = null, ctSayfa = 0, ctFiltre = '', ctAkisN = CT_AKIS_ADIM;
  let KS = null, ksHata = null, ksSel = null, ksKaynak = null;
  let HL = {}, MIDS = {}, midsZaman = null, midDexler = null;
  let ksFiltre = { tarz: '', katman: '', piyasa: '', gecmis: '' };
  let sekme = 'ozet', kolFiltre = '';


  const ISIK = { yesil: ['🟢', 'Yeşil'], sari: ['🟡', 'Sarı'], kirmizi: ['🔴', 'Kırmızı'] };
  const TUR = { acilis: 'Açılış', kapanis: 'Kapanış', buyutme: 'Büyütme', azaltma: 'Azaltma', isik: 'Işık' };
  const NEDEN = { gec_gordum: 'geç gördüm', begenmedim: 'beğenmedim', bakiye_yok: 'bakiye yok', diger: 'diğer' };
  const ctIsik = (t) => (ISIK[t.saglik && t.saglik.isik] || ['⚪', 'Bilinmiyor']);
  const ctKirmizi = (t) => !!t.saglik && t.saglik.isik === 'kirmizi';
  const ctYonCls = (y) => y === 'long' ? 'up' : y === 'short' ? 'down' : 'flat';
  const ctYonRozet = (y) => ctRozet(ctYon(y) || '?', y === 'long' ? 'ct-b-ok' : y === 'short' ? 'ct-b-bad' : 'ct-b-mut');
  const ctKaldirac = (v) => isNum(v) ? ctRozet(fmt(v, 1).replace(',0', '') + 'x', 'ct-b-mut') : '';
  const ctRozet = (txt, c) => `<span class="badge ${c}">${esc(txt)}</span>`;
  // oranlar (0,08) → %8 ; sayılar Türkçe biçim, para "1.043,20 $"
  const ctP = (v, d = 0) => isNum(v) ? '%' + fmt(v * 100, d) : '—';
  const ctPs = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '-' : '') + '%' + fmt(Math.abs(v * 100), d) : '—';
  const ctUsd = (v, d = 2) => isNum(v) ? (v < 0 ? '-' : '') + fmt(Math.abs(v), d) + ' $' : '—';
  const ctUsdA = (v) => ctUsd(v, isNum(v) && Math.abs(v) < 100 ? 2 : 0); // küçük tutarlar kuruşlu
  const ctUsds = (v, d) => isNum(v) ? (v > 0 ? '+' : '') + (d === undefined ? ctUsdA(v) : ctUsd(v, d)) : '—';
  const ctFiyat = (v) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: v >= 1000 ? 2 : v >= 1 ? 4 : 6 }) : '—';
  const ctYon = (y) => y ? String(y).toUpperCase() : '';
  const ctDate = (iso) => new Date(String(iso || '').replace(/(\.\d{3})\d+/, '$1')); // Safari/WebKit için kesir 3 haneye
  const ctTarih = (iso, tamZaman) => {
    const t = iso ? ctDate(iso) : null; if (!t || isNaN(t)) return '—';
    return t.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit', ...(tamZaman === false ? {} : { hour: '2-digit', minute: '2-digit' }) });
  };
  const ctAcikSaat = (iso) => {
    const t = iso ? ctDate(iso) : null; if (!t || isNaN(t)) return '—';
    const gun = (d) => d.toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' });
    const saat = t.toLocaleTimeString('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit' });
    if (gun(t) === gun(new Date())) return `Bugün ${saat}`;
    if (gun(t) === gun(new Date(Date.now() - 86400000))) return `Dün ${saat}`;
    return t.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  const ctEskiVeri = (t) => t && t.gecerli === false;
  const ctAdr = (a) => { a = String(a || ''); return a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a; };
  const ctYasDakika = (iso) => { const d = ctDate(iso); return !isNaN(d) ? Math.max(0, Math.round((Date.now() - d.getTime()) / 60000)) : null; };
  const ctTazelik = (iso) => { const dk = ctYasDakika(iso); return dk == null ? 'Veri saati bilinmiyor' : `Veri ${ctYas(dk)}${dk > CT_ESKI_DK ? ' · eski' : ''}`; };
  function ctYas(dk) { return dk < 60 ? `${dk} dk önce` : dk < 2880 ? `${Math.round(dk / 60)} sa önce` : `${Math.round(dk / 1440)} gün önce`; }
  async function hlPost(body) {
    const r = await fetch(HL_INFO, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  const hlDexler = (x) => (Array.isArray(x) ? x : []).map((d) => d && d.name).filter(Boolean);
  async function midsYenile() {
    if (!CT) return;
    try {
      midDexler = midDexler || hlDexler(await hlPost({ type: 'perpDexs' }));
      const yanitlar = await Promise.all([hlPost({ type: 'allMids' }), ...midDexler.map((dex) => hlPost({ type: 'allMids', dex }))]);
      MIDS = Object.assign({}, ...yanitlar); midsZaman = Date.now(); render();
    } catch (e) { /* static durum.json positions remain visible */ }
  }
  async function hlSon30GunIslemleri(adres) {
    const bitis = Date.now(), baslangic = bitis - 30 * 24 * 60 * 60 * 1000, tum = new Map();
    let imlec = baslangic;
    while (imlec < bitis) {
      const sayfa = await hlPost({ type: 'userFillsByTime', user: adres, startTime: imlec, endTime: bitis, limit: 2000 });
      if (!Array.isArray(sayfa) || !sayfa.length) break;
      sayfa.forEach((f) => tum.set(`${f.coin}|${f.tid}`, f));
      const enYeni = Math.max(...sayfa.map((f) => Number(f.time)));
      if (sayfa.length < 2000 || enYeni < imlec) break;
      imlec = enYeni + 1;
    }
    return [...tum.values()].sort((a, b) => Number(a.time) - Number(b.time));
  }
  function hlPozisyonlar(state, mids) {
    return (state?.assetPositions || []).map((x) => x.position || x).map((p) => {
      const miktar = Number(p.szi), coin = p.coin, mid = Number(mids?.[coin]);
      if (!coin || !miktar || !isNum(mid)) return null;
      const deger = Math.abs(miktar * mid), hesap = Number(state?.marginSummary?.accountValue);
      return { coin, yon: miktar > 0 ? 'long' : 'short', giris: Number(p.entryPx), mid, deger, hesap_payi: hesap > 0 ? deger / hesap : null,
        kaldirac: Number(p.leverage?.value), anlik_kz: Number(p.unrealizedPnl) };
    }).filter(Boolean);

  async function hlDetayYukle(adres, zorla = false) {

        <div class="ct-sec"><b>Kırmızı bayraklar</b> ${ip('bayrak')}<div class="mt-1">${bayrakHtml(t)}</div></div></div>
      <div class="card ct-card"><h2 class="bas">Açık pozisyonlar (${liste.length})</h2>${canliNot}${liste.length ? liste.map(acikSatir).join('') : '<div class="ct-sub mt-1">Açık pozisyon yok.</div>'}</div>
      ${(t.egri || []).length > 1 ? `<div class="card ct-card"><h2 class="bas">Trader’ın kâr eğrisi <span class="ct-sub font-normal">(kendi geçmişi, bizim sonucumuz değil)</span></h2>${ksEgrisi(t.egri)}</div>` : ''}
      ${det('gecmis:' + t.adres, `<b>İşlem geçmişi</b> <span class="ct-sub">(son 30 gün${h?.durum === 'hazir' ? ', ' + islemler.length + ' işlem' : ''})</span>`, h?.durum === 'hazir' ? (gecmis.length ? gecmis.map(satir).join('') : '<div class="ct-sub">İşlem yok.</div>') + (islemler.length > (sayfa + 1) * 20 ? `<button class="ct-btn w-full mt-2" onclick="location.hash='trader/${adr}/${sayfa + 1}'">Daha fazla</button>` : '') : '<div class="ct-sub">Canlı veri gelince burada listelenir.</div>')}
      ${olaylar.length || CT ? det('olay:' + t.adres, `<b>Bizim olaylar</b> <span class="ct-sub">(${olaylar.length})</span>`, benim.length ? benim.map((o) => ctOlayYuvarlak(o, false)).join('') + (olaylar.length > n ? `<button class="ct-btn w-full mt-2" onclick="olayN['${esc(t.adres)}']=${n + 8};render()">Daha fazla</button>` : '') : '<div class="ct-sub">Bu trader için olay yok.</div>') : ''}
      ${det('karar:' + t.adres, '<b>Kararlarım</b>', `<div class="ct-kv"><div><div class="k">Açtım</div><div class="v">${s.acti}</div></div><div><div class="k">Atladım</div><div class="v">${s.atladi}</div></div><div><div class="k">Cevapsız</div><div class="v">${s.cevapsiz}</div></div></div><div class="ct-sec"><span class="ct-sub">Atlama nedenleri:</span> ${nedenHtml(s.kr)}</div>`)}
      <div class="card ct-card"><h2 class="bas">Bizim sanal kopya ${ip('ozet')}</h2><div class="ct-kv mt-2"><div><div class="k">Getiri</div><div class="v">${ctPs(sanalGetiri(t), 2)}</div></div><div><div class="k">Bakiye</div><div class="v">${ctUsdA(t.sanal_kopya_v3?.bakiye_usd)}</div></div></div></div>
      ${det('secim:' + t.adres, '<b>Seçim ayrıntıları</b>', sec)}
    </div>`;
  }
  const ctKapiRozet = (k) => { const s = k && k.sinif; return ctRozet(s || 'kapı yok', 'ct-b-mut'); };
  const olayN = {};

  // ---------- 3) Huni: kapı ve keşif
  const ksRozet = (m, s) => ctRozet(m, s);
  const ksKatman = (a) => a.katman === 'kopyalanabilir' ? ['Kopyalanabilir', 'ct-b-ok'] : ['İzleme adayı', 'ct-b-warn'];
  const ksDurum = (d) => d === 'Geçti' ? 'ct-b-ok' : d === 'Kaldı' ? 'ct-b-bad' : 'ct-b-warn';
  const ksPiyasa = (a) => Object.entries(a.piyasa_payi || {}).sort((x, y) => y[1] - x[1])[0]?.[0] || '';
  const ksPay = (a) => {
    const p = a.piyasa_payi || {}, renk = { kripto: '#38bdf8', hisse: '#a78bfa', emtia: '#f5cb5c' };
    return `<div class="ks-share" aria-label="Piyasa payları">${['kripto', 'hisse', 'emtia'].map((k) => `<span style="width:${Math.max(0, p[k] || 0) * 100}%;background:${renk[k]}"></span>`).join('')}</div><div class="ct-sub mt-1">Kripto ${ctP(p.kripto)} · Hisse ${ctP(p.hisse)} · Emtia ${ctP(p.emtia)}</div>`;
  };
  function ksFiltrele() {
    return (KS?.adaylar || []).filter((a) => (!ksFiltre.tarz || a.tarz === ksFiltre.tarz) && (!ksFiltre.katman || a.katman === ksFiltre.katman)
      && (!ksFiltre.piyasa || ksPiyasa(a) === ksFiltre.piyasa) && (!ksFiltre.gecmis || a.gecmis_gun >= 365))
      .sort((a, b) => ((b.katman === 'kopyalanabilir') - (a.katman === 'kopyalanabilir')) || (a.genc_aday - b.genc_aday) || ((b.alfa_t ?? -Infinity) - (a.alfa_t ?? -Infinity)));
  }
  function ksEgrisi(egri) {
    const y = (egri || []).map((p) => p?.[1]).filter(isNum);
    if (y.length < 2) return '<div class="ct-sub">eğri yok</div>';
    const mn = Math.min(...y), mx = Math.max(...y), aralik = mx - mn || 1;
    const pts = y.map((v, i) => `${(i * 100 / (y.length - 1)).toFixed(2)},${(30 - ((v - mn) / aralik * 27)).toFixed(2)}`).join(' ');
    return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" class="w-full" style="height:44px" role="img" aria-label="Eğri"><polyline points="${pts}" fill="none" stroke="#94a3b8" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function ksKart(a) {
    const [katman, renk] = ksKatman(a), once = a.tarz === 'swing' ? ['2 sa kopya', a.kopya?.g120] : ['30 dk kopya', a.kopya?.g30];
    return `<a class="card ct-card ks-card" href="#trader/${encodeURIComponent(a.adres)}"><div class="ks-card-head"><span class="ks-address">${esc(ctAdr(a.adres))}</span>${tarzRozet(a)}${ksRozet(katman, renk)}${a.genc_aday ? ksRozet('Genç aday', 'ct-b-warn') : ''}</div>
      <div class="ct-kv mt-2"><div><div class="k">Medyan tutma</div><div class="v">${fmt(a.medyan_tutma_sa, 1)} sa</div></div><div><div class="k">Medyan kaldıraç</div><div class="v">${fmt(a.medyan_kaldirac, 1)}x</div></div><div><div class="k">${once[0]}</div><div class="v">${ctPs(once[1])}</div></div><div><div class="k">Kârlı ay</div><div class="v">${ctP(a.karli_ay_orani)}</div></div></div></a>`;
  }
  const secenek = (v, ad, f) => `<option value="${v}"${f === v ? ' selected' : ''}>${ad}</option>`;
  function ksKontrol() {
    const f = ksFiltre, sel = (etiket, alan, opts) => `<label class="ct-sub">${etiket}<select class="ks-select mt-1" onchange="ksFiltre.${alan}=this.value;render()">${opts.map(([v, ad]) => secenek(v, ad, f[alan])).join('')}</select></label>`;
    return `<div class="card ct-card"><div class="ks-controls">${sel('Tarz', 'tarz', [['', 'Tümü'], ['intraday', 'Intraday'], ['swing', 'Swing']])}${sel('Katman', 'katman', [['', 'Tümü'], ['kopyalanabilir', 'Kopyalanabilir'], ['izleme_adayi', 'İzleme adayı']])}${sel('Piyasa (ağırlık)', 'piyasa', [['', 'Tümü'], ['kripto', 'Kripto'], ['hisse', 'Hisse'], ['emtia', 'Emtia']])}${sel('Geçmiş', 'gecmis', [['', 'Tümü'], ['12', '≥12 ay']])}</div></div>`;
  }
  function ksAyrintiGovde(a) {
    const adimlar = Array.from({ length: 8 }, (_, i) => a.adimlar?.[String(i + 1)] || { durum: 'Yetersiz', neden: 'Veri yok.' });
    const kv = (k, v) => `<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
    return `<h3 class="alt">Kapı adımları ${ip('kapi')}</h3>${adimlar.map((x, i) => `<div class="ks-adim"><div>${ksRozet(`${i + 1}. ${x.durum}`, ksDurum(x.durum))}</div><div>${esc(x.neden || 'Neden belirtilmemiş.')}</div></div>`).join('')}
      <h3 class="alt">Ölçüler</h3><div class="ct-kv">${kv('Geçmiş', `${fmt(a.gecmis_gun, 0)} gün`)}${kv('Kapanan işlem', fmt(a.kapanan_islem, 0))}${kv('Aktif ay', fmt(a.aktif_ay, 0))}${kv('Hesap değeri', ctUsd(a.hesap_degeri, 0))}${kv('Medyan tutma', `${fmt(a.medyan_tutma_sa, 1)} sa`)}${kv('Medyan kaldıraç', `${fmt(a.medyan_kaldirac, 1)}x`)}${kv('30 dk kopya ' , ctPs(a.kopya?.g30))}${kv('2 sa kopya', ctPs(a.kopya?.g120))}${kv('8 sa kopya', ctPs(a.kopya?.g480))}${kv('Kârlı ay', ctP(a.karli_ay_orani))}${kv('Plasebo p', fmt(a.plasebo_p, 3))}${kv('Alfa t', `${fmt(a.alfa_t, 1)} · ${esc(a.alfa_kiyas)}`)}</div>
      <h3 class="alt">Piyasa payları</h3>${ksPay(a)}<div class="ct-sub mt-1">Binance payı: ${ctP(a.binance_payi)}</div>
      <h3 class="alt">İlişkili hesap notu</h3><div class="text-xs">${esc(a.iliskili_not || 'İlişkili hesap notu yok.')}</div>`;
  }
  function huniHtml() {
    const tr = CT?.traderlar || [], g = golge();
    const havuz = KS ? (isNum(KS.havuz) ? KS.havuz : isNum(KS.islenen) ? KS.islenen : null) : null;
    const aday = KS ? (isNum(KS.aday_sayisi) ? KS.aday_sayisi : (KS.adaylar || []).length) : null;
    const oda = isNum(g.oda_n) ? g.oda_n : tr.some((t) => kolOf(t)) ? tr.filter((t) => uyeMi(t, 'oda')).length : null;
    const kutu = (ad, v, h, alt) => `<div class="hk"><div class="k">${esc(ad)} ${ip(h)}</div><div class="v">${isNum(v) ? fmt(v, 0) : 'bilinmiyor'}</div><div class="ct-sub">${alt}</div></div>`;
    const yas = KS ? ctYasDakika(KS.uretildi) : null, kapsam = KS && isNum(KS.evren) && KS.evren > 0 && isNum(KS.islenen) ? KS.islenen / KS.evren : null;
    const tarama = !KS ? '<div class="ct-sub">Tarama verisi okunamadı.</div>' : `${tazelikSatiri('Son tarama', KS.uretildi, ksKaynak?.ornek ? '<span class="text-amber-300">ÖRNEK VERİ</span>' : esc(ksKaynak?.tarih || ''))}
      <div class="ct-kv mt-2"><div><div class="k">Taranan evren</div><div class="v">${fmt(KS.evren, 0)}</div></div><div><div class="k">İşlenen</div><div class="v">${fmt(KS.islenen, 0)}${kapsam != null ? ` <span class="ct-sub">(${ctP(kapsam)})</span>` : ''}</div></div><div><div class="k">Durum</div><div class="v">${KS.durum === 'eksik' ? '⚠ eksik koşu' : 'tamam'}</div></div></div>
      ${KS.durum === 'eksik' ? '<div class="ct-sub text-amber-300 mt-1">Eksik koşu: aday listesi tam evreni temsil etmeyebilir.</div>' : ''}`;
    const adaylar = ksFiltrele();
    return `${ksHata ? `<div class="p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200">${esc(ksHata)}</div>` : ''}
      <div class="card ct-card"><h2 class="bas">Huni ${ip('kapi')}</h2><div class="huni mt-2">${kutu('Havuz', havuz, 'havuz', 'ön elemeye giren')}<span class="ok" aria-hidden="true">→</span>${kutu('Aday', aday, 'aday', 'kapıyı geçen')}<span class="ok" aria-hidden="true">→</span>${kutu('Oda', oda, 'oda', 'kopyalamaya yakın')}</div></div>
      <div class="card ct-card"><h2 class="bas">Son tarama</h2><div class="mt-2">${tarama}</div></div>
      ${det('adaylar', `<b>Adaylar</b> <span class="ct-sub">(${adaylar.length} / ${(KS?.adaylar || []).length})</span>`, KS ? `${ksKontrol()}<div class="ct-grid mt-3">${adaylar.map(ksKart).join('') || bos('Bu filtrelerde aday yok.')}</div>` : bos('Keşif verisi henüz okunamadı.'), false)}`;
  }
  async function ksAdresiKopyala(adres) {
    const not = $('ksCopyNote');
    try { await navigator.clipboard.writeText(adres); not.textContent = 'Adres panoya kopyalandı.'; }
    catch (e) { not.textContent = 'Panoya kopyalanamadı.'; }
  }

  // ---------- 4) Ayarlar
  function ayarHtml() {
    const a = tutarAyar();
    return `<div class="card ct-card ct-detay"><h2 class="bas">Tutar hesaplayıcı</h2><label class="flex items-center gap-2 mt-3 text-sm"><input id="tutarAcik" type="checkbox" ${a.acik ? 'checked' : ''} onchange="tutarKaydet()"> Açık</label><label class="ct-sub block mt-3">Bütçe ($)<input id="tutarButce" class="ks-select mt-1" inputmode="decimal" value="${esc(a.butce || '')}" ${a.acik ? '' : 'disabled'} onchange="tutarKaydet()"></label><p class="ct-sub mt-3">Bütçe yalnız bu tarayıcıda saklanır. Bilgi amaçlıdır; emir göndermez.</p></div>
      <div class="card ct-card ct-detay"><h2 class="bas">Sözlük</h2>${Object.entries(SOZLUK).map(([k, [ad, m]]) => `<div class="ct-row"><b class="text-white">${esc(ad)}</b><div class="ct-sub">${esc(m)}</div></div>`).join('')}</div>`;
  }
  function tutarKaydet() {
    const acik = !!$('tutarAcik')?.checked, butce = Number($('tutarButce')?.value || 0);
    try { localStorage.setItem(TUTAR_AYAR, JSON.stringify({ acik, butce: isFinite(butce) && butce > 0 ? butce : 0 })); } catch (e) { }
    const kutu = $('tutarButce'); if (kutu) kutu.disabled = !acik;   // odak ayar alanındayken o bölüm yeniden çizilmez
    render();
  }

  // ---------- çizim
  function render() {
    hataKutusu(); yasGoster();
    const yaz = (id, f) => { try { $(id).innerHTML = f(); } catch (e) { $(id).innerHTML = `<div class="card empty">Bu bölüm çizilemedi (${esc(e.message)}).</div>`; console.error(e); } };
    yaz('ozMain', ozetHtml); yaz('kasaMain', kasaHtml); yaz('trMain', traderlarHtml); yaz('huMain', huniHtml);
    if (!document.activeElement?.closest?.('#ayarMain')) yaz('ayarMain', ayarHtml);   // yazarken yeniden çizme
    if (window.lucide) lucide.createIcons();
  }
  const ctSerit = render;

  // ---------- yükleme
  async function ctYukle(elle) {
    const ikon = $('refreshIcon'); if (elle && ikon) ikon.classList.add('animate-spin');
    ksYukle();
    try {
      const r = await fetch(CT_KAYNAK + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j || !Array.isArray(j.traderlar) || !Array.isArray(j.olaylar)) throw new Error('beklenen alanlar yok');
      if (j.surum !== 1) throw new Error('desteklenmeyen sürüm: ' + j.surum);
      CT = j; ctHata = null;
    } catch (e) { ctHata = 'Copy trade verisi okunamadı (' + e.message + ').'; }
    try {
      const r = await fetch(CT_KARAR + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.status === 404) CTK = { durum: 'yok', kayit: {}, bozuk: 0 };
      else if (!r.ok) throw new Error('HTTP ' + r.status);
      else {
        const kayit = {}; let bozuk = 0;
        (await r.text()).split('\n').filter((l) => l.trim()).forEach((l) => {
          try { const k = JSON.parse(l); if (k && k.olay_id && (k.karar === 'acti' || k.karar === 'atladi')) kayit[k.olay_id] = k; else bozuk++; } catch (e) { bozuk++; }
        });
        CTK = { durum: Object.keys(kayit).length ? 'ok' : 'yok', kayit, bozuk };
      }
    } catch (e) { CTK = { durum: 'hata', kayit: {}, bozuk: 0 }; }
    try {
      const r = await fetch(CT_DEGISIM + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.status === 404) CTD = { durum: 'yok', degisimler: [] };
      else if (!r.ok) throw new Error('HTTP ' + r.status);
      else { const j = await r.json(); CTD = { durum: Array.isArray(j.degisimler) ? 'ok' : 'hata', degisimler: Array.isArray(j.degisimler) ? j.degisimler : [] }; }
    } catch (e) { CTD = { durum: 'hata', degisimler: [] }; }
    render();
    midsYenile();
    yonlendir(); detayAc();
    if (ikon) setTimeout(() => ikon.classList.remove('animate-spin'), 400);
  }
  async function ksYukle() {
    const uygunMu = (j) => j && j.surum === 1 && Array.isArray(j.adaylar) && j.adaylar.every((a) => a && typeof a.adres === 'string'
      && ['intraday', 'swing', 'scalp'].includes(a.tarz) && ['kopyalanabilir', 'izleme_adayi'].includes(a.katman)
      && a.piyasa_payi && a.kopya && a.adimlar && Array.isArray(a.egri));
    const jsonOku = async (adres) => {
      const r = await fetch(adres + (adres.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    };
    try {
      const j = await jsonOku(KESIF_KAYNAK);
      if (!uygunMu(j)) throw new Error('canlı dosyada v1 şeması beklenen alanları içermiyor');
      KS = j; ksHata = null; ksKaynak = { tarih: String(j.uretildi || '').slice(0, 10), ornek: false };
    } catch (e) {
      try {
        const ornek = await jsonOku(KESIF_ORNEK);
        if (!uygunMu(ornek)) throw new Error('örnek veri v1 şeması beklenen alanları içermiyor');
        KS = ornek; ksKaynak = { ornek: true };
        ksHata = `Canlı Keşif verisi okunamadı (${e.message}).`;
      } catch (ornekHata) {
        KS = null; ksKaynak = null;
        ksHata = `Keşif verisi okunamadı (${e.message}; örnek veri: ${ornekHata.message}).`;
      }
    }
    const ksKutu = $('ksMsg');
    ksKutu.classList.toggle('hidden', !ksHata);
    ksKutu.textContent = !ksHata ? '' : ksKaynak?.ornek ? `⚠ Keşif ve Huni ÖRNEK (sahte) veri gösteriyor — gerçek tarama değil. ${ksHata}` : `⚠ ${ksHata}`;
    render(); yonlendir(); detayAc();
  }
  // trader sayfası açıksa o adresin canlı verisini yükle
  function detayAc() {
    if (!traderAdres) return;
    const k = (x) => x.adres.toLowerCase() === traderAdres.toLowerCase(), t = (CT?.traderlar || []).find(k) || (KS?.adaylar || []).find(k);
    if (t) hlDetayYukle(t.adres);
  }
  // eski adresler yeni sekmelere gider: #ct/<id> ve #kesif/<adres> → trader sayfası; #ctakis, #ctistat → özet; #ct → trader'lar; #kesif → huni
  function yonlendir() {
    const h = location.hash;
    let m = /^#ct\/(.+)$/.exec(h);
    if (m && CT) { const t = (CT.traderlar || []).find((x) => x.id === decodeURIComponent(m[1])); if (t) { location.replace('#trader/' + encodeURIComponent(t.adres)); return; } }
    m = /^#kesif\/(.+)$/.exec(h);
    if (m) { location.replace('#trader/' + m[1]); }
  }
  function ctHash() {
    const h = location.hash;
    const tm = /^#trader\/([^/]+)(?:\/(\d+))?(?:\/coin\/([^/]+))?$/.exec(h);
    traderAdres = tm ? decodeURIComponent(tm[1]) : null;
    traderCoin = tm?.[3] ? decodeURIComponent(tm[3]) : null;
    const eski = { '#ctakis': 'ozet', '#ctistat': 'ozet', '#ct': 'traderlar', '#kesif': 'huni' }, ad = h.replace(/^#/, '');
    if (tm || /^#(ct|kesif)\//.test(h)) showTab('traderlar');
    else showTab(TABS.some((x) => x[0] === ad) ? ad : eski[h] || 'ozet');
    yonlendir(); render(); detayAc();
    if (!traderAdres) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', ctHash);

  buildNav();
  showTab('ozet');
  ctHash(); ctYukle();
  setInterval(ctYukle, 5 * 60 * 1000);
  setInterval(midsYenile, 60 * 1000);
  setInterval(render, 60 * 1000);

</script>
</body>
</html>
