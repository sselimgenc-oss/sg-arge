<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Pano</title>
  <meta name="description" content="sg-arge paper trade panosu: sanal defter, gerçek para yok.">
  <link rel="stylesheet" href="vendor/tailwind.3.4.17.css">
  <script src="vendor/chart.umd.4.4.1.js"></script>
  <script src="vendor/lucide.0.460.0.min.js"></script>
  <style>
    :root {
      --bg: #0d1527; --header: #101a30; --card: #16223b; --hover: #1d2c4b; --border: #243555;
      --accent: #f5cb5c; --text: #e2e8f0; --muted: #94a3b8; --up: #10b981; --down: #ef4444;
    }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; }
    .nav-btn.active { background-color: #1c2a47; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
    .nav-btn.active i { color: var(--accent); }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
    .empty { padding: 1.25rem; text-align: center; color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 0.25rem; font-size: 10px; font-weight: 600; }
    /* copy trade sekmeleri (telefon öncelikli: tek sütun, tablo yok, yatay kaydırma yok) */
    .ct-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .ct-card { display: block; min-width: 0; padding: 0.875rem; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .ct-card:hover, .ct-card:focus-visible { background: var(--hover); outline: none; }
    .ct-card.kirmizi { opacity: 0.6; }
    .ct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .ct-name { font-weight: 700; color: #fff; font-size: 15px; }
    .ct-sub { font-size: 11px; color: var(--muted); }
    .ct-pos { border-top: 1px solid var(--border); padding: 0.5rem 0; font-size: 12px; }
    .ct-pos .l1 { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
    .ct-pos .l1 > span:first-child { display: inline-flex; align-items: center; gap: 0.375rem; white-space: nowrap; }
    .ct-pos .l2 { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .ct-sec { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); font-size: 12px; }
    .ct-b-ok { background: rgba(16,185,129,.18); color: #34d399; } .ct-b-warn { background: rgba(245,203,92,.18); color: #f5cb5c; }
    .ct-b-bad { background: rgba(239,68,68,.18); color: #f87171; } .ct-b-mut { background: rgba(148,163,184,.18); color: #cbd5e1; }
    /* sabit üst şerit: sticky'nin çalışması için CT sekmesi açıkken main/kap taşma kırpmasını bırakır (belge kayar) */
    body.ct-aktif #layoutWrap, body.ct-aktif #main { overflow: visible; }
    .ct-sticky { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 0.375rem 0; margin-top: -0.375rem; }
    .ct-strip { padding: 0.375rem 0.625rem; font-size: 11px; color: var(--muted); }
    .ct-strip.stale { border-color: #b45309; background: #2a2012; color: #fcd34d; }
    .ct-stat { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 0.5rem; }
    .ct-stat .k { font-size: 9px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .ct-stat .v { font-size: 13px; font-weight: 700; color: #fff; overflow-wrap: anywhere; }
    .ct-age { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 0.5rem; font-size: 10px; }
    .ct-card.tik { cursor: pointer; }
    .ct-pos summary { list-style: none; cursor: pointer; }
    .ct-pos summary::-webkit-details-marker { display: none; }
    .ct-pos summary .ok { display: inline-block; color: var(--muted); transition: transform .15s; margin-left: 2px; }
    .ct-pos[open] summary .ok { transform: rotate(90deg); }
    .ct-bn { display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
    .ct-pos .ek span { white-space: nowrap; }
    .ct-pos .ek { color: var(--muted); font-size: 11px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 0.75rem; align-items: center; }
    .ct-row { padding: 0.625rem 0; border-top: 1px solid var(--border); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    .ct-row:first-child { border-top: 0; }
    @media (max-width: 359px) { .yenile-yazi { display: none; } }
    .ct-detay { max-width: 760px; }
    .ct-btn { background: #1c2a47; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem 0.875rem; font-size: 12px; color: var(--text); min-height: 40px; }
    .ct-btn[disabled] { opacity: 0.4; }
    .ct-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem; }
    .ct-kv > div { background: #101a30; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.375rem 0.5rem; min-width: 0; }
    .ct-kv .k { font-size: 10px; color: var(--muted); } .ct-kv .v { font-size: 13px; font-weight: 600; }
    /* Keşif: kartlar tek sütunda da okunur; filtreler asla yatay kaydırma oluşturmaz. */
    .ks-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: .5rem; }
    .ks-select { width: 100%; min-width: 0; background: #1c2a47; border: 1px solid var(--border); border-radius: .375rem; color: var(--text); padding: .6rem .5rem; font-size: 12px; }
    .ks-card { cursor: pointer; }
    .ks-card:hover, .ks-card:focus-visible { background: var(--hover); outline: none; }
    .ks-card-head { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; }
    .ks-address { font-weight: 700; color: #fff; font-size: 14px; }
    .ks-egr i { display: block; height: 42px; }
    .ks-share { display: flex; height: 7px; overflow: hidden; border-radius: 99px; background: #0f172a; margin-top: .3rem; }
    .ks-share > span { min-width: 0; }
    .ks-adim { display: grid; grid-template-columns: auto 1fr; gap: .25rem .6rem; align-items: start; border-top: 1px solid var(--border); padding: .55rem 0; font-size: 12px; }
    .ks-adim:first-child { border-top: 0; }
    .ks-copy-note { min-height: 1.1rem; font-size: 11px; color: var(--muted); }
    .ks-bilgi { font-size: 11px; color: var(--muted); }
    .ct-live { font-size: 12px; color: var(--muted); }
    .ct-live-pos { border-top: 1px solid var(--border); padding: .6rem 0; }
    .ct-live-pos:first-child { border-top: 0; }
    .ct-link { color: #93c5fd; text-decoration: underline; font-size: 12px; min-height: 44px; display: inline-flex; align-items: center; }
    .ct-open-strip { overflow: hidden; max-height: 18rem; }
    .ct-open-strip.pause .ct-open-list { animation-play-state: paused; }
    .ct-open-row { display: block; width: 100%; text-align: left; border-top: 1px solid var(--border); padding: .55rem 0; font-size: 12px; color: var(--text); }
    .ct-open-row:first-child { border-top: 0; }
    .ct-trade { border-top: 1px solid var(--border); padding: .65rem 0; font-size: 12px; }
    .ct-trade:first-child { border-top: 0; }
    .ct-trade.vurgu { background: rgba(250, 204, 21, .12); box-shadow: 0 0 0 1px rgba(250, 204, 21, .5); padding-inline: .4rem; border-radius: .35rem; }
    @media (prefers-reduced-motion: no-preference) { .ct-open-strip.kayan .ct-open-list { animation: ct-open-scroll 20s linear infinite; } @keyframes ct-open-scroll { from { transform: translateY(0); } to { transform: translateY(-50%); } } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ÜST BAŞLIK -->
  <header class="bg-[#101a30] border-b border-[#243555] px-4 py-2.5 flex items-center justify-between gap-3">
    <h1 class="text-base font-bold text-white min-w-0 truncate">SG Pano · Copy trade</h1>
    <div class="flex items-center gap-2 flex-shrink-0">
      <span class="text-[11px] text-slate-400 whitespace-nowrap" id="dataAge">—</span>
      <button onclick="ctYukle(true)" class="ct-btn flex items-center justify-center gap-1.5" style="padding:0.375rem 0.75rem;min-height:36px" aria-label="Yenile">
        <i id="refreshIcon" data-lucide="refresh-cw" class="w-3.5 h-3.5 text-[#f5cb5c]"></i><span class="yenile-yazi">Yenile</span>
      </button>
    </div>
  </header>

  <div id="layoutWrap" class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <!-- MENÜ: geniş ekranda sol sütun, dar ekranda yatay şerit -->
    <aside class="lg:w-60 bg-[#101a30] border-b lg:border-b-0 lg:border-r border-[#243555] flex lg:flex-col justify-between flex-shrink-0">
      <nav id="nav" class="flex lg:flex-col overflow-x-auto lg:overflow-visible py-1 lg:py-2 text-xs w-full"></nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-6" id="main">
      <!-- COPY TRADE: ana ekran (kartlar) + ayrıntı -->
      <section data-tab="ct" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctMain"></div>
      </section>

      <!-- COPY TRADE: akış -->
      <section data-tab="ctakis" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctAkis"></div>
      </section>

      <!-- COPY TRADE: istatistik -->
      <section data-tab="ctistat" class="tab hidden space-y-4">
        <div class="ct-msg hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div class="ct-sticky"><div class="ct-strip card"></div></div>
        <div id="ctIstat"></div>
      </section>

      <!-- KEŞİF: kapı adayları, yalnız okunur; kopyalama düğmesi adresi panoya alır. -->
      <section data-tab="kesif" class="tab hidden space-y-4">
        <div id="ksMsg" class="hidden p-3 rounded border border-red-800 bg-red-950/40 text-xs text-red-200"></div>
        <div id="ksMain"></div>
      </section>

      <section data-tab="ayarlar" class="tab hidden space-y-4">
        <div id="ayarMain"></div>
      </section>

    </main>
  </div>

<script>
  const TABS = [
    ['ct', 'Copy trade', 'users'], ['kesif', 'Keşif', 'compass'], ['ctakis', 'CT akış', 'activity'], ['ctistat', 'CT istatistik', 'bar-chart-3'], ['ayarlar', 'Ayarlar', 'settings'],
  ];
  const charts = {};

  // ---------- yardımcılar
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
  const cls = (v) => !isNum(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  function buildNav() {
    $('nav').innerHTML = TABS.map(([id, label, icon]) =>
      `<button data-nav="${id}" onclick="showTab('${id}')" class="nav-btn flex items-center gap-2.5 px-4 py-2.5 text-slate-300 hover:bg-[#1a2438] whitespace-nowrap lg:w-full">
         <i data-lucide="${icon}" class="w-4 h-4 text-slate-400"></i><span>${label}</span><span class="ml-auto text-[10px] text-slate-400" id="navc-${id}"></span></button>`).join('');
  }
  function showTab(id) {
    document.querySelectorAll('.tab').forEach((s) => s.classList.toggle('hidden', s.dataset.tab !== id));
    document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.nav === id));
    document.body.classList.toggle('ct-aktif', id.startsWith('ct'));
    if (id === 'ct') ctCizim();
    if (id === 'kesif') ksRender();
    if (id === 'ayarlar') ayarRender();
  }

  function chart(id, cfg) {
    if (charts[id]) charts[id].destroy();
    const el = $(id); if (!el || !window.Chart) return;
    charts[id] = new Chart(el, cfg);
  }
  const axes = { x: { ticks: { color: '#94a3b8', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: '#1f2b42' } }, y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1f2b42' } } };
  const base = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: axes };

  // ---------- copy trade izleme (tanım: sg-arge docs/PANO_COPYTRADE.md, veri: docs/VERI_SOZLESMESI.md, surum 1)
  // Kaynak adresleri yalnız burada değişir (canlı: sg-arge copytrade-izleme dalı; örnek sabit veri: ./izleme/ornek_durum.json).
  const CT_KAYNAK = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/durum.json';
  const CT_KARAR = 'https://raw.githubusercontent.com/sselimgenc-oss/sg-arge/copytrade-izleme/izleme/kararlar.jsonl'; // dosya yoksa (404) karar kaydı yok sayılır
  // Keşif verisinin tek uzak kaynağı: GitHub API tarih klasörünü, ardından API'nin verdiği ham adresi bulur.
  const KESIF_KAYNAK = 'https://api.github.com/repos/sselimgenc-oss/sg-arge/contents/copytrade/kapi?ref=copytrade-kapi';
  const KESIF_ORNEK = './kesif/ornek_kesif.json';
  const CT_ESKI_DK = 90, CT_SAYFA = 8, CT_AKIS_ADIM = 50, CT_YETERSIZ = 10;
  const KAYMA_ESIK = { intraday: 0.005, swing: 0.015 }; // kullanıcı kararı: %0,5 / %1,5
  const HL_INFO = 'https://api.hyperliquid.xyz/info', TUTAR_AYAR = 'sg-pano-tutar-v1';
  let CT = null, CTK = { durum: 'yok', kayit: {}, bozuk: 0 }, ctHata = null;
  let ctSel = null, traderAdres = null, traderCoin = null, ctSayfa = 0, ctFiltre = '', ctAkisN = CT_AKIS_ADIM;
  let KS = null, ksHata = null, ksSel = null, ksKaynak = null;
  let HL = {}, MIDS = {}, midsZaman = null, midDexler = null;
  let ksFiltre = { tarz: '', katman: '', piyasa: '', gecmis: '', sirala: 'alfa_t' };

  const ISIK = { yesil: ['🟢', 'Yeşil'], sari: ['🟡', 'Sarı'], kirmizi: ['🔴', 'Kırmızı'] };
  const TUR = { acilis: 'Açılış', kapanis: 'Kapanış', buyutme: 'Büyütme', azaltma: 'Azaltma', isik: 'Işık' };
  const NEDEN = { gec_gordum: 'geç gördüm', begenmedim: 'beğenmedim', bakiye_yok: 'bakiye yok', diger: 'diğer' };
  const ctIsik = (t) => (ISIK[t.saglik && t.saglik.isik] || ['⚪', 'Bilinmiyor']);
  const ctKirmizi = (t) => !!t.saglik && t.saglik.isik === 'kirmizi';
  const ctYonCls = (y) => y === 'long' ? 'up' : y === 'short' ? 'down' : 'flat';
  const ctYonRozet = (y) => ctRozet(ctYon(y) || '?', y === 'long' ? 'ct-b-ok' : y === 'short' ? 'ct-b-bad' : 'ct-b-mut');
  const ctKaldirac = (v) => isNum(v) ? ctRozet(fmt(v, 1).replace(',0', '') + 'x', 'ct-b-mut') : '';
  const ctRozet = (txt, c) => `<span class="badge ${c}">${esc(txt)}</span>`;
  const ctKapiRozet = (k) => { const s = k && k.sinif; return ctRozet(s || 'kapı yok', s === 'Geçti' ? 'ct-b-ok' : s === 'Yetersiz' ? 'ct-b-warn' : s === 'Kaldı' ? 'ct-b-bad' : 'ct-b-mut'); };
  // oranlar (0,08) → %8 ; sayılar Türkçe biçim, para "1.043,20 $"
  const ctP = (v, d = 0) => isNum(v) ? '%' + fmt(v * 100, d) : '—';
  const ctPs = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '-' : '') + '%' + fmt(Math.abs(v * 100), d) : '—';
  const ctUsd = (v, d = 2) => isNum(v) ? (v < 0 ? '-' : '') + fmt(Math.abs(v), d) + ' $' : '—';
  const ctUsdA = (v) => ctUsd(v, isNum(v) && Math.abs(v) < 100 ? 2 : 0); // küçük tutarlar kuruşlu
  const ctUsds = (v, d) => isNum(v) ? (v > 0 ? '+' : '') + (d === undefined ? ctUsdA(v) : ctUsd(v, d)) : '—';
  const ctFiyat = (v) => isNum(v) ? v.toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: v >= 1000 ? 2 : v >= 1 ? 4 : 6 }) : '—';
  const ctYon = (y) => y ? String(y).toUpperCase() : '';
  const ctDate = (iso) => new Date(String(iso || '').replace(/(\.\d{3})\d+/, '$1')); // Safari/WebKit için kesir 3 haneye
  const ctTarih = (iso, tamZaman) => {
    const t = iso ? ctDate(iso) : null; if (!t || isNaN(t)) return '—';
    return t.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: '2-digit', ...(tamZaman === false ? {} : { hour: '2-digit', minute: '2-digit' }) });
  };
  const ctAcikSaat = (iso) => {
    const t = iso ? ctDate(iso) : null; if (!t || isNaN(t)) return '—';
    const gun = (d) => d.toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' });
    const saat = t.toLocaleTimeString('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit' });
    if (gun(t) === gun(new Date())) return `Bugün ${saat}`;
    if (gun(t) === gun(new Date(Date.now() - 86400000))) return `Dün ${saat}`;
    return t.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  const ctAdr = (a) => { a = String(a || ''); return a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a; };
  const ctYasDakika = (iso) => { const d = ctDate(iso); return !isNaN(d) ? Math.max(0, Math.round((Date.now() - d.getTime()) / 60000)) : null; };
  const ctTazelik = (iso) => { const dk = ctYasDakika(iso); return dk == null ? 'Veri saati bilinmiyor' : `Veri ${ctYas(dk)}${dk > CT_ESKI_DK ? ' · eski' : ''}`; };
  const ctEskiVeri = (t) => t && t.gecerli === false;
  function ctYas(dk) { return dk < 60 ? `${dk} dk önce` : dk < 2880 ? `${Math.round(dk / 60)} sa önce` : `${Math.round(dk / 1440)} gün önce`; }
  function ctBinance(b) {
    const m = b === 'var' ? ['badge-check', 'up', "Binance'te var"] : b === 'yok' ? ['ban', 'down', "Binance'te yok"] : ['circle-help', 'flat', 'Binance durumu bilinmiyor'];
    return `<span class="ct-bn ${m[1]}" title="${esc(m[2])}" aria-label="${esc(m[2])}"><i data-lucide="${m[0]}" class="w-3.5 h-3.5"></i></span>`;
  }
  async function hlPost(body) {
    const r = await fetch(HL_INFO, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  const hlDexler = (x) => (Array.isArray(x) ? x : []).map((d) => d && d.name).filter(Boolean);
  async function midsYenile() {
    if (!CT) return;
    try {
      midDexler = midDexler || hlDexler(await hlPost({ type: 'perpDexs' }));
      const yanitlar = await Promise.all([hlPost({ type: 'allMids' }), ...midDexler.map((dex) => hlPost({ type: 'allMids', dex }))]);
      MIDS = Object.assign({}, ...yanitlar); midsZaman = Date.now(); ctSerit();
    } catch (e) { /* static durum.json positions remain visible */ }
  }
  async function hlSon30GunIslemleri(adres) {
    const bitis = Date.now(), baslangic = bitis - 30 * 24 * 60 * 60 * 1000, tum = new Map();
    let imlec = baslangic;
    while (imlec < bitis) {
      const sayfa = await hlPost({ type: 'userFillsByTime', user: adres, startTime: imlec, endTime: bitis, limit: 2000 });
      if (!Array.isArray(sayfa) || !sayfa.length) break;
      sayfa.forEach((f) => tum.set(`${f.coin}|${f.tid}`, f));
      const enYeni = Math.max(...sayfa.map((f) => Number(f.time)));
      if (sayfa.length < 2000 || enYeni < imlec) break;
      imlec = enYeni + 1;
    }
    return [...tum.values()].sort((a, b) => Number(a.time) - Number(b.time));
  }
  function hlPozisyonlar(state, mids) {
    return (state?.assetPositions || []).map((x) => x.position || x).map((p) => {
      const miktar = Number(p.szi), coin = p.coin, mid = Number(mids?.[coin]);
      if (!coin || !miktar || !isNum(mid)) return null;
      const deger = Math.abs(miktar * mid), hesap = Number(state?.marginSummary?.accountValue);
      return { coin, yon: miktar > 0 ? 'long' : 'short', giris: Number(p.entryPx), mid, deger, hesap_payi: hesap > 0 ? deger / hesap : null,
        kaldirac: Number(p.leverage?.value), anlik_kz: Number(p.unrealizedPnl) };
    }).filter(Boolean);
  }
  async function hlDetayYukle(adres, zorla = false) {

  // ---------- ana ekran / ayrıntı
  function ctRenderAna() {

      return;
    }
    el.innerHTML = tr.length ? `<div class="ct-grid">${ctSirala(tr).map(ctKart).join('')}</div>` : '<div class="card empty">Henüz izlenen trader yok.</div>';
  }

  function ctKararRozet(o) {

    if (o.tur !== 'acilis') return '';
    return CTK.durum === 'hata' ? ctRozet('karar kaydı okunamadı', 'ct-b-warn') : ctRozet('cevapsız', 'ct-b-warn');
  }
  function ctOlayMetin(o) {
    if (o.tur === 'isik') { const i = ISIK[o.not]; return i ? `ışık → ${i[0]} ${esc(i[1].toLowerCase())}` : 'ışık değişti'; }
    return `<b class="text-white">${esc(o.coin)}</b> ${ctYonRozet(o.yon)} ${ctKaldirac(o.kaldirac)}`

  function ctOlayYuvarlak(o, adGoster) {

      ${adGoster ? `<b class="text-white">${esc(t ? t.takma_ad : o.trader)}</b>` : ''}${ctRozet(TUR[o.tur] || o.tur, 'ct-b-mut')}${ctKararRozet(o)}${ctSanalRozet(o)}</div>
      <div class="mt-1">${ctOlayMetin(o)}${o.not && o.tur !== 'isik' ? ` <span class="ct-sub">· ${esc(o.not)}</span>` : ''}</div></div>`;
  }
  const ctOlaylar = () => ((CT && CT.olaylar) || []).slice().sort((a, b) => String(b.zaman).localeCompare(String(a.zaman)));

  function ctAyrinti(t) {

    const kr = olay.filter((o) => CTK.kayit[o.id]), acti = kr.filter((o) => CTK.kayit[o.id].karar === 'acti').length, atladi = kr.length - acti;
    const cevapsiz = olay.filter((o) => o.tur === 'acilis' && !CTK.kayit[o.id]).length;

    return `<a href="#" class="ct-btn inline-flex items-center gap-1 mb-3">← Kartlar</a>
      <div class="space-y-4 ct-detay">
      <div class="card ct-card"><div class="ct-head"><span class="ct-name text-lg">${esc(t.takma_ad)}</span><span aria-label="Sağlık: ${esc(ad)}">${em} ${esc(ad)}</span>${ctEskiVeri(t) ? ctRozet('eski / eksik veri', 'ct-b-warn') : ''}${ctKapiRozet(t.kapi)}
          ${ctKirmizi(t) ? ctRozet('izlemede — kopyalama', 'ct-b-bad') : t.durum && t.durum !== 'kopyala' ? ctRozet(t.durum, 'ct-b-mut') : ''}</div>

        <div class="ct-kv mt-3">${kv('Form skoru', isNum(t.form && t.form.skor) ? fmt(t.form.skor, 1) : '—')}${kv('30 gün', ctPs(t.form && t.form.getiri_30g))}${kv('90 gün', ctPs(t.form && t.form.getiri_90g))}</div></div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Sağlık ışığının nedenleri</h3>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Açık pozisyonlar</h3>
        ${poz.length ? poz.map((p) => ctPozisyon(p, true)).join('') : '<div class="ct-sub">pozisyon yok</div>'}</div>

      <div class="card ct-card">${hlDetayHtml(t, olay)}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Kâr eğrisi (son 90 gün)</h3>
        ${(t.egri || []).some((p) => p && isNum(p[1])) ? '<div class="relative h-56"><canvas id="ctChEgri"></canvas></div>' : '<div class="ct-sub">kâr eğrisi yok</div>'}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Sanal kopya</h3>
        ${sk ? `<div class="ct-kv">${kv('Başlangıç', ctUsd(sk.baslangic_usd, 0))}${kv('Bakiye', `<span class="${cls(sk.getiri)}">${ctUsd(sk.bakiye_usd)}</span>`)}${kv('Getiri', `<span class="${cls(sk.getiri)}">${ctPs(sk.getiri)}</span>`)}${kv('Düşüş', ctP(sk.dusus, 1))}${kv('Gecikme', isNum(sk.gecikme_dk) ? fmt(sk.gecikme_dk, 0) + ' dk' : '—')}${kv('t0', esc(sk.t0 || '—'))}</div>` : '<div class="ct-sub">henüz veri yok</div>'}
        ${ctSkEgri(sk) ? '<div class="relative h-48 mt-3"><canvas id="ctChSanal"></canvas></div><div class="ct-sub">günlük sanal bakiye (t0\'dan beri)</div>' : '<div class="ct-sub mt-2">sanal kopya eğrisi: henüz veri yok</div>'}</div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">Açtıklarım ↔ tümü</h3>
        <div class="ct-kv">${kv('Açtım', acti)}${kv('Atladım', atladi)}${kv('Cevapsız', cevapsiz)}</div>
        <div class="mt-2">${ctKarsilastirHtml(ctKarsilastir(olay))}</div>
        <div class="ct-sub mt-2">${CTK.durum === 'hata' ? 'Karar kaydı okunamadı. ' : CTK.durum === 'yok' ? 'Henüz karar kaydı yok. ' : ''}Sonuç: kapanmış olayların kopyalanan tutara göre maliyet sonrası net getirisinin ortalaması.</div></div>

      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-1">İşlem geçmişi <span class="ct-sub font-normal">(${olay.length} olay; veride son 200 olay var)</span></h3>
        ${dilim.length ? dilim.map((o) => ctOlayYuvarlak(o, false)).join('') : '<div class="ct-sub">bu trader için olay yok</div>'}
        <div class="flex items-center justify-between mt-2"><button class="ct-btn" onclick="ctSayfaGit(-1)" ${ctSayfa === 0 ? 'disabled' : ''}>← Önceki</button>
          <span class="ct-sub">${ctSayfa + 1} / ${sayfaSay}</span><button class="ct-btn" onclick="ctSayfaGit(1)" ${ctSayfa + 1 >= sayfaSay ? 'disabled' : ''}>Sonraki →</button></div></div>
      </div>`;
  }
  const ctSkEgri = (sk) => { const e = ((sk && sk.egri) || []).filter((p) => p && isNum(p[1])); return e.length >= 2 ? e : null; };
  function ctSayfaGit(d) { ctSayfa = Math.max(0, ctSayfa + d); ctRender(); }

  function ctCizim() {
    if (!CT || !ctSel) { ['ctChEgri', 'ctChSanal'].forEach((k) => { if (charts[k]) { charts[k].destroy(); delete charts[k]; } }); return; }
    const t = (CT.traderlar || []).find((x) => x.id === ctSel); if (!t || !$('ctChEgri')) return;
    const sg = ctSkEgri(t.sanal_kopya);
    if (sg && $('ctChSanal')) chart('ctChSanal', { type: 'line', data: { labels: sg.map((p) => p[0]), datasets: [{ data: sg.map((p) => p[1]), borderColor: '#10b981', borderWidth: 2, pointRadius: 0, tension: 0.15 }] },

    const pts = (t.egri || []).filter((p) => p && isNum(p[1]));

      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ctPs(c.parsed.y, 2) } } } };
    chart('ctChEgri', { type: 'line', data: { labels: pts.map((p) => p[0]), datasets: [{ data: pts.map((p) => p[1]), borderColor: '#f5cb5c', borderWidth: 2, pointRadius: 0, tension: 0.15 }] }, options: opt });
  }

  // ---------- akış sekmesi

    const el = $('ctAkis');

      <select id="ctFiltreSel" class="bg-[#1c2a47] border border-[#243555] px-2.5 py-2 rounded text-slate-200 text-xs" onchange="ctFiltre=this.value;ctAkisN=${CT_AKIS_ADIM};ctRender()">
        <option value="">Tüm traderlar</option>${tr.map((t) => `<option value="${esc(t.id)}"${t.id === ctFiltre ? ' selected' : ''}>${esc(t.takma_ad)}</option>`).join('')}</select></div>
      ${CTK.durum === 'hata' ? '<div class="ct-sub text-amber-300">Karar kaydı okunamadı; karar durumları eksik olabilir.</div>' : CTK.durum === 'yok' ? '<div class="ct-sub">Henüz karar kaydı yok.</div>' : ''}

  // ---------- istatistik sekmesi
  function ctRenderIstat() {
    const el = $('ctIstat');

      const acti = kr.filter((k) => k.karar === 'acti').length, cevapsiz = o.filter((x) => x.tur === 'acilis' && !CTK.kayit[x.id]).length;

        <div class="ct-kv mt-2">${kv('Sanal kopya getirisi', `<span class="${cls(t.sanal_kopya && t.sanal_kopya.getiri)}">${ctPs(t.sanal_kopya && t.sanal_kopya.getiri)}</span>`)}${kv('Olay', o.length)}${kv('Açtım', acti)}${kv('Atladım', kr.length - acti)}${kv('Cevapsız', cevapsiz)}</div>

        <div class="ct-sec">${ctKarsilastirHtml(ctKarsilastir(olay))}<div class="ct-sub mt-1">Fark = açtıklarımın ortalama sanal sonucu − tüm olayların. ${kayitlar.length ? '' : 'Henüz karar kaydı yok. '}${CTK.durum === 'hata' ? 'Karar kaydı okunamadı. ' : ''}Eşik: ${CT_YETERSIZ} kapanmış ve karar verilmiş olay.</div></div>

  function ctRender() { ctSerit(); ctRenderAna(); ctRenderAkis(); ctRenderIstat(); if (window.lucide) lucide.createIcons(); ctCizim(); }

  // ---------- keşif (sg-arge docs/GOREV_TRADER_SECIMI.md, kesif.json v1)
  const ksRozet = (metin, sinif) => ctRozet(metin, sinif);
  const ksTarz = (a) => a.tarz === 'swing' ? 'Swing' : a.tarz === 'intraday' ? 'Intraday' : 'Scalp';
  const ksKatman = (a) => a.katman === 'kopyalanabilir' ? ['Kopyalanabilir', 'ct-b-ok'] : ['İzleme adayı', 'ct-b-warn'];
  const ksDurum = (d) => d === 'Geçti' ? 'ct-b-ok' : d === 'Kaldı' ? 'ct-b-bad' : 'ct-b-warn';
  const ksPiyasa = (a) => Object.entries(a.piyasa_payi || {}).sort((x, y) => y[1] - x[1])[0]?.[0] || '';
  const ksPay = (a) => {
    const p = a.piyasa_payi || {}, renk = { kripto: '#38bdf8', hisse: '#a78bfa', emtia: '#f5cb5c' };
    return `<div class="ks-share" aria-label="Piyasa payları">${['kripto', 'hisse', 'emtia'].map((k) => `<span style="width:${Math.max(0, p[k] || 0) * 100}%;background:${renk[k]}"></span>`).join('')}</div><div class="ct-sub mt-1">Kripto ${ctP(p.kripto)} · Hisse ${ctP(p.hisse)} · Emtia ${ctP(p.emtia)}</div>`;
  };
  function ksFiltrele() {
    let l = (KS?.adaylar || []).filter((a) => (!ksFiltre.tarz || a.tarz === ksFiltre.tarz)
      && (!ksFiltre.katman || a.katman === ksFiltre.katman)
      && (!ksFiltre.piyasa || ksPiyasa(a) === ksFiltre.piyasa)
      && (!ksFiltre.gecmis || a.gecmis_gun >= 365));
    const deger = (a) => ksFiltre.sirala === 'g30' ? a.kopya?.g30 : ksFiltre.sirala === 'g120' ? a.kopya?.g120 : ksFiltre.sirala === 'tutma' ? a.medyan_tutma_sa : a.alfa_t;
    return l.sort((a, b) => ((a.katman === 'kopyalanabilir') - (b.katman === 'kopyalanabilir')) * -1
      || (a.genc_aday - b.genc_aday) || ((deger(b) ?? -Infinity) - (deger(a) ?? -Infinity)));
  }
  function ksEgrisi(egri) {
    const y = (egri || []).map((p) => p?.[1]).filter(isNum);
    if (y.length < 2) return '<div class="ct-sub">kâr eğrisi yok</div>';
    const mn = Math.min(...y), mx = Math.max(...y), aralik = mx - mn || 1;
    const pts = y.map((v, i) => `${(i * 100 / (y.length - 1)).toFixed(2)},${(30 - ((v - mn) / aralik * 27)).toFixed(2)}`).join(' ');
    const renk = y[y.length - 1] >= y[0] ? '#10b981' : '#ef4444';
    return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" class="w-full" role="img" aria-label="Haftalık kâr eğrisi"><polyline points="${pts}" fill="none" stroke="${renk}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function ksKart(a) {
    const [katman, renk] = ksKatman(a), once = a.tarz === 'swing' ? ['2 sa kopya', a.kopya?.g120] : ['30 dk kopya', a.kopya?.g30];
    return `<a class="card ct-card ks-card" href="#trader/${encodeURIComponent(a.adres)}">
      <div class="ks-card-head"><span class="ks-address">${esc(ctAdr(a.adres))}</span>${ksRozet(ksTarz(a), 'ct-b-mut')}${ksRozet(katman, renk)}${a.genc_aday ? ksRozet('Genç aday', 'ct-b-warn') : ''}</div>

      <div class="ct-kv mt-2"><div><div class="k">Medyan tutma</div><div class="v">${fmt(a.medyan_tutma_sa, 1)} sa</div></div><div><div class="k">Medyan kaldıraç</div><div class="v">${fmt(a.medyan_kaldirac, 1)}x</div></div><div><div class="k">${once[0]}</div><div class="v ${cls(once[1])}">${ctPs(once[1])}</div></div><div><div class="k">Diğer gecikme</div><div class="v ${cls(a.tarz === 'swing' ? a.kopya?.g30 : a.kopya?.g120)}">${ctPs(a.tarz === 'swing' ? a.kopya?.g30 : a.kopya?.g120)}</div></div><div><div class="k">Kârlı ay</div><div class="v">${ctP(a.karli_ay_orani)}</div></div><div><div class="k">Binance payı</div><div class="v">${ctP(a.binance_payi)}</div></div></div>
      <div class="ct-sec">${ksPay(a)}</div></a>`;
  }
  function ksKontrol() {
    const f = ksFiltre;
    return `<div class="card ct-card"><div class="ks-controls"><label class="ct-sub">Tarz<select class="ks-select mt-1" onchange="ksFiltre.tarz=this.value;ksRender()"><option value="">Tümü</option><option value="intraday"${f.tarz === 'intraday' ? ' selected' : ''}>Intraday</option><option value="swing"${f.tarz === 'swing' ? ' selected' : ''}>Swing</option></select></label><label class="ct-sub">Katman<select class="ks-select mt-1" onchange="ksFiltre.katman=this.value;ksRender()"><option value="">Tümü</option><option value="kopyalanabilir"${f.katman === 'kopyalanabilir' ? ' selected' : ''}>Kopyalanabilir</option><option value="izleme_adayi"${f.katman === 'izleme_adayi' ? ' selected' : ''}>İzleme adayı</option></select></label><label class="ct-sub">Piyasa (ağırlık)<select class="ks-select mt-1" onchange="ksFiltre.piyasa=this.value;ksRender()"><option value="">Tümü</option><option value="kripto"${f.piyasa === 'kripto' ? ' selected' : ''}>Kripto</option><option value="hisse"${f.piyasa === 'hisse' ? ' selected' : ''}>Hisse</option><option value="emtia"${f.piyasa === 'emtia' ? ' selected' : ''}>Emtia</option></select></label><label class="ct-sub">Geçmiş<select class="ks-select mt-1" onchange="ksFiltre.gecmis=this.value;ksRender()"><option value="">Tümü</option><option value="12"${f.gecmis ? ' selected' : ''}>≥12 ay</option></select></label><label class="ct-sub">Sıralama<select class="ks-select mt-1" onchange="ksFiltre.sirala=this.value;ksRender()"><option value="alfa_t"${f.sirala === 'alfa_t' ? ' selected' : ''}>Alfa t</option><option value="g30"${f.sirala === 'g30' ? ' selected' : ''}>30 dk kopya</option><option value="g120"${f.sirala === 'g120' ? ' selected' : ''}>2 sa kopya</option><option value="tutma"${f.sirala === 'tutma' ? ' selected' : ''}>Tutma süresi</option></select></label></div></div>`;
  }
  function ksAyrinti(a) {
    const [katman, renk] = ksKatman(a), adimlar = Array.from({ length: 8 }, (_, i) => a.adimlar?.[String(i + 1)] || { durum: 'Yetersiz', neden: 'Veri yok.' });
    const kv = (k, v) => `<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
    return `<a href="#kesif" class="ct-btn inline-flex mb-3">← Adaylar</a><div class="space-y-4 ct-detay"><div class="card ct-card"><div class="ks-card-head"><span class="ct-name text-lg">${esc(ctAdr(a.adres))}</span>${ksRozet(ksTarz(a), 'ct-b-mut')}${ksRozet(katman, renk)}${a.genc_aday ? ksRozet('Genç aday', 'ct-b-warn') : ''}</div><div class="ct-sub mt-2 break-all">${esc(a.adres)}</div><div class="flex flex-wrap gap-2 mt-3"><button class="ct-btn" onclick="ksAdresiKopyala('${esc(a.adres)}')"><i data-lucide="copy" class="w-3.5 h-3.5 inline"></i> Adresi kopyala</button><span id="ksCopyNote" class="ks-copy-note self-center"></span></div></div>
      <div class="card ct-card">${hlDetayHtml(a)}</div>
      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-2">Kapı adımları</h3>${adimlar.map((x, i) => `<div class="ks-adim"><div>${ksRozet(`${i + 1}. ${x.durum}`, ksDurum(x.durum))}</div><div>${esc(x.neden || 'Neden belirtilmemiş.')}</div></div>`).join('')}</div>
      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-2">Ölçüler</h3><div class="ct-kv">${kv('Geçmiş', `${fmt(a.gecmis_gun, 0)} gün`)}${kv('Kapanan işlem', fmt(a.kapanan_islem, 0))}${kv('Aktif ay', fmt(a.aktif_ay, 0))}${kv('Hesap değeri', ctUsd(a.hesap_degeri, 0))}${kv('Medyan tutma', `${fmt(a.medyan_tutma_sa, 1)} sa`)}${kv('Medyan kaldıraç', `${fmt(a.medyan_kaldirac, 1)}x`)}${kv('30 dk kopya', `<span class="${cls(a.kopya?.g30)}">${ctPs(a.kopya?.g30)}</span>`)}${kv('2 sa kopya', `<span class="${cls(a.kopya?.g120)}">${ctPs(a.kopya?.g120)}</span>`)}${kv('8 sa kopya', `<span class="${cls(a.kopya?.g480)}">${ctPs(a.kopya?.g480)}</span>`)}${kv('Kârlı ay', ctP(a.karli_ay_orani))}${kv('Plasebo p', fmt(a.plasebo_p, 3))}${kv('Alfa t', `${fmt(a.alfa_t, 1)} · ${esc(a.alfa_kiyas)}`)}</div></div>
      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-2">Piyasa payları</h3>${ksPay(a)}<div class="ct-sub mt-2">Binance payı: ${ctP(a.binance_payi)}</div></div>
      <div class="card ct-card"><h3 class="text-xs font-semibold text-slate-300 mb-2">İlişkili hesap notu</h3><div class="text-xs">${esc(a.iliskili_not || 'İlişkili hesap notu yok.')}</div></div></div>`;
  }
  function ksRender() {
    const el = $('ksMain'), msg = $('ksMsg');
    msg.classList.toggle('hidden', !ksHata); msg.textContent = ksHata || '';
    if (!KS) { el.innerHTML = '<div class="card empty">Keşif verisi henüz okunamadı.</div>'; return; }
    const adaylar = ksFiltrele(), secili = ksSel && KS.adaylar.find((a) => a.adres === ksSel);
    const yas = ctYasDakika(KS.uretildi);
    const bilgi = `<div class="card ct-card ks-bilgi">${ksKaynak?.ornek ? '⚠ Örnek veri gösteriliyor. Canlı Keşif verisi okunamadı.' : `Veri tarihi: ${esc(ksKaynak?.tarih || 'bilinmiyor')}`}<br><span class="${yas != null && yas > CT_ESKI_DK ? 'down' : ''}">${ctTazelik(KS.uretildi)}</span>${KS.durum === 'eksik' ? '<br><span class="down">⚠ Eksik koşu: aday listesi tam evreni temsil etmeyebilir.</span>' : ''}</div>`;
    el.innerHTML = secili ? `${bilgi}${ksAyrinti(secili)}` : `${bilgi}${ksKontrol()}<div class="ct-sub">${adaylar.length} / ${KS.adaylar.length} aday · evren ${fmt(KS.evren, 0)} · işlenen ${fmt(KS.islenen, 0)}</div><div class="ct-grid">${adaylar.map(ksKart).join('') || '<div class="card empty">Bu filtrelerde aday yok.</div>'}</div>`;
    if (window.lucide) lucide.createIcons();
  }
  async function ksAdresiKopyala(adres) {
    const not = $('ksCopyNote');
    try { await navigator.clipboard.writeText(adres); not.textContent = 'Adres panoya kopyalandı.'; }
    catch (e) { not.textContent = 'Panoya kopyalanamadı.'; }
  }

  // ---------- yükleme
  async function ctYukle(elle) {
    const ikon = $('refreshIcon'); if (elle && ikon) ikon.classList.add('animate-spin');
    ksYukle();
    try {
      const r = await fetch(CT_KAYNAK + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j || !Array.isArray(j.traderlar) || !Array.isArray(j.olaylar)) throw new Error('beklenen alanlar yok');
      if (j.surum !== 1) throw new Error('desteklenmeyen sürüm: ' + j.surum);
      CT = j; ctHata = null;
    } catch (e) { ctHata = 'Copy trade verisi okunamadı (' + e.message + ').'; }
    try {
      const r = await fetch(CT_KARAR + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.status === 404) CTK = { durum: 'yok', kayit: {}, bozuk: 0 };
      else if (!r.ok) throw new Error('HTTP ' + r.status);
      else {
        const kayit = {}; let bozuk = 0;
        (await r.text()).split('\n').filter((l) => l.trim()).forEach((l) => {
          try { const k = JSON.parse(l); if (k && k.olay_id && (k.karar === 'acti' || k.karar === 'atladi')) kayit[k.olay_id] = k; else bozuk++; } catch (e) { bozuk++; }
        });
        CTK = { durum: Object.keys(kayit).length ? 'ok' : 'yok', kayit, bozuk };
      }
    } catch (e) { CTK = { durum: 'hata', kayit: {}, bozuk: 0 }; }
    ctRender();
    midsYenile();
    if (ctSel && CT) {
      const trader = (CT.traderlar || []).find((t) => t.id === ctSel);
      if (trader) hlDetayYukle(trader.adres);
    }
    if (traderAdres && CT) {
      const trader = (CT.traderlar || []).find((t) => t.adres.toLowerCase() === traderAdres.toLowerCase());
      if (trader) hlDetayYukle(trader.adres);
    }
    if (ikon) setTimeout(() => ikon.classList.remove('animate-spin'), 400);
  }
  async function ksYukle() {
    const uygunMu = (j) => j && j.surum === 1 && Array.isArray(j.adaylar) && j.adaylar.every((a) => a && typeof a.adres === 'string'
      && ['intraday', 'swing', 'scalp'].includes(a.tarz) && ['kopyalanabilir', 'izleme_adayi'].includes(a.katman)
      && a.piyasa_payi && a.kopya && a.adimlar && Array.isArray(a.egri));
    const jsonOku = async (adres) => {
      const r = await fetch(adres + (adres.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    };
    try {
      const kok = await jsonOku(KESIF_KAYNAK);
      if (!Array.isArray(kok)) throw new Error('tarih klasörü listesi bekleniyordu');
      const tarihler = kok.filter((x) => x?.type === 'dir' && /^\d{4}-\d{2}-\d{2}$/.test(x.name))
        .map((x) => x.name).sort().reverse();
      let bulunan = null;
      for (const tarih of tarihler) {
        const klasor = await jsonOku(`${KESIF_KAYNAK.replace('?ref=', `/${tarih}?ref=`)}`);
        const dosya = Array.isArray(klasor) && klasor.find((x) => x?.type === 'file' && x.name === 'kesif.json');
        if (dosya?.download_url) { bulunan = { tarih, adres: dosya.download_url }; break; }
      }
      if (!bulunan) throw new Error('hiçbir tarih klasöründe kesif.json yok');
      const j = await jsonOku(bulunan.adres);
      if (!uygunMu(j)) throw new Error('canlı dosyada v1 şeması beklenen alanları içermiyor');
      KS = j; ksHata = null; ksKaynak = { tarih: bulunan.tarih, ornek: false };
    } catch (e) {
      try {
        const ornek = await jsonOku(KESIF_ORNEK);
        if (!uygunMu(ornek)) throw new Error('örnek veri v1 şeması beklenen alanları içermiyor');
        KS = ornek; ksKaynak = { ornek: true };
        ksHata = `Canlı Keşif verisi okunamadı (${e.message}).`;
      } catch (ornekHata) {
        KS = null; ksKaynak = null;
        ksHata = `Keşif verisi okunamadı (${e.message}; örnek veri: ${ornekHata.message}).`;
      }
    }
    if (!document.querySelector('[data-tab="kesif"]').classList.contains('hidden')) ksRender();
    if (ksSel && KS) {
      const aday = (KS.adaylar || []).find((a) => a.adres === ksSel);
      if (aday) hlDetayYukle(aday.adres);
    }
    if (traderAdres && KS) {
      const aday = (KS.adaylar || []).find((a) => a.adres.toLowerCase() === traderAdres.toLowerCase());
      if (aday) hlDetayYukle(aday.adres);
    }
  }
  function ctHash() {
    const m = /^#ct\/(.+)$/.exec(location.hash);
    ctSel = m ? decodeURIComponent(m[1]) : null; ctSayfa = 0;
    const km = /^#kesif\/(.+)$/.exec(location.hash);
    ksSel = km ? decodeURIComponent(km[1]) : null;
    const tm = /^#trader\/([^/]+)(?:\/(\d+))?(?:\/coin\/([^/]+))?$/.exec(location.hash);
    traderAdres = tm ? decodeURIComponent(tm[1]) : null;
    traderCoin = tm?.[3] ? decodeURIComponent(tm[3]) : null;
    if (m || tm) showTab('ct'); else if (km || location.hash === '#kesif') showTab('kesif');
    if (CT !== null || ctHata) ctRender();
    if (KS !== null || ksHata) ksRender();
    if (m && CT) {
      const trader = (CT.traderlar || []).find((t) => t.id === ctSel);
      if (trader) hlDetayYukle(trader.adres);
    }
    if (km && KS) {
      const aday = (KS.adaylar || []).find((a) => a.adres === ksSel);
      if (aday) hlDetayYukle(aday.adres);
    }
    if (tm) {
      const trader = (CT?.traderlar || []).find((t) => t.adres.toLowerCase() === traderAdres.toLowerCase()) || (KS?.adaylar || []).find((a) => a.adres.toLowerCase() === traderAdres.toLowerCase());
      if (trader) hlDetayYukle(trader.adres);
    }
  }
  window.addEventListener('hashchange', ctHash);

  buildNav();
  showTab('ct');
  if (window.lucide) lucide.createIcons();
  ctHash(); ctYukle();
  setInterval(ctYukle, 5 * 60 * 1000);
  setInterval(midsYenile, 60 * 1000);
  setInterval(ctSerit, 60 * 1000);
  setInterval(ksRender, 60 * 1000);
</script>
</body>
</html>
