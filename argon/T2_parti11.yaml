  - "Kesitsel (cross-sectional) sıralama ve haftalık portföy dengeleme mantığı (ozel_kod: true): 1) Evren: Piyasa değerine göre en büyük 100 ABD hissesi (fiyat >= 1$). 2) Her 5 işlem gününde bir (haftalık) son 5 günlük getiriye (roc5 = close / close[5] - 1) göre 100 hisse küçükten büyüğe sıralanır; en düşük performanslı 10 hisseye eşit ağırlıkla long girilir. 3) Bir sonraki haftalık dengelemede ilk 10'dan çıkan hisseler kapatılır. 4) Short kuralı: Aynı 100 hisse içinden son 1 aylık (21 işlem günü, roc21 = close / close[21] - 1) getirisi en yüksek olan 10 hisseye eşit ağırlıkla short girilir ve haftalık dengelenir."
