- 'Yazar: Kıvanç Özbilgiç. PMax (Profit Maximizer) göstergesinde ATR bantları fiyat yerine hareketli ortalamaya (varsayılan EMA 10, hl2) bağlanır'
- 'Pine Kodu: longStop = MAvg - Multiplier*atr; longStopPrev = nz(longStop[1], longStop); longStop := MAvg > longStopPrev ? max(longStop, longStopPrev) : longStop; shortStop = MAvg + Multiplier*atr; shortStopPrev = nz(shortStop[1], shortStop); shortStop := MAvg < shortStopPrev ? min(shortStop, shortStopPrev) : shortStop; dir := dir == -1 and MAvg > shortStopPrev ? 1 : dir == 1 and MAvg < longStopPrev ? -1 : dir; PMax = dir==1 ? longStop: shortStop'
- 'Giriş: cross_over(MAvg, PMax); Çıkış: cross_under(MAvg, PMax). Rapor verileri Exness gerçek tick verisiyle XAUUSD H1 üzerinde 2020-2026 döneminde 448 işlemde elde edilen net sonuçlardır'
