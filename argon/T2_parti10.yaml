  - "Çapraz varlık volatilite spreadi hesaplama adımları (ozel_kod: true): 1) İşlem gören menkul kıymetin ATR'sinin 50 periyotluk RSI'ı (rsi_atr_sec = RSI(ATR(security, ATRLen), RSILen)) ve piyasa endeksinin (S&P 500) ATR'sinin 50 periyotluk RSI'ı (rsi_atr_mkt = RSI(ATR(SP500, ATRLen), RSILen)) hesaplanır (RSILen=50). 2) RSISpread = rsi_atr_sec / rsi_atr_mkt olarak bulunur. 3) AvgSpread = EMA(RSISpread, RSILen) ve AvgSpreadDiff = RSISpread - AvgSpread hesaplanır. 4) Long Giriş: AvgSpreadDiff < 0 ve rsi_atr_mkt > rsi_atr_sec (piyasa volatilite RSI'ı hisse volatilite RSI'ından büyük) olduğunda al. 5) Long Çıkış: AvgSpreadDiff > 0 olduğunda sat."
