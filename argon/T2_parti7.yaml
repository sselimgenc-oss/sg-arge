  - "Yazar kurallarin ihtiyari oldugunu acikca belirtmektedir ('you need to get a feel for the price action before the Pin Bar and use your discretion before you enter a trade'): 1) Pin bar oncesinde trend yonunde guclu momentum aranir. 2) Pin bar kuyrugu toplam boyun yaklasik 2/3'u olmalidir. 3) Pin bar onceki bir destek/direnc (S/R) seviyesinde olusmali veya konsolidasyon alanindan disari taşmalidir. 4) Stop-loss pin barin ~5 pip altina/ustune konur; kar hedefi bir sonraki ana destek/direnc seviyesidir (en az 1R bosluk olmali, referans S/R yoksa 1R + 5 pip). Destek/direnc ve konsolidasyon cizimi goz karari oldugu icin spec_durumu: ihtiyari."
