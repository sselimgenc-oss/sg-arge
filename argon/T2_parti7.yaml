  - ad: "QuantConnect OOS Uygulamasi (2000-2026)"
    not: "24 ulke ETF'i uzerinde 0.5 bps komisyonla CAGR %1.47, MDD %27, Sharpe -0.2, Win Rate %49."
spec_durumu: tam
belirsiz:
  - "Ciftli istatistiksel arbitraj (pairs trading) kurallari (ozel_kod: true, Thomakos, Wang & Schizas): 1) 22-24 ulke ETF'i icin 120 islem gunluk olusum (formation) doneminde baslangic fiyati 1$'a normalize edilir (norm_a = price_a / price_a[0]). 2) Tum ikililer icin kareli sapmalarin toplami Distance = sum((norm_a - norm_b)^2) hesaplanir ve en kucuk mesafeli ilk 5 cift secilir. 3) Takip eden 20 islem gununde spread = norm_a - norm_b dizisinin 120 gunluk ortalamasi (mean) ve standart sapmasi (std) izlenir; fark 0.5 * std esigini astiginda ucuz kalan ETF long, pahali kalan ETF esit dolar tutariyla short acilir. 4) Spread tekrar yakinsadiginda (abs(spread - mean) <= 0.5 * std) veya 20 islem gunu doldugunda pozisyon kapatilir."
