  - "Ivan Scherman'in Business Insider makalesinde anlatilan S&P 500 - VIX uyumsuzluk stratejisidir: 1) S&P 500 bir duzeltme (correction) yapip ilk dibini olusturdugunda VIX yukari sicrar. 2) S&P 500 ilk dibin altinda ikinci bir daha dusuk dip (lower low) yaptiginda VIX onceki tepesini gecemezse (lower high - pozitif diverjans) kurumsal put/hedge talebinin azaldigi anlasilir. 3) S&P 500 fiyati 30 gunluk hareketli ortalamanin 2 standart sapma altindaki alt Bollinger bandinin altina inmemis olmalidir (close >= bb30.alt). 4) Gun kapanisinda long girilir; fiyat 30 gunluk ortalamanin uzerine ciktiginda (close > bb30.orta) karla, alt Bollinger bandinin altinda kapattiginda (close < bb30.alt) zararla cikilir."
  - "Ancak 'duzeltme' (correction) ve iki dip/tepe arasindaki pencere/esik uzunlugu mekanik olarak tanimlanmadigi icin spec_durumu: eksik olarak isaretlendi."
