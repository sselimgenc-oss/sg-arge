deneme_sayisi_kaynakta: null
rapor: {pf: null, sharpe: null, getiri: null, mdd: null, islem: null, wr: null, maliyet_dahil: belirtilmemis}
varyantlar:
  - ad: "Yazarin Yorumdaki 90/40 Varyanti"
    not: "Yorumlarda lookback_long = 90, lookback_short = 40 ve bir baska kullanici tarafindan target_profit = 10 olarak test edilmistir."
spec_durumu: dakikalik
belirsiz:
  - "Coklu zaman dilimi histerezis durum degiskenleri (ozel_kod: true): 10m'de (supertrend[3,10] - 6 <= close -> haut10 = 1; supertrend[3,10] + 3 > close -> haut10 = 0), 5m'de (supertrend[3,10] - 3 <= close -> haut5m = 1; supertrend[3,10] + 3 > close -> haut5m = 0), 3m'de (supertrend[3,3] - 3 <= close -> haut3 = 1; supertrend[3,3] + 1 > close -> haut3 = 0), 30s'de (supertrend[3,6] - 1 <= close -> haut30s = 1; supertrend[3,6] + 7 > close -> haut30s = 0)."
  - "Long giris (feuvert == 1 and stopa == 0): 09:10 <= time < 17:00 ve close < close[80] iken, stopa == 0 ise girilir. stopa = 1 oldugu yasakli kosullar: (10:00<time<11:00) or (12:35<time<13:30) or (dayofweek=2 and ((11:00<time<14:40) or time>16:50)) or (dayofweek=3 and ((12:15<time<13:15) or haut3=0)) or (16:00<time<16:15) or (dayofweek=1 and time<10:00) or (dayofweek=4 and (haut10=0 or haut3=0 or (09:30<time<10:00))) or (dayofweek=1 and (haut3=0 or close>hh40-10)) or (dayofweek=2 and haut3=0 and time<11:00) or (dayofweek=4 and close>hh60-10) or (dayofweek=5 and close>hh60-10) or (dayofweek=4 and 15:30<time<17:00) or (dayofweek=5 and time<11:00) or (haut10=0 and close>hh40-15) or (dayofweek=5 and (haut30s=0 or haut3=0) and time<12:00) or (dayofweek=1 and (haut10=0 or close>hh40-15)) or (dayofweek=3 and time>14:30 and haut30s=0) or ((dayofweek=4 or dayofweek=1) and haut5m=0) or (dayofweek=4 and close>hh50-15 and time<15:30) or (dayofweek=5 and 15:29<time<15:40) or (dayofweek=5 and haut30s=0 and 14:00<time<15:35) or ((dayofweek=2 or dayofweek=3) and 15:00<time<15:35) or (dayofweek=2 and 15:29<time<15:45) or (dayofweek=3 and 11:00<time<11:35) or (16:15<=time<16:30) or (dayofweek=5 and haut30s=0)."
  - "Hedef kar: 5 puan, ancak 16:00 < time < 17:00 arasinda 6 puana cikarilir; stop loss 38 puandir."
  - "Short kurallari da mevcuttur: 09:00 <= time < 17:00 ve close > close[30] ve stopv == 0 iken sellshort yapilir."
