name: Hourly market data archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: hourly-market-data-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Update the rolling hourly archive
        # Tek sembol hatasi (orn. adi degisen hisse) arsivi engellemesin; hata MANIFEST'e yazilir.
        run: python data/fetch.py --interval 1h --append || echo "::warning::Bazi semboller indirilemedi; ayrinti data/MANIFEST.csv"

      - name: Verify resampling and archive helpers
        run: python -m pytest -q

      - name: Enforce the repository archive size limit
        run: |
          bytes=$(du -sb data/hourly | cut -f1)
          if [ "$bytes" -gt 52428800 ]; then
            echo "Hourly archive is larger than 50 MiB ($bytes bytes); auditor approval is required."
            exit 1
          fi

      - name: Commit updated archives
        run: |
          if [ -z "$(git status --porcelain -- data/evren.csv data/hourly data/MANIFEST.csv results/veri_kalitesi_1h.md)" ]; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evren.csv data/hourly data/MANIFEST.csv results/veri_kalitesi_1h.md
          git commit -m "[Codex-Sol] veri arsivi"
          git push
