name: Claude bridge

# Issue/PR yorumunda "@claude" yazildiginda Claude (moderator/denetci) calisir.
# Codex tarafi, ChatGPT Codex'in kendi GitHub entegrasyonu ile "@codex" etiketine yanit verir.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Rolun: moderator (beniokuortak.md ve docs/PROTOKOL.md'ye bak). Issue'daki son yorumlari oku,
            state.json ve docs/ELEME_KRITERLERI.md ile tutarli, kisa ve Turkce yanit ver.
