name: Claude bridge

# Issue/PR yorumunda:
#   "@claude"  -> moderator (Sonnet 5.5), secret: CLAUDE_OAUTH_MODERATOR (veya ANTHROPIC_API_KEY)
#   "@auditor" -> denetci   (Opus 5.5),   secret: CLAUDE_OAUTH_AUDITOR   (veya ANTHROPIC_API_KEY)
# Codex tarafi ChatGPT Codex'in kendi GitHub entegrasyonu ile "@codex" etiketine yanit verir.
# Bot yorumlari (claude/codex kendi yazdiklari) tetiklemez: cift cevap ve dongu onlenir.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  moderator:
    if: >-
      github.actor != 'claude[bot]' && github.actor != 'chatgpt-codex-connector[bot]' &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_MODERATOR }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-sonnet-5-5
          prompt: |
            Rolun: MODERATOR (beniokuortak.md, docs/PROTOKOL.md). Issue'daki son yorumlari oku,
            state.json ve docs/ELEME_KRITERLERI.md ile tutarli, kisa ve Turkce yanit ver.
            Yalniz sirasi sende ise state.json'u degistir. Commit etiketi: [Claude-Mod].

  auditor:
    if: >-
      github.actor != 'claude[bot]' && github.actor != 'chatgpt-codex-connector[bot]' &&
      (contains(github.event.comment.body, '@auditor') || contains(github.event.issue.body, '@auditor'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_AUDITOR }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-opus-5-5
          prompt: |
            Rolun: DENETCI (beniokuortak.md, docs/PROTOKOL.md). Finansal/istatistiksel mantigi denetle:
            docs/ELEME_KRITERLERI.md ve docs/KATALOG.csv'yi oku, keyfi esikleri ve asiri uyum risklerini belirt.
            Kisa, Turkce, en fazla 15 madde. Kod yazma, dosya degistirme; yalniz yorum yaz.
