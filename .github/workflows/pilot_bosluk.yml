name: Pilot boşluk doldur

# TEK SEFER, elle: etiket günü (secim.json tarihi) → arşivin ilk yoklaması aralığını API'den arşive yazar. Haftalık koşu (`CT-Haftalık`) API'ye gitmez;
# bu adım yapılmadan, arşiv etiketten sonra başladıysa haftalık koşu kırmızı biter. Hata yutulmaz.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arsiv
  cancel-in-progress: false

jobs:
  bosluk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: En son seçim (veri dalı)
        run: |
          git fetch --depth=1 origin copytrade-kapi
          name=$(git ls-tree -r --name-only FETCH_HEAD | sed -n 's#^secim/\(.*\)/secim\.json$#\1#p' | sort | tail -1)
          test -n "$name"
          mkdir -p veri/secim/"$name"
          git show "FETCH_HEAD:secim/$name/secim.json" > "veri/secim/$name/secim.json"
          echo "SECIM=veri/secim/$name/secim.json" >> "$GITHUB_ENV"
      - name: Arşiv kapsamı (ilk yoklama) ve var olan boşluk kaydı
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync "s3://${R2_BUCKET}/" arsiv --exclude "*" --include "tur=kapsam/*" --include "tur=bosluk/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: Boşluğu doldur
        run: python -m copytrade.pilot_veri --arsiv arsiv --secim "$SECIM" --bosluk-doldur
      - name: R2'ye ekle (yalnız yeni parçalar ve boşluk kaydı)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync arsiv "s3://${R2_BUCKET}/" --exclude "tur=kapsam/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
