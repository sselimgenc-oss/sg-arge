name: CT-Kapı v1.1

# Tetik: elle (mod seçilir), copytrade/kapi/CALISTIR yoluna push (main veya geliştirme dalı; dosyada `mod=hizli|eksik`
# satırı olabilir, yoksa tam), haftalık zamanlama (pazar 22:43 TSİ). Sonuçlar main'e değil `copytrade-kapi` veri dalına yazılır.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "tam | hizli (--yalniz-adim5: önceki sonuçta adım 1–4 geçen adresler + dış adaylar) | eksik (--eksikleri-tamamla)"
        type: choice
        options: [tam, hizli, eksik]
        default: tam
      ekle:
        description: "Kapıya zorla eklenecek adres(ler), boşlukla ayrılmış (kaynak = dis_aday)"
        type: string
        default: ""
  push:
    branches:
      - main
      - claude/kapi-v1-1
    paths:
      - copytrade/kapi/CALISTIR
  schedule:
    - cron: "43 19 * * 0"

permissions:
  contents: write

concurrency:
  # Haftalık koşular birbirini beklesin; elle/push koşuları (hızlı, eksik) takılan bir koşuya takılmasın.
  group: copytrade-kapi-${{ github.event_name == 'schedule' && 'haftalik' || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.p.outputs.mod }}
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
      day: ${{ steps.p.outputs.day }}
      ekle: ${{ steps.p.outputs.ekle }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          set -euo pipefail
          mod="${{ inputs.mod }}"
          if [ -z "$mod" ] && [ "${{ github.event_name }}" = push ]; then
            mod=$(grep -oE '^mod=(tam|hizli|eksik)' copytrade/kapi/CALISTIR | head -1 | cut -d= -f2 || true)
          fi
          mod="${mod:-tam}"
          ekle="${{ inputs.ekle }}"
          if [ -z "$ekle" ] && [ "${{ github.event_name }}" = push ]; then
            ekle=$(grep -oE '^ekle=.*' copytrade/kapi/CALISTIR | head -1 | cut -d= -f2- || true)
          fi
          # Yalnız 0x + 40 onaltılık hane kabul edilir (komut satırına başka bir şey geçmesin).
          ekle=$(echo "$ekle" | grep -oE '0x[0-9a-fA-F]{40}' | tr '\n' ' ' || true)
          echo "ekle=$ekle" >> "$GITHUB_OUTPUT"
          count=32; [ "$mod" = hizli ] && count=24   # hızlı: 9 aday + dış adaylar; kısa parçalar, ayrı IP'ler
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($count))))")" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  stage1:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veri dalından önceki sonuçlar (hızlı ve eksik mod bunlara bakar)
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/copytrade-kapi >/dev/null 2>&1; then
            git fetch --depth=1 origin copytrade-kapi
            git archive FETCH_HEAD copytrade/kapi | tar -x
          fi
      - name: Kapı koşusu
        shell: bash
        run: |
          case "${{ needs.plan.outputs.mod }}" in
            hizli) extra="--yalniz-adim5" ;;
            eksik) extra="--eksikleri-tamamla" ;;
            *) extra="" ;;
          esac
          for a in ${{ needs.plan.outputs.ekle }}; do extra="$extra --adres $a"; done
          # Hızlı modda 45 dk sınır: günlük (API'den) iş bitince okunabilsin. Hata gizlenmez: parça hata verirse veya zaman aşımına
          # uğrarsa adım (ve iş) kırmızı olur; bitmeyen parça `bitti.json` bırakmaz, birleştirme sonucu `durum: eksik` yayımlar.
          limit=100m; [ "${{ needs.plan.outputs.mod }}" = hizli ] && limit=45m
          export PYTHONWARNINGS=ignore
          timeout $limit python -m copytrade.kapi --root copytrade --shard-index ${{ matrix.shard }} --shard-count ${{ needs.plan.outputs.count }} $extra
      - name: Sonuçları tarih klasörüyle paketle
        if: always()
        shell: bash
        run: |
          mkdir -p artifact/${{ needs.plan.outputs.day }}
          if [ -d copytrade/kapi/${{ needs.plan.outputs.day }} ]; then cp -r copytrade/kapi/${{ needs.plan.outputs.day }}/. artifact/${{ needs.plan.outputs.day }}/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-${{ matrix.shard }}
          path: artifact/
          if-no-files-found: ignore

  publish:
    needs: [plan, stage1]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Veri dalındaki aynı günün sonuçlarını getir
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/copytrade-kapi >/dev/null 2>&1; then
            git fetch --depth=1 origin copytrade-kapi
            git archive FETCH_HEAD copytrade/kapi kesif | tar -x || git archive FETCH_HEAD copytrade/kapi | tar -x
          fi
      - name: Birleştir
        id: birlestir
        run: |
          # Hiçbir parça sonuç üretmediyse eski (main'deki) dosyalar yayımlanmasın.
          find shards -name sonuc.csv | grep -q . || { echo "Parçalardan sonuc.csv gelmedi; yayımlanacak yeni sonuç yok." >&2; exit 1; }
          python -m copytrade.kapi --root copytrade --birlestir shards --beklenen-parca ${{ needs.plan.outputs.count }} --mod ${{ needs.plan.outputs.mod }}
          echo "durum=$(python3 -c "import json;print(json.load(open('copytrade/kapi/${{ needs.plan.outputs.day }}/durum.json'))['durum'])")" >> "$GITHUB_OUTPUT"
      - name: Keşif verisi ve ilişkili hesap işaretleri
        # Eksik koşudan kesif.json üretilmez. Keşif düşerse iş kırmızı olur (sonuçlar yine yayımlanır: sonraki adımlar `!cancelled()`).
        if: steps.birlestir.outputs.durum == 'tamam' && needs.plan.outputs.mod != 'hizli'
        run: python -m copytrade.kesif --root copytrade --output kesif
      - name: Veri dalına yaz
        if: ${{ !cancelled() && steps.birlestir.outcome == 'success' }}
        env:
          DAY: ${{ needs.plan.outputs.day }}
          MOD: ${{ needs.plan.outputs.mod }}
        run: bash .github/scripts/kapi_yayimla.sh
      - name: Eksik koşu işi kırmızı yapar
        if: ${{ !cancelled() && steps.birlestir.outputs.durum == 'eksik' }}
        run: |
          echo "Koşu eksik (durum: eksik):" >&2
          cat "copytrade/kapi/${{ needs.plan.outputs.day }}/durum.json" >&2
          exit 1
