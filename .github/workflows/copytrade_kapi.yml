name: CT-Kapı v1

on:
  workflow_dispatch:
  push:
    branches:
      - codex/copytrade-kapi
    paths:
      - copytrade/kapi/CALISTIR

permissions:
  contents: write

concurrency:
  group: copytrade-kapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: timeout 100m python -m copytrade.kapi --root copytrade --shard-index ${{ matrix.shard }} --shard-count 8 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-${{ matrix.shard }}
          path: copytrade/kapi/

  publish:
    needs: stage1
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Birleştir ve dalda sakla
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          groups = {}
          for path in Path("shards").rglob("sonuc.csv"):
              groups.setdefault(path.parent.name, []).append(pd.read_csv(path))
          for date, frames in groups.items():
              root = Path("copytrade/kapi") / date
              root.mkdir(parents=True, exist_ok=True)
              pd.concat(frames, ignore_index=True).to_csv(root / "sonuc.csv", index=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f copytrade/kapi
          git commit -m "copytrade: CT-Kapı sonuçları" || exit 0
          git push origin HEAD:${{ github.ref_name }}
