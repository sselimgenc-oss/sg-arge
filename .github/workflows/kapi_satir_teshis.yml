name: CT-Kapı satır teşhisi
on:
  push:
    branches: [codex/kapi-satir]
permissions:
  contents: write
  actions: read
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 40711594322
          github-token: ${{ github.token }}
          pattern: stage1-*
          path: shards
      - run: python copytrade/kapi_satir_teshis.py shards --output docs/codex_durum_kapi_satir.md
      - run: cat docs/codex_durum_kapi_satir.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/codex_durum_kapi_satir.md
          git diff --cached --quiet || git commit -m 'docs: kapı satır teşhisi'
          git push
