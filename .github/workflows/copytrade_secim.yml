name: CT-Seçim v1.3

# Elle çalışır. Girdi: `copytrade-kapi` veri dalındaki en son TAM kapı koşusu (durum = tamam, kapsam ≥ secim_min_kapsam).
# Çıktı: veri dalına `secim/<tarih>-<sürüm>/secim.json` + `RAPOR.md` (iş 1), ardından aynı klasöre `bayrak.json` (iş 2, seçimi bekletmez).
# Aynı sürüm + kapı tarihi veri dalında varsa seçim reddedilir (yayımlanan seçimin üzerine yazılmaz).
# İzleme listesi burada üretilmez (kullanıcı onayından sonra, elle: `--izleme-listesi`).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - copytrade/secim/CALISTIR

permissions:
  contents: write

concurrency:
  group: copytrade-secim
  cancel-in-progress: false

jobs:
  secim:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # bayraksız seçim yerel veride saniyeler sürer; bayraklar ayrı işte
    outputs:
      day: ${{ steps.secim.outputs.day }}
      name: ${{ steps.secim.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veri dalından kapı sonuçlarını ve yayımlı seçimleri getir
        run: |
          git fetch --depth=1 origin copytrade-kapi
          git archive FETCH_HEAD copytrade/kapi | tar -x
          if [ -n "$(git ls-tree --name-only FETCH_HEAD secim)" ]; then git archive FETCH_HEAD secim | tar -x; fi
      - name: Seçim
        id: secim
        run: |
          # Gün bir kez belirlenir; yayım aynı günü kullanır (gece yarısını geçen koşu sonucu kaybetmesin).
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          python -m copytrade.secim --root copytrade --output secim --tarih "$day" | tee secim.log
          out=$(sed -n 's/^Çıktı: //p' secim.log)
          test -f "$out/secim.json"
          name=$(basename "$out")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p "yayim/secim"
          cp -r "$out" "yayim/secim/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: secim-${{ steps.secim.outputs.name }}
          path: yayim
      - name: Veri dalına yaz
        run: |
          name=${{ steps.secim.outputs.name }}
          archive=$(mktemp -d)
          cp -r yayim/. "$archive"
          cp .github/scripts/son_yaz.py "$archive/son_yaz.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin copytrade-kapi
          git checkout -f -B copytrade-kapi FETCH_HEAD
          test ! -e "secim/$name/secim.json"   # yayımlı seçimin üzerine yazılmaz
          cp -r "$archive"/. .
          python3 son_yaz.py son.json secim "$name"     # pano/ofis en son seçim klasörünü buradan okur (API çağrısı gerekmez)
          rm son_yaz.py
          git add -f "secim/$name" son.json
          git diff --cached --quiet && exit 0
          git commit -m "copytrade: Seçim $name"
          for attempt in 1 2 3; do
            git pull --rebase origin copytrade-kapi
            git push origin HEAD:copytrade-kapi && exit 0
            sleep 5
          done
          exit 1

  bayrak:
    needs: secim
    runs-on: ubuntu-latest
    timeout-minutes: 150  # aday katı kırmızı bayrakları 365 gün dolum/funding çeker; 20 dk run 1'de yetmedi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: secim-${{ needs.secim.outputs.name }}
          path: yayim
      - name: Önceki (kısmi) bayrak sonucunu önbellek olarak getir
        run: |
          name=${{ needs.secim.outputs.name }}
          git fetch --depth=1 origin copytrade-kapi
          if git cat-file -e "FETCH_HEAD:secim/$name/bayrak.json" 2>/dev/null; then
            git show "FETCH_HEAD:secim/$name/bayrak.json" > "yayim/secim/$name/bayrak.json"    # aynı sürüm + kapı + kod ise çağrılar yeniden yapılmaz
          fi
      - name: Kırmızı bayraklar (bilgi; seçimi değiştirmez)
        id: bayrak
        run: python -m copytrade.secim --bayrak --secim "yayim/secim/${{ needs.secim.outputs.name }}/secim.json"
      - name: Veri dalına ekle (zaman aşımında kısmi sonuç da yazılır)
        if: always() && steps.bayrak.outcome != 'skipped'
        run: |
          name=${{ needs.secim.outputs.name }}
          archive=$(mktemp -d)
          test -f "yayim/secim/$name/bayrak.json"
          cp "yayim/secim/$name/bayrak.json" "yayim/secim/$name/BAYRAK.md" "$archive/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin copytrade-kapi
          git checkout -f -B copytrade-kapi FETCH_HEAD
          test -f "secim/$name/secim.json"
          cp "$archive/bayrak.json" "$archive/BAYRAK.md" "secim/$name/"
          git add -f "secim/$name/bayrak.json" "secim/$name/BAYRAK.md"
          git diff --cached --quiet && exit 0
          git commit -m "copytrade: Seçim $name bayrakları"
          for attempt in 1 2 3; do
            git pull --rebase origin copytrade-kapi
            git push origin HEAD:copytrade-kapi && exit 0
            sleep 5
          done
          exit 1
