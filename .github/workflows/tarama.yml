name: Tarama asama 1 (T5b-1, T12 gun ici)

on:
  workflow_dispatch:
    inputs:
      tf:
        description: "Kart zaman dilimleri (virgulle): 1D,1W gunluk | 1H,30m,15m,5m,1m gun ici"
        default: "1D,1W"
      kart_ids:
        description: "Yalniz bu kartlar (virgulle; bos = hepsi)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Download bars for the requested timeframes
        env:
          TARAMA_TF: ${{ inputs.tf }}
        run: |
          set -e
          IFS=',' read -ra TFS <<< "$TARAMA_TF"
          NEED_DAILY=0
          for tf in "${TFS[@]}"; do
            case "$tf" in
              1D|1W) NEED_DAILY=1 ;;
              1H) python data/fetch.py --interval 1h --append --allow-partial ;;
              30m|15m|5m|1m) python data/fetch.py --interval "$tf" --baslangic 2020-01-01 --allow-partial ;;
            esac
          done
          # the scan always loads the daily archive for the benchmark series
          python data/fetch.py --interval 1d --allow-partial
          # T22: named ETFs of the portfolio-rotation (gecis) cards
          python data/fetch.py --interval 1d --rotasyon --allow-partial
      - name: Run tests
        run: python -m pytest -q
      - name: Run scan
        env:
          TARAMA_TF: ${{ inputs.tf }}
          TARAMA_KARTLAR: ${{ inputs.kart_ids }}
        run: python backtests/tarama.py --kartlar docs/spec --tf "$TARAMA_TF" --kart-ids "$TARAMA_KARTLAR"
      - name: Open results PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh scan results"
          branch: "results/tarama-${{ github.run_id }}"
          title: "chore: refresh scan results"
          body: "Workflow sonucu; main'e doğrudan push edilmez."
          add-paths: |
            data/MANIFEST.csv
            data/evren.csv
            data/hourly
            results/tarama.csv
            results/tarama_ozet.md
            results/tarama_gunici_ozet.md
            results/tarama_islemler
            results/veri_kalitesi_1h.md
