name: Copy trade aday taraması

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # İlk deneme koşusu için: lider dalında bu iş akışı ya da copytrade kodu değişince de koşar.
  push:
    branches: [claude/magical-ride-c7apbp]
    paths: [.github/workflows/copytrade.yml, copytrade/**]

permissions:
  contents: write

concurrency:
  group: copytrade-veri
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore public-data archive
        run: |
          git fetch origin copytrade-veri || true
          git checkout origin/copytrade-veri -- copytrade/veri copytrade/izleme.csv copytrade/kopya copytrade/RAPOR.md 2>/dev/null || true
      - name: Scan public chain data
        run: python -m copytrade.tarama --root copytrade
      - name: Commit archive to its dedicated branch
        run: |
          # Arşiv dalı main'den ayrı (yalnız veri); her gün onun ucuna eklenir, yoksa ilk koşuda yetim dal açılır.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=$(mktemp -d)
          for p in veri izleme.csv kopya RAPOR.md; do [ -e "copytrade/$p" ] && cp -r "copytrade/$p" "$out/"; done
          if git rev-parse -q --verify origin/copytrade-veri >/dev/null; then
            git checkout -f -B copytrade-veri origin/copytrade-veri
          else
            git checkout -f --orphan copytrade-veri && git rm -rfq . && git clean -fdq
          fi
          mkdir -p copytrade && cp -r "$out"/. copytrade/
          git add -f copytrade
          git commit -m "copytrade: günlük tarama $(date -u +%F)" || exit 0
          git push origin copytrade-veri
