name: Arşiv kesinti alarmı

# Saatlik: arsiv.yml son başarılı koşusundan `arsiv_kesinti_saat` (kurallar.yaml) saatten fazla geçtiyse bu iş KIRMIZI biter (uyarı e-postası/rozet).
# Neden: API yalnız son 10.000 dolumu verir; çok aktif adreste ~1 haftadan uzun boşluk geri alınamaz (Argon A21).
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: arsiv.yml koşuları
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/workflows/arsiv.yml/runs?per_page=50" > runs.json
      - name: Kesinti kontrolü
        run: python -m copytrade.arsiv_alarm --runs runs.json
