name: Uctan uca huni

on:
  workflow_dispatch:
    inputs:
      kartlar:
        description: "Virgulle kart IDleri (bos = hepsi)"
        default: ""
      tf:
        description: "Zaman dilimleri"
        default: "1D,1W"
      null_tekrar:
        description: "Null tekrar sayisi"
        default: "200"
      bootstrap_tekrar:
        description: "Bootstrap tekrar sayisi"
        default: "1000"
      evren_pit:
        description: "PIT Asama 2b de calissin"
        type: boolean
        default: true
      u1_5m:
        description: "U7 U1 5m checkpoint kosusunu calistir"
        type: boolean
        default: false
      faz1_u7:
        description: "U7 Faz 1 kosusunu calistir"
        type: boolean
        default: false
      reddit_u7:
        description: "U7 Reddit RD-01..04 kosusunu calistir"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  ARTIFACT_SUFFIX: ${{ github.run_id }}

jobs:
  u1_5m:
    if: ${{ inputs.u1_5m }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download U1 5m archive
        run: python data/fetch.py --interval 5m --allow-partial
      - name: Resume U1 5m funnel
        run: python backtests/u1_huni.py --tf 5m --tekrar 200 --tekrar-yuksek 1000 --bootstrap-tekrar 1000 --isci 1 --resume --veri-kok data --results-dir results/u7/u1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u7-u1-5m-${{ github.run_id }}
          path: results/u7/u1/
          retention-days: 14
      - name: Commit U1 checkpoints and summaries to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/u7/u1/parca results/u7/u1/getiriler results/u7/u1/huni_ozet.csv results/u7/u1/huni_ozet.md
          git commit -m "u7: U1 5m checkpoints ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*5))
          done

  faz1_u7:
    if: ${{ inputs.faz1_u7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download Faz 1 daily archive
        run: |
          python data/fetch.py --interval 1d --allow-partial --evren pit
          python data/fetch.py --interval 1d --rotasyon --allow-partial
          python -c "from data.fetch import Asset, fetch_asset; fetch_asset(Asset('USDTRY=X', 'FX', 'yfinance'), '1d', append=False)"
      - name: Run U7 Faz 1 stages
        run: |
          python backtests/tarama.py --results-dir results/u7/faz1
          python backtests/asama2a.py --results-dir results/u7/faz1 --tekrar 200 --tekrar-yuksek 1000 --isci 1
          python backtests/asama2b.py --results-dir results/u7/faz1 --null-tekrar 200 --bootstrap-tekrar 1000 --isci 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u7-faz1-${{ github.run_id }}
          path: results/u7/faz1/
          retention-days: 14
      - name: Commit Faz 1 summaries to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/u7/faz1/tarama.csv results/u7/faz1/tarama_ozet.md \
            results/u7/faz1/asama2a.csv results/u7/faz1/asama2a_ozet.md \
            results/u7/faz1/asama2b.csv results/u7/faz1/asama2b_ozet.md \
            results/u7/faz1/getiriler
          git commit -m "u7: Faz 1 checkpoints ${{ github.run_id }}" || exit 0
          # Veri indirme adimi izlenen MANIFEST'i degistirir. Kosu verisini ya da
          # islem dokumlerini commit etmeden rebase'in temiz bir agacta calismasi icin sakla.
          git stash push --include-untracked -m "u7-runner-artifacts" || true
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*5))
          done

  reddit_u7:
    if: ${{ inputs.reddit_u7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download Reddit daily archive
        run: |
          python data/fetch.py --interval 1d --allow-partial --evren pit
          python data/fetch.py --interval 1d --rotasyon --allow-partial
          python -c "from data.fetch import Asset, fetch_asset; fetch_asset(Asset('USDTRY=X', 'FX', 'yfinance'), '1d', append=False)"
      - name: Run U7 Reddit stages
        run: |
          python backtests/tarama.py --results-dir results/u7/reddit --kart-ids RD-01,RD-02,RD-03,RD-04
          python backtests/asama2a.py --results-dir results/u7/reddit --kart-ids RD-01,RD-02,RD-03,RD-04 --tekrar 200 --tekrar-yuksek 1000 --isci 1
          python backtests/asama2b.py --results-dir results/u7/reddit --kart-ids RD-01,RD-02,RD-03,RD-04 --codex-ids '' --null-tekrar 200 --bootstrap-tekrar 1000 --isci 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u7-reddit-${{ github.run_id }}
          path: results/u7/reddit/
          retention-days: 14
      - name: Commit Reddit checkpoints and daily returns to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/u7/reddit/tarama.csv results/u7/reddit/tarama_ozet.md \
            results/u7/reddit/asama2a.csv results/u7/reddit/asama2a_ozet.md \
            results/u7/reddit/asama2b.csv results/u7/reddit/asama2b_ozet.md
          git add results/u7/reddit/getiriler 2>/dev/null || true
          git commit -m "u7: Reddit checkpoints ${{ github.run_id }}" || exit 0
          git stash push --include-untracked -m "u7-runner-artifacts" || true
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*5))
          done

  veri:
    # U7'nin hedefli checkpoint işleri genel Faz 1 hunisini yeniden başlatmaz.
    if: ${{ !inputs.faz1_u7 && !inputs.reddit_u7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download daily universe once
        run: |
          python data/fetch.py --interval 1d --allow-partial --evren pit
          python data/fetch.py --interval 1d --rotasyon --allow-partial
          python -c "from data.fetch import Asset, fetch_asset; fetch_asset(Asset('USDTRY=X', 'FX', 'yfinance'), '1d', append=False)"
      - uses: actions/upload-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          path: |
            data/daily/
            data/MANIFEST.csv
            data/evren.csv
          retention-days: 7

  tarama:
    needs: veri
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          # huni-data artifact'inin kökü data/ olduğundan, proje köküne
          # açılırsa daily/ olur; koşucular data/daily/ bekler.
          path: data
      - run: python backtests/tarama.py --tf "${{ inputs.tf }}" --kart-ids "${{ inputs.kartlar }}" --birlestir
      - uses: actions/upload-artifact@v4
        with:
          name: huni-tarama-${{ env.ARTIFACT_SUFFIX }}
          path: results/
          retention-days: 7

  asama2a:
    needs: [veri, tarama]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: huni-tarama-${{ env.ARTIFACT_SUFFIX }}
          path: .
      - run: python backtests/asama2a.py --tf "${{ inputs.tf }}" --tekrar "${{ inputs.null_tekrar }}" --kart-ids "${{ inputs.kartlar }}"
      - uses: actions/upload-artifact@v4
        with:
          name: huni-asama2a-${{ env.ARTIFACT_SUFFIX }}
          path: results/
          retention-days: 7

  asama2b_sabit:
    needs: [veri, asama2a]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: huni-asama2a-${{ env.ARTIFACT_SUFFIX }}
          path: .
      - name: Run fixed-universe stage 2b
        run: |
          args=(--tf "${{ inputs.tf }}" --null-tekrar "${{ inputs.null_tekrar }}" --bootstrap-tekrar "${{ inputs.bootstrap_tekrar }}")
          if [ -n "${{ inputs.kartlar }}" ]; then args+=(--kart-ids "${{ inputs.kartlar }}"); fi
          python backtests/asama2b.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: huni-asama2b-sabit-${{ env.ARTIFACT_SUFFIX }}
          path: results/
          retention-days: 7

  asama2b_pit:
    needs: [veri, asama2b_sabit]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: huni-asama2b-sabit-${{ env.ARTIFACT_SUFFIX }}
          path: .
      - name: Run PIT stage 2b and retain its named output
        if: ${{ inputs.evren_pit }}
        run: |
          cp results/asama2b.csv results/asama2b_sabit.csv
          args=(--tf "${{ inputs.tf }}" --null-tekrar "${{ inputs.null_tekrar }}" --bootstrap-tekrar "${{ inputs.bootstrap_tekrar }}" --evren pit)
          if [ -n "${{ inputs.kartlar }}" ]; then args+=(--kart-ids "${{ inputs.kartlar }}"); fi
          python backtests/asama2b.py "${args[@]}"
          mv results/asama2b.csv results/asama2b_pit.csv
          mv results/asama2b_sabit.csv results/asama2b.csv
      - uses: actions/upload-artifact@v4
        with:
          name: huni-asama2b-pit-${{ env.ARTIFACT_SUFFIX }}
          path: results/
          retention-days: 7

  portfoy:
    needs: [veri, asama2b_pit]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-data-${{ env.ARTIFACT_SUFFIX }}
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: huni-asama2b-pit-${{ env.ARTIFACT_SUFFIX }}
          path: .
      - run: python backtests/portfoy.py --bootstrap-tekrar "${{ inputs.bootstrap_tekrar }}"
      - uses: actions/upload-artifact@v4
        with:
          name: huni-portfoy-${{ env.ARTIFACT_SUFFIX }}
          path: results/
          retention-days: 7

  sonuc_pr:
    needs: portfoy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: huni-portfoy-${{ env.ARTIFACT_SUFFIX }}
          path: .
      - name: Build final result report
        run: python backtests/sonuc_raporu.py
      - name: Commit results to a run branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="huni/${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ data/MANIFEST.csv data/evren.csv
          git commit -m "chore: huni results ${{ github.run_id }}" || exit 0
          git push origin "$branch"
          {
            echo "## Huni sonucu"
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            echo "- Süre: $(( $(date +%s) - $(date -d "$started" +%s) )) saniye"
            echo "- git_sha: $(git rev-parse HEAD)"
            echo
            sed -n '/## Özet sayılar/,/^## Paper/p' results/SONUC.md | head -20
          } > /tmp/huni-pr.md
          gh pr create --base main --head "$branch" --title "chore: huni sonuçları ${{ github.run_id }}" --body-file /tmp/huni-pr.md
