name: TV-2 kripto kuyruğu

on:
  workflow_dispatch:
    inputs:
      parca:
        description: "0-7 kuyruk parcasi (bos: tum matris)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tv2:
    strategy:
      fail-fast: false
      matrix:
        parca: ["0", "1", "2", "3", "4", "5", "6", "7"]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore TV-2 caches
        uses: actions/cache@v4
        with:
          path: data/tv2
          key: tv2-${{ runner.os }}-${{ matrix.parca }}-${{ github.run_id }}
          restore-keys: tv2-${{ runner.os }}-${{ matrix.parca }}-
      - name: Select unfinished slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids = Path('results/tv2/kuyruk_kripto_kalan.txt').read_text().splitlines()
          part = int('${{ matrix.parca }}')
          requested = '${{ inputs.parca }}'
          todo = []
          if requested and requested != str(part):
              Path('/tmp/tv2-queue.txt').write_text('')
              print(f'part {part}: dispatch {requested}, atlandi')
              raise SystemExit
          for i, ident in enumerate(ids):
              if i % 8 != part:
                  continue
              row = Path('results/tv2/satirlar') / f'{ident}.json'
              if row.exists():
                  try:
                      if json.loads(row.read_text()).get('karar') != 'zaman_asimi':
                          continue
                  except (ValueError, OSError):
                      pass
              todo.append(ident)
          Path('/tmp/tv2-queue.txt').write_text('\n'.join(todo) + ('\n' if todo else ''))
          print(f'part {part}: {len(todo)} strateji')
          PY
      - name: Run slice with checkpoints
        run: xargs -r -P2 -I{} timeout 7200 python -m backtests.tv2 --ayri --dakikalik {} < /tmp/tv2-queue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv2-${{ matrix.parca }}-${{ github.run_id }}
          path: |
            results/tv2/satirlar/
            results/tv2/getiriler/
          retention-days: 14
      - name: Commit result checkpoints
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tv2/satirlar results/tv2/getiriler
          git commit -m "tv2: kripto parca ${{ matrix.parca }} (${{ github.run_id }})" || exit 0
          git stash push --include-untracked -m "tv2-runner-artifacts" || true
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*5))
          done
