name: Hyperliquid arşivi
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 * * * *"
    - cron: "13 2 * * 0"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: arsiv
  cancel-in-progress: false
jobs:
  arsiv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Güncel kapı havuzunu al
        run: git fetch --depth=1 origin copytrade-kapi && mkdir -p guncel-kapi && git archive FETCH_HEAD copytrade/kapi | tar -x -C guncel-kapi
      - name: R2 imleç ve bugünün kapsamını indir
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync "s3://${R2_BUCKET}/" arsiv --exclude "*" --include "tur=*/son.json" --include "tur=kapsam/gun=$(date -u +%F)/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: 15 dk pozisyon ve mum
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --tur pozisyon,mum_1dk,olay
      - name: Saatlik dolum ve funding
        if: github.event.schedule == '7 * * * *'
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --tur dolum,funding
      - name: Haftalık leaderboard
        if: github.event.schedule == '13 2 * * 0'
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --tur leaderboard
      - name: R2'ye ekle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync arsiv "s3://${R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
