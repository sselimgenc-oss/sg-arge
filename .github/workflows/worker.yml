name: Telegram Worker dağıtımı

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Worker testleri
        run: npm test --prefix worker
      - name: Gerekli secret'ları doğrula
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_WEBHOOK_SECRET; do
            value="${!name}"
            [ -n "$value" ] || { echo "Eksik GitHub Secret: $name" >&2; exit 1; }
            echo "::add-mask::$value"
          done
      - name: D1 veritabanını bul veya oluştur
        shell: bash
        run: |
          set -euo pipefail
          # wrangler çıktısının başında JSON olmayan satırlar olabiliyor; doğrudan Cloudflare API'si kullanılır.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          db_id=$(curl --fail --silent --show-error "${auth[@]}" "$api?name=sg-arge-telegram" \
            | jq -r '[.result[]? | select(.name == "sg-arge-telegram") | .uuid][0] // empty')
          if [ -z "$db_id" ]; then
            db_id=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" \
              --data '{"name":"sg-arge-telegram"}' "$api" | jq -r '.result.uuid // empty')
          fi
          [ -n "$db_id" ] && [ "$db_id" != null ]
          cp worker/wrangler.toml worker/wrangler.generated.toml
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "sg-arge-telegram"\ndatabase_id = "%s"\n' "$db_id" >> worker/wrangler.generated.toml
      - name: D1 şemasını uygula
        run: npm exec --yes wrangler@4 d1 execute sg-arge-telegram --remote --file=worker/schema.sql --config=worker/wrangler.generated.toml
      - name: Worker secret'larını aktar ve dağıt
        shell: bash
        run: |
          set -euo pipefail
          # Önce dağıt: ilk koşuda Worker yokken secret put etkileşimli soru sorabilir.
          npm exec --yes wrangler@4 deploy --config=worker/wrangler.generated.toml
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_WEBHOOK_SECRET; do
            printf '%s' "${!name}" | npm exec --yes wrangler@4 secret put "$name" --config=worker/wrangler.generated.toml
          done
      - name: Telegram webhook'unu ayarla
        shell: bash
        run: |
          set -euo pipefail
          subdomain=$(curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          [ -n "$subdomain" ] && [ "$subdomain" != null ]
          curl --fail --silent --show-error --retry 2 \
            --data-urlencode "url=https://sg-arge-telegram.$subdomain.workers.dev/telegram" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" >/dev/null
