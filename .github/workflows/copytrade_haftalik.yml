name: CT-Haftalık

# Elle çalışır (zamanlama yok: gölge ileri getirisi hazır olunca zamanlama kararı kullanıcıda). En son seçimi veri dalından alır, haftalık geri bildirim
# raporunu (rotasyon içindir; kol bazında getiri yazılmaz) ve geçiş kaydını `rotasyon/` altına yazar. Aynı hafta yeniden koşmak yeni olay üretmez.
on:
  workflow_dispatch:
    inputs:
      tarih:
        description: "Hafta etiketi (YYYY-MM-DD; boşsa bugün UTC)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: copytrade-haftalik
  cancel-in-progress: false

jobs:
  haftalik:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veri dalından en son seçim ve rotasyon kaydı
        id: veri
        run: |
          git fetch --depth=1 origin copytrade-kapi
          name=$(git ls-tree -r --name-only FETCH_HEAD | sed -n 's#^secim/\(.*\)/secim\.json$#\1#p' | sort | tail -1)
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p veri/secim/"$name"
          git show "FETCH_HEAD:secim/$name/secim.json" > "veri/secim/$name/secim.json"
          if [ -n "$(git ls-tree --name-only FETCH_HEAD rotasyon)" ]; then git archive FETCH_HEAD rotasyon | tar -x; fi
      - name: Haftalık rapor ve geçiş kaydı
        run: |
          day="${{ inputs.tarih }}"; day="${day:-$(date -u +%F)}"
          python -m copytrade.haftalik_rapor --secim "veri/secim/${{ steps.veri.outputs.name }}/secim.json" --tarih "$day" --cikti rotasyon --gecis
      - name: Veri dalına yaz
        run: |
          archive=$(mktemp -d)
          cp -r rotasyon "$archive/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin copytrade-kapi
          git checkout -f -B copytrade-kapi FETCH_HEAD
          cp -r "$archive"/rotasyon .
          git add -f rotasyon
          git diff --cached --quiet && exit 0
          git commit -m "copytrade: haftalık rotasyon"
          for attempt in 1 2 3; do
            git pull --rebase origin copytrade-kapi
            git push origin HEAD:copytrade-kapi && exit 0
            sleep 5
          done
          exit 1
