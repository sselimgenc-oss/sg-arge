name: CT-Haftalık

# Her Perşembe (etiket günü) ve elle. Önce `pilot_veri` arşivi R2'den okuyup üç girdiyi üretir (getiri, kapanmış işlem, risk), sonra haftalık rapor ve
# geçiş kaydı `rotasyon/` altına yazılır (rotasyon içindir; kol bazında getiri yazılmaz). Aynı hafta yeniden koşmak yeni olay üretmez.
# Hata yutulmaz: girdi üretilemezse koşu kırmızı biter.
on:
  schedule:
    - cron: "23 6 * * 4"
  workflow_dispatch:
    inputs:
      tarih:
        description: "Hafta etiketi (YYYY-MM-DD; boşsa bugün UTC)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: copytrade-haftalik
  cancel-in-progress: false

jobs:
  haftalik:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veri dalından en son seçim ve rotasyon kaydı
        id: veri
        run: |
          git fetch --depth=1 origin copytrade-kapi
          name=$(git ls-tree -r --name-only FETCH_HEAD | sed -n 's#^secim/\(.*\)/secim\.json$#\1#p' | sort | tail -1)
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p veri/secim/"$name"
          git show "FETCH_HEAD:secim/$name/secim.json" > "veri/secim/$name/secim.json"
          if [ -n "$(git ls-tree --name-only FETCH_HEAD rotasyon)" ]; then git archive FETCH_HEAD rotasyon | tar -x; fi
      - name: Bayrak dosyası (varsa)
        run: |
          path="secim/${{ steps.veri.outputs.name }}/bayrak.json"
          if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then git show "FETCH_HEAD:$path" > "veri/$path"; else echo "bayrak.json yok: martingale işareti 'veri yok' olur"; fi
      - name: Arşivi R2'den indir
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync "s3://${R2_BUCKET}/" arsiv --exclude "*" --include "tur=dolum/*" --include "tur=funding/*" --include "tur=mum_1dk/*" --include "tur=pozisyon/*" --include "tur=kapsam/*" --include "tur=bosluk/*" --include "tur=mum_1sa/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: Arşiv kesinti durumu (bilgi; rapora yazılır)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pilot_veri
          gh api "repos/${{ github.repository }}/actions/workflows/arsiv.yml/runs?per_page=50" > runs.json
          python -m copytrade.arsiv_alarm --runs runs.json --yaz pilot_veri/arsiv_kesinti.json --bilgi
      - name: Pilot veri hattı (getiri, kapanmış işlem, risk)
        run: |
          day="${{ inputs.tarih }}"; day="${day:-$(date -u +%F)}"
          python -m copytrade.pilot_veri --arsiv arsiv --secim "veri/secim/${{ steps.veri.outputs.name }}/secim.json" --bayrak "veri/secim/${{ steps.veri.outputs.name }}/bayrak.json" --tarih "$day" --cikti pilot_veri
      - name: Haftalık rapor ve geçiş kaydı
        run: |
          day="${{ inputs.tarih }}"; day="${day:-$(date -u +%F)}"
          python -m copytrade.haftalik_rapor --secim "veri/secim/${{ steps.veri.outputs.name }}/secim.json" --tarih "$day" --cikti rotasyon --gecis --getiri pilot_veri/getiri.json --kapanmis-islem pilot_veri/kapanmis_islem.json --risk pilot_veri/risk.json --ozet pilot_veri/ozet.json --arsiv-kesinti pilot_veri/arsiv_kesinti.json
      - name: Veri dalına yaz
        run: |
          archive=$(mktemp -d)
          cp -r rotasyon "$archive/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin copytrade-kapi
          git checkout -f -B copytrade-kapi FETCH_HEAD
          cp -r "$archive"/rotasyon .
          git add -f rotasyon
          git diff --cached --quiet && exit 0
          git commit -m "copytrade: haftalık rotasyon"
          for attempt in 1 2 3; do
            git pull --rebase origin copytrade-kapi
            git push origin HEAD:copytrade-kapi && exit 0
            sleep 5
          done
          exit 1
