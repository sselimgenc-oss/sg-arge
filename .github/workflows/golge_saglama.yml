name: Gölge üç-adres sağlama

on:
  workflow_dispatch:
    inputs:
      adresler:
        description: "Virgülle ayrılmış en az üç Hyperliquid public adresi"
        required: true
        default: "0x8bae3527e5a33fa0cf184f37bc112d071463ab6d,0x3f96c4df1e76902985d3dbd979af54b487f29671,0x3e6805e8694bb2b717a828c1bfa32df5d6580cc9"
  push:
    branches: [codex/golge]
    paths:
      - "copytrade/golge*.py"
      - ".github/workflows/golge_saglama.yml"

permissions:
  contents: read

jobs:
  saglama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADRESLER: ${{ inputs.adresler || '0x8bae3527e5a33fa0cf184f37bc112d071463ab6d,0x3f96c4df1e76902985d3dbd979af54b487f29671,0x3e6805e8694bb2b717a828c1bfa32df5d6580cc9' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Üç-adres sağlama ve özet
        run: |
          python -m copytrade.golge_saglama --adresler "$ADRESLER" --output golge_saglama.json
          cat golge_saglama.json
      - uses: actions/upload-artifact@v4
        with:
          name: golge-uc-adres-saglama
          path: golge_saglama.json
