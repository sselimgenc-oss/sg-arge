name: Izleme deneme (küçük gerçek veri)

# Kalite kuralı 1: değişiklikler tam koşudan önce küçük gerçek veriyle denenir. Üretim R2'sine ve veri dalına YAZMAZ;
# çıktı yalnız artifact ve koşu özetidir. Varsayılan: yoğun taban trader'ı B17 + iki oda trader'ı.
on:
  workflow_dispatch:
    inputs:
      idler:
        description: "İzleme listesinden virgülle ayrılmış trader kimlikleri"
        default: "B17,O01,O02"

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Küçük liste ile motoru çalıştır
        env:
          IDLER: ${{ inputs.idler }}
        run: |
          mkdir -p deneme_kok deneme_cikti
          cp -r copytrade deneme_kok/copytrade
          python - <<'PY'
          import os, yaml
          ids = {x.strip() for x in os.environ['IDLER'].split(',') if x.strip()}
          data = yaml.safe_load(open('copytrade/izleme_listesi.yaml', encoding='utf-8'))
          rows = [r for r in data['traderlar'] if r['id'] in ids]
          assert {r['id'] for r in rows} == ids, f'listede olmayan kimlik: {ids - {r["id"] for r in rows}}'
          yaml.safe_dump({'traderlar': rows}, open('deneme_kok/copytrade/izleme_listesi.yaml', 'w', encoding='utf-8'), allow_unicode=True)
          PY
          start=$(date +%s)
          python -m copytrade.izleme_motoru --root deneme_kok --output deneme_cikti
          echo "motor süresi: $(( $(date +%s) - start )) sn" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Çıktı özeti
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, statistics
          d = json.load(open('deneme_cikti/durum.json', encoding='utf-8'))
          print('### Çıktı özeti')
          print('olay_kapsami:', json.dumps(d['olay_kapsami'], ensure_ascii=False))
          print('kapsam:', json.dumps(d['kapsam'], ensure_ascii=False))
          print('olaylar (yayımlanan):', len(d['olaylar']))
          for row in d['gunluk_sayac'][:12]:
              print('sayac:', json.dumps(row, ensure_ascii=False))
          for t in d['traderlar']:
              k = t['sanal_kopya']
              print(f"{t['id']} kol={t['kol']} gecerli={t['gecerli']} durum={t.get('veri_durumu')} hesap=${t['hesap_degeri']:.0f} "
                    f"bakiye=${k['bakiye_usd']:.2f} getiri={k['getiri']:.4f} fiyatsiz={k.get('fiyatsiz_eylem')} {k.get('fiyatsiz_coinler')}")
          files = sorted(pathlib.Path('deneme_cikti/olaylar').glob('*.jsonl.gz'))
          sizes = [f.stat().st_size for f in files]
          print(f'olay arşivi: {len(files)} saat parçası, toplam {sum(sizes)} bayt, min/medyan/max = {min(sizes, default=0)}/{statistics.median(sizes) if sizes else 0}/{max(sizes, default=0)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izleme-deneme
          path: deneme_cikti
