name: Plasebo kalibrasyonu

on:
  workflow_dispatch:
  push:
    branches: [codex/kapi-kontrol]
    paths: [backtests/plasebo.py, results/tv2/**, results/u7/**]

jobs:
  plasebo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m backtests.plasebo
