name: Asama 2a piyasa betasi (T6a)

on:
  workflow_dispatch:
    inputs:
      tf:
        description: "Kart zaman dilimleri (virgulle): 1D,1W gunluk | 1H,30m,15m,5m gun ici"
        default: "1D,1W"
      tekrar:
        description: "Null model tekrar sayisi (sinir satirlar icin 1000'e cikar)"
        default: "200"
      kart_ids:
        description: "Yalniz bu kartlar (virgulle; bos = tarama.csv'deki tum asama 2 adaylari)"
        default: ""

permissions:
  contents: write

jobs:
  asama2a:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Download bars for the requested timeframes
        env:
          ASAMA2A_TF: ${{ inputs.tf }}
        run: |
          set -e
          IFS=',' read -ra TFS <<< "$ASAMA2A_TF"
          NEED_DAILY=0
          for tf in "${TFS[@]}"; do
            case "$tf" in
              1D|1W) NEED_DAILY=1 ;;
              1H) python data/fetch.py --interval 1h --append --allow-partial ;;
              30m|15m|5m) python data/fetch.py --interval "$tf" --baslangic 2020-01-01 --allow-partial ;;
            esac
          done
          if [ "$NEED_DAILY" = 1 ]; then
            python data/fetch.py --interval 1d --allow-partial
            python -c "from data.fetch import Asset, fetch_asset; fetch_asset(Asset('USDTRY=X', 'FX', 'yfinance'), '1d', append=False)"
          fi
      - name: Run tests
        run: python -m pytest -q
      - name: Scan kismi_kar cards (P02, R01) and merge into tarama.csv
        env:
          ASAMA2A_TF: ${{ inputs.tf }}
        run: |
          case ",$ASAMA2A_TF," in
            *,1D,*|*,1W,*) python backtests/tarama.py --kartlar docs/spec --tf 1D,1W --kart-ids P02,R01 --birlestir ;;
          esac
      - name: Run stage 2a
        env:
          ASAMA2A_TF: ${{ inputs.tf }}
          ASAMA2A_TEKRAR: ${{ inputs.tekrar }}
          ASAMA2A_KARTLAR: ${{ inputs.kart_ids }}
        run: python backtests/asama2a.py --tf "$ASAMA2A_TF" --tekrar "$ASAMA2A_TEKRAR" --kart-ids "$ASAMA2A_KARTLAR"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/MANIFEST.csv data/evren.csv results/tarama.csv results/tarama_ozet.md results/tarama_islemler/ results/asama2a.csv results/asama2a_ozet.md
          git diff --cached --quiet || git commit -m "chore: refresh stage 2a results"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
