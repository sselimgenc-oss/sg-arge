name: CT gecikmeli kopya mutabakatı

# Tek adres için gecikmeli kopya dökümü (docs/GOREV_TRADER_SECIMI.md görev 13). Tetik: elle (adres girilir) veya
# copytrade/kapi/MUTABAKAT yoluna push (dosyada `adres=0x…` satırı). Çıktı: copytrade-kapi veri dalında mutabakat/.
on:
  workflow_dispatch:
    inputs:
      adres:
        description: "Hyperliquid adresi"
        required: true
        default: "0x1404109f8cd4a79a0447365edbb7a13acd0b2f27"
  push:
    branches: [main, claude/kapi-v1-1]
    paths: [copytrade/kapi/MUTABAKAT]

permissions:
  contents: write

concurrency:
  group: copytrade-mutabakat-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mutabakat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mutabakat
        shell: bash
        env:
          PYTHONWARNINGS: ignore
        run: |
          adres="${{ inputs.adres }}"
          if [ -z "$adres" ]; then adres=$(grep -oE '^adres=0x[0-9a-fA-F]{40}' copytrade/kapi/MUTABAKAT | head -1 | cut -d= -f2); fi
          [[ "$adres" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "geçerli adres yok" >&2; exit 1; }
          python -m copytrade.mutabakat --adres "$adres" --output mutabakat
      - name: Veri dalına yaz
        shell: bash
        run: |
          set -euo pipefail
          archive=$(mktemp -d); cp -r mutabakat "$archive/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/copytrade-kapi >/dev/null; then
            git fetch origin copytrade-kapi
            git checkout -f -B copytrade-kapi FETCH_HEAD
          else
            git checkout --orphan copytrade-kapi
            git rm -rfq --ignore-unmatch .
          fi
          cp -r "$archive"/. .
          git add -f mutabakat
          git diff --cached --quiet && exit 0
          git commit -m "copytrade: mutabakat $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git ls-remote --exit-code --heads origin refs/heads/copytrade-kapi >/dev/null && git pull --rebase origin copytrade-kapi
            git push origin HEAD:copytrade-kapi && exit 0
            sleep 5
          done
          exit 1
