name: Paper trade (gunluk sanal defter)

# Gercek para ve araci kurum baglantisi YOK. Hafta ici ABD kapanisindan sonra calisir; defteri, raporu ve panel dosyasini
# yalniz `paper-defter` dalina yazar (ana dala yazmaz). Etkinlestirme (schedule) ve baslangic tarihi: lider/kullanici karari.
# paper/portfoy.yaml `baslangic` tarihi kullanici onayina kadar yer tutucudur.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-defter
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}   # bos ise panel aktarimi atlanir
      PANEL_REPO: sselimgenc-oss/sg-pano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Restore ledger from paper-defter
        run: |
          git fetch origin paper-defter || true
          if git rev-parse --verify -q origin/paper-defter > /dev/null; then
            git checkout origin/paper-defter -- paper/defter paper/RAPOR.md paper/panel || true
          fi
      - name: Daily run (download needed symbols, engine, ledger, report)
        run: python paper/gunluk.py --indirme
      - name: Dashboard file (paper/panel/data.json)
        run: python paper/panel.py
      - name: Hourly dashboard-only valuation
        run: python paper/anlik.py
      - name: Commit ledger, report and panel file to paper-defter
        run: |
          set -e
          mkdir -p /tmp/out
          cp -r paper/defter /tmp/out/defter
          cp paper/RAPOR.md /tmp/out/RAPOR.md
          cp -r paper/panel /tmp/out/panel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked -q || true
          if git rev-parse --verify -q origin/paper-defter > /dev/null; then
            git checkout -q -B paper-defter origin/paper-defter
          else
            git checkout -q --orphan paper-defter
            git rm -rf -q . || true
          fi
          mkdir -p paper
          rm -rf paper/defter paper/panel
          cp -r /tmp/out/defter paper/defter
          cp -r /tmp/out/panel paper/panel
          cp /tmp/out/RAPOR.md paper/RAPOR.md
          git add -f paper
          git diff --cached --quiet || git commit -q -m "paper: gunluk defter $(date -u +%F)"
          git push origin paper-defter
      - name: Publish data.json to the dashboard repo (needs the PANEL_TOKEN secret)
        if: env.PANEL_TOKEN != ''
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${PANEL_TOKEN}@github.com/${PANEL_REPO}.git" /tmp/panel-repo
          cp paper/panel/data.json /tmp/panel-repo/data.json
          cd /tmp/panel-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -q -m "data.json: sg-arge paper defteri $(date -u +%F)" && git push origin HEAD)
