name: Dukascopy 1m archive

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols"
        required: false
        default: "USDJPY USDCHF USATECHIDXUSD"
      years:
        description: "Years to fetch, e.g. 2010 2011 2012"
        required: true
        default: "2010 2011 2012"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements.txt
      - name: Download missing days and checkpoint yearly files
        env:
          SYMBOLS: ${{ inputs.symbols }}
          YEARS: ${{ inputs.years }}
        run: python data/dukascopy.py $SYMBOLS --yillar $YEARS
      - name: Commit archive
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/dakika results/veri_kalitesi_dukascopy.md
          git diff --cached --quiet || git commit -m '[T36a] Dukascopy 1 dk veri'
          git push
