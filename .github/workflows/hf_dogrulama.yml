name: HF doğrulama

# Hugging Face geçmiş hesap verisi (ProbioticFarmer/hyperliquid-augmented-copytrading) ölçümü. docs/GOREV_HF_DOGRULAMA.md.
# Yöntemi/kapıyı değiştirmez; hata `|| true` ile örtülmez (iş kırmızı olur, JSON yine yüklenir).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/hf-dogrulama
    paths:
      - copytrade/hf_dogrulama.py
      - .github/workflows/hf_dogrulama.yml

permissions:
  contents: read

jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kapı sonuçlarını veri dalından getir
        run: |
          git fetch --depth=1 origin copytrade-kapi
          git archive FETCH_HEAD copytrade/kapi | tar -x
      - name: Doğrulama
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # isteğe bağlı: tanımlıysa HF hız sınırı yükselir
        run: python -m copytrade.hf_dogrulama --root copytrade --output hf_dogrulama.json
      - name: Özet (JSON'dan, günlük kapsam hariç)
        if: ${{ !cancelled() }}
        run: |
          [ -s hf_dogrulama.json ] && python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("hf_dogrulama.json"))
          k = r["adimlar"].get("kapsam")
          if k:
              k = {x: y for x, y in k.items() if x != "gunluk"}
              r["adimlar"]["kapsam"] = k
          e = r["adimlar"].get("envanter", {})
          for s in e.values():
              if isinstance(s, dict) and "sutunlar" in s:
                  s["sutunlar"] = [c["ad"] + ":" + c["tur"] for c in s["sutunlar"]]
          e.pop("_veri_karti", None)
          print("```json")
          print(json.dumps(r, ensure_ascii=False, indent=1)[:60000])
          print("```")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hf_dogrulama
          path: hf_dogrulama.json
