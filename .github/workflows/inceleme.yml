name: Copy trade örnek inceleme

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-ride-c7apbp]
    paths: [copytrade/inceleme.py, .github/workflows/inceleme.yml]

permissions:
  contents: write

jobs:
  inceleme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: timeout 40m python -m copytrade.inceleme --mod istikrar --havuz 60 --adet 10 --cikti copytrade/inceleme/RAPOR_istikrar.md || true
      - name: Raporu dala yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copytrade/inceleme/
          git commit -m "Copy trade örnek inceleme raporu" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
