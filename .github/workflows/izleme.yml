name: Copy trade saatlik izleme

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copytrade-izleme
  cancel-in-progress: false

jobs:
  izleme:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Durum arşivini geri yükle
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin copytrade-izleme >/dev/null; then
            git fetch origin copytrade-izleme
            git archive FETCH_HEAD izleme | tar -x
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Kapı sonuçlarını (tarz) veri dalından getir
        shell: bash
        # Trader'ın tarzı izleme listesinde yoksa en son kapı sonucundan okunur (copytrade-kapi dalı).
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/copytrade-kapi >/dev/null 2>&1; then
            git fetch --depth=1 origin copytrade-kapi
            git archive FETCH_HEAD copytrade/kapi | tar -x
          fi
      - name: Halka açık veriyi oku ve sanal defteri güncelle
        run: python -m copytrade.izleme_motoru --root . --output izleme
      - name: Worker kararlarını içe al
        if: ${{ vars.KARAR_URL != '' }}
        # Karar aktarımı düşerse saatlik durum yine yayımlanır (kararlar bir sonraki saatte gelir); adım günlükte kırmızı görünür.
        continue-on-error: true
        env:
          KARAR_URL: ${{ vars.KARAR_URL }}
        run: python -m copytrade.kararlar --url "$KARAR_URL" --output izleme/kararlar.jsonl
      - name: Arşivi ayrı veri dalına yaz
        run: bash .github/scripts/izleme_yayimla.sh
