name: Faz 3 geçmiş prova

# Elle çalışır (ön kayıt: Faz 3 yalnız durdurabilir, başlatma kanıtı sayılmaz). Sıra: sentetik doğrulama (geçmezse gerçek koşu yok) → T anları (matris, parça parça)
# → rapor. Hiçbir pencere `faz3_son_tarih`'ten sonraya taşmaz. Evren: bugünkü leaderboard (iyimser üst sınır). Çıktı artifact: faz3/RAPOR.md
# (lider `arastirma/copytrade/faz3/RAPOR.md` olarak repoya alır).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrulama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Sentetik doğrulama (200 tohum)
        run: python -m copytrade.faz3 --sentetik --cikti faz3
      - uses: actions/upload-artifact@v4
        with: {name: faz3-dogrulama, path: faz3/dogrulama.json}

  plan:
    needs: dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pencereler: ${{ steps.t.outputs.pencereler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - id: t
        run: echo "pencereler=$(python -m copytrade.faz3 --planla)" >> "$GITHUB_OUTPUT"
      - name: Evren anlık görüntüsü (bugünkü leaderboard)
        run: python -m copytrade.kapi --evren-yaz evren.json
      - uses: actions/upload-artifact@v4
        with: {name: faz3-evren, path: evren.json}

  pencere:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        t: ${{ fromJson(needs.plan.outputs.pencereler) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: faz3-evren, path: .}
      - uses: actions/download-artifact@v4
        with: {name: faz3-dogrulama, path: faz3}
      - name: Pencere ${{ matrix.t }}
        run: python -m copytrade.faz3 --pencere ${{ matrix.t }} --adresler evren.json --dogrulama faz3/dogrulama.json --cikti faz3
      - uses: actions/upload-artifact@v4
        with: {name: "faz3-pencere-${{ matrix.t }}", path: "faz3/pencere_${{ matrix.t }}.json"}

  rapor:
    needs: pencere
    if: ${{ !cancelled() && needs.pencere.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "faz3-*", path: parcalar, merge-multiple: true}
      - run: |
          mkdir -p faz3
          cp parcalar/pencere_*.json faz3/
          python -m copytrade.faz3 --birlestir faz3 --dogrulama parcalar/dogrulama.json --cikti faz3
      - uses: actions/upload-artifact@v4
        with: {name: faz3-rapor, path: faz3/RAPOR.md}
